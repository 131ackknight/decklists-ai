<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" role="img" aria-label="Where every score sits on the dev decks, from the model alone to the best possible" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="900" height="650" fill="#fcfcfb"/>
<text x="24" y="34" text-anchor="start" font-size="18" font-weight="600" fill="#0b0b0b">Where every score sits (21 dev decks, whole-deck score)</text>
<text x="24" y="56" text-anchor="start" font-size="13" font-weight="400" fill="#52514e">The score is how many of a deck's 60 cards match what real players went on to play.</text>
<circle cx="30" cy="82" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="0"/>
<text x="42" y="86" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">The brewer</text>
<path d="M132 75L137.6 82L132 89L126.4 82Z" fill="#eb6834" stroke="#fcfcfb" stroke-width="0"/>
<text x="144" y="86" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">The model alone</text>
<circle cx="264" cy="82" r="5" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="276" y="86" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">Hollow: told 3 cards</text>
<circle cx="418" cy="82" r="6" fill="#52514e" stroke="#fcfcfb" stroke-width="0"/>
<text x="430" y="86" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">Filled: told the whole idea</text>
<line x1="606" y1="82" x2="624" y2="82" stroke="#0b0b0b" stroke-width="2.5"/>
<text x="632" y="86" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">Real decks, for comparison</text>
<line x1="170" y1="620" x2="170" y2="110" stroke="#c3c2b7" stroke-width="2"/>
<line x1="164" y1="620" x2="176" y2="620" stroke="#c3c2b7" stroke-width="1"/>
<text x="156" y="624" text-anchor="end" font-size="12" font-weight="400" fill="#52514e">0</text>
<text x="120" y="624" text-anchor="end" font-size="12" font-weight="400" fill="#52514e">0 of 60 cards</text>
<line x1="164" y1="518" x2="176" y2="518" stroke="#c3c2b7" stroke-width="1"/>
<text x="156" y="522" text-anchor="end" font-size="12" font-weight="400" fill="#52514e">20</text>
<text x="120" y="522" text-anchor="end" font-size="12" font-weight="400" fill="#52514e">12 of 60 cards</text>
<line x1="164" y1="416" x2="176" y2="416" stroke="#c3c2b7" stroke-width="1"/>
<text x="156" y="420" text-anchor="end" font-size="12" font-weight="400" fill="#52514e">40</text>
<text x="120" y="420" text-anchor="end" font-size="12" font-weight="400" fill="#52514e">24 of 60 cards</text>
<line x1="164" y1="314" x2="176" y2="314" stroke="#c3c2b7" stroke-width="1"/>
<text x="156" y="318" text-anchor="end" font-size="12" font-weight="400" fill="#52514e">60</text>
<text x="120" y="318" text-anchor="end" font-size="12" font-weight="400" fill="#52514e">36 of 60 cards</text>
<line x1="164" y1="212" x2="176" y2="212" stroke="#c3c2b7" stroke-width="1"/>
<text x="156" y="216" text-anchor="end" font-size="12" font-weight="400" fill="#52514e">80</text>
<text x="120" y="216" text-anchor="end" font-size="12" font-weight="400" fill="#52514e">48 of 60 cards</text>
<line x1="164" y1="110" x2="176" y2="110" stroke="#c3c2b7" stroke-width="1"/>
<text x="156" y="114" text-anchor="end" font-size="12" font-weight="400" fill="#52514e">100</text>
<text x="120" y="114" text-anchor="end" font-size="12" font-weight="400" fill="#52514e">60 of 60 cards</text>
<line x1="180" y1="184.5" x2="222" y2="184.5" stroke="#e1e0d9" stroke-width="1"/>
<line x1="158" y1="184.5" x2="182" y2="184.5" stroke="#0b0b0b" stroke-width="2.5"/>
<text x="230" y="189.5" text-anchor="start" font-size="15" font-weight="600" fill="#0b0b0b">85.4</text>
<text x="278" y="189.5" text-anchor="start" font-size="14" font-weight="500" fill="#0b0b0b">Best possible</text>
<text x="570" y="189.5" text-anchor="start" font-size="12" font-weight="400" fill="#6f6e69">the best 60 cards, picked with hindsight</text>
<line x1="180" y1="219.1" x2="222" y2="219.1" stroke="#e1e0d9" stroke-width="1"/>
<line x1="158" y1="219.1" x2="182" y2="219.1" stroke="#0b0b0b" stroke-width="2.5"/>
<text x="230" y="224.1" text-anchor="start" font-size="15" font-weight="600" fill="#0b0b0b">78.6</text>
<text x="278" y="224.1" text-anchor="start" font-size="14" font-weight="500" fill="#0b0b0b">A real player's later list</text>
<text x="570" y="224.1" text-anchor="start" font-size="12" font-weight="400" fill="#6f6e69">real lists agree with each other this much</text>
<line x1="180" y1="284.9" x2="222" y2="284.9" stroke="#e1e0d9" stroke-width="1"/>
<line x1="158" y1="284.9" x2="182" y2="284.9" stroke="#0b0b0b" stroke-width="2.5"/>
<text x="230" y="289.9" text-anchor="start" font-size="15" font-weight="600" fill="#0b0b0b">65.7</text>
<text x="278" y="289.9" text-anchor="start" font-size="14" font-weight="500" fill="#0b0b0b">The inventors' first lists</text>
<text x="570" y="289.9" text-anchor="start" font-size="12" font-weight="400" fill="#6f6e69">the people who came up with the deck</text>
<line x1="180" y1="346.1" x2="222" y2="346.1" stroke="#e1e0d9" stroke-width="1"/>
<circle cx="170" cy="346.1" r="7" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="230" y="351.1" text-anchor="start" font-size="15" font-weight="600" fill="#0b0b0b">53.7</text>
<text x="278" y="351.1" text-anchor="start" font-size="14" font-weight="500" fill="#0b0b0b">The brewer, told the whole idea</text>
<text x="570" y="351.1" text-anchor="start" font-size="12" font-weight="400" fill="#6f6e69">the request names every key card</text>
<line x1="180" y1="381.3" x2="222" y2="381.3" stroke="#e1e0d9" stroke-width="1"/>
<path d="M170 372.3L177.2 381.3L170 390.3L162.8 381.3Z" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="230" y="386.3" text-anchor="start" font-size="15" font-weight="600" fill="#0b0b0b">46.8</text>
<text x="278" y="386.3" text-anchor="start" font-size="14" font-weight="500" fill="#0b0b0b">The model alone, told the whole idea</text>
<text x="570" y="386.3" text-anchor="start" font-size="12" font-weight="400" fill="#6f6e69">one call, no tools or data</text>
<line x1="180" y1="402.2" x2="222" y2="402.2" stroke="#e1e0d9" stroke-width="1"/>
<circle cx="170" cy="402.2" r="7" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
<text x="230" y="407.2" text-anchor="start" font-size="15" font-weight="600" fill="#0b0b0b">42.7</text>
<text x="278" y="407.2" text-anchor="start" font-size="14" font-weight="500" fill="#0b0b0b">The brewer, told 3 cards</text>
<text x="570" y="407.2" text-anchor="start" font-size="12" font-weight="400" fill="#6f6e69">the standard test</text>
<line x1="180" y1="447.1" x2="222" y2="447.1" stroke="#e1e0d9" stroke-width="1"/>
<path d="M170 438.1L177.2 447.1L170 456.1L162.8 447.1Z" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/>
<text x="230" y="452.1" text-anchor="start" font-size="15" font-weight="600" fill="#0b0b0b">33.9</text>
<text x="278" y="452.1" text-anchor="start" font-size="14" font-weight="500" fill="#0b0b0b">The model alone, told 3 cards</text>
<text x="570" y="452.1" text-anchor="start" font-size="12" font-weight="400" fill="#6f6e69">one call, no tools or data</text>
</svg>
