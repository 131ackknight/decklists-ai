<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a judge's scoresheet, one prompt at a time. Sticky bar with the prompt picker and progress; the request, then one lettered card per anonymous answer with four 1-5 rows. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --ink: #1b2236;
  --muted: #5d667d;
  --line: #dde2ec;
  --accent: #2459a6;
  --accent-ink: #ffffff;
  --score: #b5650d;
  --ok: #1f7a4d;
  --warn: #a35a00;
  --bad: #b3261e;
  --chip: #e8edf6;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141d; --surface: #181e2b; --ink: #e5e9f2; --muted: #9aa4ba; --line: #2a3346;
    --accent: #6f9fe0; --accent-ink: #0d1422; --score: #e2a04f; --ok: #5cc28e; --warn: #e3a24a; --bad: #f08a80; --chip: #222b3d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141d; --surface: #181e2b; --ink: #e5e9f2; --muted: #9aa4ba; --line: #2a3346;
  --accent: #6f9fe0; --accent-ink: #0d1422; --score: #e2a04f; --ok: #5cc28e; --warn: #e3a24a; --bad: #f08a80; --chip: #222b3d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 0 64px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar-inner { max-width: 980px; margin: 0 auto; padding: 12px 16px; display: grid; gap: 10px; }
.title-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.title-row h1 { font-size: 1.4rem; }
.progress { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.progress b { color: var(--score); font-weight: 600; }
.nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.nav select { flex: 1 1 260px; min-width: 0; font: 0.95rem var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.btn { font: 600 0.9rem var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 14px; border-radius: 8px; cursor: pointer; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn:focus-visible, .seg button:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.notice { margin: 16px 0 0; padding: 10px 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; color: var(--muted); font-size: 0.92rem; }
.request { margin: 20px 0 6px; display: grid; gap: 8px; }
.request .fmt { font: 600 0.75rem var(--font-body); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.prompt { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.lookfor { margin: 0; color: var(--muted); font-size: 0.95rem; max-width: 70ch; }
.lookfor b { color: var(--ink); font-weight: 600; }
.list { display: grid; gap: 18px; margin-top: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.letter { font: 700 1.25rem var(--font-display); width: 2.2rem; height: 2.2rem; display: grid; place-items: center; border-radius: 8px; background: var(--ink); color: var(--surface); }
.chip { font: 600 0.75rem var(--font-body); letter-spacing: 0.04em; text-transform: uppercase; background: var(--chip); color: var(--muted); padding: 3px 8px; border-radius: 4px; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
.done { margin-left: auto; font-size: 0.85rem; color: var(--ok); }
details summary { cursor: pointer; color: var(--accent); font-size: 0.9rem; }
.reply { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 22rem; overflow: auto; padding: 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.95rem; margin-top: 8px; }
.deck { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.deck pre { margin: 0; font: 0.82rem/1.45 var(--font-mono); padding: 10px 12px; background: var(--bg); border-radius: 8px; overflow-x: auto; min-width: 0; }
.deck h3 { font: 600 0.8rem var(--font-body); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 6px; }
.rate { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; }
.row label { font-size: 0.92rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: 600 0.95rem var(--font-body); width: 40px; height: 36px; border: 0; border-left: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--score); color: var(--surface); }
.seg button:disabled { cursor: not-allowed; opacity: 0.6; }
textarea { width: 100%; min-height: 56px; font: 0.92rem var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; }
.saved { font-size: 0.8rem; color: var(--muted); min-height: 1.2em; }
.foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 20px; }
@media (max-width: 560px) {
  .row { grid-template-columns: 1fr; }
  .seg button { width: 44px; }
}
@media (prefers-reduced-motion: no-preference) {
  .seg button, .btn { transition: background 120ms ease, color 120ms ease; }
}
</style>

</div>

<script type="application/json" id="data">{"dimensions":[{"key":"plan","label":"Coherent plan: clear way to win, cards serve it","short":"Plan"},{"key":"legal","label":"Legal list: right size, copies, and format legality","short":"Legal"},{"key":"mana","label":"Working mana: land count, colored sources, curve","short":"Mana"},{"key":"shell","label":"Current shell: interaction and support the field plays now","short":"Shell"}],"prompts":[{"id":"premodern-mono-g-storm","format":"Premodern","prompt":"Make a mono green storm deck in Premodern.","lookFor":"Uses the green storm cards that exist (Hunting Pack, Sprouting Vines), an elf mana and untap engine, enough payoffs or a second way to win, and says plainly that it is a brew.","title":"Make a mono green storm deck in Premodern.","answers":[{"aid":"6e17aaa2133c","text":"I'll check the current Premodern field and look for mono green storm strategies.Mono green storm is not in the current Premodern field. I can build you a brew using storm cards legal in Premodern.\n\nLet me look up the key storm pieces available in green:Storm is not legal in Premodern. The format's card pool ends before storm was printed. Grapeshot, Tendrils of Agony, and other storm cards are all illegal.\n\nPremodern's legal sets are Tempest through Apocalypse. There is no storm mechanic available.\n\nI can build you a different mono green deck instead. Would you like:\n- Mono green aggro or midrange\n- A green combo deck using legal pieces\n- Something else in Premodern\n\nWhat sounds good?","error":false,"deck":null,"letter":"A"}]},{"id":"premodern-stock-goblins","format":"Premodern","prompt":"Give me a stock Goblins list for Premodern.","lookFor":"Matches recent winning lists closely. No pet cards.","title":"Give me a stock Goblins list for Premodern.","answers":[{"aid":"116d83810cc7","text":"I'll get the current Goblins strategy and a winning list for you.Now let me get the reference decklists for Goblins.Here is a stock Goblins list for Premodern. The deck is Unranked with 2.5% meta share and 12 appearances in the last 30 days.Let me adjust to 60 cards using the other list as reference.Done. This is a Gruul Goblins list based on a 5-0 League finish. The deck runs 34 goblins with Lackey and Piledriver as the fast threats, Matron and Ringleader as tutors and card draw, and Warchief to pump the team. Siege-Gang Commander closes games. The mana uses Rishadan Port and Wasteland for disruption. Naturalize in the main handles artifact and enchantment threats. The sideboard has Pyroblast and Red Elemental Blast for blue decks, Tormod's Crypt for graveyard strategies, and Caller of the Claw for board wipes.","error":false,"deck":{"main":[{"qty":3,"name":"Gempalm Incinerator"},{"qty":4,"name":"Goblin Lackey"},{"qty":4,"name":"Goblin Matron"},{"qty":4,"name":"Goblin Piledriver"},{"qty":4,"name":"Goblin Ringleader"},{"qty":1,"name":"Goblin Sharpshooter"},{"qty":1,"name":"Goblin Tinkerer"},{"qty":4,"name":"Goblin Warchief"},{"qty":4,"name":"Mogg Fanatic"},{"qty":3,"name":"Siege-gang Commander"},{"qty":1,"name":"Skirk Prospector"},{"qty":3,"name":"Naturalize"},{"qty":1,"name":"Forest"},{"qty":4,"name":"Karplusan Forest"},{"qty":9,"name":"Mountain"},{"qty":4,"name":"Rishadan Port"},{"qty":2,"name":"Wasteland"},{"qty":4,"name":"Wooded Foothills"}],"side":[{"qty":1,"name":"Caller of the Claw"},{"qty":1,"name":"Mogg Salvage"},{"qty":1,"name":"Naturalize"},{"qty":2,"name":"Overload"},{"qty":4,"name":"Pyroblast"},{"qty":1,"name":"Red Elemental Blast"},{"qty":3,"name":"Tormod's Crypt"},{"qty":2,"name":"Tranquil Domain"}],"mainCount":60,"sideCount":15},"letter":"A"}]},{"id":"premodern-replenish-twist","format":"Premodern","prompt":"Build a Replenish deck in Premodern that doesn't play blue.","lookFor":"Finds a non-blue enchantment engine or says why the request is weak and offers the closest real option.","title":"Build a Replenish deck in Premodern that doesn't play blue.","answers":[{"aid":"7b66f96ede47","text":"I'll check the current Premodern field and look for Replenish strategies.Replenish is Tier B with 21 appearances. Let me get the card stats and recent winning lists.I see the issue. All Replenish decks in the field play blue (Island is 100% stock). The deck needs blue for Frantic Search, Intuition, and Attunement. \n\nHowever, you asked for a non-blue version. This would be a brew. Let me build one using Replenish with white and green instead, keeping the core enchantment strategy.Perfect. I'll build a Replenish brew in white and green. This uses the enchantress draw engine with Argothian Enchantress and Enchantress's Presence instead of blue card draw. Sterling Grove tutors for key enchantments. The mana base uses green ramp and white tutors.Let me fix the main deck count and sideboard.Let me look up specific sideboard options.Now I'll rebuild with a full 60-card main deck and legal sideboard.Let me add 3 more cards to the main deck.Let me add 2 more cards.One more card.","error":false,"deck":{"main":[{"qty":4,"name":"Replenish"},{"qty":4,"name":"Opalescence"},{"qty":4,"name":"Parallax Wave"},{"qty":3,"name":"Seal of Cleansing"},{"qty":4,"name":"Swords to Plowshares"},{"qty":3,"name":"Abeyance"},{"qty":4,"name":"Argothian Enchantress"},{"qty":3,"name":"Enchantress's Presence"},{"qty":3,"name":"Sterling Grove"},{"qty":3,"name":"Mirri's Guile"},{"qty":3,"name":"Wild Growth"},{"qty":2,"name":"Exploration"},{"qty":2,"name":"Sylvan Library"},{"qty":2,"name":"Serra's Sanctum"},{"qty":4,"name":"Brushland"},{"qty":4,"name":"Windswept Heath"},{"qty":4,"name":"Plains"},{"qty":4,"name":"Forest"}],"side":[{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Yavimaya Granger"},{"qty":3,"name":"Aura of Silence"},{"qty":3,"name":"Disenchant"},{"qty":2,"name":"Elvish Lyrist"},{"qty":3,"name":"Naturalize"}],"mainCount":60,"sideCount":15},"letter":"A"}]},{"id":"modern-named-two-cards","format":"Modern","prompt":"Build a Modern deck around Thassa's Oracle and Tainted Pact.","lookFor":"Recognizes the combo, builds singleton-friendly support, real interaction and mana.","title":"Build a Modern deck around Thassa's Oracle and Tainted Pact.","answers":[{"aid":"54467526d1ab","text":"I'll look up those cards and find a legal shell for this combo.Tainted Pact is illegal in Modern. Thassa's Oracle is legal and shows up in 22 recent lists.\n\nI can build around Thassa's Oracle as a win condition, but Tainted Pact is not legal in the format. Do you want me to:\n\n1. Build a Thassa's Oracle deck using legal tutors and card draw instead?\n2. Build a different combo deck from the current Modern meta?\n\nLet me know which direction you'd prefer.","error":false,"deck":null,"letter":"A"}]},{"id":"modern-tribal-brew","format":"Modern","prompt":"I want a Modern Merfolk deck that can beat the current top decks.","lookFor":"Current Merfolk shell, sideboard aimed at the actual top decks.","title":"I want a Modern Merfolk deck that can beat the current top d","answers":[{"aid":"ccf22c5f7e39","text":"I'll check the current Modern field and then build you a Merfolk list that can compete.Merfolk is not in the current top 25 strategies. The field is dominated by Broodscale Combo (17.3%), Prowess (9.3%), and various combo and tempo decks. Merfolk has not shown up in recent results.\n\nI can build you a Merfolk brew that targets the meta, but it will not be based on recent winning lists. The deck will need to handle fast combo (Broodscale, Devoted Druid, Storm) and aggressive tempo (Prowess, Affinity).\n\nDo you want me to:\n1. Build a Merfolk brew designed to race and disrupt the current top decks?\n2. Switch to a different archetype that is actually performing in the meta?\n\nIf you want the Merfolk brew, I'll need to know your preferred shell: are you thinking tempo-focused with disruption, or a more aggressive fish strategy?","error":false,"deck":null,"letter":"A"}]},{"id":"modern-off-meta-color","format":"Modern","prompt":"Make a fun mono white control deck for Modern leagues.","lookFor":"Real win conditions, enough removal and card flow, honest about strength.","title":"Make a fun mono white control deck for Modern leagues.","answers":[{"aid":"e3f484be20a2","text":"I'll check the current Modern field to see what mono white control looks like.I don't see mono white control in the current meta. Let me check what Boros Land Destruction looks like, since that's the closest white control strategy showing results.Boros Land Destruction is the closest thing to white control in the meta. But you asked for mono white, so let me build a fun mono white control brew for you. I'll use a shell focused on board wipes, removal, and white's best control tools.For a fun mono white control brew, I'll focus on white's best removal and board wipes. Here's a list built around Solitude, Path to Exile, and Wrath effects:Let me fix that. I'll add more lands and remove the illegal card.Let me add more lands and utility.Let me add a few more cards and remove the illegal land.Let me add three more cards to hit 60.Let me fix the Counterspell count and add two more lands.Let me remove one Counterspell from the sideboard.","error":false,"deck":{"main":[{"qty":4,"name":"Solitude"},{"qty":4,"name":"Path to Exile"},{"qty":2,"name":"Wrath of God"},{"qty":3,"name":"Wrath of the Skies"},{"qty":2,"name":"Dress Down"},{"qty":3,"name":"Ephemerate"},{"qty":2,"name":"Spell Snare"},{"qty":3,"name":"Counterspell"},{"qty":2,"name":"Snapcaster Mage"},{"qty":2,"name":"Teferi, Time Raveler"},{"qty":1,"name":"Teferi, Hero of Dominaria"},{"qty":2,"name":"Murktide Regent"},{"qty":1,"name":"Subtlety"},{"qty":2,"name":"Engineered Explosives"},{"qty":1,"name":"Solitary Confinement"},{"qty":1,"name":"Spell Pierce"},{"qty":9,"name":"Plains"},{"qty":6,"name":"Island"},{"qty":4,"name":"Flooded Strand"},{"qty":2,"name":"Scalding Tarn"},{"qty":2,"name":"Hallowed Fountain"},{"qty":2,"name":"Mystic Gate"}],"side":[{"qty":2,"name":"Rest In Peace"},{"qty":2,"name":"Surgical Extraction"},{"qty":2,"name":"Dress Down"},{"qty":2,"name":"Spell Pierce"},{"qty":1,"name":"Jace, the Mind Sculptor"},{"qty":1,"name":"Teferi, Time Raveler"},{"qty":2,"name":"Subtlety"},{"qty":1,"name":"Murktide Regent"},{"qty":1,"name":"Counterspell"}],"mainCount":60,"sideCount":14},"letter":"A"}]},{"id":"legacy-sideboard-only","format":"Legacy","prompt":"Here's my Legacy Dimir Tempo main deck, build me a sideboard for the current meta. \n\n2 Brazen Borrower\n2 Murktide Regent\n4 Orcish Bowmasters\n4 Tamiyo, Inquisitive Student\n4 Brainstorm\n4 Daze\n4 Fatal Push\n4 Force of Will\n1 Flooded Strand\n1 Island\n1 Marsh Flats\n1 Misty Rainforest\n4 Polluted Delta\n1 Scalding Tarn\n1 Swamp\n1 Undercity Sewers\n4 Underground Sea\n4 Wasteland\n1 Kaito, Bane of Nightmares\n4 Flow State\n4 Ponder\n4 Thoughtseize","lookFor":"Fifteen cards aimed at the top decks by share, castable in UB, no anti-synergy.","title":"Here's my Legacy Dimir Tempo main deck, build me a sideboard","answers":[{"aid":"35c56deb8d13","text":"I'll help you build a sideboard for Dimir Tempo. Let me check the current meta and see what the field is playing.Good news. Your main deck is stock Dimir Tempo. The field average sideboard runs 7 cards across 15 slots. Here's what the meta is playing:\n\n- Consign to Memory (3 copies, 100% adoption)\n- Force of Negation (2 copies, 94% adoption)\n- Massacre (2 copies, 80% adoption)\n- Nihil Spellbomb (2 copies, 76% adoption)\n- Hydroblast (2 copies, 65% adoption)\n- Barrowgoyf (2 copies, 69% adoption)\n- Orcish Bowmasters (2 copies, 60% adoption)\n\nThat's 15 slots. Let me build your sideboard:Your sideboard is locked in. Here's what you're running:\n\n**Sideboard (15 cards)**\n- 3 Consign to Memory (100% adoption, exiles threats and graveyard fuel)\n- 2 Force of Negation (94% adoption, free counter against combo and tempo)\n- 2 Massacre (80% adoption, sweeps small creatures)\n- 2 Nihil Spellbomb (76% adoption, graveyard hate and card draw)\n- 2 Hydroblast (65% adoption, red removal and utility)  on recent results:Done. This is Mono-Red Rally, the tier A fast red aggro deck in Pauper. It runs 24 creatures that attack early and Rally at the Hornburg to generate tokens. Reckless Impulse and Experimental Synthesizer fuel the deck. Burn spells finish the game.\n\nThe sideboard has Cast into the Fire and Smash to Smithereens for artifact matchups, Red Elemental Blast and Pyroblast for blue decks, Relic of Progenitus for graveyard strategies, and extra End the Festivities for creature-heavy matchups.","error":false,"deck":{"main":[{"qty":4,"name":"Burning-tree Emissary"},{"qty":4,"name":"Clockwork Percussionist"},{"qty":4,"name":"Galvanic Blast"},{"qty":4,"name":"Goblin Bushwhacker"},{"qty":4,"name":"Goblin Tomb Raider"},{"qty":4,"name":"Great Furnace"},{"qty":4,"name":"Lightning Bolt"},{"qty":14,"name":"Mountain"},{"qty":4,"name":"Rally At the Hornburg"},{"qty":4,"name":"Voldaren Epicure"},{"qty":4,"name":"Reckless Impulse"},{"qty":3,"name":"Experimental Synthesizer"},{"qty":2,"name":"Chain Lightning"},{"qty":1,"name":"End the Festivities"}],"side":[{"qty":3,"name":"Cast Into the Fire"},{"qty":3,"name":"Red Elemental Blast"},{"qty":3,"name":"Pyroblast"},{"qty":2,"name":"Relic of Progenitus"},{"qty":2,"name":"End the Festivities"},{"qty":1,"name":"Smash to Smithereens"}],"mainCount":60,"sideCount":14},"letter":"A"}]},{"id":"pioneer-named-card","format":"Pioneer","prompt":"Build a Pioneer deck around Greasefang, Okiba Boss that isn't the usual list.","lookFor":"Keeps the engine, changes the shell meaningfully, still assembles reliably.","title":"Build a Pioneer deck around Greasefang, Okiba Boss that isn'","answers":[{"aid":"3d8c87525fe8","text":"I'll start by looking at the current Pioneer field and then find what Greasefang lists are doing.Good. Greasefang is Tier C with 10 appearances and 27 league trophies. Let me see what the standard lists look like.The standard Greasefang list is a Boros/Orzhov vehicle deck that recurs Parhelion II and Monument to Endurance and Stiflenought.\n\n4. **Keep Hydroblast at 2**. Answers Sligh and Goblins red spells.\n\nLet me propose the tuned list:**Tuned UB Psychatog for current meta:**\n\n**Changes from your list:**\n\nMain deck:\n- Added 1 Engineered Plague (cuts 1 Sickening Dreams, 1 Portent). Plague hits Enchantress tokens and Sligh tokens. Enchantress is 13.8% of the field.\n- Increased Smother to 4 (from 3). Sligh is 10.6% meta share.\n- Increased Fact or Fiction to 3 (from 2). Better card advantage against grindy matchups.\n\nSideboard:\n- Removed Control Magic. Too slow.\n- Added 1 more Engineered Plague (to 3 total). Enchantress is the top threat.\n\nThe deck keeps your core control shell and Psychatog finisher while adding maindeck answers to the top three strategies: Enchantress, Stiflenought, and Sligh. Back to Basics and Hydroblast in the board handle Terrageddon and red decks.","error":false,"deck":{"main":[{"qty":1,"name":"Powder Keg"},{"qty":4,"name":"Psychatog"},{"qty":4,"name":"Accumulated Knowledge"},{"qty":1,"name":"Chain of Vapor"},{"qty":4,"name":"Counterspell"},{"qty":3,"name":"Fact Or Fiction"},{"qty":4,"name":"Foil"},{"qty":4,"name":"Gush"},{"qty":2,"name":"Impulse"},{"qty":1,"name":"Lim-dûl's Vault"},{"qty":4,"name":"Smother"},{"qty":1,"name":"Thwart"},{"qty":1,"name":"Engineered Plague"},{"qty":11,"name":"Island"},{"qty":4,"name":"Polluted Delta"},{"qty":3,"name":"Swamp"},{"qty":2,"name":"Underground River"},{"qty":3,"name":"Duress"},{"qty":3,"name":"Portent"}],"side":[{"qty":2,"name":"Annul"},{"qty":2,"name":"Back to Basics"},{"qty":2,"name":"Blue Elemental Blast"},{"qty":1,"name":"Chain of Vapor"},{"qty":2,"name":"Engineered Plague"},{"qty":1,"name":"Haunting Echoes"},{"qty":2,"name":"Hydroblast"},{"qty":1,"name":"Morphling"}],"mainCount":60,"sideCount":13},"letter":"A"}]},{"id":"modern-combine-strategies","format":"Modern","prompt":"Combine Living End and Scam into one Modern deck.","lookFor":"Says whether the two plans fight, builds the version that works or explains why not.","title":"Combine Living End and Scam into one Modern deck.","answers":[{"aid":"fa6a56375d97","text":"I'll look up the current Modern field to find these strategies and see what they play.I see Living End in the field. I don't see \"Scam\" listed. That's likely Grief/Fury tempo or a Murktide shell. Let me get the card stats and reference lists for Living End, and check what Scam might be.\"Scam\" in Modern typically refers to Grief/Fury tempo decks that use Solitude and other free interaction. That's not showing as a named strategy in the current field. The closest would be Murktide or Rakdos Delirium.\n\nCombining Living End and Scam is difficult because they have opposite game plans. Living End is a cascade combo deck that wins by cheating creatures into play. Scam is a tempo deck built around Grief and Fury as free discard/removal.\n\nThey share almost no cards. Living End plays Shardless Agent, Violent Outburst, and cyclers. Scam plays Solitude, Counterspell, and Murktide.\n\nCan you clarify what you mean by \"Scam\"? Are you looking for:\n1. A Grief/Fury tempo shell mixed with Living End?\n2. A different archetype from the current field?\n3. A brew that uses specific cards from both strategies?\n\nOr would you like me to build a Living End list with some tempo elements added?","error":false,"deck":null,"letter":"A"}]},{"id":"pauper-named-common","format":"Pauper","prompt":"Build a Pauper deck around Kiln Fiend.","lookFor":"Cheap spell density, protection, enough payoff redundancy.","title":"Build a Pauper deck around Kiln Fiend.","answers":[{"aid":"a502aa57a433","text":"I'll look up Kiln Fiend and check the current Pauper field to build around it.Kiln Fiend is legal in Pauper and has appeared in 26 recent lists. It's a red creature that pumps itself when you cast instants or sorceries. This is a spellslinger strategy. Let me check if there's an established archetype and get reference lists.Mono-Red Rally is the closest established archetype, but it's focused on Rally at the Hornburg and creature tokens. Kiln Fiend wants a different shell: cheap instants and sorceries to pump it. This will be a brew. Let me build a spellslinger deck around Kiln Fiend with cantrips and burn.Let me look up specific cards that work with Kiln Fiend:Good. Now let me check for more red spells and creatures that fit:Monastery Swiftspear is illegal. Let me build a mono-red Kiln Fiend spellslinger brew with cheap instants and sorceries:Expedite is not legal. Let me check what I can use instead:Good. Let me rebuild with Faithless Looting and add one more card to reach 60:Let me add one more Mountain:Done. This is a Pauper brew built around Kiln Fiend as a spellslinger threat.\n\n**Main deck:** Kiln Fiend pumps itself +3/+0 each time you cast an instant or sorcery. Goblin Electromancer has not shown up in results but costs {U}{R} and reduces spell costs. The deck runs 28 cheap instants and sorceries: Lightning Bolt, Galvanic Blast, and Lava Spike for damage; Temur Battle Rage and Assault Strobe for double strike; Crash Through for trample and card draw; Faithless Looting for filtering; Reckless Impulse for card advantage; and Fireblast as a finisher. Great Furnace counts as an artifact for Galvanic Blast's metalcraft.\n\n**Sideboard:** Red Elemental Blast and Pyroblast for blue decks. Gorilla Shaman for artifact-heavy matchups like Affinity. Relic of Progenitus for graveyard strategies. Flaring Pain for Fog effects. Searing Blaze for creature-based decks.","error":false,"deck":{"main":[{"qty":4,"name":"Kiln Fiend"},{"qty":3,"name":"Goblin Electromancer"},{"qty":4,"name":"Lightning Bolt"},{"qty":4,"name":"Galvanic Blast"},{"qty":4,"name":"Lava Spike"},{"qty":3,"name":"Temur Battle Rage"},{"qty":2,"name":"Assault Strobe"},{"qty":2,"name":"Crash Through"},{"qty":3,"name":"Faithless Looting"},{"qty":2,"name":"Reckless Impulse"},{"qty":2,"name":"Fireblast"},{"qty":4,"name":"Great Furnace"},{"qty":23,"name":"Mountain"}],"side":[{"qty":3,"name":"Red Elemental Blast"},{"qty":3,"name":"Pyroblast"},{"qty":2,"name":"Gorilla Shaman"},{"qty":3,"name":"Relic of Progenitus"},{"qty":2,"name":"Flaring Pain"},{"qty":2,"name":"Searing Blaze"}],"mainCount":60,"sideCount":15},"letter":"A"}]},{"id":"premodern-dream-halls-no-storm","format":"Premodern","prompt":"Build me a Premodern Dream Halls deck that doesn't win with storm.","lookFor":"Keeps the Dream Halls engine (free spells by discarding a same-color card) but wins another way, with enough card flow to feed the discards. No storm cards.","title":"Build me a Premodern Dream Halls deck that doesn't win with ","answers":[{"aid":"66a7893d6f4a","text":"I'll look up Dream Halls and check the current Premodern field to understand what we're working with.Dream Halls is legal and has 40 decks in format. It shows 4 appearances in the field. Let me get the recent winning lists to see what the current approach is.I see the problem. All three recent Dream Halls lists are storm-based, using Brain Freeze and Rush of Knowledge as the kill. You want a different angle.\n\nDream Halls lets you cast spells by discarding cards that share a color. The non-storm approach would be to use it to cheat out big threats or lock pieces. Let me build a brew that uses Dream Halls to cast creatures or control spells without paying mana.\n\nHere's a concept: use Dream Halls to cast creatures like Iona, Shield of Emeria or Yosei, the Morning Star (both legal in Premodern), or lock pieces like Stasis. We'll pair it with card draw and discard outlets to fuel the engine.Iona and Yosei are illegal. Let me look for legal creatures and payoffs that work with Dream Halls.Let me try a different approach. I'll look for creatures and payoffs that are actually legal in Premodern and work with the Dream Halls engine.Good. Now let me think about the win condition. Since you don't want storm, I'll build around casting creatures and control spells for free via Dream Halls, then winning with creatures or a control lock. Morphling is a classic finisher. Let me also check for other payoffs.Psychatog is legal and works well with discard. Let me build a Dream Halls deck that uses it as a finisher, along with Morphling and control elements. The core idea: use Dream Halls to cast spells and creatures for free by discarding, then win with creatures or control.\n\nHere's my brew:I need 6 more cards. Let me add more draw and utility.Brainstorm is illegal. Let me add Opt, Arcane Denial, and Gilded Drake to round out the deck.Need 3 more. Let me add more lands and utility.","error":false,"deck":null,"letter":"A"}]},{"id":"any-format-peter-parkers-camera","format":"Any","prompt":"Build a deck that best utilizes Peter Parker's Camera.","lookFor":"Picks a format where the Camera is legal and says why. Finds activated or triggered abilities worth copying three times, enough of them to make a 1-mana artifact matter.","title":"Build a deck that best utilizes Peter Parker's Camera.","answers":[{"aid":"8256c29e5a49","text":"I'll look up Peter Parker's Camera to see what it does and check if it's legal in Modern.Peter Parker's Camera is legal in Modern but has not shown up in results. This is a brew.\n\nThe Camera copies activated or triggered abilities you control. The best shell would abuse repeatable abilities: fetch lands, manlands, planeswalkers, or creatures with strong activated abilities.\n\nLet me check what strategies have the most flexible activated abilities and mana bases to support this:For Peter Parker's Camera, I want a deck with many activated abilities to copy. Amulet Titan is perfect: it runs Amulet of Vigor (triggers), Primeval Titan (activated ability to fetch), and manlands. Let me build around that:Perfect. Amulet Titan has Primeval Titan's activated ability to fetch lands, Amulet of Vigor's triggered ability, and manlands like Urza's Saga. Peter Parker's Camera can copy these repeatedly.\n\nI'll add 2 copies of the Camera to the main deck, cutting some flex slots. The Camera is cheap, enters immediately, and copies Primeval Titan fetches or Amulet triggers to accelerate further.Done. This is a brew: Amulet Titan with 2 copies of Peter Parker's Camera.\n\nThe Camera copies Primeval Titan's activated ability to fetch two lands, or Amulet of Vigor's triggered ability when lands enter. With Spelunking and bounce lands, you can chain multiple land drops and copy them repeatedly. The Camera costs one mana and enters with three film counters, giving you three extra copies before it runs out.","error":false,"deck":{"main":[{"qty":4,"name":"Amulet of Vigor"},{"qty":2,"name":"Peter Parker's Camera"},{"qty":1,"name":"Aftermath Analyst"},{"qty":4,"name":"Arboreal Grazer"},{"qty":1,"name":"Cultivator Colossus"},{"qty":1,"name":"Dryad of the Ilysian Grove"},{"qty":3,"name":"Primeval Titan"},{"qty":2,"name":"Sakura-tribe Scout"},{"qty":4,"name":"Spelunking"},{"qty":2,"name":"Summoner's Pact"},{"qty":3,"name":"Boseiju, Who Endures"},{"qty":4,"name":"Crumbling Vestige"},{"qty":1,"name":"Echoing Deeps"},{"qty":3,"name":"Forest"},{"qty":4,"name":"Gruul Turf"},{"qty":1,"name":"Hanweir Battlements"},{"qty":1,"name":"Mirrorpool"},{"qty":1,"name":"Shifting Woodland"},{"qty":3,"name":"Simic Growth Chamber"},{"qty":3,"name":"The Mycosynth Gardens"},{"qty":1,"name":"Tolaria West"},{"qty":4,"name":"Urza's Saga"},{"qty":1,"name":"Valakut, the Molten Pinnacle"},{"qty":1,"name":"Vesuva"},{"qty":3,"name":"Green Sun's Zenith"},{"qty":2,"name":"Scapeshift"}],"side":[{"qty":1,"name":"Bojuka Bog"},{"qty":1,"name":"Boseiju, Who Endures"},{"qty":2,"name":"Cursed Totem"},{"qty":3,"name":"Dismember"},{"qty":1,"name":"Elvish Reclaimer"},{"qty":2,"name":"Endurance"},{"qty":1,"name":"Fire Magic"},{"qty":1,"name":"Force of Vigor"},{"qty":1,"name":"Tireless Tracker"},{"qty":2,"name":"Vexing Bauble"}],"mainCount":60,"sideCount":15},"letter":"A"}]},{"id":"premodern-vague","format":"Premodern","prompt":"Something weird but competitive for Premodern.","lookFor":"Offers distinct directions, picks one, still plays real interaction.","title":"Something weird but competitive for Premodern.","answers":[{"aid":"bc8a25cc3033","text":"I'll check what's in the current Premodern field.Stasis is the weird one. 0.8% meta share but 3 league trophies. Let me grab a winning list.Stasis is a lock deck. You tap down the opponent's lands with Stasis, untap with Forsaken City, and use Gush and Chain of Vapor to keep them locked. Black Vise drains them out. It's weird, it's competitive, and it has real wins.\n\nThe SOANGRY 5-0 is the cleaner list. Want me to build from that?","error":false,"deck":null,"letter":"A"}]}]}</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const DIMS = DATA.dimensions;
  const ratings = new Map(); // answer id -> rating body
  const syncers = new Map();
  const writeChains = new Map();
  let db = null;
  let canWrite = false;
  let current = 0;
  try { current = Math.min(Number(localStorage.getItem("blind-prompt") || 0), DATA.prompts.length - 1) || 0; } catch (e) {}

  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
    }
    for (const kid of kids) if (kid) n.append(kid);
    return n;
  };
  const complete = (aid) => {
    const r = ratings.get(aid);
    return Boolean(r) && DIMS.every((d) => typeof r[d.key] === "number");
  };
  const lines = (xs) => (xs || []).map((c) => `${c.qty} ${c.name}`).join("\n");

  function renderProgress() {
    const total = DATA.prompts.reduce((n, p) => n + p.answers.length, 0);
    const done = DATA.prompts.reduce((n, p) => n + p.answers.filter((a) => complete(a.aid)).length, 0);
    const prog = document.getElementById("progress");
    prog.replaceChildren(el("b", { text: `${done} of ${total}` }), " answers rated");
    const picker = document.getElementById("picker");
    DATA.prompts.forEach((p, i) => {
      const n = p.answers.filter((a) => complete(a.aid)).length;
      picker.options[i].textContent = `${i + 1}. ${p.title} (${n}/${p.answers.length})`;
    });
  }

  function save(prompt, answer, patch, status) {
    if (!db || !canWrite) return;
    const body = { ...(ratings.get(answer.aid) || {}), ...patch, aid: answer.aid, prompt: prompt.id, updatedAt: new Date().toISOString() };
    ratings.set(answer.aid, body);
    renderProgress();
    status.textContent = "Saving…";
    const prev = writeChains.get(answer.aid) || Promise.resolve();
    const next = prev
      .then(() => db.collection("ratings").doc(answer.aid).set(body))
      .then(() => { status.textContent = "Saved"; })
      .catch((e) => {
        status.textContent = e && e.code === "invalid_argument"
          ? "Only the owner can save ratings on this page."
          : "Could not save. Try again in a moment.";
      });
    writeChains.set(answer.aid, next);
  }

  function renderAnswer(prompt, answer) {
    const card = el("article", { class: "card" });
    let chip = el("span", { class: "chip ok", text: "Deck passed v1's check" });
    if (answer.error) chip = el("span", { class: "chip bad", text: "Error, no answer" });
    else if (!answer.deck) chip = el("span", { class: "chip warn", text: "No deck" });
    const done = el("span", { class: "done" });
    card.append(el("div", { class: "card-head" }, el("span", { class: "letter", text: answer.letter }), chip, done));

    if (answer.text) {
      const d = el("details", {}, el("summary", { text: `Read the reply (${answer.text.length.toLocaleString()} characters)` }));
      d.append(el("div", { class: "reply", text: answer.text }));
      if (!answer.deck) d.open = true;
      card.append(d);
    } else if (answer.error) {
      card.append(el("p", { class: "lookfor", text: "The model returned an error for this prompt." }));
    }
    if (answer.deck) {
      const deck = el("div", { class: "deck" });
      deck.append(el("div", {}, el("h3", { text: `Main deck (${answer.deck.mainCount})` }), el("pre", { text: lines(answer.deck.main) })));
      if (answer.deck.side.length) deck.append(el("div", {}, el("h3", { text: `Sideboard (${answer.deck.sideCount})` }), el("pre", { text: lines(answer.deck.side) })));
      card.append(deck);
    }

    const rate = el("div", { class: "rate" });
    const status = el("div", { class: "saved", "aria-live": "polite" });
    const segs = [];
    for (const d of DIMS) {
      const id = `l-${answer.aid}-${d.key}`;
      const row = el("div", { class: "row" }, el("label", { id, text: d.label }));
      const seg = el("div", { class: "seg", role: "group", "aria-labelledby": id });
      for (let v = 1; v <= 5; v++) {
        const b = el("button", { type: "button", "aria-pressed": "false", text: String(v) });
        b.disabled = !canWrite;
        b.addEventListener("click", () => {
          for (const sib of seg.children) sib.setAttribute("aria-pressed", String(sib === b));
          save(prompt, answer, { [d.key]: v }, status);
          done.textContent = complete(answer.aid) ? "Rated" : "";
        });
        seg.append(b);
      }
      segs.push(seg);
      row.append(seg);
      rate.append(row);
    }
    const notes = el("textarea", { id: `n-${answer.aid}`, placeholder: "Notes (optional)" });
    notes.disabled = !canWrite;
    notes.addEventListener("change", () => save(prompt, answer, { notes: notes.value }, status));
    rate.append(notes, status);
    card.append(rate);

    const sync = () => {
      const r = ratings.get(answer.aid) || {};
      DIMS.forEach((d, i) => {
        for (const b of segs[i].children) b.setAttribute("aria-pressed", String(r[d.key] === Number(b.textContent)));
      });
      if (document.activeElement !== notes) notes.value = r.notes || "";
      done.textContent = complete(answer.aid) ? "Rated" : "";
    };
    syncers.set(answer.aid, sync);
    sync();
    return card;
  }

  function render() {
    const p = DATA.prompts[current];
    try { localStorage.setItem("blind-prompt", String(current)); } catch (e) {}
    document.getElementById("picker").value = String(current);
    for (const id of ["prev", "prev2"]) document.getElementById(id).disabled = current === 0;
    for (const id of ["next", "next2"]) document.getElementById(id).disabled = current === DATA.prompts.length - 1;
    const req = document.getElementById("request");
    const firstLine = p.prompt.split("\n")[0];
    const kids = [el("span", { class: "fmt", text: `${p.format} · ${p.answers.length} anonymous answers` })];
    if (p.prompt.length > 220 && p.prompt.includes("\n")) {
      kids.push(el("p", { class: "prompt", text: firstLine }));
      const d = el("details", {}, el("summary", { text: "Show the pasted list" }));
      d.append(el("div", { class: "deck" }, el("pre", { text: p.prompt.slice(firstLine.length).trim() })));
      kids.push(d);
    } else {
      kids.push(el("p", { class: "prompt", text: p.prompt }));
    }
    const lf = el("p", { class: "lookfor" });
    lf.append(el("b", { text: "A good answer: " }), p.lookFor);
    kids.push(lf);
    req.replaceChildren(...kids);
    syncers.clear();
    document.getElementById("list").replaceChildren(...p.answers.map((a) => renderAnswer(p, a)));
    renderProgress();
  }

  const picker = document.getElementById("picker");
  DATA.prompts.forEach((p, i) => picker.append(el("option", { value: String(i), text: `${i + 1}. ${p.title}` })));
  picker.addEventListener("change", () => { current = Number(picker.value); render(); window.scrollTo(0, 0); });
  const go = (delta) => { current = Math.max(0, Math.min(DATA.prompts.length - 1, current + delta)); render(); window.scrollTo(0, 0); };
  for (const id of ["prev", "prev2"]) document.getElementById(id).addEventListener("click", () => go(-1));
  for (const id of ["next", "next2"]) document.getElementById(id).addEventListener("click", () => go(1));

  render();

  (async () => {
    const notice = document.getElementById("notice");
    const claude = window.claude;
    const dbNs = claude && claude.use ? await claude.use("db") : null;
    const user = claude && claude.use ? await claude.use("user") : null;
    if (!dbNs) {
      notice.textContent = "Ratings save only when this page is open on claude.ai and you're signed in. You can still read every answer.";
      return;
    }
    db = dbNs;
    canWrite = user ? (user.isOwner() ?? false) : false;
    let first = true;
    db.collection("ratings").onSnapshot(
      (snap) => {
        ratings.clear();
        for (const d of snap.docs) ratings.set(d.id, d.data());
        if (first) {
          first = false;
          notice.textContent = canWrite
            ? "Answers are anonymous and shuffled per prompt. Ratings save as you click."
            : "Read-only: only the page owner can rate.";
          render();
          return;
        }
        for (const sync of syncers.values()) sync();
        renderProgress();
      },
      () => { notice.textContent = "Saved ratings could not be loaded. Reload the page to try again."; },
    );
  })();
})();
</script>
