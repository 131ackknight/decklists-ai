<title>Would You Play It</title>

<style>
/* Layout: one question per screen. The request, each answer's opening, only the cards that differ, then A / Same / B. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --ink: #1b2236;
  --muted: #5d667d;
  --line: #dde2ec;
  --accent: #2459a6;
  --pick: #b5650d;
  --chip: #e8edf6;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141d; --surface: #181e2b; --ink: #e5e9f2; --muted: #9aa4ba; --line: #2a3346;
    --accent: #6f9fe0; --pick: #e2a04f; --chip: #222b3d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141d; --surface: #181e2b; --ink: #e5e9f2; --muted: #9aa4ba; --line: #2a3346;
  --accent: #6f9fe0; --pick: #e2a04f; --chip: #222b3d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 64px; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.top h1 { font-size: 1.3rem; }
.progress { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.progress b { color: var(--pick); }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 0.9rem; color: var(--muted); }
.controls label { display: inline-flex; gap: 6px; align-items: center; }
.btn { font: 600 0.88rem var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.btn:disabled { opacity: 0.5; cursor: default; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.notice { margin: 0; color: var(--muted); font-size: 0.9rem; }
.request { display: grid; gap: 6px; }
.fmt { font: 600 0.75rem var(--font-body); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.prompt { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.duel { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 14px; }
.side { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.side-head { display: flex; gap: 10px; align-items: center; }
.letter { font: 700 1.2rem var(--font-display); width: 2.1rem; height: 2.1rem; display: grid; place-items: center; border-radius: 8px; background: var(--ink); color: var(--surface); }
.lead { margin: 0; font-size: 0.94rem; overflow-wrap: anywhere; }
.only h3 { font: 600 0.78rem var(--font-body); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
.only pre { margin: 0; font: 0.84rem/1.5 var(--font-mono); padding: 10px 12px; background: var(--bg); border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
.none { color: var(--muted); font-style: italic; }
.full summary { font-size: 0.85rem; }
.full h4 { font: 600 0.72rem var(--font-body); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 8px 0 2px; }
.full ul { list-style: none; margin: 0; padding: 0; font: 0.8rem/1.5 var(--font-mono); columns: 2 170px; column-gap: 14px; }
.full li { break-inside: avoid; overflow-wrap: anywhere; }
.full li.uniq { color: var(--accent); font-weight: 600; }
.only ul { list-style: none; margin: 0; padding: 10px 12px; background: var(--bg); border-radius: 8px; font: 0.84rem/1.5 var(--font-mono); }
.only li { overflow-wrap: anywhere; }
.card { cursor: help; border-bottom: 1px dotted var(--muted); }
.card:hover, .card:focus-visible { color: var(--accent); }
#peek { position: fixed; z-index: 10; width: min(300px, calc(100vw - 16px)); max-height: 60vh; overflow: auto; border-radius: 10px; border: 1px solid var(--line); box-shadow: 0 8px 28px rgba(0,0,0,0.3); background: var(--surface); color: var(--ink); padding: 10px 12px; display: none; pointer-events: none; font: 0.84rem/1.45 var(--font-body); }
#peek.on { display: block; }
#peek .pk-head { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; }
#peek .pk-cost { font-family: var(--font-mono); font-weight: 400; color: var(--muted); white-space: nowrap; }
#peek .pk-type { color: var(--muted); font-size: 0.78rem; margin: 2px 0 6px; }
#peek .pk-text { white-space: pre-wrap; }
#peek .pk-pt { text-align: right; font-weight: 700; margin-top: 6px; }
.peek-note { font-size: 0.78rem; color: var(--muted); margin: 0; }
details summary { cursor: pointer; color: var(--accent); font-size: 0.9rem; }
.shared pre { margin: 6px 0 0; font: 0.8rem/1.45 var(--font-mono); padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; columns: 2 220px; }
.reply { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 20rem; overflow: auto; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.9rem; margin-top: 6px; }
.ask { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.ask h2 { font-size: 1.1rem; }
.picks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.picks button { font: 700 1.05rem var(--font-display); padding: 16px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); cursor: pointer; }
.picks button kbd { display: block; font: 0.75rem var(--font-mono); color: var(--muted); margin-top: 2px; }
.picks button[aria-pressed="true"] { background: var(--pick); color: var(--surface); border-color: var(--pick); }
.picks button[aria-pressed="true"] kbd { color: var(--surface); }
.why { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.85rem; color: var(--muted); }
.why button { font: 0.85rem var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 4px 10px; border-radius: 999px; cursor: pointer; }
.why button[aria-pressed="true"] { background: var(--chip); border-color: var(--accent); color: var(--accent); }
button:disabled { cursor: not-allowed; opacity: 0.6; }
.saved { font-size: 0.8rem; color: var(--muted); min-height: 1.2em; }
@media (max-width: 560px) { .picks { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: no-preference) { .picks button, .why button { transition: background 120ms ease, color 120ms ease; } }
</style>
<style>
.deckbox { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.ans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ans button { font: 700 1.05rem var(--font-display); padding: 16px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); cursor: pointer; }
.ans button kbd { display: block; font: 0.75rem var(--font-mono); color: var(--muted); margin-top: 2px; }
.ans button[aria-pressed="true"] { background: var(--pick); color: var(--surface); border-color: var(--pick); }
.ans button[aria-pressed="true"] kbd { color: var(--surface); }
.note { display: grid; gap: 6px; }
.note textarea { font: 0.92rem var(--font-body); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); min-height: 3.2em; resize: vertical; }
</style>

<script type="application/json" id="data">{"decks":[{"id":"474087c633ec","format":"Premodern","prompt":"Brew me a Premodern deck built around Rising Waters.","text":"I built UG Waters, a green mana-creature deck with Rising Waters and Opposition as a soft lock. Rising Waters stops lands from untapping, but creatures still untap normally, so your 16 mana creatures keep making mana while the opponent gets one land per turn. Opposition then taps that one land during their upkeep, after it untaps. River Boa, Blastoderm, Call of the Herd and Deranged Hermit's squirrels win the game while they're locked out.\n\n**Directions I considered:**\n1. **Mono-blue Stasis-style.** Use the Stasis shell (Gush, Daze, Thwart, Black Vise, Forsaken City) with Rising Waters as a second lock piece.\n2. **Stiflenought tempo.** Land Phyrexian Dreadnought, protect it with Stifle and free counters, then use Rising Waters to keep the opponent off mana.\n3. **UG mana creatures + Opposition (chosen).** I borrowed the creature base and mana from Cradle Control, an existing green deck that already runs Winter Orb (a similar lock artifact) and Opposition.\n\nI picked direction 3 because Rising Waters only stops lands. A deck that makes its mana from creatures is the one where the lock barely touches you, so the card works best there.\n\n**What the cards do:**\n- **Quirion Ranger:** returns a tapped Forest to your hand so you can replay it untapped, getting around your own Rising Waters.\n- **Gaea's Cradle:** a land that makes one green mana per creature you control. Pick it as your one land to untap each turn.\n- **River Boa:** can't be blocked by blue players who control an Island. In the last 30 days, Stiflenought (10% of the field) and UB Psychatog (5%) both play Islands.\n\n**Win line:**\n- **Turn 1:** mana creature.\n- **Turn 2:** second mana creature.\n- **Turn 3:** Rising Waters.\n- **Turn 4:** Opposition.\n- **Turn 4 on:** attack with creatures that don't need your lands. The planned finish is turn 7.\n\n**Honest odds:**\n- Rising Waters is a 4-mana enchantment and you run 4 copies. You'll see one by turn 4 in about 53% of games, and you'll have a mana creature 97% of the time.\n- When Rising Waters doesn't show up, you're playing a fair green creature deck with fast mana.\n- The checker gave about 1.2% for drawing every specific card in the win line by turn 7. That number is mostly about needing those exact cards; other creatures and the second lock piece can stand in for them.\n\n**Mana:** 19 lands, slightly below Cradle Control's average of about 20. A lock deck that runs on creature mana wants fewer lands.\n\n**Sideboard:** aimed at the current field:\n- Hydroblast for Sligh and Goblins.\n- Naturalize for Enchantress and Mox Diamond.\n- Submerge, which is free against any deck with a Forest, for Terrageddon and Enchantress.\n- Xantid Swarm for counterspell decks.\n- Tormod's Crypt for graveyard decks (Hermit Druid, Replenish, Psychatog).\n- Ravenous Baloth and a second Masticore for aggro.","deck":{"main":[{"qty":4,"name":"Birds of Paradise"},{"qty":4,"name":"Llanowar Elves"},{"qty":4,"name":"Fyndhorn Elves"},{"qty":2,"name":"Werebear"},{"qty":2,"name":"Quirion Ranger"},{"qty":4,"name":"Rising Waters"},{"qty":3,"name":"Opposition"},{"qty":4,"name":"River Boa"},{"qty":2,"name":"Blastoderm"},{"qty":3,"name":"Call of the Herd"},{"qty":2,"name":"Deranged Hermit"},{"qty":2,"name":"Tradewind Rider"},{"qty":1,"name":"Masticore"},{"qty":1,"name":"Mystic Snake"},{"qty":2,"name":"Sylvan Library"},{"qty":1,"name":"Wall of Blossoms"},{"qty":8,"name":"Forest"},{"qty":4,"name":"Island"},{"qty":4,"name":"Yavimaya Coast"},{"qty":2,"name":"Gaea's Cradle"},{"qty":1,"name":"Treetop Village"}],"side":[{"qty":3,"name":"Hydroblast"},{"qty":3,"name":"Naturalize"},{"qty":2,"name":"Submerge"},{"qty":2,"name":"Xantid Swarm"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Ravenous Baloth"},{"qty":1,"name":"Masticore"}],"commander":[]}},{"id":"f73420c37812","format":"Premodern","prompt":"Brew me a Premodern deck built around Mind Over Matter.","text":"I built a mono-blue Mind Over Matter storm deck. The deck was accepted as a 60-card main with a 15-card sideboard. I'm calling it a brew: in recent results Mind Over Matter shows up in only one Premodern list.\n\n**The plan:** Mind Over Matter costs 6 ({2}{U}{U}{U}{U}), so you rarely pay for it. Show and Tell puts it into play on turn 2 off Ancient Tomb + Island, or turn 1 with Ancient Tomb + Mox Diamond. If you can't do that, you hard-cast it around turn 4 using Ancient Tomb, City of Traitors, Mox Diamond, Svyelunite Temple and Thran Dynamo. Once it's out, every card you discard untaps a land or mana rock, so your hand becomes mana: 2 from Tomb or City, 3 from Dynamo, blue from an Island or Mox.\n\nWith Mind Over Matter out, Rush of Knowledge draws 6 cards because Mind Over Matter is your highest mana value permanent. Accumulated Knowledge, Frantic Search, Meditate and Opt keep refilling your hand and each one adds to storm. When you've cast about 10 spells, Brain Freeze mills 3 cards per copy, and two Brain Freezes empty the opponent's library.\n\n**Honest odds:**\n- You find Mind Over Matter or Intuition plus some fast mana by turn 4 about 65% of the time. Intuition naming three copies of Mind Over Matter guarantees you get one.\n- The turn-2 Show and Tell start is much less reliable. With 3 Show and Tells that hand came up only 26% of the time, which is why I raised it to 4.\n- Each Ancient Tomb untap deals 2 damage to you. Use City of Traitors and Thran Dynamo first.\n\n**Directions I considered:**\n1. **UB reanimator:** the one real list. It uses Academy Rector, Shallow Grave and Arcanis the Omnipotent, then kills with a hasty Kamahl, Pit Fighter. I passed because it needs white for Rector and is clunky.\n2. **White-blue Replenish:** Attunement puts Mind Over Matter in the graveyard and Replenish brings it back. I passed because there Mind Over Matter only locks the opponent's lands and doesn't win.\n3. **Borrowing the Dream Halls package (chosen):** Show and Tell, Tomb, City, Rush of Knowledge, Meditate, Intuition and Brain Freeze, with Mind Over Matter replacing Dream Halls as the engine.\n\nI chose the third because Mind Over Matter plus lands that make 2 mana is a real engine that produces cards and mana together. It also has a proven kill from that shell, and the land count (19 plus 3 Mox Diamond) matches real Dream Halls lists.\n\nThe sideboard targets the current field:\n- **Red decks (Sligh, Goblins):** Hydroblast and Blue Elemental Blast.\n- **Enchantress, Replenish and Mox Diamond decks:** Annul.\n- **Counterspell decks (Stiflenought, Psychatog):** Defense Grid.\n- **Hermit Druid and Psychatog:** Stifle and Tormod's Crypt.\n- **Cunning Wish targets:** Chain of Vapor plus the other sideboard instants.","deck":{"main":[{"qty":11,"name":"Island"},{"qty":4,"name":"Ancient Tomb"},{"qty":2,"name":"City of Traitors"},{"qty":2,"name":"Svyelunite Temple"},{"qty":4,"name":"Mind Over Matter"},{"qty":4,"name":"Show and Tell"},{"qty":3,"name":"Mox Diamond"},{"qty":1,"name":"Thran Dynamo"},{"qty":4,"name":"Rush of Knowledge"},{"qty":3,"name":"Meditate"},{"qty":4,"name":"Accumulated Knowledge"},{"qty":3,"name":"Intuition"},{"qty":4,"name":"Frantic Search"},{"qty":3,"name":"Opt"},{"qty":3,"name":"Brain Freeze"},{"qty":4,"name":"Counterspell"},{"qty":1,"name":"Cunning Wish"}],"side":[{"qty":3,"name":"Hydroblast"},{"qty":2,"name":"Blue Elemental Blast"},{"qty":3,"name":"Annul"},{"qty":2,"name":"Chain of Vapor"},{"qty":2,"name":"Defense Grid"},{"qty":2,"name":"Stifle"},{"qty":1,"name":"Tormod's Crypt"}],"commander":[]}},{"id":"6dda8d243ce9","format":"Premodern","prompt":"Brew me a Premodern deck built around Phyrexian Processor.","text":"I built a mono-black **Processor Ritual** brew. It's a new deck, not a proven list. In recent results, Phyrexian Processor only shows up as a single sideboard copy in Devourer Combo, fetched by Tinker. This deck makes it the main plan.\n\n**The plan:** Dark Ritual, Ancient Tomb, City of Traitors and Lotus Petal get Processor down on turn 1 or 2. The card has you pay any amount of life as it enters, then {4},{T} makes a black Minion token whose power and toughness equal the life you paid. Duress, Cabal Therapy and Ravenous Rats strip the cards that answer it first: Counterspell, Seal of Cleansing, Naturalize. Then you make a 7/7 or 8/8 every turn and win around turn 5.\n\n**How much life to pay:** About 7–8 against control and combo. Only 4–5 against Sligh and Goblins, because Ancient Tomb also costs you 2 damage per tap.\n\n**Backup plan:** When you don't draw Processor, the deck still plays like a disruptive black aggro deck, with Hypnotic Specter, Phyrexian Negator and Masticore.\n\n**Three directions I considered:**\n1. **Tinker artifact deck:** borrows the Devourer Combo shell and Tinkers for Processor.\n2. **White Armageddon prison:** Mox Diamond and City of Traitors into Processor, then Armageddon, borrowing the Terrageddon package.\n3. **Mono-black Ritual:** borrows the menu's Moneyball Black package (Dark Ritual, Duress, Cabal Therapy, Smother, Diabolic Edict) plus the fast lands.\n\n**I chose mono-black.** Dark Ritual and the colorless fast lands are the only redundant way to cast a 4-mana artifact on turn 1–2, and discard is the best protection black has for a noncreature threat. The mana matches Moneyball's (17 black sources), and check_deck flagged no issues.\n\n**Honest odds:**\n- With 4 Processors you have about a 49% chance to see one by turn 3 on the play.\n- About 38% of hands have Processor plus a fast-mana card by turn 2.\n- Drawing every card in my full sample line (Duress, Tomb, Processor, Therapy) by turn 5 is only about 7%. But the only parts you really need are Processor plus fast mana; the discard is interchangeable.\n- That's why about half the deck works without Processor.\n\n**Weak spots:** Burn decks (Sligh) punish the life payment. Terrageddon and Enchantress play artifact removal. The 15-card sideboard targets these:\n- Dystopia and Gloom for Enchantress, Terrageddon and Replenish\n- Engineered Plague for Goblins\n- Bottle Gnomes for Sligh\n- Tormod's Crypt for Psychatog, Replenish and Hermit Druid","deck":{"main":[{"qty":4,"name":"Phyrexian Processor"},{"qty":4,"name":"Hypnotic Specter"},{"qty":3,"name":"Phyrexian Negator"},{"qty":2,"name":"Masticore"},{"qty":3,"name":"Ravenous Rats"},{"qty":2,"name":"Withered Wretch"},{"qty":4,"name":"Dark Ritual"},{"qty":4,"name":"Duress"},{"qty":4,"name":"Cabal Therapy"},{"qty":3,"name":"Smother"},{"qty":2,"name":"Diabolic Edict"},{"qty":1,"name":"Cursed Scroll"},{"qty":2,"name":"Lotus Petal"},{"qty":4,"name":"Ancient Tomb"},{"qty":3,"name":"City of Traitors"},{"qty":15,"name":"Swamp"}],"side":[{"qty":3,"name":"Engineered Plague"},{"qty":3,"name":"Dystopia"},{"qty":2,"name":"Gloom"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Bottle Gnomes"},{"qty":2,"name":"Perish"},{"qty":1,"name":"Diabolic Edict"}],"commander":[]}},{"id":"22550a15b81d","format":"Premodern","prompt":"Brew me a Premodern deck built around Volrath's Shapeshifter and Phage the Untouchable.","text":"This is a UG deck with a tiny red splash. It uses Survival of the Fittest to get Phage the Untouchable into your graveyard without ever casting it, which turns Volrath's Shapeshifter into a flying, game-ending Phage. It's a brew: no published list in the last 400 days runs these two cards together.\n\n**How it wins (around turn 4):**\n1. Turn 2: Survival of the Fittest.\n2. Turn 3: Shapeshifter.\n3. Turn 4: discard Wonder to Survival to fetch Phage. While Wonder is in your graveyard and you control an Island, your creatures have flying.\n4. Attack with Shapeshifter. Once no blockers are declared, discard Phage to Wild Mongrel for free (Merfolk Looter or Survival also work).\n5. Phage is now the top card of your graveyard, so Shapeshifter becomes a 4/4 Phage. Its combat damage makes the opponent lose the game.\n6. Phage was never cast or put onto the battlefield, so its \"you lose the game\" trigger never happens.\n7. Bonus: with Anger in the graveyard and a Mountain in play, Shapeshifter has haste and can win the turn it comes down.\n\n**Direction chosen:** I looked at three options:\n- **Hermit Druid Combo shell:** the deck where Shapeshifter is already played.\n- **UG Survival with Wonder:** borrows the Survival + Wild Mongrel/madness package from Survival Madness.\n- **UB discard control:** uses Shapeshifter's own \"{2}: Discard a card.\"\n\nI picked UG Survival. It's the only one that gives you evasion (Wonder), a free instant-speed discard outlet and a tutor for every piece, all in one shell.\n\n**Things to know:**\n- **Be careful with your graveyard.** Shapeshifter only copies the top card of your graveyard. Any instant you cast (Counterspell, Impulse, etc.) lands on top and covers Phage. So discard Phage last, during combat.\n- **Odds:** you draw a Shapeshifter plus either Phage or Survival by turn 4 on the draw about 39.5% of the time. That doesn't count Survival fetching Shapeshifter itself or the Looters digging, so the real number is higher.\n- **Warnings I left alone:**\n  - The deck checker wants 20 black sources for Phage. You never cast it, so the 3 lands that can fetch a Swamp don't matter.\n  - Red is low compared with Survival Madness lists because the single Mountain is only there to switch on Anger. You never need red mana.\n- **Sideboard:** aimed at the current top decks: Annul and Naturalize for Enchantress and Replenish, Hydroblast for Sligh and Goblins, Submerge for green decks like Terrageddon, and Tormod's Crypt for Hermit Druid and Psychatog.","deck":{"main":[{"qty":4,"name":"Birds of Paradise"},{"qty":4,"name":"Merfolk Looter"},{"qty":4,"name":"Wild Mongrel"},{"qty":4,"name":"Volrath's Shapeshifter"},{"qty":2,"name":"Phage the Untouchable"},{"qty":2,"name":"Wonder"},{"qty":1,"name":"Anger"},{"qty":2,"name":"Basking Rootwalla"},{"qty":2,"name":"Arrogant Wurm"},{"qty":4,"name":"Survival of the Fittest"},{"qty":4,"name":"Counterspell"},{"qty":3,"name":"Mana Leak"},{"qty":3,"name":"Impulse"},{"qty":4,"name":"Yavimaya Coast"},{"qty":4,"name":"Wooded Foothills"},{"qty":2,"name":"Flooded Strand"},{"qty":1,"name":"Polluted Delta"},{"qty":5,"name":"Island"},{"qty":4,"name":"Forest"},{"qty":1,"name":"Mountain"}],"side":[{"qty":2,"name":"Naturalize"},{"qty":1,"name":"Uktabi Orangutan"},{"qty":3,"name":"Hydroblast"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Ravenous Baloth"},{"qty":2,"name":"Submerge"},{"qty":3,"name":"Annul"}],"commander":[]}},{"id":"35d23af246be","format":"Premodern","prompt":"Brew me a Premodern deck built around Seismic Assault.","text":"I built a red-green Seismic Assault deck I'm calling **RG \"Seismic Terravore\"**. Each land you discard to Seismic Assault deals 2 damage to any target, and it costs no mana. That makes extra lands in your hand into removal for creatures (including your opponent's mana creatures) and, at the end, into a burn finish. Every land card that hits any graveyard also gives Terravore +1/+1: lands discarded to Seismic or Mox Diamond, used Wooded Foothills and Wastelands, and lands destroyed by Pillage and Avalanche Riders.\n\n**Three directions I considered:**\n1. **Blue-red Dream Halls.** The only real recent deck with Seismic Assault is a single blue-red Dream Halls list. There Seismic is a side finisher, not the plan.\n2. **Mono-red land destruction plus Seismic.** It's a real deck (7 lists), but it has no payoff that grows when lands go to the graveyard.\n3. **Red-green land-destruction shell (chosen).** It borrows the Terrageddon package from your list of what's working: Mox Diamond, Terravore, Sylvan Library and Wasteland. It also uses the red-green version of mono-red land destruction, which already plays Terravore, Sylvan Library and Karplusan Forest.\n\n**Why direction 3:** It's the only one where Seismic Assault is the engine. Sylvan Library finds the lands that fuel it, and Terravore turns those same lands into a huge trampler.\n\n**The deck:**\n- **Mana:** 26 lands, the same count as the land-destruction deck I borrowed from. Here the extra lands are ammunition, not flood. Birds of Paradise and Mox Diamond help you reach RRR for Seismic Assault on turn 3.\n- **Threats:** Call of the Herd and Treetop Village are backup threats.\n- **Interaction:** Lightning Bolt for creatures. Pillage also kills artifact creatures like Phyrexian Dreadnought.\n\n**Honest odds:** You'll have Seismic Assault by turn 4 only about 53% of the time (on the play). That's why the deck still works without it: Terravore and land destruction carry those games. The simulator puts having every card in the full winning line by turn 6 at just 4.5%. You don't need all of them, though; Seismic plus a handful of lands, or a big Terravore, wins alone.\n\n**Sideboard (15):** aimed at the current top decks:\n- 3 Pyroblast and 2 Red Elemental Blast against the blue decks\n- 3 Naturalize and 2 Anarchy against Enchantress's Solitary Confinement and Replenish\n- 3 Pyroclasm against Goblins\n- 2 Tormod's Crypt against Hermit Druid","deck":{"main":[{"qty":4,"name":"Seismic Assault"},{"qty":4,"name":"Terravore"},{"qty":4,"name":"Sylvan Library"},{"qty":4,"name":"Mox Diamond"},{"qty":4,"name":"Birds of Paradise"},{"qty":4,"name":"Lightning Bolt"},{"qty":4,"name":"Pillage"},{"qty":3,"name":"Call of the Herd"},{"qty":3,"name":"Avalanche Riders"},{"qty":4,"name":"Wasteland"},{"qty":4,"name":"Wooded Foothills"},{"qty":4,"name":"Karplusan Forest"},{"qty":2,"name":"Treetop Village"},{"qty":2,"name":"Gemstone Mine"},{"qty":7,"name":"Mountain"},{"qty":3,"name":"Forest"}],"side":[{"qty":3,"name":"Pyroblast"},{"qty":2,"name":"Red Elemental Blast"},{"qty":3,"name":"Naturalize"},{"qty":2,"name":"Tormod's Crypt"},{"qty":3,"name":"Pyroclasm"},{"qty":2,"name":"Anarchy"}],"commander":[]}},{"id":"e6288e70875f","format":"Premodern","prompt":"Brew me a mono-green Premodern ramp deck built around Rofellos, Llanowar Emissary.","text":"This is a brew. Rofellos has no recent Premodern tournament results, so there's no proven list to start from.\n\n**The plan:** Play an elf on turn 1 and Rofellos on turn 2. Every land in the deck except one Gaea's Cradle is a Forest, so by turn 3 Rofellos usually makes 6–7 mana. Use that mana early to cast Plow Under, Winter's Grasp and Creeping Mold, which knock out the opponent's lands. Then put the leftover mana into things that can use any amount of it:\n- **Kamahl, Fist of Krosa:** turns your Forests into creatures, then gives your whole team +3/+3 and trample.\n- **Masticore:** shoots creatures and protects itself.\n- **Deranged Hermit:** makes a team of squirrels.\n- **Hurricane:** a finisher that can use any amount of mana.\n\nQuirion Ranger lets Rofellos tap twice in one turn: return a Forest to your hand to untap him, then play that Forest again.\n\n**Directions I considered:**\n1. **Elves/Survival toolbox:** the shell the Elves deck uses. I took its elves, Quirion Ranger and Cradle but dropped the rest, because that deck plays only about 8 Forests and Rofellos needs lots of them.\n2. **Big creatures only:** cheating out Verdant Force with Natural Order. Too slow and fragile.\n3. **Ramp plus land destruction (my choice):** I took the green land-destruction cards from Oath Ponza. Rofellos makes 5-mana Plow Under possible on turn 3, and few things are better at wrecking the slower decks that make up much of the field.\n\n**Notes:**\n- **21 lands:** the deck checker flagged this as about two more than Elves decks play. I kept them on purpose: Rofellos and Kamahl both get better with every extra Forest, and Masticore, Kamahl and Hurricane can use extra mana when you draw too many lands.\n- **Odds:** you'll see Rofellos by turn 3 about 49% of the time, and at least one of the 8 one-mana elves about 75%. Drawing every card in the exact winning sequence by turn 6 is only about 2%. The deck doesn't need that, though: any dork plus any big spell does the same job.\n- **Weak spots:** Sligh's cheap burn spells kill the elves. The sideboard has Spike Feeder and the deck has Masticore to help there.\n- **Sideboard:** aimed at the decks the meta shows. Naturalize, Tranquil Domain and Uktabi Orangutan are for Enchantress and artifacts. Choke is for the blue decks (Stiflenought, Psychatog, Standstill). Tormod's Crypt is for the graveyard decks (Hermit Druid, Replenish, Psychatog).","deck":{"main":[{"qty":4,"name":"Llanowar Elves"},{"qty":4,"name":"Fyndhorn Elves"},{"qty":4,"name":"Rofellos, Llanowar Emissary"},{"qty":2,"name":"Quirion Ranger"},{"qty":3,"name":"Wall of Blossoms"},{"qty":3,"name":"Deranged Hermit"},{"qty":2,"name":"Kamahl, Fist of Krosa"},{"qty":2,"name":"Masticore"},{"qty":2,"name":"Krosan Tusker"},{"qty":3,"name":"Sylvan Library"},{"qty":4,"name":"Plow Under"},{"qty":3,"name":"Winter's Grasp"},{"qty":2,"name":"Creeping Mold"},{"qty":1,"name":"Hurricane"},{"qty":20,"name":"Forest"},{"qty":1,"name":"Gaea's Cradle"}],"side":[{"qty":3,"name":"Naturalize"},{"qty":2,"name":"Tranquil Domain"},{"qty":3,"name":"Choke"},{"qty":3,"name":"Tormod's Crypt"},{"qty":2,"name":"Spike Feeder"},{"qty":2,"name":"Uktabi Orangutan"}],"commander":[]}},{"id":"44e8bf344346","format":"Legacy","prompt":"Brew me a Legacy deck built around Thassa's Oracle and Tainted Pact.","text":"I built **Highlander Dimir Oracle**: a 60-card Legacy deck where every card is a 1-of, with a full 15-card sideboard. It's a brew, using Dimir Tempo's lands and interaction.\n\n**The plan:** Tainted Pact exiles cards from the top of your library one at a time. It only stops when you take a card or when two exiled cards share a name. In a deck with no duplicates (only one Island and one Swamp), you can turn down every card and exile your whole library. Then Thassa's Oracle's trigger sees an empty library and you win. You can cast Oracle and respond to its trigger with Pact, or cast Pact first and then Oracle. Either way the combo costs 4 mana, and Dark Ritual, Cabal Ritual, Lotus Petal and Chrome Mox can bring that down to turn 2–3. Until then you play like a tempo deck with 21 interaction spells (Force of Will, Daze, Thoughtseize, Fatal Push, Bowmasters and others) to protect the combo.\n\n**Three directions I considered:**\n1. **Doomsday hybrid**, using the Doomsday deck's fast mana and Oracle finish. The problem is that Doomsday runs 4-ofs, and any duplicate left in your library breaks Pact's kill.\n2. **Dimir Tempo package with an Oracle-Pact finish.** Its cards are proven, but as 4-ofs they also break Pact.\n3. **A singleton Dimir deck** using the Dimir Tempo and Doomsday cards as 1-ofs, with mana-value-2 tutors added. This is the only build where Pact works every time. It's also how the one real list running both cards is built (a singleton Dimir Rogue deck), so I chose this one.\n\n**Finding the two pieces:**\n- **Tutors:** Pact and Oracle both have mana value 2, so Muddle the Mixture, Dimir Infiltrator and Shred Memory can transmute for either one. Spellseeker finds Pact, and Grim Tutor, Wishclaw Talisman and Intuition find anything.\n- **Backup wins:** Doomsday plus Oracle is a second kill, and Personal Tutor can find Doomsday. If Oracle is lost, Laboratory Maniac also wins after Pact empties your library.\n\n**Things to know:**\n- **Odds:** On the play by turn 4, you'll have Pact or a card that finds it 79% of the time. You'll have Oracle, Doomsday or Lab Maniac in hand about 53% of the time. Brainstorm and the other cantrips raise both numbers, but the draw calculation didn't count them.\n- **Land count:** The deck runs 17 lands, while Dimir Tempo lists average about 19. Lotus Petal, Chrome Mox, the two Rituals and an average mana value of 1.98 make up the difference. Fetch lands and two-color lands give 15–16 blue and black sources.\n- **Sideboarding:** When you side in cards, keep every card a 1-of. A duplicate left in your library turns off the Pact kill, so none of the sideboard cards repeat anything in the main deck.","deck":{"main":[{"qty":1,"name":"Thassa's Oracle"},{"qty":1,"name":"Tainted Pact"},{"qty":1,"name":"Doomsday"},{"qty":1,"name":"Laboratory Maniac"},{"qty":1,"name":"Muddle the Mixture"},{"qty":1,"name":"Dimir Infiltrator"},{"qty":1,"name":"Shred Memory"},{"qty":1,"name":"Spellseeker"},{"qty":1,"name":"Intuition"},{"qty":1,"name":"Grim Tutor"},{"qty":1,"name":"Wishclaw Talisman"},{"qty":1,"name":"Personal Tutor"},{"qty":1,"name":"Brainstorm"},{"qty":1,"name":"Ponder"},{"qty":1,"name":"Preordain"},{"qty":1,"name":"Consider"},{"qty":1,"name":"Street Wraith"},{"qty":1,"name":"Brainsurge"},{"qty":1,"name":"Dark Ritual"},{"qty":1,"name":"Cabal Ritual"},{"qty":1,"name":"Lotus Petal"},{"qty":1,"name":"Chrome Mox"},{"qty":1,"name":"Force of Will"},{"qty":1,"name":"Force of Negation"},{"qty":1,"name":"Daze"},{"qty":1,"name":"Pact of Negation"},{"qty":1,"name":"Flusterstorm"},{"qty":1,"name":"Spell Pierce"},{"qty":1,"name":"Counterspell"},{"qty":1,"name":"Drown in the Loch"},{"qty":1,"name":"Mystical Dispute"},{"qty":1,"name":"Thoughtseize"},{"qty":1,"name":"Duress"},{"qty":1,"name":"Inquisition of Kozilek"},{"qty":1,"name":"Cabal Therapy"},{"qty":1,"name":"Fatal Push"},{"qty":1,"name":"Snuff Out"},{"qty":1,"name":"Orcish Bowmasters"},{"qty":1,"name":"Brazen Borrower"},{"qty":1,"name":"Tamiyo, Inquisitive Student"},{"qty":1,"name":"Sheoldred's Edict"},{"qty":1,"name":"Misdirection"},{"qty":1,"name":"Spell Snare"},{"qty":1,"name":"Underground Sea"},{"qty":1,"name":"Watery Grave"},{"qty":1,"name":"Undercity Sewers"},{"qty":1,"name":"Island"},{"qty":1,"name":"Swamp"},{"qty":1,"name":"Polluted Delta"},{"qty":1,"name":"Flooded Strand"},{"qty":1,"name":"Misty Rainforest"},{"qty":1,"name":"Scalding Tarn"},{"qty":1,"name":"Bloodstained Mire"},{"qty":1,"name":"Marsh Flats"},{"qty":1,"name":"Verdant Catacombs"},{"qty":1,"name":"Darkslick Shores"},{"qty":1,"name":"Drowned Catacomb"},{"qty":1,"name":"Underground River"},{"qty":1,"name":"Otawara, Soaring City"},{"qty":1,"name":"Mana Confluence"}],"side":[{"qty":1,"name":"Toxic Deluge"},{"qty":1,"name":"Plague Engineer"},{"qty":1,"name":"Cut Down"},{"qty":1,"name":"Dread of Night"},{"qty":1,"name":"Nihil Spellbomb"},{"qty":1,"name":"Tormod's Crypt"},{"qty":1,"name":"Surgical Extraction"},{"qty":1,"name":"Hydroblast"},{"qty":1,"name":"Defense Grid"},{"qty":1,"name":"Hurkyl's Recall"},{"qty":1,"name":"Wasteland"},{"qty":1,"name":"Pithing Needle"},{"qty":1,"name":"Echoing Truth"},{"qty":1,"name":"Annul"},{"qty":1,"name":"Leyline of the Void"}],"commander":[]}},{"id":"3363a30ade35","format":"Legacy","prompt":"Brew me a Legacy Elves deck built around Glimpse of Nature and Heritage Druid.","text":"I built a G/b Glimpse Elves combo deck, a brew. No published list from the last 400 days plays Glimpse of Nature and Heritage Druid together, and neither card appears in recent results. Elves as a whole only shows up in Legacy inside \"GX Midrange\" decks (the green Gaea's Cradle / Natural Order / Craterhoof Behemoth builds). So I took that deck's mana base, Thoughtseize and Natural Order finish, and put your two cards at the center.\n\n**How it wins:** You play a mana elf on turn 1. On turn 2 or 3 you cast Glimpse of Nature, so every cheap Elf you cast that turn draws a card.\n- **Heritage Druid** taps any three of your Elves for GGG, even ones you just cast that turn. That keeps the chain paid for.\n- **Nettle Sentinel** untaps every time you cast a green spell, so it can be tapped for the Druid more than once.\n- **Quirion Ranger and Wirewood Symbiote** untap creatures for extra mana.\n- **Gaea's Cradle** turns a full board into a lot of mana.\n\nThe chain ends with Natural Order. You sacrifice a spare Elf to put Craterhoof Behemoth into play, which gives your whole team trample and +X/+X for a lethal attack. Green Sun's Zenith gives you another way to find creatures, Thoughtseize protects the turn you go off, and Allosaurus Shepherd stops your green spells from being countered by Force of Will.\n\n**The three directions I considered:**\n1. Mono-green Pact/Lotus Petal storm-style Elves.\n2. G/b Elves using the GX Midrange package (Thoughtseize, Cradle, Natural Order → Craterhoof).\n3. An Eladamri / Formidable Speaker value build.\n\nI picked the second because it uses tested mana and Craterhoof Behemoth as the finisher, and its Thoughtseize helps against the combo decks in the field (Doomsday, OmniTell, Reanimator).\n\n**Odds and notes:**\n- By turn 3 on the play, you have a 49% chance of drawing Glimpse and a 75% chance of having Heritage Druid or Nettle Sentinel. You have a 79% chance of drawing Natural Order, Zenith or Craterhoof. You'll have all three only 26% of the time. Without Glimpse you can still win by building a board for Cradle and then casting Natural Order; it's just slower.\n- The deck runs 17 lands, below the checker's suggested ~19. I think that's fine with six 1-mana elves, two Cradles and an average mana value of 1.63.\n- The sideboard targets the field: Force of Vigor against Tron and Eldrazi artifacts, Leyline of the Void against Reanimator, Snuff Out / Fatal Push / Abrupt Decay against Ocelot and the tempo decks, and Duress against Doomsday and OmniTell.","deck":{"main":[{"qty":4,"name":"Heritage Druid"},{"qty":4,"name":"Nettle Sentinel"},{"qty":3,"name":"Llanowar Elves"},{"qty":3,"name":"Fyndhorn Elves"},{"qty":3,"name":"Quirion Ranger"},{"qty":3,"name":"Wirewood Symbiote"},{"qty":2,"name":"Elvish Visionary"},{"qty":1,"name":"Allosaurus Shepherd"},{"qty":1,"name":"Formidable Speaker"},{"qty":1,"name":"Endurance"},{"qty":1,"name":"Craterhoof Behemoth"},{"qty":4,"name":"Glimpse of Nature"},{"qty":4,"name":"Natural Order"},{"qty":4,"name":"Green Sun's Zenith"},{"qty":2,"name":"Once Upon a Time"},{"qty":3,"name":"Thoughtseize"},{"qty":2,"name":"Gaea's Cradle"},{"qty":1,"name":"Dryad Arbor"},{"qty":3,"name":"Forest"},{"qty":2,"name":"Bayou"},{"qty":4,"name":"Verdant Catacombs"},{"qty":2,"name":"Misty Rainforest"},{"qty":2,"name":"Windswept Heath"},{"qty":1,"name":"Wooded Foothills"}],"side":[{"qty":3,"name":"Force of Vigor"},{"qty":2,"name":"Abrupt Decay"},{"qty":3,"name":"Leyline of the Void"},{"qty":2,"name":"Snuff Out"},{"qty":1,"name":"Endurance"},{"qty":1,"name":"Collector Ouphe"},{"qty":2,"name":"Duress"},{"qty":1,"name":"Fatal Push"}],"commander":[]}},{"id":"0291e9f46dd9","format":"Legacy","prompt":"Brew me a Legacy deck built around Auriok Salvagers and Lion's Eye Diamond.","text":"I built a mono-white Karn artifact deck around **Auriok Salvagers + Lion's Eye Diamond**. It's a brew, and the submitted deck passed all checks.\n\n**The combo:** Auriok Salvagers costs 4 mana. For {1}{W} it returns an artifact with mana value 1 or less from your graveyard to your hand. With Salvagers on the battlefield and Lion's Eye Diamond (LED) in play:\n1. Sacrifice LED for three white mana. This discards your hand.\n2. Pay {1}{W} to Salvagers to return LED.\n3. Recast LED for free and sacrifice it again.\n\nEach loop leaves you one extra white mana, so you can make as much mana as you want. You don't need any mana to start. Then Salvagers returns Walking Ballista (mana value 0 in the graveyard; LED probably just discarded it). Cast it with a huge X and shoot the opponent. Pyrite Spellbomb is a backup win: LED makes red, so you can loop the Spellbomb for 2 damage each time.\n\n**Getting the pieces:**\n- Karn, the Great Creator can use −2 to fetch the sideboard copies of LED, Ballista or Mycosynth Lattice.\n- Urza's Saga's third chapter puts LED or the Spellbomb onto the battlefield.\n- Agatha's Soul Cauldron is a second way to get Salvagers' ability. Exile a Salvagers from the graveyard (e.g. one LED just discarded). Every creature with a +1/+1 counter then has the ability. Leonardo, Haliya and The Destined White Mage give out counters through life gain, so they back up the combo and also attack.\n- Chalice of the Void, Ancient Tomb, City of Traitors and Cavern of Souls (naming Human, which makes Salvagers uncounterable) are the fast-mana, disruptive shell.\n\n**Three directions I considered:**\n1. The mono-white Karn/Stompy shell. Every real list running both cards is this deck (4 lists).\n2. A blue Brainstorm/Force of Will shell. It's too slow for a 4-mana creature combo.\n3. A red, storm-style build with fast mana and Pyrite Spellbomb. It's fragile and has no backup way to get Salvagers' ability.\n\nI chose the first one because Karn, Urza's Saga and the Cauldron give it the most ways to find the combo and still win if Salvagers gets removed. From the meta menu, I borrowed Lotus Petal and Mox Opal (the fast-mana package that Sewer Combo and other menu decks run alongside Cauldron) and Eldrazi's Chalice of the Void.\n\n**Honest odds:**\n- On the play, you see one of the 4 Salvagers by turn 4 only 52.8% of the time.\n- You have a way to get LED (an LED, Karn or Saga) 86.4% of the time.\n- Both together is 44.6%.\n\nThe submission tool reported 0.8% for drawing every card in the win line by turn 3. That number is misleading: it requires all five cards in the line, including the optional Karn and Ancient Tomb. Still, this is a turn-3-or-4 combo deck with a creature backup plan, not a reliable turn-2 kill.\n\nThe sideboard has the extra LED, Ballista and Lattice for Karn to fetch. It also has Ethersworn Canonist and Damping Sphere for Storm and Doomsday, graveyard hate for Reanimator, and Swords to Plowshares for Ocelot and Tempo.","deck":{"main":[{"qty":4,"name":"Auriok Salvagers"},{"qty":3,"name":"Walking Ballista"},{"qty":4,"name":"Leonardo, Cutting Edge"},{"qty":4,"name":"Haliya, Guided by Light"},{"qty":3,"name":"The Destined White Mage"},{"qty":2,"name":"Lion's Eye Diamond"},{"qty":3,"name":"Agatha's Soul Cauldron"},{"qty":4,"name":"Chalice of the Void"},{"qty":4,"name":"Lotus Petal"},{"qty":1,"name":"Mox Opal"},{"qty":1,"name":"Pyrite Spellbomb"},{"qty":1,"name":"Shadowspear"},{"qty":1,"name":"Pithing Needle"},{"qty":1,"name":"Soul-Guide Lantern"},{"qty":4,"name":"Karn, the Great Creator"},{"qty":4,"name":"Ancient Tomb"},{"qty":4,"name":"Urza's Saga"},{"qty":2,"name":"City of Traitors"},{"qty":3,"name":"Cavern of Souls"},{"qty":6,"name":"Plains"},{"qty":1,"name":"Karakas"}],"side":[{"qty":1,"name":"Lion's Eye Diamond"},{"qty":1,"name":"Walking Ballista"},{"qty":1,"name":"Mycosynth Lattice"},{"qty":1,"name":"Ensnaring Bridge"},{"qty":1,"name":"Tormod's Crypt"},{"qty":1,"name":"Damping Sphere"},{"qty":3,"name":"Ethersworn Canonist"},{"qty":3,"name":"Swords to Plowshares"},{"qty":2,"name":"Disruptor Flute"},{"qty":1,"name":"Grafdigger's Cage"}],"commander":[]}},{"id":"59a189513c9b","format":"Legacy","prompt":"Brew me a Legacy deck built around Hypergenesis.","text":"I built a Temur cascade Hypergenesis deck. It borrows the mana and interaction from Legacy's Living End list, and the Living End half is replaced with fatties.\n\n**The plan:** Hypergenesis costs nothing to cast, and every other spell in the deck costs 3 or more. So when you cast Violent Outburst or Shardless Agent, their cascade always finds Hypergenesis and casts it for free. Spirit guides let you do that on turn 1 or 2. Hypergenesis then lets you put your hand onto the battlefield. A good drop is a haste-giver (Urabrask the Hidden, Samut, Cyclops of Eternal Fury, Akroma's Memorial) plus Craterhoof Behemoth and something huge like Emrakul or Archon of Cruelty. That's normally lethal the same turn. Force of Will and Force of Negation protect the combo for free.\n\n**Directions I considered:**\n1. **Temur cascade (chosen):** Borrows the Living End package (8 cascade spells, 4 Force of Will, Force of Negation, Elvish Spirit Guide, fetches and duals).\n2. **Four-colour, 12 cascade spells:** Adds Demonic Dread and Ardent Plea. You'd see a cascade spell by turn 2 more often (85% vs 71%), but the mana gets much shakier and you'd lose some free blue cards for Force of Will.\n3. **Green casting Hypergenesis from suspend:** Far too slow.\n\nI chose Temur because Living End is the only deck running cascade in Legacy right now. Its mana and free counterspells are tested, and it keeps Force of Will.\n\n**How the main pieces work:**\n- **Urabrask the Hidden:** Put it in first. Creatures the opponent drops during Hypergenesis then enter tapped and can't block.\n- **Elesh Norn, Mother of Machines:** Stops the opponent's enter-the-battlefield effects and doubles Craterhoof's and Archon's.\n- **Fury and Subtlety:** Free removal or a counter when you need it, and bodies that count toward Craterhoof's bonus when dropped.\n\n**Things to know:**\n- **Odds:** With 8 cascade spells, you see one by turn 2 on the play 70.6% of the time. Suspending Hypergenesis is a slow backup. The submit tool scored the exact sample line at 0% because it asks for all those specific cards together. Any haste-giver plus Craterhoof does the same job.\n- **Opponent's drops:** Your opponent also gets to put cards in during Hypergenesis. That's why the deck runs the haste-givers, Urabrask, Elesh Norn and Akroma's Memorial (which gives flying, trample and protection from black and red).\n- **Mana:** The checker flagged two things, and I'm leaving both as they are. The 15 lands look low for the curve, but the fatties are never cast. The real list runs about 14.5 lands, plus the 7 spirit guides. There are no black sources because Griselbrand is only ever put in free.\n- **Cheap cards:** Never add anything that isn't a land and costs 0–2, sideboard included. It would break the cascade. That rules out Pyroblast, Thoughtseize and Inevitable Betrayal. I left out Blood Moon and Magus of the Moon because they would wreck this deck's own dual lands.","deck":{"main":[{"qty":4,"name":"Violent Outburst"},{"qty":4,"name":"Shardless Agent"},{"qty":3,"name":"Hypergenesis"},{"qty":4,"name":"Elvish Spirit Guide"},{"qty":3,"name":"Simian Spirit Guide"},{"qty":4,"name":"Force of Will"},{"qty":3,"name":"Force of Negation"},{"qty":2,"name":"Subtlety"},{"qty":1,"name":"Endurance"},{"qty":4,"name":"Craterhoof Behemoth"},{"qty":2,"name":"Urabrask the Hidden"},{"qty":2,"name":"Samut, Voice of Dissent"},{"qty":1,"name":"Cyclops of Eternal Fury"},{"qty":1,"name":"Akroma's Memorial"},{"qty":1,"name":"Emrakul, the Aeons Torn"},{"qty":1,"name":"Elesh Norn, Mother of Machines"},{"qty":2,"name":"Archon of Cruelty"},{"qty":2,"name":"Fury"},{"qty":1,"name":"Griselbrand"},{"qty":4,"name":"Misty Rainforest"},{"qty":2,"name":"Scalding Tarn"},{"qty":1,"name":"Wooded Foothills"},{"qty":2,"name":"Tropical Island"},{"qty":2,"name":"Volcanic Island"},{"qty":1,"name":"Taiga"},{"qty":1,"name":"Forest"},{"qty":1,"name":"Island"},{"qty":1,"name":"Thundering Falls"}],"side":[{"qty":3,"name":"Force of Vigor"},{"qty":3,"name":"Mystical Dispute"},{"qty":2,"name":"Endurance"},{"qty":2,"name":"Fury"},{"qty":2,"name":"Subtlety"},{"qty":1,"name":"Elesh Norn, Grand Cenobite"},{"qty":1,"name":"Force of Negation"},{"qty":1,"name":"Archon of Cruelty"}],"commander":[]}},{"id":"e548892489cb","format":"Legacy","prompt":"Brew me a Legacy deck built around Scapeshift and Valakut, the Molten Pinnacle.","text":"I built a Legacy brew I'm calling **RG \"Lands-Shift\"**: Scapeshift and Valakut, sped up with Legacy's best land-drop cards. The deck passed the legality check and was accepted.\n\n**What the tools found:** Every real deck running Scapeshift and Valakut together is from Modern (82 lists: 67 Amulet Titan, 14 RG Valakut). In Legacy, Scapeshift shows up in 1 list from the last 90 days and Valakut in none. So this is untested, not a copy of anything.\n\n**Three directions I considered:**\n1. **Blue Scapeshift (green, red, blue):** Brainstorm, Ponder and Force of Will, plus ramp. It protects the combo well, but its ramp is weak, so it would kill on turn 5 or later.\n2. **Modern-style big green:** Green Sun's Zenith, Primeval Titan and Amulet of Vigor. Legacy has nothing as good as the Modern Amulet package, and it's slow against the tempo decks.\n3. **The Lands package (chosen):** Exploration, Mox Diamond, Crop Rotation and Life from the Loam, from the 5%-of-the-field Lands deck. **I picked this because Scapeshift's only real need is lots of lands fast, and that is exactly what this package does.**\n\n**The plan:** Make extra land drops with Mox Diamond, Exploration, Sakura-Tribe Elder and Dryad. Then cast Prismatic Omen, which makes every land you control a Mountain, and Scapeshift. With Omen in play, Scapeshift with 7 lands fetches Valakut plus 6 more lands. All 7 count as Mountains and each sees 6 others, so Valakut triggers 7 times for 21 damage. Without Omen you need 8 lands, using basic Mountains, Taigas and Stomping Ground.\n\n**Backup routes:**\n- **Without Scapeshift:** With Omen or Dryad and Valakut in play, every later land is another 3 damage. Fetchlands count twice: once when they enter and once for the land they fetch.\n- **Loam engine:** Life from the Loam returns spent fetchlands, so the damage keeps coming over several turns.\n- **Crop Rotation:** It's an instant, so it can grab Valakut at the end of the opponent's turn, which gives Wasteland less time to hit it.\n\n**What to expect:**\n- **Odds:** By turn 5 on the play you see Scapeshift about 57% of the time. Seeing Valakut or Crop Rotation is about 82%, though Scapeshift can fetch Valakut by itself.\n- **The 2% figure:** The checker says you'll have drawn every card in the listed turn-4 line only 2% of the time. That counts having Mox Diamond, Exploration, Omen and Scapeshift all at once, and you don't need all of them. Realistically the deck wins on turns 4 to 5.\n\n**Land count:** The checker warned that Lands decks run about 32 lands. I'm at 27 on purpose, because Mox Diamond and the 4 Sakura-Tribe Elders also make mana.\n\n**Sideboard:** It targets the most-played decks:\n- Pyroblast and Veil of Summer against the blue tempo decks.\n- Pyroclasm against Ocelot Aggro.\n- Force of Vigor against Chalice of the Void, Tron's artifacts and opposing enchantments.\n- Endurance and Surgical Extraction against graveyard decks like Reanimator.\n- Choke against the blue decks.","deck":{"main":[{"qty":4,"name":"Scapeshift"},{"qty":4,"name":"Prismatic Omen"},{"qty":4,"name":"Exploration"},{"qty":4,"name":"Mox Diamond"},{"qty":4,"name":"Crop Rotation"},{"qty":3,"name":"Life from the Loam"},{"qty":2,"name":"Dryad of the Ilysian Grove"},{"qty":4,"name":"Sakura-Tribe Elder"},{"qty":4,"name":"Lightning Bolt"},{"qty":4,"name":"Valakut, the Molten Pinnacle"},{"qty":4,"name":"Taiga"},{"qty":1,"name":"Stomping Ground"},{"qty":4,"name":"Wooded Foothills"},{"qty":2,"name":"Bloodstained Mire"},{"qty":2,"name":"Windswept Heath"},{"qty":6,"name":"Mountain"},{"qty":3,"name":"Forest"},{"qty":1,"name":"Bojuka Bog"}],"side":[{"qty":3,"name":"Force of Vigor"},{"qty":2,"name":"Endurance"},{"qty":3,"name":"Pyroblast"},{"qty":2,"name":"Veil of Summer"},{"qty":2,"name":"Pyroclasm"},{"qty":2,"name":"Choke"},{"qty":1,"name":"Surgical Extraction"}],"commander":[]}},{"id":"36f0128e1e9c","format":"Legacy","prompt":"Brew me a Legacy deck built around Kiki-Jiki, Mirror Breaker and Pestermite.","text":"I built UR Kiki-Twin Sneak, a brew. No published list in the last 400 days runs Kiki-Jiki and Pestermite together, so there was no proven version to start from.\n\n**How it wins:** When Pestermite enters, it untaps Kiki-Jiki. Kiki-Jiki then copies Pestermite, and each copy untaps Kiki-Jiki again. That gives you as many hasty flying Pestermites as you want in one turn. Kiki-Jiki costs 5 with RRR, so the deck mostly cheats it in instead of casting it:\n- **Sneak Attack:** pay {R} for Kiki-Jiki and {R} for Pestermite and you win.\n- **Show and Tell:** put Kiki-Jiki in, then flash in Pestermite for 2U.\n\nAncient Tomb, City of Traitors and Lotus Petal can get Sneak Attack down on turn 2 and finish the combo on turn 3.\n\n**The pieces:**\n- **Combo creatures:** 3 Deceiver Exarch back up Pestermite as untappers, and 2 Imperial Recruiter can fetch either half of the combo.\n- **Protection:** 2 Hexing Squelcher make your spells uncounterable and give your creatures \"Ward—Pay 2 life.\"\n- **Interaction and card selection:** Force of Will, Spell Pierce, Lightning Bolt, Brainstorm and Ponder.\n\n**Directions I considered:**\n1. **Izzet Tempo base with Splinter Twin and Kiki-Jiki.** Hard-casting a 5-mana Kiki-Jiki is too slow for a field this fast.\n2. **Mono-red with fast mana and Simian Spirit Guide.** It loses Force of Will, the cantrips and the blue untappers.\n3. **The Sneak and Show base (chosen).** That deck's mana and interaction are proven, and Sneak Attack and Show and Tell are the best ways in the format to skip Kiki-Jiki's cost. Kiki-Jiki and the untappers replace its Emrakul and Atraxa.\n\nThe land count (19 lands plus 3 Lotus Petal) matches real Sneak and Show lists. The sideboard draws on the cards those lists use against this field. It covers blue tempo (Pyroblast, Hydroblast), Ocelot and Eldrazi aggro (Abrade, Pyroclasm, Magus of the Moon), graveyard and combo decks (Grafdigger's Cage, Surgical Extraction, Flusterstorm), and opposing countermagic (Consign to Memory, Force of Negation).\n\n**Odds:** Drawing the exact turn-3 line (Ancient Tomb, Sneak Attack, Kiki-Jiki and Pestermite all by turn 3) happens in only about 2.6% of games. Without counting Brainstorm, Ponder or Recruiter, you see at least one Kiki-Jiki or Recruiter by turn 4 about 68% of the time. You see at least one untapper, and at least one Sneak Attack or Show and Tell, about 74% of the time each. You have all three types together about 35% of the time before cantrips. Expect to win on turns 3–5 with Force of Will backup, not turn 2–3 every game.","deck":{"main":[{"qty":4,"name":"Kiki-Jiki, Mirror Breaker"},{"qty":4,"name":"Pestermite"},{"qty":3,"name":"Deceiver Exarch"},{"qty":2,"name":"Imperial Recruiter"},{"qty":2,"name":"Hexing Squelcher"},{"qty":4,"name":"Sneak Attack"},{"qty":3,"name":"Show and Tell"},{"qty":4,"name":"Brainstorm"},{"qty":4,"name":"Ponder"},{"qty":4,"name":"Force of Will"},{"qty":2,"name":"Spell Pierce"},{"qty":2,"name":"Lightning Bolt"},{"qty":3,"name":"Lotus Petal"},{"qty":3,"name":"Ancient Tomb"},{"qty":1,"name":"City of Traitors"},{"qty":4,"name":"Volcanic Island"},{"qty":1,"name":"Thundering Falls"},{"qty":4,"name":"Scalding Tarn"},{"qty":2,"name":"Misty Rainforest"},{"qty":1,"name":"Polluted Delta"},{"qty":2,"name":"Island"},{"qty":1,"name":"Mountain"}],"side":[{"qty":2,"name":"Pyroblast"},{"qty":2,"name":"Consign to Memory"},{"qty":2,"name":"Abrade"},{"qty":1,"name":"Grafdigger's Cage"},{"qty":2,"name":"Force of Negation"},{"qty":2,"name":"Magus of the Moon"},{"qty":1,"name":"Pyroclasm"},{"qty":1,"name":"Hydroblast"},{"qty":1,"name":"Flusterstorm"},{"qty":1,"name":"Surgical Extraction"}],"commander":[]}}],"cards":{"Birds of Paradise":{"cost":"{G}","type":"Creature — Bird","text":"Flying\n{T}: Add one mana of any color.","pt":"0/1"},"Llanowar Elves":{"cost":"{G}","type":"Creature — Elf Druid","text":"{T}: Add {G}.","pt":"1/1"},"Fyndhorn Elves":{"cost":"{G}","type":"Creature — Elf Druid","text":"{T}: Add {G}.","pt":"1/1"},"Werebear":{"cost":"{1}{G}","type":"Creature — Human Bear Druid","text":"{T}: Add {G}.\nThreshold — This creature gets +3/+3 as long as there are seven or more cards in your graveyard.","pt":"1/1"},"Quirion Ranger":{"cost":"{G}","type":"Creature — Elf Ranger","text":"Return a Forest you control to its owner's hand: Untap target creature. Activate only once each turn.","pt":"1/1"},"Rising Waters":{"cost":"{3}{U}","type":"Enchantment","text":"Lands don't untap during their controllers' untap steps.\nAt the beginning of each player's upkeep, that player untaps a land they control."},"Opposition":{"cost":"{2}{U}{U}","type":"Enchantment","text":"Tap an untapped creature you control: Tap target artifact, creature, or land."},"River Boa":{"cost":"{1}{G}","type":"Creature — Snake","text":"Islandwalk (This creature can't be blocked as long as defending <script>
(function () {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const answers = new Map();
  let db = null;
  let canWrite = false;
  let current = 0;
  let chain = Promise.resolve();
  let advanceTimer = null;
  const unjudgedOnly = document.getElementById("unjudgedOnly");

  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
    }
    for (const kid of kids) if (kid) n.append(kid);
    return n;
  };
  /** Card -> copies across main, side and commander. */
  function counts(deck) {
    const m = new Map();
    if (!deck) return m;
    for (const zone of ["commander", "main", "side"]) {
      for (const c of deck[zone] || []) {
        const k = (zone === "side" ? "SB: " : "") + c.name;
        m.set(k, (m.get(k) || 0) + c.qty);
      }
    }
    return m;
  }
  function diff(a, b) {
    const onlyA = [];
    const onlyB = [];
    const both = [];
    for (const k of new Set([...a.keys(), ...b.keys()])) {
      const x = a.get(k) || 0;
      const y = b.get(k) || 0;
      const shared = Math.min(x, y);
      if (shared) both.push(`${shared} ${k}`);
      if (x > shared) onlyA.push(`${x - shared} ${k}`);
      if (y > shared) onlyB.push(`${y - shared} ${k}`);
    }
    const byMain = (s) => (s.includes("SB: ") ? 1 : 0);
    const sort = (xs) => xs.sort((p, q) => byMain(p) - byMain(q) || p.replace(/^\d+ /, "").localeCompare(q.replace(/^\d+ /, "")));
    return { onlyA: sort(onlyA), onlyB: sort(onlyB), both: sort(both) };
  }
  /** The reply's opening: its first two sentences, where answers put the plan. */
  function opening(text) {
    if (!text) return "";
    const clean = text.replace(/\*\*/g, "").replace(/\s+/g, " ").trim();
    const parts = clean.match(/[^.!?]+[.!?]+/g) || [clean];
    const out = parts.slice(0, 2).join(" ").trim();
    return out.length > 360 ? out.slice(0, 357) + "…" : out;
  }

  /** A card name that shows the card's text on hover, focus or tap (artifact pages can't load outside images). */
  function cardName(name) {
    return el("span", { class: "card", "data-card": name, tabindex: "0", text: name });
  }
  const peek = document.getElementById("peek");
  let peekFor = null;
  function showPeek(target, x, y) {
    const name = target.dataset.card;
    const c = DATA.cards && DATA.cards[name];
    if (name !== peekFor) {
      peekFor = name;
      // el() skips null children; replaceChildren would render them as the text "null".
      peek.replaceChildren(
        ...[
          el("div", { class: "pk-head" }, el("span", { text: name }), c ? el("span", { class: "pk-cost", text: c.cost }) : null),
          c ? el("div", { class: "pk-type", text: c.type }) : el("div", { class: "pk-type", text: "No card text on file." }),
          c ? el("div", { class: "pk-text", text: c.text }) : null,
          c && c.pt ? el("div", { class: "pk-pt", text: c.pt }) : null,
        ].filter(Boolean),
      );
    }
    peek.classList.add("on");
    const w = peek.offsetWidth;
    const h = peek.offsetHeight;
    peek.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x + 16)) + "px";
    peek.style.top = Math.max(8, Math.min(window.innerHeight - h - 8, y - h / 2)) + "px";
  }
  function hidePeek() { peek.classList.remove("on"); }
  document.addEventListener("mouseover", (e) => { const t = e.target.closest && e.target.closest(".card"); if (t) showPeek(t, e.clientX, e.clientY); });
  document.addEventListener("mousemove", (e) => { if (peek.classList.contains("on") && e.target.closest && e.target.closest(".card")) showPeek(e.target.closest(".card"), e.clientX, e.clientY); });
  document.addEventListener("mouseout", (e) => { if (e.target.closest && e.target.closest(".card")) hidePeek(); });
  document.addEventListener("focusin", (e) => { const t = e.target.closest && e.target.closest(".card"); if (t) { const r = t.getBoundingClientRect(); showPeek(t, r.right, r.top + r.height / 2); } });
  document.addEventListener("focusout", (e) => { if (e.target.closest && e.target.closest(".card")) hidePeek(); });
  // Touch: tap a name to show, tap anywhere else to hide.
  document.addEventListener("click", (e) => { const t = e.target.closest && e.target.closest(".card"); if (t) { if (peek.classList.contains("on") && peekFor === t.dataset.card) hidePeek(); else showPeek(t, e.clientX, e.clientY); } else hidePeek(); });

  /** "4 Card Name" or "1 SB: Card Name" as a list item with a hoverable name. */
  function cardLine(line) {
    const m = line.match(/^(\d+) (SB: )?(.+)$/);
    if (!m) return el("li", { text: line });
    return el("li", {}, `${m[1]} ${m[2] || ""}`, cardName(m[3]));
  }

  function fullList(deck, other) {
    const d = el("details", { class: "full", open: "" }, el("summary", { text: "Full decklist" }));
    const theirs = counts(other);
    for (const [zone, label] of [["commander", "Commander"], ["main", "Main"], ["side", "Sideboard"]]) {
      const lines = deck[zone] || [];
      if (!lines.length) continue;
      const total = lines.reduce((n, c) => n + c.qty, 0);
      const ul = el("ul");
      for (const c of lines) {
        const k = (zone === "side" ? "SB: " : "") + c.name;
        ul.append(el("li", { class: c.qty > (theirs.get(k) || 0) ? "uniq" : null }, `${c.qty} `, cardName(c.name)));
      }
      d.append(el("h4", { text: `${label} (${total})` }), ul);
    }
    return d;
  }


  const judged = (id) => Boolean(answers.get(id) && answers.get(id).play);
  const inView = (i) => !unjudgedOnly.checked || !judged(DATA.decks[i].id) || i === current;

  function renderProgress() {
    const done = DATA.decks.filter((d) => judged(d.id)).length;
    document.getElementById("progress").replaceChildren(el("b", { text: `${done} of ${DATA.decks.length}` }), " decks judged");
  }
  function save(patch, advance) {
    if (!db || !canWrite) return;
    const d = DATA.decks[current];
    const body = { ...(answers.get(d.id) || {}), ...patch, deck: d.id, prompt: d.prompt, updatedAt: new Date().toISOString() };
    answers.set(d.id, body);
    sync();
    renderProgress();
    const status = document.getElementById("saved");
    status.textContent = "Saving…";
    chain = chain
      .then(() => db.collection("decks").doc(d.id).set(body))
      .then(() => { status.textContent = advance ? "Saved. Next deck in a moment (Previous to go back)." : "Saved"; })
      .catch(() => { status.textContent = "Could not save. Try again in a moment."; });
    if (advance) { clearTimeout(advanceTimer); advanceTimer = setTimeout(() => go(1), 900); }
  }
  function sync() {
    const a = answers.get(DATA.decks[current].id) || {};
    for (const b of document.querySelectorAll("#ans button")) { b.setAttribute("aria-pressed", String(a.play === b.dataset.p)); b.disabled = !canWrite; }
    document.getElementById("why").value = a.why || "";
  }
  function render() {
    const d = DATA.decks[current];
    document.getElementById("request").replaceChildren(el("span", { class: "fmt", text: d.format }), el("p", { class: "prompt", text: d.prompt.split("\n")[0] }));
    const box = document.getElementById("deckbox");
    box.replaceChildren();
    if (d.text) box.append(el("p", { class: "lead", text: opening(d.text) }));
    if (d.deck) box.append(fullList(d.deck, d.deck)); // compared with itself: nothing highlighted
    else box.append(el("p", { class: "none", text: "No deck was submitted." }));
    if (d.text) { const det = el("details", {}, el("summary", { text: "Full reply" })); det.append(el("div", { class: "reply", text: d.text })); box.append(det); }
    document.getElementById("saved").textContent = "";
    document.getElementById("prev").disabled = !DATA.decks.some((_, i) => i < current && inView(i));
    document.getElementById("next").disabled = !DATA.decks.some((_, i) => i > current && inView(i));
    sync();
    try { localStorage.setItem("play-deck", String(current)); } catch (e) {}
    window.scrollTo({ top: 0 });
  }
  function go(dir) {
    for (let i = current + dir; i >= 0 && i < DATA.decks.length; i += dir) { if (inView(i)) { current = i; render(); return; } }
  }
  function jumpToFirst() { const i = DATA.decks.findIndex((d) => !judged(d.id)); if (i >= 0) current = i; render(); }
  document.getElementById("prev").addEventListener("click", () => go(-1));
  document.getElementById("next").addEventListener("click", () => go(1));
  unjudgedOnly.addEventListener("change", render);
  for (const b of document.querySelectorAll("#ans button")) b.addEventListener("click", () => save({ play: b.dataset.p }, true));
  document.getElementById("saveWhy").addEventListener("click", () => save({ why: document.getElementById("why").value.trim() }, false));
  document.addEventListener("keydown", (e) => {
    if (e.target && e.target.tagName === "TEXTAREA") return;
    const map = { "1": "yes", "2": "no" };
    if (map[e.key] && canWrite) save({ play: map[e.key] }, true);
    if (e.key === "ArrowRight") go(1);
    if (e.key === "ArrowLeft") go(-1);
  });
  try { current = Math.min(Number(localStorage.getItem("play-deck") || 0), DATA.decks.length - 1) || 0; } catch (e) {}
  render();
  (async () => {
    const notice = document.getElementById("notice");
    const claude = window.claude;
    const dbNs = claude && claude.use ? await claude.use("db") : null;
    const user = claude && claude.use ? await claude.use("user") : null;
    if (!dbNs) { notice.textContent = "Answers save only when this page is open on claude.ai and you're signed in."; return; }
    db = dbNs;
    canWrite = user ? (user.isOwner() ?? false) : false;
    let first = true;
    db.collection("decks").onSnapshot(
      (snap) => {
        answers.clear();
        for (const doc of snap.docs) answers.set(doc.id, doc.data());
        if (first) { first = false; notice.textContent = canWrite ? "One deck at a time. Press 1 (yes) or 2 (no); hover any card for its text. A line on what's wrong is the most useful thing you can give." : "Read-only: only the page owner can judge."; jumpToFirst(); return; }
        sync(); renderProgress();
      },
      () => { notice.textContent = "Saved answers could not be loaded. Reload the page to try again."; },
    );
  })();
})();
</script>
