<script type="application/json" id="data">{"decks":[{"id":"4d36d8062c39","format":"Premodern","prompt":"Brew me a Premodern deck built around Mind Over Matter.","text":"I built a mono-blue **Mind Over Matter + Arcanis combo** deck. It's a brew and a fairly fragile one.\n\n**Plan:** Get Mind Over Matter (MoM) onto the battlefield, either through Show and Tell or by hard-casting it with Ancient Tomb, City of Traitors and Thran Dynamo.\n- **Main kill:** Once Arcanis the Omnipotent has been in play for a turn, tap it to draw 3, then discard a card to MoM to untap it and repeat. Each loop gains 2 cards, which you discard to untap Thran Dynamo (3 mana each), Tomb or City (2 each) or Islands (1 each). That draws most of your deck and makes a huge pile of mana. Then aim Stroke of Genius at your opponent with X bigger than their remaining library, and they lose for drawing from an empty deck.\n- **Backup kill, no Arcanis needed:** Use MoM and the mana rocks to fire a Stroke of Genius at yourself. Every card it draws becomes 2–3 more mana, which pays for a second, lethal Stroke.\n- **Supporting cards:** Intuition (finds MoM or Stroke), Impulse and Opt find the pieces. Counterspell and Mana Leak protect them. Cunning Wish can fetch the sideboard Stroke.\n\n**Directions I considered:**\n1. A white build using Academy Rector and Enlightened Tutor to find MoM.\n2. A Dream Halls build casting things for free.\n3. A mono-blue build that borrows two proven packages: the fast mana and tutors from Premodern's Dream Halls decks (Ancient Tomb, City of Traitors, Show and Tell, Intuition, Frantic Search), and the counterspells and card-filtering spells from Stiflenought.\n\nI chose the third. MoM needs four blue mana, so staying mono-blue keeps the mana clean. It also has the only setup that turns MoM into an actual kill: permanents that give back more than one card or mana each time you untap them.\n\n**Weak spots:**\n- **Arcanis can't attack or tap the turn it comes in,** so it has to survive a full turn. Untapping it with MoM doesn't get around that.\n- **The odds are low.** Grim Monolith would have been the ideal mana rock for this, but it's banned. The checker says you'll naturally draw every card in the win line by turn 6 in only about 1.5% of games. That number ignores tutors and card draw, so the real odds are better. Still, it doesn't compare with the top decks.\n- **Opponents can fight it.** Stifle and enchantment removal (Seal of Cleansing, Naturalize) stop the engine. Sligh will punish the 2 damage Ancient Tomb deals every time you tap it.\n- **Land count:** I'm running 22 lands, about 3 more than Dream Halls lists, because this deck has to pay full price for its 6-drops.\n\nThe sideboard is aimed at the most common decks in the format right now:\n- **Red decks (Sligh, Goblins):** Hydroblast, Blue Elemental Blast and Powder Keg.\n- **Stiflenought, Replenish and Oath:** Annul, Chain of Vapor and Stifle.\n- **Graveyard decks:** Tormod's Crypt.\n- **Cunning Wish target:** an extra Stroke of Genius.\n\nThe checker raised no warnings.","deck":{"main":[{"qty":4,"name":"Mind Over Matter"},{"qty":3,"name":"Arcanis the Omnipotent"},{"qty":3,"name":"Stroke of Genius"},{"qty":3,"name":"Show and Tell"},{"qty":3,"name":"Thran Dynamo"},{"qty":4,"name":"Intuition"},{"qty":4,"name":"Impulse"},{"qty":4,"name":"Opt"},{"qty":2,"name":"Frantic Search"},{"qty":4,"name":"Counterspell"},{"qty":2,"name":"Mana Leak"},{"qty":2,"name":"Cunning Wish"},{"qty":4,"name":"Ancient Tomb"},{"qty":1,"name":"City of Traitors"},{"qty":17,"name":"Island"}],"side":[{"qty":3,"name":"Hydroblast"},{"qty":2,"name":"Blue Elemental Blast"},{"qty":1,"name":"Stroke of Genius"},{"qty":2,"name":"Chain of Vapor"},{"qty":2,"name":"Annul"},{"qty":2,"name":"Powder Keg"},{"qty":2,"name":"Stifle"},{"qty":1,"name":"Tormod's Crypt"}],"commander":[]}},{"id":"597a9b4ff8e0","format":"Premodern","prompt":"Brew me a Premodern deck built around Seismic Assault.","text":"**RG Seismic Terravore (brew)**\n\n**Directions I considered:**\n1. **Red-green lands-matter**, borrowing the Terrageddon package (Mox Diamond, Terravore, Sylvan Library, Call of the Herd, Werebear).\n2. **Mono-red land-heavy burn** with Fireblast and cycling lands.\n3. **Blue-red Dream Halls**. This is the only real deck that has run Seismic Assault recently (one list), and there Assault is just a side piece.\n\nI picked the first. It's the only one where Seismic Assault's cost (discarding a land) also builds your board: every land you throw for 2 damage goes to the graveyard and makes Terravore +1/+1, since Terravore counts lands in all graveyards. The best card-draw-for-lands in your colors (Mulch, Yavimaya Elder, Sylvan Library) is all green.\n\n**The plan:** Turn 1 Mox Diamond discards a land, so Terravore already has fuel. Mulch and Sylvan Library dig, and Seismic Assault lands on turn 3 with the Mox (it costs RRR). After that, every extra land in hand is a 2-damage shot, either at a blocker or at the opponent. Terravore then comes down huge and tramples over, with Lightning Bolt and Call of the Herd to fill out the game.\n\n**Why some cards are here:**\n- **Yavimaya Elder:** a chump blocker that fetches two basic lands when it dies, which is 4 more Assault damage.\n- **Devastating Dreams:** the finisher in the Armageddon role. Both players sacrifice lands, small creatures die, and all those lands make Terravore enormous. The deck checker flagged it as rarely played, and I kept it for exactly this reason.\n- **26 lands:** more than a normal deck, because lands are your ammo as well as your mana. That's the same count as Terrageddon decks. The deck has 23 red sources and 23 green sources.\n\n**Honest odds:** You'll have at least one Seismic Assault in your opening hand or draws by turn 4 on the play about 53% of the time, before counting what Mulch and Library dig up. The checker said all six cards in the sample win line show up by turn 6 in only 1.2% of games. That number is misleading, because the deck really only needs Assault plus spare lands and any threat. Still, this is an untested brew, not a proven list.\n\nThe 15-card sideboard is built for the current top decks: blue-hate (Pyroblast and Red Elemental Blast) for Stiflenought and Psychatog, Pyroclasm for Goblins and Sligh, Naturalize for Enchantress, Anarchy for white decks, Tormod's Crypt for graveyard decks, and Zuran Orb against burn. Zuran Orb also puts your own lands in the graveyard, which grows Terravore.","deck":{"main":[{"qty":4,"name":"Seismic Assault"},{"qty":4,"name":"Terravore"},{"qty":3,"name":"Yavimaya Elder"},{"qty":2,"name":"Werebear"},{"qty":4,"name":"Mox Diamond"},{"qty":4,"name":"Sylvan Library"},{"qty":4,"name":"Mulch"},{"qty":4,"name":"Lightning Bolt"},{"qty":3,"name":"Call of the Herd"},{"qty":2,"name":"Devastating Dreams"},{"qty":4,"name":"Wooded Foothills"},{"qty":4,"name":"Karplusan Forest"},{"qty":3,"name":"Gemstone Mine"},{"qty":1,"name":"City of Brass"},{"qty":2,"name":"Treetop Village"},{"qty":1,"name":"Forgotten Cave"},{"qty":1,"name":"Tranquil Thicket"},{"qty":6,"name":"Mountain"},{"qty":4,"name":"Forest"}],"side":[{"qty":2,"name":"Pyroblast"},{"qty":1,"name":"Red Elemental Blast"},{"qty":3,"name":"Pyroclasm"},{"qty":3,"name":"Naturalize"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Zuran Orb"},{"qty":2,"name":"Anarchy"}],"commander":[]}},{"id":"e1b104245a3f","format":"Legacy","prompt":"Brew me a Legacy deck built around Auriok Salvagers and Lion's Eye Diamond.","text":"I built a mono-white artifact deck called \"Salvagers Stompy\" (labeled a brew). It's my own take on the Mono-White Stompy shell, because that's the only place played_with found Auriok Salvagers and Lion's Eye Diamond together in real decks (4 recent Legacy lists).\n\n**The combo:** Lion's Eye Diamond (LED) costs {0} and gives 3 mana when you sacrifice it. Salvagers returns it to your hand for {1}{W}. So every loop of \"recast LED, sacrifice it, buy it back\" nets 1 mana, which means unlimited mana. You spend that mana on Walking Ballista: pay {4} for each counter, then remove counters to ping the opponent. If no Ballista is around, the single Pyrite Spellbomb can be looped for 2 damage each time instead.\n\n**Getting there without casting the 4-drop:** Agatha's Soul Cauldron gives Salvagers' ability to any creature you control that has a +1/+1 counter. So you can sacrifice LED while holding Salvagers, which discards it. Then tap Cauldron to exile it from your graveyard, and a Ballista that already has a counter starts doing the looping. Leonardo and The Destined White Mage are mainly creatures that collect counters, so there are more bodies that can pick up the ability. Karn, the Great Creator fetches a missing LED, Cauldron or Ballista from the sideboard. Urza's Saga puts LED straight onto the battlefield.\n\n**When the combo isn't there:** Ancient Tomb, City of Traitors, Lotus Petal and Chalice of the Void let you play the deck as a fast, disruptive creature deck. Chalice on 1 hurts both Tempo decks' cantrips and Ocelot Aggro's Swords to Plowshares.\n\n**Three directions I considered:**\n1. This mono-white Karn/Cauldron shell.\n2. A blue-white Brainstorm and Force of Will shell with Trinket Mage, borrowing the Dimir Tempo package from your list.\n3. A red-white Goblin Welder artifact deck.\n\nI chose the first because it's the only one where Salvagers works from your hand, the battlefield or the graveyard, and where four Karns tutor the missing piece. That redundancy is what a combo built on 4 copies of a 4-drop needs.\n\n**Honest odds:**\n- Starting on the draw, with no mulligans, you see a Salvagers by turn 4 only 56.6% of the time.\n- Some way to get LED (the 2 LEDs, 4 Sagas, or 4 Karns) shows up by then 89% of the time.\n- All three parts together by turn 4: 43%.\n- The submit tool's stricter check, where every card in the turn-4 line is in hand without tutoring, came out at only 1.4%. That figure ignores Karn and Saga tutoring, though.\n\nSo expect the infinite combo in some games and a fast white beatdown deck the rest of the time.\n\n**Sideboard:** It holds Karn targets (a third LED, a fourth Cauldron, a fourth Ballista, Ensnaring Bridge, Mycosynth Lattice, Tormod's Crypt, Grafdigger's Cage). It also has Ethersworn Canonist against storm and Doomsday, Voice of Victory against Force of Will and Tempo, and Perilous Snare as flexible removal.","deck":{"main":[{"qty":4,"name":"Auriok Salvagers"},{"qty":3,"name":"Walking Ballista"},{"qty":4,"name":"Leonardo, Cutting Edge"},{"qty":3,"name":"The Destined White Mage"},{"qty":4,"name":"Haliya, Guided by Light"},{"qty":2,"name":"Lion's Eye Diamond"},{"qty":3,"name":"Agatha's Soul Cauldron"},{"qty":4,"name":"Lotus Petal"},{"qty":1,"name":"Mox Opal"},{"qty":4,"name":"Chalice of the Void"},{"qty":1,"name":"Shadowspear"},{"qty":1,"name":"Pyrite Spellbomb"},{"qty":1,"name":"Pithing Needle"},{"qty":1,"name":"Soul-Guide Lantern"},{"qty":4,"name":"Karn, the Great Creator"},{"qty":4,"name":"Ancient Tomb"},{"qty":4,"name":"Urza's Saga"},{"qty":2,"name":"City of Traitors"},{"qty":2,"name":"Cavern of Souls"},{"qty":1,"name":"Karakas"},{"qty":7,"name":"Plains"}],"side":[{"qty":1,"name":"Lion's Eye Diamond"},{"qty":1,"name":"Agatha's Soul Cauldron"},{"qty":1,"name":"Walking Ballista"},{"qty":1,"name":"Tormod's Crypt"},{"qty":1,"name":"Ensnaring Bridge"},{"qty":1,"name":"Mycosynth Lattice"},{"qty":1,"name":"Grafdigger's Cage"},{"qty":3,"name":"Ethersworn Canonist"},{"qty":3,"name":"Voice of Victory"},{"qty":2,"name":"Perilous Snare"}],"commander":[]}},{"id":"af841f3833c7","format":"Legacy","prompt":"Brew me a Legacy deck built around Hypergenesis.","text":"I built a Temur cascade Hypergenesis deck for Legacy. It's a brew: Hypergenesis decks don't appear in recent results.\n\n**The plan:** Hypergenesis has no mana cost and Suspend 3, so you'll rarely hard-suspend it. Instead you cast it for free with cascade. Every nonland card in the deck except Hypergenesis has mana value 3 or more. So when you cast Shardless Agent or Violent Outburst, the cascade always hits Hypergenesis. It then lets you put Atraxa, Griselbrand, Archon of Cruelty, Emrakul and other large creatures from your hand straight onto the battlefield.\n\n- **Turn 2:** two lands plus an Elvish Spirit Guide or Simian Spirit Guide lets you cascade.\n- **End of the opponent's turn:** Violent Outburst is an instant, so you can cascade then, untap with the board, and attack.\n- **Winning:** the creatures that enter do the work. Archon makes them sacrifice a creature and discard. Atraxa and Griselbrand refill your hand. Terastodon, Woodfall Primus and Ashen Rider destroy whatever the opponent drops when Hypergenesis lets each player put cards in.\n\n**The three directions I considered:**\n1. **Temur cascade on the Living End shell (chosen):** Shardless Agent, Violent Outburst, Force of Will, Force of Negation and Spirit Guides.\n2. **Five-color cascade:** add Ardent Plea and Demonic Dread for 16 cascade spells, but give up the counterspells and accept shaky mana.\n3. **Borrow menu packages:** the Reanimator and OmniTell creatures (Atraxa, Griselbrand, Archon of Cruelty) plus OmniTell's Show and Tell as a second way to put a creature into play.\n\nI went with direction 1 and took the creatures and Show and Tell from direction 3. Living End is the only real Legacy deck already running these cascade spells. Its counterspells protect the combo. Show and Tell, at mana value 3, is a backup that cascade skips over, so it doesn't break the \"cascade only hits Hypergenesis\" rule.\n\n**Odds:**\n- You have a cascade spell or Show and Tell by turn 3 on the play about 86% of the time.\n- You have one of those plus a big creature in hand about 79% of the time.\n\n**Things to know:**\n- **Hypergenesis is symmetric.** The opponent puts permanents in too. OmniTell and Sneak-style decks holding Omniscience or Emrakul are the worst matchups. That's why Terastodon and Woodfall Primus (which destroy non-creature permanents) are in the main deck, and Force of Vigor is in the sideboard.\n- **The deck has no white or black lands.** The deck-check tool flags this, and it's expected, because the large creatures are never cast from your hand.\n- **Lotus Petal and cheap cantrips like Brainstorm are left out on purpose.** Anything under mana value 3 would be what the cascade hits instead of Hypergenesis.","deck":{"main":[{"qty":4,"name":"Hypergenesis"},{"qty":4,"name":"Shardless Agent"},{"qty":4,"name":"Violent Outburst"},{"qty":3,"name":"Show and Tell"},{"qty":4,"name":"Force of Will"},{"qty":3,"name":"Force of Negation"},{"qty":4,"name":"Elvish Spirit Guide"},{"qty":2,"name":"Simian Spirit Guide"},{"qty":2,"name":"Endurance"},{"qty":3,"name":"Atraxa, Grand Unifier"},{"qty":2,"name":"Griselbrand"},{"qty":3,"name":"Archon of Cruelty"},{"qty":1,"name":"Emrakul, the Aeons Torn"},{"qty":1,"name":"Terastodon"},{"qty":1,"name":"Woodfall Primus"},{"qty":1,"name":"Sphinx of the Steel Wind"},{"qty":1,"name":"Ashen Rider"},{"qty":1,"name":"Elesh Norn, Grand Cenobite"},{"qty":4,"name":"Misty Rainforest"},{"qty":2,"name":"Scalding Tarn"},{"qty":2,"name":"Wooded Foothills"},{"qty":2,"name":"Volcanic Island"},{"qty":3,"name":"Tropical Island"},{"qty":2,"name":"Taiga"},{"qty":1,"name":"Forest"}],"side":[{"qty":3,"name":"Force of Vigor"},{"qty":3,"name":"Mystical Dispute"},{"qty":3,"name":"Fury"},{"qty":3,"name":"Leyline of the Void"},{"qty":2,"name":"Magus of the Moon"},{"qty":1,"name":"Endurance"}],"commander":[]}},{"id":"69c93e574f30","format":"Legacy","prompt":"Brew me a Legacy deck built around Scapeshift and Valakut, the Molten Pinnacle.","text":"I submitted a brew I'm calling **RG Valakut Shift**. Scapeshift and Valakut, the Molten Pinnacle haven't shown up together in any recent Legacy results. The only decks that run both are in Modern (Amulet Titan and RG Valakut). So I took the ramp idea from those decks and added Legacy's land-search tools from the Lands deck in the menu.\n\n**The plan:** Exploration, Sakura-Tribe Elder and Farseek get you to 6–7 lands by turn 4–5. Then Scapeshift sacrifices all your lands and puts Valakut onto the battlefield along with Mountains. They all enter at the same time, so each one sees at least five other Mountains and triggers Valakut for 3 damage.\n- **With Prismatic Omen or Dryad of the Ilysian Grove out:** every land you control is also a Mountain, Valakut included. 6 lands is 18 damage and 7 lands is 21, which kills.\n- **Without either one:** 7 lands is enough. You search for Valakut plus 6 Taigas or Mountains (10 in the deck) for 18 damage.\n- **Backups:** With Omen or Dryad out and Valakut plus five other lands in play, every new land deals 3 damage. That includes land drops, Crop Rotation, fetch lands brought back with Life from the Loam, and Primeval Titan found with Green Sun's Zenith.\n\n**The three directions I considered:**\n1. A green-red ramp deck based on the Modern list, using Green Sun's Zenith from the GX Midrange menu entry.\n2. A version built on the Lands package: Exploration, Mox Diamond, Crop Rotation and Life from the Loam.\n3. A Temur blue version with Brainstorm, Force of Will and Uro, using Scapeshift as the finisher.\n\n**Why I chose the mix of 1 and 2:** Scapeshift needs lands that are actually on the battlefield. Mox Diamond costs you a land, and the blue cards don't add any. Exploration, Sakura-Tribe Elder, Farseek, Dryad, and Green Sun's Zenith (which can fetch Dryad Arbor, a land) all put lands into play. Crop Rotation also finds Valakut at instant speed, so you can respond to Wasteland.\n\n**Mana:** The check tool flagged 26 lands as low next to Lands decks, which run about 32. I kept 26 because 7 spells in the deck put more lands into play. It also flagged missing white, blue and black sources, which don't matter here.\n\n**Odds:** On the draw, you'll have Scapeshift itself by turn 4 about 57% of the time. You'll have at least one of Omen, Dryad or Green Sun's Zenith about 89% of the time. Both together is about 50%. Once Upon a Time can't find Scapeshift, but it does find lands and Dryad. The checker reported a 1.6% chance of drawing every card in the exact win line by turn 5, but that number ignores tutors and the backup lines. The realistic kill turn is 4–5.\n\n**Weak spots:** This is slow by Legacy standards. Fair blue decks with Force of Will and Daze can stop Scapeshift, and Wasteland can destroy Valakut. The sideboard is aimed at the current field: Pyroblast and Veil of Summer against the blue tempo decks, Fiery Confluence against Ocelot Aggro, and Force of Vigor, Collector Ouphe, Endurance and Tormod's Crypt against Tron, Sewer Combo and Reanimator.","deck":{"main":[{"qty":4,"name":"Scapeshift"},{"qty":4,"name":"Green Sun's Zenith"},{"qty":4,"name":"Once Upon a Time"},{"qty":4,"name":"Exploration"},{"qty":3,"name":"Prismatic Omen"},{"qty":3,"name":"Dryad of the Ilysian Grove"},{"qty":4,"name":"Sakura-Tribe Elder"},{"qty":3,"name":"Farseek"},{"qty":2,"name":"Crop Rotation"},{"qty":2,"name":"Life from the Loam"},{"qty":1,"name":"Primeval Titan"},{"qty":3,"name":"Valakut, the Molten Pinnacle"},{"qty":1,"name":"Dryad Arbor"},{"qty":4,"name":"Taiga"},{"qty":4,"name":"Wooded Foothills"},{"qty":2,"name":"Windswept Heath"},{"qty":2,"name":"Prismatic Vista"},{"qty":6,"name":"Mountain"},{"qty":4,"name":"Forest"}],"side":[{"qty":3,"name":"Force of Vigor"},{"qty":3,"name":"Pyroblast"},{"qty":2,"name":"Veil of Summer"},{"qty":2,"name":"Endurance"},{"qty":2,"name":"Fiery Confluence"},{"qty":2,"name":"Collector Ouphe"},{"qty":1,"name":"Tormod's Crypt"}],"commander":[]}},{"id":"4c7748660664","format":"Legacy","prompt":"Brew me a Legacy deck built around Kiki-Jiki, Mirror Breaker and Pestermite.","text":"I built **Izzet Kiki-Twin**, a brew for Legacy. No published list from the last 400 days plays Kiki-Jiki and Pestermite together, so this hasn't been tested in tournaments.\n\n**The plan:** Flash in Pestermite at the end of your opponent's turn. Then cast Kiki-Jiki, which has haste, and tap it to copy Pestermite. The copy's enter trigger untaps Kiki-Jiki, so you can repeat as many times as you like and attack with that many hasty 2/1 fliers.\n\nFour Splinter Twin back up Kiki-Jiki. Put one on Pestermite or Deceiver Exarch for the same endless loop a turn earlier and for one less red mana. Three Imperial Recruiter can find whichever half you're missing, since Pestermite, Exarch and Kiki-Jiki all have power 2 or less.\n\n**Shell:** The rest is borrowed from Izzet Tempo, a top deck right now:\n- **To find the combo:** 4 Brainstorm, 4 Ponder and 1 Preordain.\n- **To protect it:** 4 Force of Will, 3 Daze, 2 Spell Pierce and 1 Force of Negation.\n- **To deal with creatures:** 4 Lightning Bolt.\n\n**Mana:** I used fetchlands and Volcanic Islands, and added 2 Ancient Tomb. Tomb plus one blue land casts Pestermite on turn 2, or Splinter Twin on turn 3 with two red. It's 20 lands rather than Tempo's usual 19 because Kiki-Jiki costs 5.\n\n**Directions I considered:**\n1. **This Izzet tempo-combo deck.**\n2. **A mono-red fast-mana prison deck** using the Painter deck's Ancient Tomb and City of Traitors, splashing blue for Pestermite.\n3. **A Jeskai deck** adding Restoration Angel and Felidar Guardian as extra combo partners for Kiki-Jiki.\n\nI chose Izzet because it has the best tools for finding a two-card combo, with nine cantrips and a tutor. It can also protect the combo with free counterspells against a field full of Force of Will.\n\n**Odds:** Without mulligans or help from cantrips, you'll have drawn an untapper (or Recruiter) plus Kiki-Jiki or Twin by turn 5 in about 57% of games. The cantrips and Recruiter push that higher. The deck checker's 3.5% figure is misleading here. It counts games where all four cards in my win line were drawn, but the combo only needs two of them.\n\n**Sideboard:** It's aimed at the top decks:\n- **Against blue decks:** Pyroblast and Red Elemental Blast.\n- **Against red decks:** Hydroblast.\n- **Against combo:** Force of Negation and Consign to Memory.\n- **Against graveyard decks:** Surgical Extraction and Grafdigger's Cage.\n- **Against artifact decks like Sewer Combo and Eldrazi:** Meltdown and Fiery Confluence.\n- **Against creatures:** Unholy Heat.\n\nI left out Blood Moon on purpose because it would wreck this deck's own nonbasic lands.","deck":{"main":[{"qty":2,"name":"Kiki-Jiki, Mirror Breaker"},{"qty":4,"name":"Pestermite"},{"qty":3,"name":"Deceiver Exarch"},{"qty":4,"name":"Splinter Twin"},{"qty":3,"name":"Imperial Recruiter"},{"qty":1,"name":"Brazen Borrower"},{"qty":4,"name":"Brainstorm"},{"qty":4,"name":"Ponder"},{"qty":1,"name":"Preordain"},{"qty":4,"name":"Force of Will"},{"qty":3,"name":"Daze"},{"qty":4,"name":"Lightning Bolt"},{"qty":2,"name":"Spell Pierce"},{"qty":1,"name":"Force of Negation"},{"qty":4,"name":"Volcanic Island"},{"qty":1,"name":"Steam Vents"},{"qty":4,"name":"Scalding Tarn"},{"qty":2,"name":"Misty Rainforest"},{"qty":2,"name":"Flooded Strand"},{"qty":2,"name":"Bloodstained Mire"},{"qty":2,"name":"Island"},{"qty":1,"name":"Mountain"},{"qty":2,"name":"Ancient Tomb"}],"side":[{"qty":2,"name":"Pyroblast"},{"qty":1,"name":"Red Elemental Blast"},{"qty":2,"name":"Hydroblast"},{"qty":2,"name":"Force of Negation"},{"qty":2,"name":"Surgical Extraction"},{"qty":1,"name":"Grafdigger's Cage"},{"qty":1,"name":"Meltdown"},{"qty":1,"name":"Fiery Confluence"},{"qty":1,"name":"Unholy Heat"},{"qty":2,"name":"Consign to Memory"}],"commander":[]}}],"cards":{"Mind Over Matter":{"cost":"{2}{U}{U}{U}{U}","type":"Enchantment","text":"Discard a card: You may tap or untap target artifact, creature, or land."},"Arcanis the Omnipotent":{"cost":"{3}{U}{U}{U}","type":"Legendary Creature — Wizard","text":"{T}: Draw three cards.\n{2}{U}{U}: Return Arcanis to its owner's hand.","pt":"3/4"},"Stroke of Genius":{"cost":"{X}{2}{U}","type":"Instant","text":"Target player draws X cards."},"Show and Tell":{"cost":"{2}{U}","type":"Sorcery","te  they may copy this spell and may choose a new target for that copy."},"Annul":{"cost":"{U}","type":"Instant","text":"Counter target artifact or enchantment spell."},"Powder Keg":{"cost":"{2}","type":"Artifact","text":"At the beginning of your upkeep, you may put a fuse counter on this artifact.\n{T}, Sacrifice this artifact: Destroy each artifact and creature with mana value equal to the number of fuse counters on this artifact."},"Stifle":{"cost":"{U}","type":"Instant","text":"Counter target activated or triggered ability. (Mana abilities can't be targeted.)"},"Tormod's Crypt":{"cost":"{0}","type":"Artifact","text":"{T}, Sacrifice this artifact: Exile target player's graveyard."},"Seismic Assault":{"cost":"{R}{R}{R}","type":"Enchantment","text":"Discard a land card: This enchantment deals 2 damage to any target."},"Terravore":{"cost":"{1}{G}{G}","type":"Creature — Lhurgoyf","text":"Trample\nTerravore's power and toughness are each equal to the number of land cards in all graveyards.","pt":"*/*"},"Yavimaya Elder":{"cost":"{1}{G}{G}","type":"Creature — Human Druid","text":"When this creature dies, you may search your library for up to two basic land cards, reveal them, put them into your hand, then shuffle.\n{2}, Sacrifice this creature: Draw a card.","pt":"2/1"},"Werebear":{"cost":"{1}{G}","type":"Creature — Human Bear Druid","text":"{T}: Add {G}.\nThreshold — This creature gets +3/+3 as long as there are seven or more cards in your graveyard.","pt":"1/1"},"Mox Diamond":{"cost":"{0}","type":"Artifact","text":"If this artifact would enter, you may discard a land card instead. If you do, put this artifact onto the battlefield. If you don't, put it into its owner's graveyard.\n{T}: Add one mana of any color."},"Sylvan Library":{"cost":"{1}{G}","type":"Enchantment","text":"At the beginning of your draw step, you may draw two additional cards. If you do, choose two cards in your hand drawn this turn. For each of those cards, pay 4 life or put the card on top of your library."},"Mulch":{"cost":"{1}{G}","type":"Sorcery","text":"Reveal the top four cards of your library. Put all land cards revealed this way into your hand and the rest into your graveyard."},"Lightning Bolt":{"cost":"{R}","type":"Instant","text":"Lightning Bolt deals 3 damage to any target."},"Call of the Herd":{"cost":"{2}{G}","type":"Sorcery","text":"Create a 3/3 green Elephant creature token.\nFlashback {3}{G} (You may cast this card from your graveyard for its flashback cost. Then exile it.)"},"Devastating Dreams":{"cost":"{R}{R}","type":"Sorcery","text":"As an additional cost to cast this spell, discard X cards at random.\nEach player sacrifices X lands of their choice. Devastating Dreams deals X damage to each creature."},"Wooded Foothills":{"cost":"","type":"Land","text":"{T}, Pay 1 life, Sacrifice this land: Search your library for a Mountain or Forest card, put it onto the battlefield, then shuffle."},"Karplusan Forest":{"cost":"","type":"Land","text":"{T}: Add {C}.\n{T}: Add {R} or {G}. This land deals 1 damage to you."},"Gemstone Mine":{"cost":"","type":"Land","text":"This land enters with three mining counters on it.\n{T}, Remove a mining counter from this land: Add one mana of any color. If there are no mining counters on this land, sacrifice it."},"City of Brass":{"cost":"","type":"Land","text":"Whenever this land becomes tapped, it deals 1 damage to you.\n{T}: Add one mana of any color."},"Treetop Village":{"cost":"","type":"Land","text":"This land enters tapped.\n{T}: Add {G}.\n{1}{G}: This land becomes a 3/3 green Ape creature with trample until end of turn. It's still a land. (It can deal excess combat damage to the player or planeswalker it's attacking.)"},"Forgotten Cave":{"cost":"","type":"Land","text":"This land enters tapped.\n{T}: Add {R}.\nCycling {R} ({R}, Discard this card: Draw a card.)"},"Tranquil Thicket":{"cost":"","type":"Land","text":"This land enters tapped.\n{T}: Add {G}.\nCycling {G} ({G}, Discard this card: Draw a card.)"},"Mountain":{"cost":"","type":"Basic Land — Mountain","text":"({T}: Add {R}.)"},"Forest":{"cost":"","type":"Basic Land — Forest","text":"({T}: Add {G}.)"},"Pyroblast":{"cost":"{R}","type":"Instant","text":"Choose one —\n• Counter target spell if it's blue.\n• Destroy target permanent if it's blue."},"Red Elemental Blast":{"cost":"{R}","type":"Instant","text":"Choose one —\n• Counter target blue spell.\n• Destroy target blue permanent."},"Pyroclasm":{"cost":"{1}{R}","type":"Sorcery","text":"Pyroclasm deals 2 damage to each creature."},"Naturalize":{"cost":"{1}{G}","type":"Instant","text":"Destroy target artifact or enchantment."},"Zuran Orb":{"cost":"{0}","type":"Artifact","text":"Sacrifice a land: You gain 2 life."},"Anarchy":{"cost":"{2}{R}{R}","type":"Sorcery","text":"Destroy all white permanents."},"Auriok Salvagers":{"cost":"{3}{W}","type":"Creature — Human Soldier","text":"{1}{W}: Return target artifact card with mana value 1 or less from your graveyard to your hand.","pt":"2/4"},"Walking Ballista":{"cost":"{X}{X}","type":"Artifact Creature — Construct","text":"This creature enters with X +1/+1 counters on it.\n{4}: Put a +1/+1 counter on this creature.\nRemove a +1/+1 counter from this creature: It deals 1 damage to any target.","pt":"0/0"},"Leonardo, Cutting Edge":{"cost":"{1}{W}","type":"Legendary Creature — Mutant Ninja Turtle","text":"Sneak {W} (You may cast this spell for {W} if you also return an unblocked attacker you control to hand during the declare blockers step. He enters tapped and attacking.)\nLifelink\nWhenever you gain life, put a +1/+1 counter on Leonardo.","pt":"1/1"},"The Destined White Mage":{"cost":"{2}{W}","type":"Legendary Creature — Human Cleric","text":"Lifelink\n{W}, {T}: Another target creature you control gains lifelink until end of turn.\nWhenever you gain life, put a +1/+1 counter on target creature you control. If you have a full party, put three +1/+1 counters on that creature instead.","pt":"2/3"},"Haliya, Guided by Light":{"cost":"{2}{W}","type":"Legendary Creature — Human Soldier","text":"Whenever Haliya or another creature or artifact you control enters, you gain 1 life.\nAt the beginning of your end step, draw a card if you've gained 3 or more life this turn.\nWarp {W} (You may cast this card from your hand for its warp cost. Exile this creature at the beginning of the next end step, then you may cast it from exile on a later turn.)","pt":"3/3"},"Lion's Eye Diamond":{"cost":"{0}","type":"Artifact","text":"Discard your hand, Sacrifice this artifact: Add three mana of any one color. Activate only as an instant."},"Agatha's Soul Cauldron":{"cost":"{2}","type":"Legendary Artifact","text":"You may spend mana as though it were mana of any color to activate abilities of creatures you control.\nCreatures you control with +1/+1 counters on them have all activated abilities of all creature cards exiled with Agatha's Soul Cauldron.\n{T}: Exile target card from a graveyard. When a creature card is exiled this way, put a +1/+1 counter on target creature you control."},"Lotus Petal":{"cost":"{0}","type":"Artifact","text":"{T}, Sacrifice this artifact: Add one mana of any color."},"Mox Opal":{"cost":"{0}","type":"Legendary Artifact","text":"Metalcraft — {T}: Add one mana of any color. Activate only if you control three or more artifacts."},"Chalice of the Void":{"cost":"{X}{X}","type":"Artifact","text":"This artifact enters with X charge counters on it.\nWhenever a player casts a spell with mana value equal to the number of charge counters on this artifact, counter that spell."},"Shadowspear":{"cost":"{1}","type":"Legendary Artifact — Equipment","text":"Equipped creature gets +1/+1 and has trample and lifelink.\n{1}: Permanents your opponents control lose hexproof and indestructible until end of turn.\nEquip {2}"},"Pyrite Spellbomb":{"cost":"{1}","type":"Artifact","text":"{R}, Sacrifice this artifact: It deals 2 damage to any target.\n{1}, Sacrifice this artifact: Draw a card."},"Pithing Needle":{"cost":"{1}","type":"Artifact","text":"As this artifact enters, choose a card name.\nActivated abilities of sources with the chosen name can't be activated unless they're mana abilities."},"Soul-Guide Lantern":{"cost":"{1}","type":"Artifact","text":"When this artifact enters, exile target card from a graveyard.\n{T}, Sacrifice this artifact: Exile each opponent's graveyard.\n{1}, {T}, Sacrifice this artifact: Draw a card."},"Karn, the Great Creator":{"cost":"{4}","type":"Legendary Planeswalker — Karn","text":"Activated abilities of artifacts your opponents control can't be activated.\n+1: Until your next turn, up to one target noncreature artifact becomes an artifact creature with power and toughness each equal to its mana value.\n−2: You may reveal an artifact card you own from outside the game or choose a face-up artifact card you own in exile. Put that card into your hand."},"Urza's Saga":{"cost":"","type":"Enchantment Land — Urza's Saga","text":"(As this Saga enters and after your draw step, add a lore counter. Sacrifice after III.)\nI — This Saga gains \"{T}: Add {C}.\"\nII — This Saga gains \"{2}, {T}: Create a 0/0 colorless Construct artifact creature token with 'This token gets +1/+1 for each artifact you control.'\"\nIII — Search your library for an artifact card with mana cost {0} or {1}, put it onto the battlefield, then shuffle."},"Cavern of Souls":{"cost":"","type":"Land","text":"As this land enters, choose a creature type.\n{T}: Add {C}.\n{T}: Add one mana of any color. Spend this mana only to cast a creature spell of the chosen type, and that spell can't be countered."},"Karakas":{"cost":"","type":"Legendary Land","text":"{T}: Add {W}.\n{T}: Return target legendary creature to its owner's hand."},"Plains":{"cost":"","type":"Basic Land — Plains","text":"({T}: Add {W}.)"},"Ensnaring Bridge":{"cost":"{3}","type":"Artifact","text":"Creatures with power greater than the number of cards in your hand can't attack."},"Mycosynth Lattice":{"cost":"{6}","type":"Artifact","text":"All permanents are artifacts in addition to their other types.\nAll cards that aren't on the battlefield, spells, and permanents are colorless.\nPlayers may spend mana as though it were mana of any color."},"Grafdigger's Cage":{"cost":"{1}","type":"Artifact","text":"Creature cards in graveyards and libraries can't enter the battlefield.\nPlayers can't cast spells from graveyards or libraries."},"Ethersworn Canonist":{"cost":"{1}{W}","type":"Artifact Creature — Human Cleric","text":"Each player who has cast a nonartifact spell this turn can't cast additional nonartifact spells.","pt":"2/2"},"Voice of Victory":{"cost":"{1}{W}","type":"Creature — Human Bard","text":"Mobilize 2 (Whenever this creature attacks, create two tapped and attacking 1/1 red Warrior creature tokens. Sacrifice them at the beginning of the next end step.)\nYour opponents can't cast spells during your turn.","pt":"1/3"},"Perilous Snare":{"cost":"{2}{W}","type":"Artifact","text":"Start your engines! (If you have no speed, it starts at 1. It increases once on each of your turns when an opponent loses life. Max speed is 4.)\nWhen this artifact enters, exile target nonland permanent an opponent controls until this artifact leaves the battlefield.\nMax speed — {T}: Put a +1/+1 counter on target creature or Vehicle you control. Activate only as a sorcery."},"Hypergenesis":{"cost":"","type":"Sorcery","text":"Suspend 3—{1}{G}{G}\nStarting with you, each player may put an artifact, creature, enchantment, or land card from their hand onto the battlefield. Repeat this process until no one puts a card onto the battlefield."},"Shardless Agent":{"cost":"{1}{G}{U}","type":"Artifact Creature — Human Rogue","text":"Cascade (When you cast this spell, exile cards from the top of your library until you exile a nonland card that costs less. You may cast it without paying its mana cost. Put the exiled cards on the bottom in a random order.)","pt":"2/2"},"Violent Outburst":{"cost":"{1}{R}{G}","type":"Instant","text":"Cascade (When you cast this spell, exile cards from the top of your library until you exile a nonland card that costs less. You may cast it without paying its mana cost. Put the exiled cards on the bottom in a random order.)\nCreatures you control get +1/+0 until end of turn."},"Force of Will":{"cost":"{3}{U}{U}","type":"Instant","text":"You may pay 1 life and exile a blue card from your hand rather than pay this spell's mana cost.\nCounter target spell."},"Force of Negation":{"cost":"{1}{U}{U}","type":"Instant","text":"If it's not your turn, you may exile a blue card from your hand rather than pay this spell's mana cost.\nCounter target noncreature spell. If that spell is countered this way, exile it instead of putting it into its owner's graveyard."},"Elvish Spirit Guide":{"cost":"{2}{G}","type":"Creature — Elf Spirit","text":"Exile this card from your hand: Add {G}.","pt":"2/2"},"Simian Spirit Guide":{"cost":"{2}{R}","type":"Creature — Ape Spirit","text":"Exile this card from your hand: Add {R}.","pt":"2/2"},"Endurance":{"cost":"{1}{G}{G}","type":"Creature — Elemental Incarnation","text":"Flash\nReach\nWhen this creature enters, up to one target player puts all the cards from their graveyard on the bottom of their library in a random order.\nEvoke—Exile a green card from your hand.","pt":"3/4"},"Atraxa, Grand Unifier":{"cost":"{3}{G}{W}{U}{B}","type":"Legendary Creature — Phyrexian Angel","text":"Flying, vigilance, deathtouch, lifelink\nWhen Atraxa enters, reveal the top ten cards of your library. For each card type, you may put a card of that type from among the revealed cards into your hand. Put the rest on the bottom of your library in a random order. (Artifact, battle, creature, enchantment, instant, land, planeswalker, and sorcery are card types.)","pt":"7/7"},"Griselbrand":{"cost":"{4}{B}{B}{B}{B}","type":"Legendary Creature — Demon","text":"Flying, lifelink\nPay 7 life: Draw seven cards.","pt":"7/7"},"Archon of Cruelty":{"cost":"{6}{B}{B}","type":"Creature — Archon","text":"Flying\nWhenever this creature enters or attacks, target opponent sacrifices a creature or planeswalker of their choice, discards a card, and loses 3 life. You draw a card and gain 3 life.","pt":"6/6"},"Emrakul, the Aeons Torn":{"cost":"{15}","type":"Legendary Creature — Eldrazi","text":"This spell can't be countered.\nWhen you cast this spell, take an extra turn after this one.\nFlying, protection from spells that are one or more colors, annihilator 6\nWhen Emrakul is put into a graveyard from anywhere, its owner shuffles their graveyard into their library.","pt":"15/15"},"Terastodon":{"cost":"{6}{G}{G}","type":"Creature — Elephant","text":"When this creature enters, you may destroy up to three target noncreature permanents. For each permanent put into a graveyard this way, its controller creates a 3/3 green Elephant creature token.","pt":"9/9"},"Woodfall Primus":{"cost":"{5}{G}{G}{G}","type":"Creature — Treefolk Shaman","text":"Trample\nWhen this creature enters, destroy target noncreature permanent.\nPersist (When this creature dies, if it had no -1/-1 counters on it, return it to the battlefield under its owner's control with a -1/-1 counter on it.)","pt":"6/6"},"Sphinx of the Steel Wind":{"cost":"{5}{W}{U}{B}","type":"Artifact Creature — Sphinx","text":"Flying, first strike, vigilance, lifelink, protection from red and from green","pt":"6/6"},"Ashen Rider":{"cost":"{4}{W}{W}{B}{B}","type":"Creature — Archon","text":"Flying\nWhen this creature enters or dies, exile target permanent.","pt":"5/5"},"Elesh Norn, Grand Cenobite":{"cost":"{5}{W}{W}","type":"Legendary Creature — Phyrexian Praetor","text":"Vigilance\nOther creatures you control get +2/+2.\nCreatures your opponents control get -2/-2.","pt":"4/7"},"Misty Rainforest":{"cost":"","type":"Land","text":"{T}, Pay 1 life, Sacrifice this land: Search your library for a Forest or Island card, put it onto the battlefield, then shuffle."},"Scalding Tarn":{"cost":"","type":"Land","text":"{T}, P untains, you may have this land deal 3 damage to any target.\n{T}: Add {R}."},"Dryad Arbor":{"cost":"","type":"Land Creature — Forest Dryad","text":"(This land isn't a spell, it's affected by summoning sickness, and it has \"{T}: Add {G}.\")","pt":"1/1"},"Windswept Heath":{"cost":"","type":"Land","text":"{T}, Pay 1 life, Sacrifice this land: Search your library for a Forest or Plains card, put it onto the battlefield, then shuffle."},"Prismatic Vista":{"cost":"","type":"Land","text":"{T}, Pay 1 life, Sacrifice this land: Search your library for a basic land card, put it onto the battlefield, then shuffle."},"Veil of Summer":{"cost":"{G}","type":"Instant","text":"Draw a card if an opponent has cast a blue or black spell this turn. Spells you control can't be countered this turn. You and permanents you control gain hexproof from blue and from black until end of turn. (You and they can't be the targets of blue or black spells or abilities your opponents control.)"},"Fiery Confluence":{"cost":"{2}{R}{R}","type":"Sorcery","text":"Choose three. You may choose the same mode more than once.\n• Fiery Confluence deals 1 damage to each creature.\n• Fiery Confluence deals 2 damage to each opponent.\n• Destroy target artifact."},"Collector Ouphe":{"cost":"{1}{G}","type":"Creature — Ouphe","text":"Activated abilities of artifacts can't be activated.","pt":"2/2"},"Kiki-Jiki, Mirror Breaker":{"cost":"{2}{R}{R}{R}","type":"Legendary Creature — Goblin Shaman","text":"Haste\n{T}: Create a token that's a copy of target nonlegendary creature you control, except it has haste. Sacrifice it at the beginning of the next end step.","pt":"2/2"},"Pestermite":{"cost":"{2}{U}","type":"Creature — Faerie Rogue","text":"Flash\nFlying\nWhen this creature enters, you may tap or untap target permanent.","pt":"2/1"},"Deceiver Exarch":{"cost":"{2}{U}","type":"Creature — Phyrexian Cleric","text":"Flash (You may cast this spell any time you could cast an instant.)\nWhen this creature enters, choose one —\n• Untap target permanent you control.\n• Tap target permanent an opponent controls.","pt":"1/4"},"Splinter Twin":{"cost":"{2}{R}{R}","type":"Enchantment — Aura","text":"Enchant creature\nEnchanted creature has \"{T}: Create a token that's a copy of this creature, except it has haste. Exile that token at the beginning of the next end step.\""},"Imperial Recruiter":{"cost":"{2}{R}","type":"Creature — Human Advisor","text":"When this creature enters, search your library for a creature card with power 2 or less, reveal it, put it into your hand, then shuffle.","pt":"1/1"},"Brazen Borrower":{"cost":"{1}{U}{U} // {1}{U}","type":"Creature — Faerie Rogue // Instant — Adventure","text":"Flash\nFlying\nThis creature can block only creatures with flying. // Return target nonland permanent an opponent controls to its owner's hand.","pt":"3/1"},"Brainstorm":{"cost":"{U}","type":"Instant","text":"Draw three cards, then put two cards from your hand on top of your library in any order."},"Ponder":{"cost":"{U}","type":"Sorcery","text":"Look at the top three cards of your library, then put them back in any order. You may shuffle.\nDraw a card."},"Preordain":{"cost":"{U}","type":"Sorcery","text":"Scry 2, then draw a card. (To scry 2, look at the top two cards of your library, then put any number of them on the bottom and the rest on top in any order.)"},"Daze":{"cost":"{1}{U}","type":"Instant","text":"You may return an Island you control to its owner's hand rather than pay this spell's mana cost.\nCounter target spell unless its controller pays {1}."},"Spell Pierce":{"cost":"{U}","type":"Instant","text":"Counter target noncreature spell unless its controller pays {2}."},"Steam Vents":{"cost":"","type":"Land — Island Mountain","text":"({T}: Add {U} or {R}.)\nAs this land enters, you may pay 2 life. If you don't, it enters tapped."},"Flooded Strand":{"cost":"","type":"Land","text":"{T}, Pay 1 life, Sacrifice this land: Search your library for a Plains or Island card, put it onto the battlefield, then shuffle."},"Bloodstained Mire":{"cost":"","type":"Land","text":"{T}, Pay 1 life, Sacrifice this land: Search your library for a Swamp or Mountain card, put it onto the battlefield, then shuffle."},"Surgical Extraction":{"cost":"{B/P}","type":"Instant","text":"({B/P} can be paid with either {B} or 2 life.)\nChoose target card in a graveyard other than a basic land card. Search its owner's graveyard, hand, and library for any number of cards with the same name as that card and exile them. Then that player shuffles."},"Meltdown":{"cost":"{X}{R}","type":"Sorcery","text":"Destroy each artifact with mana value X or less."},"Unholy Heat":{"cost":"{R}","type":"Instant","text":"Unholy Heat deals 2 damage to target creature or planeswalker.\nDelirium — Unholy Heat deals 6 damage instead if there are four or more card types among cards in your graveyard."},"Consign to Memory":{"cost":"{U}","type":"Instant","text":"Replicate {1} (When you cast this spell, copy it for each time you paid its replicate cost. You may choose new targets for the copies.)\nCounter target triggered ability or colorless spell."}}}</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const answers = new Map();
  let db = null;
  let canWrite = false;
  let current = 0;
  let chain = Promise.resolve();
  let advanceTimer = null;
  const unjudgedOnly = document.getElementById("unjudgedOnly");

  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
    }
    for (const kid of kids) if (kid) n.append(kid);
    return n;
  };
  /** Card -> copies across main, side and commander. */
  function counts(deck) {
    const m = new Map();
    if (!deck) return m;
    for (const zone of ["commander", "main", "side"]) {
      for (const c of deck[zone] || []) {
        const k = (zone === "side" ? "SB: " : "") + c.name;
        m.set(k, (m.get(k) || 0) + c.qty);
      }
    }
    return m;
  }
  function diff(a, b) {
    const onlyA = [];
    const onlyB = [];
    const both = [];
    for (const k of new Set([...a.keys(), ...b.keys()])) {
      const x = a.get(k) || 0;
      const y = b.get(k) || 0;
      const shared = Math.min(x, y);
      if (shared) both.push(`${shared} ${k}`);
      if (x > shared) onlyA.push(`${x - shared} ${k}`);
      if (y > shared) onlyB.push(`${y - shared} ${k}`);
    }
    const byMain = (s) => (s.includes("SB: ") ? 1 : 0);
    const sort = (xs) => xs.sort((p, q) => byMain(p) - byMain(q) || p.replace(/^\d+ /, "").localeCompare(q.replace(/^\d+ /, "")));
    return { onlyA: sort(onlyA), onlyB: sort(onlyB), both: sort(both) };
  }
  /** The reply's opening: its first two sentences, where answers put the plan. */
  function opening(text) {
    if (!text) return "";
    const clean = text.replace(/\*\*/g, "").replace(/\s+/g, " ").trim();
    const parts = clean.match(/[^.!?]+[.!?]+/g) || [clean];
    const out = parts.slice(0, 2).join(" ").trim();
    return out.length > 360 ? out.slice(0, 357) + "…" : out;
  }

  /** A card name that shows the card's text on hover, focus or tap (artifact pages can't load outside images). */
  function cardName(name) {
    return el("span", { class: "card", "data-card": name, tabindex: "0", text: name });
  }
  const peek = document.getElementById("peek");
  let peekFor = null;
  function showPeek(target, x, y) {
    const name = target.dataset.card;
    const c = DATA.cards && DATA.cards[name];
    if (name !== peekFor) {
      peekFor = name;
      // el() skips null children; replaceChildren would render them as the text "null".
      peek.replaceChildren(
        ...[
          el("div", { class: "pk-head" }, el("span", { text: name }), c ? el("span", { class: "pk-cost", text: c.cost }) : null),
          c ? el("div", { class: "pk-type", text: c.type }) : el("div", { class: "pk-type", text: "No card text on file." }),
          c ? el("div", { class: "pk-text", text: c.text }) : null,
          c && c.pt ? el("div", { class: "pk-pt", text: c.pt }) : null,
        ].filter(Boolean),
      );
    }
    peek.classList.add("on");
    const w = peek.offsetWidth;
    const h = peek.offsetHeight;
    peek.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x + 16)) + "px";
    peek.style.top = Math.max(8, Math.min(window.innerHeight - h - 8, y - h / 2)) + "px";
  }
  function hidePeek() { peek.classList.remove("on"); }
  document.addEventListener("mouseover", (e) => { const t = e.target.closest && e.target.closest(".card"); if (t) showPeek(t, e.clientX, e.clientY); });
  document.addEventListener("mousemove", (e) => { if (peek.classList.contains("on") && e.target.closest && e.target.closest(".card")) showPeek(e.target.closest(".card"), e.clientX, e.clientY); });
  document.addEventListener("mouseout", (e) => { if (e.target.closest && e.target.closest(".card")) hidePeek(); });
  document.addEventListener("focusin", (e) => { const t = e.target.closest && e.target.closest(".card"); if (t) { const r = t.getBoundingClientRect(); showPeek(t, r.right, r.top + r.height / 2); } });
  document.addEventListener("focusout", (e) => { if (e.target.closest && e.target.closest(".card")) hidePeek(); });
  // Touch: tap a name to show, tap anywhere else to hide.
  document.addEventListener("click", (e) => { const t = e.target.closest && e.target.closest(".card"); if (t) { if (peek.classList.contains("on") && peekFor === t.dataset.card) hidePeek(); else showPeek(t, e.clientX, e.clientY); } else hidePeek(); });

  /** "4 Card Name" or "1 SB: Card Name" as a list item with a hoverable name. */
  function cardLine(line) {
    const m = line.match(/^(\d+) (SB: )?(.+)$/);
    if (!m) return el("li", { text: line });
    return el("li", {}, `${m[1]} ${m[2] || ""}`, cardName(m[3]));
  }

  function fullList(deck, other) {
    const d = el("details", { class: "full", open: "" }, el("summary", { text: "Full decklist" }));
    const theirs = counts(other);
    for (const [zone, label] of [["commander", "Commander"], ["main", "Main"], ["side", "Sideboard"]]) {
      const lines = deck[zone] || [];
      if (!lines.length) continue;
      const total = lines.reduce((n, c) => n + c.qty, 0);
      const ul = el("ul");
      for (const c of lines) {
        const k = (zone === "side" ? "SB: " : "") + c.name;
        ul.append(el("li", { class: c.qty > (theirs.get(k) || 0) ? "uniq" : null }, `${c.qty} `, cardName(c.name)));
      }
      d.append(el("h4", { text: `${label} (${total})` }), ul);
    }
    return d;
  }


  const judged = (id) => Boolean(answers.get(id) && answers.get(id).play);
  const inView = (i) => !unjudgedOnly.checked || !judged(DATA.decks[i].id) || i === current;

  function renderProgress() {
    const done = DATA.decks.filter((d) => judged(d.id)).length;
    document.getElementById("progress").replaceChildren(el("b", { text: `${done} of ${DATA.decks.length}` }), " decks judged");
  }
  function save(patch, advance) {
    if (!db || !canWrite) return;
    const d = DATA.decks[current];
    const body = { ...(answers.get(d.id) || {}), ...patch, deck: d.id, prompt: d.prompt, updatedAt: new Date().toISOString() };
    answers.set(d.id, body);
    sync();
    renderProgress();
    const status = document.getElementById("saved");
    status.textContent = "Saving…";
    chain = chain
      .then(() => db.collection("decks").doc(d.id).set(body))
      .then(() => { status.textContent = advance ? "Saved. Next deck in a moment (Previous to go back)." : "Saved"; })
      .catch(() => { status.textContent = "Could not save. Try again in a moment."; });
    if (advance) { clearTimeout(advanceTimer); advanceTimer = setTimeout(() => go(1), 900); }
  }
  function sync() {
    const a = answers.get(DATA.decks[current].id) || {};
    for (const b of document.querySelectorAll("#ans button")) { b.setAttribute("aria-pressed", String(a.play === b.dataset.p)); b.disabled = !canWrite; }
    document.getElementById("why").value = a.why || "";
  }
  function render() {
    const d = DATA.decks[current];
    document.getElementById("request").replaceChildren(el("span", { class: "fmt", text: d.format }), el("p", { class: "prompt", text: d.prompt.split("\n")[0] }));
    const box = document.getElementById("deckbox");
    box.replaceChildren();
    if (d.text) box.append(el("p", { class: "lead", text: opening(d.text) }));
    if (d.deck) box.append(fullList(d.deck, d.deck)); // compared with itself: nothing highlighted
    else box.append(el("p", { class: "none", text: "No deck was submitted." }));
    if (d.text) { const det = el("details", {}, el("summary", { text: "Full reply" })); det.append(el("div", { class: "reply", text: d.text })); box.append(det); }
    document.getElementById("saved").textContent = "";
    document.getElementById("prev").disabled = !DATA.decks.some((_, i) => i < current && inView(i));
    document.getElementById("next").disabled = !DATA.decks.some((_, i) => i > current && inView(i));
    sync();
    try { localStorage.setItem("play-deck", String(current)); } catch (e) {}
    window.scrollTo({ top: 0 });
  }
  function go(dir) {
    for (let i = current + dir; i >= 0 && i < DATA.decks.length; i += dir) { if (inView(i)) { current = i; render(); return; } }
  }
  function jumpToFirst() { const i = DATA.decks.findIndex((d) => !judged(d.id)); if (i >= 0) current = i; render(); }
  document.getElementById("prev").addEventListener("click", () => go(-1));
  document.getElementById("next").addEventListener("click", () => go(1));
  unjudgedOnly.addEventListener("change", render);
  for (const b of document.querySelectorAll("#ans button")) b.addEventListener("click", () => save({ play: b.dataset.p }, true));
  document.getElementById("saveWhy").addEventListener("click", () => save({ why: document.getElementById("why").value.trim() }, false));
  document.addEventListener("keydown", (e) => {
    if (e.target && e.target.tagName === "TEXTAREA") return;
    const map = { "1": "yes", "2": "no" };
    if (map[e.key] && canWrite) save({ play: map[e.key] }, true);
    if (e.key === "ArrowRight") go(1);
    if (e.key === "ArrowLeft") go(-1);
  });
  try { current = Math.min(Number(localStorage.getItem("play-deck") || 0), DATA.decks.length - 1) || 0; } catch (e) {}
  render();
  (async () => {
    const notice = document.getElementById("notice");
    const claude = window.claude;
    const dbNs = claude && claude.use ? await claude.use("db") : null;
    const user = claude && claude.use ? await claude.use("user") : null;
    if (!dbNs) { notice.textContent = "Answers save only when this page is open on claude.ai and you're signed in."; return; }
    db = dbNs;
    canWrite = user ? (user.isOwner() ?? false) : false;
    let first = true;
    db.collection("decks").onSnapshot(
      (snap) => {
        answers.clear();
        for (const doc of snap.docs) answers.set(doc.id, doc.data());
        if (first) { first = false; notice.textContent = canWrite ? "One deck at a time. Press 1 (yes) or 2 (no); hover any card for its text. A line on what's wrong is the most useful thing you can give." : "Read-only: only the page owner can judge."; jumpToFirst(); return; }
        sync(); renderProgress();
      },
      () => { notice.textContent = "Saved answers could not be loaded. Reload the page to try again."; },
    );
  })();
})();
</script>
