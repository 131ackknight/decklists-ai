<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one question per screen. The request, each answer's opening, only the cards that differ, then A / Same / B. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --ink: #1b2236;
  --muted: #5d667d;
  --line: #dde2ec;
  --accent: #2459a6;
  --pick: #b5650d;
  --chip: #e8edf6;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141d; --surface: #181e2b; --ink: #e5e9f2; --muted: #9aa4ba; --line: #2a3346;
    --accent: #6f9fe0; --pick: #e2a04f; --chip: #222b3d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141d; --surface: #181e2b; --ink: #e5e9f2; --muted: #9aa4ba; --line: #2a3346;
  --accent: #6f9fe0; --pick: #e2a04f; --chip: #222b3d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 64px; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.top h1 { font-size: 1.3rem; }
.progress { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.progress b { color: var(--pick); }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 0.9rem; color: var(--muted); }
.controls label { display: inline-flex; gap: 6px; align-items: center; }
.btn { font: 600 0.88rem var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.btn:disabled { opacity: 0.5; cursor: default; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.notice { margin: 0; color: var(--muted); font-size: 0.9rem; }
.request { display: grid; gap: 6px; }
.fmt { font: 600 0.75rem var(--font-body); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.prompt { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.duel { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 14px; }
.side { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.side-head { display: flex; gap: 10px; align-items: center; }
.letter { font: 700 1.2rem var(--font-display); width: 2.1rem; height: 2.1rem; display: grid; place-items: center; border-radius: 8px; background: var(--ink); color: var(--surface); }
.lead { margin: 0; font-size: 0.94rem; overflow-wrap: anywhere; }
.only h3 { font: 600 0.78rem var(--font-body); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
.only pre { margin: 0; font: 0.84rem/1.5 var(--font-mono); padding: 10px 12px; background: var(--bg); border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
.none { color: var(--muted); font-style: italic; }
.full summary { font-size: 0.85rem; }
.full h4 { font: 600 0.72rem var(--font-body); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 8px 0 2px; }
.full ul { list-style: none; margin: 0; padding: 0; font: 0.8rem/1.5 var(--font-mono); columns: 2 170px; column-gap: 14px; }
.full li { break-inside: avoid; overflow-wrap: anywhere; }
.full li.uniq { color: var(--accent); font-weight: 600; }
.only ul { list-style: none; margin: 0; padding: 10px 12px; background: var(--bg); border-radius: 8px; font: 0.84rem/1.5 var(--font-mono); }
.only li { overflow-wrap: anywhere; }
.card { cursor: help; border-bottom: 1px dotted var(--muted); }
.card:hover, .card:focus-visible { color: var(--accent); }
#peek { position: fixed; z-index: 10; width: min(300px, calc(100vw - 16px)); max-height: 60vh; overflow: auto; border-radius: 10px; border: 1px solid var(--line); box-shadow: 0 8px 28px rgba(0,0,0,0.3); background: var(--surface); color: var(--ink); padding: 10px 12px; display: none; pointer-events: none; font: 0.84rem/1.45 var(--font-body); }
#peek.on { display: block; }
#peek .pk-head { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; }
#peek .pk-cost { font-family: var(--font-mono); font-weight: 400; color: var(--muted); white-space: nowrap; }
#peek .pk-type { color: var(--muted); font-size: 0.78rem; margin: 2px 0 6px; }
#peek .pk-text { white-space: pre-wrap; }
#peek .pk-pt { text-align: right; font-weight: 700; margin-top: 6px; }
.peek-note { font-size: 0.78rem; color: var(--muted); margin: 0; }
details summary { cursor: pointer; color: var(--accent); font-size: 0.9rem; }
.shared pre { margin: 6px 0 0; font: 0.8rem/1.45 var(--font-mono); padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; columns: 2 220px; }
.reply { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 20rem; overflow: auto; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.9rem; margin-top: 6px; }
.ask { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.ask h2 { font-size: 1.1rem; }
.picks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.picks button { font: 700 1.05rem var(--font-display); padding: 16px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); cursor: pointer; }
.picks button kbd { display: block; font: 0.75rem var(--font-mono); color: var(--muted); margin-top: 2px; }
.picks button[aria-pressed="true"] { background: var(--pick); color: var(--surface); border-color: var(--pick); }
.picks button[aria-pressed="true"] kbd { color: var(--surface); }
.why { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.85rem; color: var(--muted); }
.why button { font: 0.85rem var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 4px 10px; border-radius: 999px; cursor: pointer; }
.why button[aria-pressed="true"] { background: var(--chip); border-color: var(--accent); color: var(--accent); }
button:disabled { cursor: not-allowed; opacity: 0.6; }
.saved { font-size: 0.8rem; color: var(--muted); min-height: 1.2em; }
@media (max-width: 560px) { .picks { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: no-preference) { .picks button, .why button { transition: background 120ms ease, color 120ms ease; } }
</style>

<div class="wrap">
  <div class="top">
    <h1>Combo Quick Pick</h1>
    <span class="progress" id="progress"></span>
  </div>
  <div class="controls">
    <button class="btn" id="prev" type="button">Previous</button>
    <button class="btn" id="next" type="button">Next</button>
    <label><input type="checkbox" id="brewsOnly" checked> Brews only</label>
    <label><input type="checkbox" id="unjudgedOnly" checked> Not yet judged</label>
  </div>
  <p class="notice" id="notice">Loading saved picks…</p>
  <section class="request" id="request"></section>
  <div class="duel" id="duel"></div>
  <div id="peek" role="tooltip"></div>
  <details class="shared" id="shared"></details>
  <section class="ask">
    <h2>Which would you rather play for this request? (Same: either is fine. Neither: I wouldn't play either.)</h2>
    <div class="picks" id="picks">
      <button type="button" data-w="A">A<kbd>1</kbd></button>
      <button type="button" data-w="tie">Same<kbd>2</kbd></button>
      <button type="button" data-w="B">B<kbd>3</kbd></button>
      <button type="button" data-w="neither">Neither<kbd>4</kbd></button>
    </div>
    <div class="why" id="why">
      <span>Why, if you like:</span>
      <button type="button" data-r="request">Closer to the request</button>
      <button type="button" data-r="mana">Better mana</button>
      <button type="button" data-r="power">Stronger cards</button>
      <button type="button" data-r="plan">Clearer plan</button>
      <button type="button" data-r="odd">Fewer odd cards</button>
    </div>
    <div class="saved" id="saved" aria-live="polite"></div>
  </section>
</div>

<script type="application/json" id="data">{"prompts":{"expert-legacy-living-end":{"format":"Legacy","prompt":"Brew me a Legacy deck built around Curator of Mysteries, Waker of Waves and Colossal Skyturtle.","lookFor":""},"expert-premodern-rector-combo":{"format":"Premodern","prompt":"Brew me a Premodern deck built around Future Sight, Academy Rector and Veteran Explorer.","lookFor":""},"expert-premodern-pandeburst":{"format":"Premodern","prompt":"Brew me a Premodern deck built around Pandemonium and Saproling Burst.","lookFor":""},"expert-premodern-draco-explosion":{"format":"Premodern","prompt":"Brew me a Premodern deck built around Erratic Explosion and Draco.","lookFor":""}},"pairs":[{"id":"3bb6892624e4","prompt":"expert-legacy-living-end","brew":true,"left":{"text":"I built a Temur (blue-green-red) Living End brew, and the deck was accepted. All three of your cards are already played together in Modern: 145 Modern Living End lists in the results run them. I moved that plan to Legacy.\n\n**The plan:** Early on, you cycle or channel your big creatures into the graveyard. Curator of Mysteries cycles for {U}, Waker of Waves discards for {1}{U}, and Colossal Skyturtle's channel bounces a creature for {1}{U}. Street Wraith, Striped Riverwinder and Generous Ent are extra cyclers. Then you cast Shardless Agent or Violent Outburst (which is an instant). Living End is the only nonland card in the deck with mana value under 3, so cascade always finds it. It returns a flying 4/4, 7/7s and a 6/5 flier while your opponent's board goes to their graveyard. Fury and Endurance can be cast for free (evoke) early to act as removal. Because they end up in the graveyard, Living End brings them back and their abilities trigger again: Fury deals 4 more damage split among their creatures.\n\n**Directions I considered:**\n1. **Temur cascade (chosen).** It borrows the Force of Will / Force of Negation package from the field and the Shardless Agent / Violent Outburst shell from Legacy's Crashing Footfalls deck.\n2. **A straight port of the Modern Bant list,** using Ardent Plea for cascade.\n3. **A fair blue tempo deck** with Curator as a finisher. But Brainstorm and Ponder would break cascade, and Waker and Skyturtle are poor cards to cast normally.\n\nI picked Temur because it adds Fury, which handles Ocelot Pride, Dragon's Rage Channeler, Tamiyo and Orcish Bowmasters. The tools show Grief is banned in Legacy, so the black version wasn't possible.\n\n**Odds:** You have at least one of the 8 cascade spells by turn 3 about 75% of the time. You almost always have a cycler or free creature (about 99%).\n\n**Checker warnings, and why I kept them:**\n- **Only 17 lands:** The checker asks for about 24 because the average mana value is 4.37. That number is misleading, since the big creatures are cycled, never cast. The 3 Generous Ents also cycle into a Forest for {1}. The Modern list runs about 15 lands plus 4 Ents.\n- **No black sources:** Street Wraith only cycles (by paying 2 life); it's never meant to be cast. Living End also has no black mana for its suspend cost; it's only ever cast through cascade.\n\n**Known weaknesses:**\n- A drawn Living End is a dead card in your hand.\n- Chalice of the Void on 0 counters the cascaded Living End, and graveyard hate hurts the deck. Force of Vigor and Boseiju in the sideboard are there for those.\n- The sideboard has no cards under mana value 3. A cheap card would get hit by cascade instead of Living End.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Shardless Agent"},{"qty":4,"name":"Violent Outburst"},{"qty":3,"name":"Living End"},{"qty":4,"name":"Curator of Mysteries"},{"qty":3,"name":"Waker of Waves"},{"qty":2,"name":"Colossal Skyturtle"},{"qty":4,"name":"Street Wraith"},{"qty":3,"name":"Striped Riverwinder"},{"qty":3,"name":"Generous Ent"},{"qty":3,"name":"Fury"},{"qty":2,"name":"Endurance"},{"qty":1,"name":"Subtlety"},{"qty":4,"name":"Force of Will"},{"qty":3,"name":"Force of Negation"},{"qty":3,"name":"Tropical Island"},{"qty":2,"name":"Volcanic Island"},{"qty":1,"name":"Taiga"},{"qty":4,"name":"Misty Rainforest"},{"qty":3,"name":"Wooded Foothills"},{"qty":1,"name":"Hedge Maze"},{"qty":1,"name":"Thundering Falls"},{"qty":1,"name":"Island"},{"qty":1,"name":"Forest"}],"side":[{"qty":2,"name":"Force of Vigor"},{"qty":2,"name":"Mystical Dispute"},{"qty":2,"name":"Endurance"},{"qty":2,"name":"Brazen Borrower"},{"qty":2,"name":"Fire // Ice"},{"qty":1,"name":"Fury"},{"qty":2,"name":"Subtlety"},{"qty":1,"name":"Boseiju, Who Endures"},{"qty":1,"name":"Misdirection"}],"mainCount":60,"sideCount":15}},"right":{"text":"This is a Dimir reanimator brew. Both 7-drops can discard themselves for value, so they act as their own way of getting into the graveyard. Discard Waker of Waves ({1}{U}: look at the top two cards, keep one) or use Colossal Skyturtle's blue channel ({1}{U}: bounce a creature). Either way you get a real effect and a 7-power body in the graveyard on turn 1–2. Then Reanimate, Animate Dead or Exhume brings it back as a 7/7 that gives the opponent's creatures -1/-0, or a 6/5 flyer with ward 2. Curator of Mysteries (cycling {U}) is the creature you can actually cast. It scries every time you discard, and Careful Study triggers it twice.\n\n**Three directions I considered:**\n1. **Dimir reanimator (chosen):** uses the reanimation spells, Thoughtseize, Lotus Petal and the mana base from the menu's Reanimator deck.\n2. **Blue-green value deck:** casts Skyturtle and uses its green channel ({2}{G}) to get back any card from the graveyard.\n3. **Dimir tempo deck:** Curator as the main threat and the 7-drops as late-game cards you discard for value.\n\nI chose the first because the 7-drops can't really be cast for 7 in Legacy. Their discard abilities do the graveyard setup for free, so reanimation is the only plan that puts all three cards to full use.\n\n**Things to know:**\n- **No Entomb.** The card tool lists it as banned in Legacy, so it's left out. Four Careful Study and the creatures' own discard abilities fill that role.\n- **Draw odds:** with no help from Brainstorm or Ponder, you see at least one way to discard a creature by turn 3 on the play 88.7% of the time. You see a reanimation spell 83.1% of the time, and both together 72.8%. The cantrips push that higher.\n- **Green left out.** I dropped green, which turns off Skyturtle's channel that returns a card from the graveyard. That keeps the mana clean. Skyturtle's blue bounce channel still gets it into the graveyard.\n- **Mana:** 16 lands is about one more than the average Reanimator list (15.1). The deck has 16 blue and 15 black sources, and check_deck found no problems.\n- **Sideboard:**\n  - Show and Tell is a backup way to get the fatties into play when the opponent has graveyard hate.\n  - Bowmasters, Fatal Push and Toxic Deluge are for the tempo and aggro decks.\n  - Force of Negation, Duress and Surgical Extraction are for combo.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Waker of Waves"},{"qty":4,"name":"Colossal Skyturtle"},{"qty":3,"name":"Curator of Mysteries"},{"qty":4,"name":"Reanimate"},{"qty":4,"name":"Animate Dead"},{"qty":2,"name":"Exhume"},{"qty":4,"name":"Careful Study"},{"qty":4,"name":"Brainstorm"},{"qty":4,"name":"Ponder"},{"qty":4,"name":"Force of Will"},{"qty":4,"name":"Thoughtseize"},{"qty":3,"name":"Lotus Petal"},{"qty":4,"name":"Polluted Delta"},{"qty":2,"name":"Flooded Strand"},{"qty":2,"name":"Bloodstained Mire"},{"qty":3,"name":"Underground Sea"},{"qty":1,"name":"Watery Grave"},{"qty":1,"name":"Undercity Sewers"},{"qty":2,"name":"Island"},{"qty":1,"name":"Swamp"}],"side":[{"qty":3,"name":"Show and Tell"},{"qty":2,"name":"Force of Negation"},{"qty":2,"name":"Fatal Push"},{"qty":2,"name":"Orcish Bowmasters"},{"qty":2,"name":"Duress"},{"qty":2,"name":"Surgical Extraction"},{"qty":2,"name":"Toxic Deluge"}],"mainCount":60,"sideCount":15}}},{"id":"423bf85915d0","prompt":"expert-premodern-rector-combo","brew":true,"left":{"text":"I built a Bant (green-white-blue) Survival brew: **Academy Rector, Veteran Explorer and Future Sight**, using the green-blue engine from Tradewind Survival.\n\n**The plan:** Veteran Explorer and Academy Rector need to die, so the deck has four Phyrexian Altars, a Phyrexian Tower and two Natural Orders (which sacrifice a green creature, so they only work with Explorer). When Explorer dies you get two basic lands. It can fetch Islands, which makes Future Sight's triple-blue cost easy to pay by turn 3–4. When Rector dies, it puts an enchantment straight onto the battlefield: Future Sight to play cards off the top, Survival of the Fittest to search up creatures, or Opposition (tap your creatures to tap down the opponent's). Enlightened Tutor puts an Altar or enchantment on top of your library, and with Future Sight out you can cast it from there right away. Deranged Hermit's squirrels and the tutor targets (Uktabi Orangutan, Mystic Snake, Tradewind Rider, Verdant Force) give you sacrifice fodder, answers and ways to win.\n\n**Directions I considered:**\n1. A five-color build based on the Pattern Combo list (Cabal Therapy, Goblin Bombardment, Karmic Guide), with Future Sight as one more card for Rector to fetch.\n2. A Bant build borrowing Tradewind Survival's Survival/Opposition package.\n3. A black-green build based on Living Death, using Cabal Therapy as the way to sacrifice.\n\nI chose the Bant build because Future Sight needs three blue mana, and only the three-color version pays that reliably. Rector also gets three strong enchantments to fetch.\n\n**Things to know:**\n- **Sacrifice outlets are the weak point.** You have at least one of Rector, Explorer or Survival by turn 4 about 91% of the time. You also have a way to sacrifice them only about 68% of the time, and that count is from before I added the fourth Altar, so it's a bit higher now. When you have no outlet, Rector can still chump-block.\n- **Green sources are thin.** The deck has 16.5 green sources versus about 22 in Tradewind Survival lists. That's on purpose, to make room for white and triple blue, and the five mana creatures help cover it.\n- **Squee** is mostly a creature to discard to Survival, but City of Brass or Birds can make red to cast it.\n- **Phyrexian Altar** has no recent tournament results, so treat it as untested.\n\nThe 15-card sideboard is aimed at the current top decks: Hydroblasts and Meddling Mages for Stiflenought, enchantment removal and Tormod's Crypts for Enchantress and Replenish, and Swords, Ravenous Baloth and Spike Feeder for Goblins and Sligh.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Birds of Paradise"},{"qty":1,"name":"Llanowar Elves"},{"qty":4,"name":"Veteran Explorer"},{"qty":4,"name":"Academy Rector"},{"qty":3,"name":"Wall of Blossoms"},{"qty":1,"name":"Squee, Goblin Nabob"},{"qty":1,"name":"Deranged Hermit"},{"qty":1,"name":"Tradewind Rider"},{"qty":1,"name":"Mystic Snake"},{"qty":1,"name":"Uktabi Orangutan"},{"qty":1,"name":"Spike Feeder"},{"qty":1,"name":"Verdant Force"},{"qty":4,"name":"Survival of the Fittest"},{"qty":2,"name":"Future Sight"},{"qty":2,"name":"Opposition"},{"qty":2,"name":"Enlightened Tutor"},{"qty":2,"name":"Natural Order"},{"qty":4,"name":"Phyrexian Altar"},{"qty":1,"name":"Swords to Plowshares"},{"qty":4,"name":"Yavimaya Coast"},{"qty":2,"name":"Brushland"},{"qty":2,"name":"City of Brass"},{"qty":1,"name":"Phyrexian Tower"},{"qty":1,"name":"Windswept Heath"},{"qty":1,"name":"Flooded Strand"},{"qty":5,"name":"Forest"},{"qty":3,"name":"Island"},{"qty":1,"name":"Plains"}],"side":[{"qty":2,"name":"Meddling Mage"},{"qty":2,"name":"Swords to Plowshares"},{"qty":1,"name":"Ravenous Baloth"},{"qty":1,"name":"Spike Feeder"},{"qty":1,"name":"Monk Realist"},{"qty":2,"name":"Seal of Cleansing"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Hydroblast"},{"qty":1,"name":"Exalted Angel"},{"qty":1,"name":"Naturalize"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built **Bant Rector Toolbox**, a brew. No published deck in the last 400 days plays all three of your cards together. The closest is one Pattern Combo list that runs Rector and Explorer with Goblin Bombardment.\n\n**The plan:** Veteran Explorer and Academy Rector only do something when they die, so the deck needs ways to kill them on purpose:\n- **Altar of Bone (GW):** sacrifice a creature as you cast it, then search for any creature.\n- **Natural Order:** sacrifice a green creature like Explorer, then put a green creature onto the battlefield.\n- **Phyrexian Tower:** a land that sacrifices a creature for mana.\n\nSacrificing Explorer gets you two basic lands, so you can cast Future Sight (5 mana, needs UUU) on turn 3 or 4. Sacrificing Rector puts an enchantment straight onto the battlefield: Future Sight for card advantage, or Opposition to tap down the opponent's lands and creatures. Using Altar of Bone on Rector gets you both an enchantment and a creature. Deranged Hermit's squirrels and Verdant Force's tokens give Opposition plenty of creatures to tap, and they win the game.\n\n**Three directions I considered:**\n1. **Bant toolbox (chosen):** borrows the Tradewind Survival deck's mana, its mana creatures (Birds, Elves, Wall of Blossoms) and its Opposition/Natural Order/Deranged Hermit package, plus Swords to Plowshares from the menu.\n2. **Pattern Combo with Future Sight added:** 4–5 colors and Goblin Bombardment. Future Sight's UUU is too hard to cast in that mana base.\n3. **Enchantress:** Rector and Explorer as tutors and ramp in the Argothian Enchantress deck. Explorer does little there, and Future Sight competes with that deck's own engine.\n\nI chose direction 1 because it's the only one where all three cards feed each other: Explorer pays for Future Sight, and Rector puts it onto the battlefield.\n\n**Odds (by turn 4 on the play, no mulligans):**\n- Rector, Explorer or Eladamri's Call: 83%\n- One of the 8 ways to sacrifice them: 79%\n- Both together: about 65%\n- At least one of Future Sight, Rector or Altar of Bone: 89%\n\n**Caveats:**\n- Explorer's trigger lets every player fetch two basics, so it can help opponents who play basic lands.\n- Rector and Explorer are 1/1 and 1/2, so the Lightning Bolt decks (Sligh, Zoo) can kill them easily. When that happens you still get the death trigger.\n- The deck check compared my mana to Tradewind Survival and flagged fewer green sources (16.5 against about 22) and no black or red. That's on purpose: this is a three-color deck, and the extra white and blue pay for Rector, Swords and Future Sight. Birds and Explorer fetching basics fill the gaps.\n- The 15-card sideboard is aimed at the top decks: Hydroblast and Xantid Swarm for Stiflenought (16% of the field), Seal of Cleansing and Naturalize for Enchantress (Rector can fetch Seal), Tormod's Crypt for graveyard decks, and Meddling Mage and Spike Feeder for combo and burn.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Veteran Explorer"},{"qty":4,"name":"Academy Rector"},{"qty":4,"name":"Birds of Paradise"},{"qty":3,"name":"Llanowar Elves"},{"qty":3,"name":"Wall of Blossoms"},{"qty":2,"name":"Deranged Hermit"},{"qty":1,"name":"Tradewind Rider"},{"qty":1,"name":"Verdant Force"},{"qty":3,"name":"Future Sight"},{"qty":2,"name":"Opposition"},{"qty":4,"name":"Altar of Bone"},{"qty":3,"name":"Natural Order"},{"qty":4,"name":"Swords to Plowshares"},{"qty":1,"name":"Eladamri's Call"},{"qty":4,"name":"Yavimaya Coast"},{"qty":2,"name":"Brushland"},{"qty":1,"name":"Adarkar Wastes"},{"qty":1,"name":"Phyrexian Tower"},{"qty":1,"name":"Windswept Heath"},{"qty":1,"name":"Flooded Strand"},{"qty":6,"name":"Forest"},{"qty":4,"name":"Island"},{"qty":1,"name":"Plains"}],"side":[{"qty":3,"name":"Hydroblast"},{"qty":3,"name":"Xantid Swarm"},{"qty":2,"name":"Seal of Cleansing"},{"qty":1,"name":"Naturalize"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Meddling Mage"},{"qty":2,"name":"Spike Feeder"}],"mainCount":60,"sideCount":15}}},{"id":"4faecaa8043c","prompt":"expert-premodern-pandeburst","brew":true,"left":{"text":"I submitted a brew: **Enchantress with a red splash, using Pandemonium and Saproling Burst as the kill.**\n\n**How the combo works:** Saproling Burst enters with 7 fade counters. Each token it makes has power equal to the counters left on Burst. With Pandemonium out, each token that enters can deal damage equal to its power. Remove one counter at a time and let each Pandemonium trigger resolve before removing the next. That deals 6+5+4+3+2+1 = 21 damage, enough to kill from 20 life. Two things to watch:\n- **Timing:** Burst loses a counter in each of your upkeeps, so the kill shrinks to 15 if it waits a turn. Set up Pandemonium first, then cast Burst and fire it all that turn.\n- **Pandemonium is symmetric:** your opponent's creatures trigger it too. Be careful against Goblins and Sligh.\n\n**Three directions I considered:**\n1. **Replenish shell (blue-white).** The only recorded list running both cards was a Replenish deck. But adding a red card and a green card to a blue-white deck strains the mana.\n2. **Red-green ramp.** This would hard-cast both cards off Wild Growth, but it has no card draw, no way to search for pieces and no way to bring them back.\n3. **Enchantress shell (green-white, splash red), the one I chose.** Enchantress is 13% of the field. Burst is already in its colors, and only Pandemonium needs the splash.\n\n**Why Enchantress won:** Argothian Enchantress, Enchantress's Presence and Mirri's Guile dig for the pieces. Sterling Grove searches for either piece and gives your other enchantments shroud. Serra's Sanctum makes enough mana to cast both in one turn. Replenish brings both back from the graveyard at once.\n\n**Changes from the stock Enchantress list:**\n- **Out:** 2 Aura of Silence, 1 Solitary Confinement, 1 Opalescence, 1 Seal of Cleansing.\n- **In:** 2 Pandemonium and 3 Saproling Burst. Burst is also a decent threat by itself.\n- **Mana:** swapped two Wild Growth for Fertile Ground (adds mana of any color) and two Forests for a Karplusan Forest and a Mountain. Wooded Foothills can also fetch the Mountain. That gives 6 red sources while keeping 15 green and 14 white, in line with real Enchantress lists. The deck check passed with no warnings.\n\n**Odds:** On the draw, without counting any extra cards the Enchantress engine draws, you'll see Pandemonium or a Sterling Grove by turn 6 71.9% of the time, and both halves 36.8% of the time. In practice the engine draws many extra cards, and the stock Parallax Wave and Opalescence plan is still there as a backup win. The sideboard is the stock Enchantress board, with Solitary Confinement in place of Karmic Justice for Sligh.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Argothian Enchantress"},{"qty":4,"name":"Enchantress's Presence"},{"qty":4,"name":"Mirri's Guile"},{"qty":2,"name":"Wild Growth"},{"qty":2,"name":"Fertile Ground"},{"qty":3,"name":"Sterling Grove"},{"qty":2,"name":"Seal of Cleansing"},{"qty":3,"name":"Swords to Plowshares"},{"qty":3,"name":"Parallax Wave"},{"qty":2,"name":"Opalescence"},{"qty":1,"name":"Solitary Confinement"},{"qty":3,"name":"Replenish"},{"qty":2,"name":"Pandemonium"},{"qty":3,"name":"Saproling Burst"},{"qty":4,"name":"Serra's Sanctum"},{"qty":4,"name":"Brushland"},{"qty":4,"name":"Windswept Heath"},{"qty":2,"name":"Wooded Foothills"},{"qty":4,"name":"Forest"},{"qty":2,"name":"Plains"},{"qty":1,"name":"Karplusan Forest"},{"qty":1,"name":"Mountain"}],"side":[{"qty":2,"name":"Aura of Silence"},{"qty":3,"name":"Xantid Swarm"},{"qty":3,"name":"Tormod's Crypt"},{"qty":2,"name":"Warmth"},{"qty":1,"name":"Sacred Ground"},{"qty":1,"name":"Gaea's Blessing"},{"qty":1,"name":"Solitary Confinement"},{"qty":1,"name":"Swords to Plowshares"},{"qty":1,"name":"Choke"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built this as a Green-White-red Enchantress brew (the deck is accepted). Pandemonium and Saproling Burst are the kill, and the Enchantress shell draws the cards and makes the mana to cast both. Cast Saproling Burst with Pandemonium already out, then remove one fade counter at a time and let each token's trigger resolve before removing the next. That's 6+5+4+3+2+1 = 21 damage. If you remove all the counters at once, the earlier tokens shrink before their damage resolves.\n\n**The three directions I considered:**\n1. **The Replenish package** (blue-white, with Attunement and Frantic Search to discard enchantments, then Replenish them back). One Replenish list in the results did run 3 Pandemonium and 3 Saproling Burst. But adding red and green to a blue-white deck makes the mana too shaky.\n2. **Red-green ramp** with Fires of Yavimaya and burn. Without Pandemonium, Saproling Burst is weak because its tokens shrink each turn, and this version has no card draw or ways to search for its pieces.\n3. **The Enchantress package plus a red splash. This is the one I picked**, because Enchantress is already 13% of the field and its cards all happen to help this combo:\n   - Argothian Enchantress and Enchantress's Presence draw a card every time you cast an enchantment.\n   - Wild Growth and Serra's Sanctum make the 9 mana you need across two turns.\n   - Sterling Grove and Enlightened Tutor find whichever piece you're missing.\n   - Solitary Confinement and Parallax Wave buy time while you set up.\n\n**Backup ways to win:**\n- With Opalescence out, each enchantment you cast becomes a creature as it enters, so Pandemonium has it deal damage equal to its mana value.\n- If you cast Replenish with Opalescence out, every enchantment returning from your graveyard triggers Pandemonium.\n\n**Mana:** I kept the Enchantress mana base and swapped in 3 Karplusan Forest, 1 Mountain and 2 Wooded Foothills. That gives 6 red sources (normal Enchantress has about 2). White drops to 13 sources against the usual 14, which I'm fine with because Serra's Sanctum makes lots of white mana. The splash also lets the sideboard run Pyroblast and Red Elemental Blast against the blue decks (Stiflenought and Psychatog). The rest of the sideboard is the usual Enchantress lineup aimed at the current field.\n\n**Honest odds:** By turn 6 on the play, not counting the extra cards from the Enchantresses or Mirri's Guile:\n- 80.9% to have Pandemonium or a card that finds it\n- 49.5% to have a natural Saproling Burst\n- 39.1% to have both\n\nThe Enchantresses' card draw should push those numbers up in real games.\n\n**Weak spots:** Opalescence turns Pandemonium and Saproling Burst into creatures, so Swords to Plowshares can hit them. Sterling Grove gives your other enchantments shroud, so keeping it in play protects your combo pieces. Armageddon from Terrageddon is a real threat when you need 9 mana.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Argothian Enchantress"},{"qty":4,"name":"Enchantress's Presence"},{"qty":4,"name":"Wild Growth"},{"qty":3,"name":"Mirri's Guile"},{"qty":3,"name":"Sterling Grove"},{"qty":3,"name":"Pandemonium"},{"qty":3,"name":"Saproling Burst"},{"qty":2,"name":"Opalescence"},{"qty":2,"name":"Parallax Wave"},{"qty":2,"name":"Seal of Cleansing"},{"qty":2,"name":"Solitary Confinement"},{"qty":2,"name":"Replenish"},{"qty":3,"name":"Swords to Plowshares"},{"qty":1,"name":"Enlightened Tutor"},{"qty":4,"name":"Serra's Sanctum"},{"qty":3,"name":"Brushland"},{"qty":3,"name":"Karplusan Forest"},{"qty":4,"name":"Windswept Heath"},{"qty":2,"name":"Wooded Foothills"},{"qty":1,"name":"Mountain"},{"qty":3,"name":"Forest"},{"qty":2,"name":"Plains"}],"side":[{"qty":3,"name":"Xantid Swarm"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Aura of Silence"},{"qty":2,"name":"Warmth"},{"qty":2,"name":"Pyroblast"},{"qty":1,"name":"Red Elemental Blast"},{"qty":1,"name":"Sacred Ground"},{"qty":1,"name":"Gaea's Blessing"},{"qty":1,"name":"Swords to Plowshares"}],"mainCount":60,"sideCount":15}}},{"id":"8bf777f79092","prompt":"expert-premodern-draco-explosion","brew":true,"left":{"text":"I built **RG \"Dragon Bomb\"**, a brew. It's tagged as borrowing from GR Zoo because that's the mana base I compared against, but the burn cards come from the Sligh and GR Zoo lists.\n\n**The plan:** Erratic Explosion deals damage equal to the mana value of the first nonland card it reveals. Draco's mana value is 16, so if Draco is on top of your library, Explosion deals 16. Add a Fireblast (sacrifice two Mountains instead of paying its cost, 4 damage) and that's exactly 20, a kill from full life. Before that, Lightning Bolt, Incinerate, Mogg Fanatic, Grim Lavamancer and Seal of Fire control the board and lower the opponent's life, so the combo doesn't always need the full 20.\n\n**How Draco gets on top:**\n- **Worldly Tutor** finds any creature and puts it on top of your library. Cast it in your main phase, not at the opponent's end step, or you'll just draw Draco.\n- **Sylvan Library** lets you draw Draco and put it right back on top.\n- **Scroll Rack** puts a Draco that's stuck in your hand back on top.\n- **Burning Wish** fetches a sorcery from your sideboard, so it works as extra copies of Explosion. The 4th Explosion sits in the sideboard because the rules cap you at four total. Wish can also grab Flame Rift (4 damage to each player), Pyroclasm or Anarchy.\n\n**Honest odds:** You'll have both an Explosion (or Wish) and a way to stack Draco by turn 4 about 55% of the time on the play, before mulligans. When the combo isn't there, the deck plays like a weaker burn deck. Explosion without Draco on top usually hits a 1-drop for 1 damage, and a Draco in your hand does nothing unless you have Library or Rack.\n\n**The three directions I considered:**\n1. **RG with Sylvan Library and Worldly Tutor, plus the Sligh/GR Zoo burn cards.** This is the one I chose.\n2. **Red-white with Enlightened Tutor.** It can find Draco because Draco is an artifact, and white adds Swords to Plowshares.\n3. **Five-color domain that actually casts Draco.** Draco gets cheaper for each basic land type you control. But Premodern doesn't allow dual lands that have land types (Plateau is not legal), so Draco would stay too expensive to cast.\n\nI picked RG because Fireblast's extra 4 damage is exactly what turns a 16-point Explosion into a kill. Green also gives two stacking cards that are already proven in the format, and the RG mana is cleaner than adding white.\n\n**Mana and sideboard:** The mana base is 21 lands with 18 red and 11 green sources. The deck check passed with no warnings, but it suggests about 23 lands and GR Zoo runs about 22. I stayed at 21 because the curve is very low. The sideboard targets what the format is playing right now:\n- Pyroblast and Red Elemental Blast against the blue decks (Stiflenought, Psychatog)\n- Naturalize and Anarchy against Enchantress and Replenish\n- Pyroclasm against creature decks\n- Tormod's Crypt against graveyard decks","error":false,"deck":{"commander":[],"main":[{"qty":3,"name":"Erratic Explosion"},{"qty":2,"name":"Draco"},{"qty":4,"name":"Worldly Tutor"},{"qty":4,"name":"Sylvan Library"},{"qty":3,"name":"Burning Wish"},{"qty":1,"name":"Scroll Rack"},{"qty":4,"name":"Lightning Bolt"},{"qty":4,"name":"Incinerate"},{"qty":4,"name":"Fireblast"},{"qty":4,"name":"Grim Lavamancer"},{"qty":4,"name":"Mogg Fanatic"},{"qty":2,"name":"Seal of Fire"},{"qty":4,"name":"Wooded Foothills"},{"qty":4,"name":"Karplusan Forest"},{"qty":10,"name":"Mountain"},{"qty":3,"name":"Forest"}],"side":[{"qty":1,"name":"Erratic Explosion"},{"qty":2,"name":"Pyroclasm"},{"qty":1,"name":"Flame Rift"},{"qty":2,"name":"Anarchy"},{"qty":3,"name":"Pyroblast"},{"qty":2,"name":"Red Elemental Blast"},{"qty":3,"name":"Naturalize"},{"qty":1,"name":"Tormod's Crypt"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built **Five-Color Domain Draco Explosion**. It's a brew, since neither card shows up in any recent Premodern results.\n\n**The plan:** Get Draco (mana value 16) to the top of your library, then cast Erratic Explosion. It reveals Draco and deals 16 damage. There are two ways to set it up for 4 mana in one main phase:\n- **Tutor first:** Worldly Tutor or Enlightened Tutor puts Draco on top, then you cast Explosion.\n- **Sylvan Library:** if you draw Draco with it, put it back on top and fire Explosion that turn.\n\nTribal Flames (5 damage with all five land types) or Lightning Bolt covers the last 4 points. Draco is also a real backup threat: with all five basic land types it costs just {6} and its upkeep drops to {0}, so it's a 9/9 flier with no drawback.\n\n**Directions I considered:**\n1. **Green-base five-color domain (chosen).** It uses the Sylvan Library and fetchland package from Terrageddon, adds Birds of Paradise and Rampant Growth to get every land type out, and has two tutors that put cards on top.\n2. **Grixis control** with Lim-Dûl's Vault and Scroll Rack, using Stiflenought's Counterspell and Foil.\n3. **Green-white with a little red,** using Enchantress's Mirri's Guile and Sylvan Library.\n\nI picked the first because domain is the only thing that turns Draco from a dead card in hand into a castable 6-drop, and green-white has the most legal ways to put Draco on top. The usual tools are out: Mystical Tutor, Vampiric Tutor and Brainstorm are banned, and Personal Tutor isn't legal in Premodern.\n\n**Things to know:**\n- **Erratic Explosion is a sorcery,** so you can't respond with it at instant speed. Plan on tutoring and exploding in the same main phase.\n- **Odds:** the chance of having Explosion plus a tutor, Library or Scroll Rack by turn 5 is about 52%, before counting Library's extra draws. Explosion is the bottleneck, since nothing in these colors can tutor for it.\n- **Mana:** the deck checker flagged 23 lands as low next to Terrageddon's 26 and white as light (8 sources). I kept 23 because Birds and Rampant Growth add 7 more mana sources. Only one Island and one Swamp are needed, since they're there just to fill out the five land types.\n\n**Sideboard:** aimed at the current fiel <script>
(function () {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const picks = new Map();
  let db = null;
  let canWrite = false;
  let current = 0;
  let chain = Promise.resolve();
  let advanceTimer = null;
  const brewsOnly = document.getElementById("brewsOnly");
  const unjudgedOnly = document.getElementById("unjudgedOnly");

  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
    }
    for (const kid of kids) if (kid) n.append(kid);
    return n;
  };
  const judged = (id) => Boolean(picks.get(id) && picks.get(id).winner);
  const inView = (i) => (!brewsOnly.checked || DATA.pairs[i].brew) && (!unjudgedOnly.checked || !judged(DATA.pairs[i].id) || i === current);

  /** Card -> copies across main, side and commander. */
  function counts(deck) {
    const m = new Map();
    if (!deck) return m;
    for (const zone of ["commander", "main", "side"]) {
      for (const c of deck[zone] || []) {
        const k = (zone === "side" ? "SB: " : "") + c.name;
        m.set(k, (m.get(k) || 0) + c.qty);
      }
    }
    return m;
  }
  function diff(a, b) {
    const onlyA = [];
    const onlyB = [];
    const both = [];
    for (const k of new Set([...a.keys(), ...b.keys()])) {
      const x = a.get(k) || 0;
      const y = b.get(k) || 0;
      const shared = Math.min(x, y);
      if (shared) both.push(`${shared} ${k}`);
      if (x > shared) onlyA.push(`${x - shared} ${k}`);
      if (y > shared) onlyB.push(`${y - shared} ${k}`);
    }
    const byMain = (s) => (s.includes("SB: ") ? 1 : 0);
    const sort = (xs) => xs.sort((p, q) => byMain(p) - byMain(q) || p.replace(/^\d+ /, "").localeCompare(q.replace(/^\d+ /, "")));
    return { onlyA: sort(onlyA), onlyB: sort(onlyB), both: sort(both) };
  }
  /** The reply's opening: its first two sentences, where answers put the plan. */
  function opening(text) {
    if (!text) return "";
    const clean = text.replace(/\*\*/g, "").replace(/\s+/g, " ").trim();
    const parts = clean.match(/[^.!?]+[.!?]+/g) || [clean];
    const out = parts.slice(0, 2).join(" ").trim();
    return out.length > 360 ? out.slice(0, 357) + "…" : out;
  }

  function renderProgress() {
    const pool = DATA.pairs.filter((p) => !brewsOnly.checked || p.brew);
    const done = pool.filter((p) => judged(p.id)).length;
    document.getElementById("progress").replaceChildren(el("b", { text: `${done} of ${pool.length}` }), brewsOnly.checked ? " brew pairs judged" : " pairs judged");
  }

  function save(patch, advance) {
    if (!db || !canWrite) return;
    const p = DATA.pairs[current];
    const body = { ...(picks.get(p.id) || {}), ...patch, pair: p.id, prompt: p.prompt, quick: true, updatedAt: new Date().toISOString() };
    picks.set(p.id, body);
    sync();
    renderProgress();
    const status = document.getElementById("saved");
    status.textContent = "Saving…";
    chain = chain
      .then(() => db.collection("pairs").doc(p.id).set(body))
      .then(() => { status.textContent = advance ? "Saved. Next pair in a moment (change your mind with Previous)." : "Saved"; })
      .catch((e) => { status.textContent = e && e.code === "invalid_argument" ? "Only the owner can save picks on this page." : "Could not save. Try again in a moment."; });
    if (advance) {
      clearTimeout(advanceTimer);
      advanceTimer = setTimeout(() => go(1), 900);
    }
  }

  /** The whole list, by zone; lines with more copies than the other deck are highlighted. */
  /** A card name that shows the card's text on hover, focus or tap (artifact pages can't load outside images). */
  function cardName(name) {
    return el("span", { class: "card", "data-card": name, tabindex: "0", text: name });
  }
  const peek = document.getElementById("peek");
  let peekFor = null;
  function showPeek(target, x, y) {
    const name = target.dataset.card;
    const c = DATA.cards && DATA.cards[name];
    if (name !== peekFor) {
      peekFor = name;
      // el() skips null children; replaceChildren would render them as the text "null".
      peek.replaceChildren(
        ...[
          el("div", { class: "pk-head" }, el("span", { text: name }), c ? el("span", { class: "pk-cost", text: c.cost }) : null),
          c ? el("div", { class: "pk-type", text: c.type }) : el("div", { class: "pk-type", text: "No card text on file." }),
          c ? el("div", { class: "pk-text", text: c.text }) : null,
          c && c.pt ? el("div", { class: "pk-pt", text: c.pt }) : null,
        ].filter(Boolean),
      );
    }
    peek.classList.add("on");
    const w = peek.offsetWidth;
    const h = peek.offsetHeight;
    peek.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x + 16)) + "px";
    peek.style.top = Math.max(8, Math.min(window.innerHeight - h - 8, y - h / 2)) + "px";
  }
  function hidePeek() { peek.classList.remove("on"); }
  document.addEventListener("mouseover", (e) => { const t = e.target.closest && e.target.closest(".card"); if (t) showPeek(t, e.clientX, e.clientY); });
  document.addEventListener("mousemove", (e) => { if (peek.classList.contains("on") && e.target.closest && e.target.closest(".card")) showPeek(e.target.closest(".card"), e.clientX, e.clientY); });
  document.addEventListener("mouseout", (e) => { if (e.target.closest && e.target.closest(".card")) hidePeek(); });
  document.addEventListener("focusin", (e) => { const t = e.target.closest && e.target.closest(".card"); if (t) { const r = t.getBoundingClientRect(); showPeek(t, r.right, r.top + r.height / 2); } });
  document.addEventListener("focusout", (e) => { if (e.target.closest && e.target.closest(".card")) hidePeek(); });
  // Touch: tap a name to show, tap anywhere else to hide.
  document.addEventListener("click", (e) => { const t = e.target.closest && e.target.closest(".card"); if (t) { if (peek.classList.contains("on") && peekFor === t.dataset.card) hidePeek(); else showPeek(t, e.clientX, e.clientY); } else hidePeek(); });

  /** "4 Card Name" or "1 SB: Card Name" as a list item with a hoverable name. */
  function cardLine(line) {
    const m = line.match(/^(\d+) (SB: )?(.+)$/);
    if (!m) return el("li", { text: line });
    return el("li", {}, `${m[1]} ${m[2] || ""}`, cardName(m[3]));
  }

  function fullList(deck, other) {
    const d = el("details", { class: "full", open: "" }, el("summary", { text: "Full decklist" }));
    const theirs = counts(other);
    for (const [zone, label] of [["commander", "Commander"], ["main", "Main"], ["side", "Sideboard"]]) {
      const lines = deck[zone] || [];
      if (!lines.length) continue;
      const total = lines.reduce((n, c) => n + c.qty, 0);
      const ul = el("ul");
      for (const c of lines) {
        const k = (zone === "side" ? "SB: " : "") + c.name;
        ul.append(el("li", { class: c.qty > (theirs.get(k) || 0) ? "uniq" : null }, `${c.qty} `, cardName(c.name)));
      }
      d.append(el("h4", { text: `${label} (${total})` }), ul);
    }
    return d;
  }

  function side(letter, ans, only, other) {
    const box = el("article", { class: "side" });
    box.append(el("div", { class: "side-head" }, el("span", { class: "letter", text: letter }), ans.deck ? null : el("span", { class: "fmt", text: "No deck" })));
    if (ans.text) box.append(el("p", { class: "lead", text: opening(ans.text) }));
    const o = el("div", { class: "only" }, el("h3", { text: `Only in ${letter}` }));
    o.append(only.length ? el("ul", {}, ...only.map(cardLine)) : el("p", { class: "none", text: "Nothing: every card is also in the other deck." }));
    box.append(o);
    if (ans.deck) box.append(fullList(ans.deck, other));
    if (ans.text) {
      const d = el("details", {}, el("summary", { text: "Full reply" }));
      d.append(el("div", { class: "reply", text: ans.text }));
      box.append(d);
    }
    return box;
  }

  function sync() {
    const s = picks.get(DATA.pairs[current].id) || {};
    for (const b of document.querySelectorAll("#picks button")) {
      b.setAttribute("aria-pressed", String(s.winner === b.dataset.w));
      b.disabled = !canWrite;
    }
    for (const b of document.querySelectorAll("#why button")) {
      b.setAttribute("aria-pressed", String((s.reasons || []).includes(b.dataset.r)));
      b.disabled = !canWrite;
    }
  }

  function render() {
    const p = DATA.pairs[current];
    const pr = DATA.prompts[p.prompt];
    const first = pr.prompt.split("\n")[0];
    const req = [el("span", { class: "fmt", text: pr.format }), el("p", { class: "prompt", text: first })];
    if (pr.prompt.includes("\n") && pr.prompt.length > 220) {
      const d = el("details", {}, el("summary", { text: "Show the pasted list" }));
      d.append(el("div", { class: "reply", text: pr.prompt.slice(first.length).trim() }));
      req.push(d);
    }
    document.getElementById("request").replaceChildren(...req);
    const d = diff(counts(p.left.deck), counts(p.right.deck));
    document.getElementById("duel").replaceChildren(side("A", p.left, d.onlyA, p.right.deck), side("B", p.right, d.onlyB, p.left.deck));
    const shared = document.getElementById("shared");
    shared.replaceChildren(el("summary", { text: `Both decks play ${d.both.length} of the same card lines` }), el("pre", { text: d.both.join("\n") || "None" }));
    shared.open = false;
    document.getElementById("saved").textContent = "";
    document.getElementById("prev").disabled = !DATA.pairs.some((_, i) => i < current && inView(i));
    document.getElementById("next").disabled = !DATA.pairs.some((_, i) => i > current && inView(i));
    sync();
    renderProgress();
  }

  function go(dir) {
    let i = current + dir;
    while (i >= 0 && i < DATA.pairs.length && !inView(i)) i += dir;
    if (i < 0 || i >= DATA.pairs.length) {
      if (dir > 0) document.getElementById("saved").textContent = "That was the last one in this view. Thank you!";
      return;
    }
    current = i;
    try { localStorage.setItem("quick-pair", String(current)); } catch (e) {}
    render();
    window.scrollTo(0, 0);
  }
  function jumpToFirst() {
    const i = DATA.pairs.findIndex((_, j) => (!brewsOnly.checked || DATA.pairs[j].brew) && (!unjudgedOnly.checked || !judged(DATA.pairs[j].id)));
    if (i >= 0) { current = i; render(); }
  }

  document.getElementById("prev").addEventListener("click", () => go(-1));
  document.getElementById("next").addEventListener("click", () => go(1));
  brewsOnly.addEventListener("change", jumpToFirst);
  unjudgedOnly.addEventListener("change", jumpToFirst);
  for (const b of document.querySelectorAll("#picks button")) b.addEventListener("click", () => save({ winner: b.dataset.w }, true));
  for (const b of document.querySelectorAll("#why button")) {
    b.addEventListener("click", () => {
      clearTimeout(advanceTimer);
      const s = picks.get(DATA.pairs[current].id) || {};
      const set = new Set(s.reasons || []);
      set.has(b.dataset.r) ? set.delete(b.dataset.r) : set.add(b.dataset.r);
      save({ reasons: [...set] }, false);
    });
  }
  document.addEventListener("keydown", (e) => {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    const map = { "1": "A", "2": "tie", "3": "B", "4": "neither" };
    if (map[e.key] && canWrite) save({ winner: map[e.key] }, true);
    if (e.key === "ArrowRight") go(1);
    if (e.key === "ArrowLeft") go(-1);
  });

  try { current = Math.min(Number(localStorage.getItem("quick-pair") || 0), DATA.pairs.length - 1) || 0; } catch (e) {}
  render();

  (async () => {
    const notice = document.getElementById("notice");
    const claude = window.claude;
    const dbNs = claude && claude.use ? await claude.use("db") : null;
    const user = claude && claude.use ? await claude.use("user") : null;
    if (!dbNs) { notice.textContent = "Picks save only when this page is open on claude.ai and you're signed in."; return; }
    db = dbNs;
    canWrite = user ? (user.isOwner() ?? false) : false;
    let first = true;
    db.collection("pairs").onSnapshot(
      (snap) => {
        picks.clear();
        for (const d of snap.docs) picks.set(d.id, d.data());
        if (first) {
          first = false;
          notice.textContent = canWrite
            ? "Hover (or tap) any card name to see what it does. The cards that differ are at the top; full lists are below, with those cards highlighted. Press 1, 2 or 3 (or click) and it moves on. The opening two sentences of each reply say what the deck is going for."
            : "Read-only: only the page owner can judge.";
          jumpToFirst();
          return;
        }
        sync();
        renderProgress();
      },
      () => { notice.textContent = "Saved picks could not be loaded. Reload the page to try again."; },
    );
  })();
})();
</script>
