<style>
/* Layout: one question per screen. The request, each answer's opening, only the cards that differ, then A / Same / B. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --ink: #1b2236;
  --muted: #5d667d;
  --line: #dde2ec;
  --accent: #2459a6;
  --pick: #b5650d;
  --chip: #e8edf6;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141d; --surface: #181e2b; --ink: #e5e9f2; --muted: #9aa4ba; --line: #2a3346;
    --accent: #6f9fe0; --pick: #e2a04f; --chip: #222b3d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141d; --surface: #181e2b; --ink: #e5e9f2; --muted: #9aa4ba; --line: #2a3346;
  --accent: #6f9fe0; --pick: #e2a04f; --chip: #222b3d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 64px; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.top h1 { font-size: 1.3rem; }
.progress { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.progress b { color: var(--pick); }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 0.9rem; color: var(--muted); }
.controls label { display: inline-flex; gap: 6px; align-items: center; }
.btn { font: 600 0.88rem var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.btn:disabled { opacity: 0.5; cursor: default; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.notice { margin: 0; color: var(--muted); font-size: 0.9rem; }
.request { display: grid; gap: 6px; }
.fmt { font: 600 0.75rem var(--font-body); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.prompt { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.duel { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 14px; }
.side { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.side-head { display: flex; gap: 10px; align-items: center; }
.letter { font: 700 1.2rem var(--font-display); width: 2.1rem; height: 2.1rem; display: grid; place-items: center; border-radius: 8px; background: var(--ink); color: var(--surface); }
.lead { margin: 0; font-size: 0.94rem; overflow-wrap: anywhere; }
.only h3 { font: 600 0.78rem var(--font-body); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
.only pre { margin: 0; font: 0.84rem/1.5 var(--font-mono); padding: 10px 12px; background: var(--bg); border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
.none { color: var(--muted); font-style: italic; }
.full summary { font-size: 0.85rem; }
.full h4 { font: 600 0.72rem var(--font-body); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 8px 0 2px; }
.full ul { list-style: none; margin: 0; padding: 0; font: 0.8rem/1.5 var(--font-mono); columns: 2 170px; column-gap: 14px; }
.full li { break-inside: avoid; overflow-wrap: anywhere; }
.full li.uniq { color: var(--accent); font-weight: 600; }
.only ul { list-style: none; margin: 0; padding: 10px 12px; background: var(--bg); border-radius: 8px; font: 0.84rem/1.5 var(--font-mono); }
.only li { overflow-wrap: anywhere; }
.card { cursor: help; border-bottom: 1px dotted var(--muted); }
.card:hover, .card:focus-visible { color: var(--accent); }
#peek { position: fixed; z-index: 10; width: min(300px, calc(100vw - 16px)); max-height: 60vh; overflow: auto; border-radius: 10px; border: 1px solid var(--line); box-shadow: 0 8px 28px rgba(0,0,0,0.3); background: var(--surface); color: var(--ink); padding: 10px 12px; display: none; pointer-events: none; font: 0.84rem/1.45 var(--font-body); }
#peek.on { display: block; }
#peek .pk-head { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; }
#peek .pk-cost { font-family: var(--font-mono); font-weight: 400; color: var(--muted); white-space: nowrap; }
#peek .pk-type { color: var(--muted); font-size: 0.78rem; margin: 2px 0 6px; }
#peek .pk-text { white-space: pre-wrap; }
#peek .pk-pt { text-align: right; font-weight: 700; margin-top: 6px; }
.peek-note { font-size: 0.78rem; color: var(--muted); margin: 0; }
details summary { cursor: pointer; color: var(--accent); font-size: 0.9rem; }
.shared pre { margin: 6px 0 0; font: 0.8rem/1.45 var(--font-mono); padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; columns: 2 220px; }
.reply { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 20rem; overflow: auto; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.9rem; margin-top: 6px; }
.ask { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.ask h2 { font-size: 1.1rem; }
.picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.picks button { font: 700 1.05rem var(--font-display); padding: 16px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); cursor: pointer; }
.picks button kbd { display: block; font: 0.75rem var(--font-mono); color: var(--muted); margin-top: 2px; }
.picks button[aria-pressed="true"] { background: var(--pick); color: var(--surface); border-color: var(--pick); }
.picks button[aria-pressed="true"] kbd { color: var(--surface); }
.why { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.85rem; color: var(--muted); }
.why button { font: 0.85rem var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 4px 10px; border-radius: 999px; cursor: pointer; }
.why button[aria-pressed="true"] { background: var(--chip); border-color: var(--accent); color: var(--accent); }
button:disabled { cursor: not-allowed; opacity: 0.6; }
.saved { font-size: 0.8rem; color: var(--muted); min-height: 1.2em; }
@media (max-width: 560px) { .picks { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .picks button, .why button { transition: background 120ms ease, color 120ms ease; } }
</style>

<div class="wrap">
  <div class="top">
    <h1>Expert Quick Pick</h1>
    <span class="progress" id="progress"></span>
  </div>
  <div class="controls">
    <button class="btn" id="prev" type="button">Previous</button>
    <button class="btn" id="next" type="button">Next</button>
    <label><input type="checkbox" id="brewsOnly" checked> Brews only</label>
    <label><input type="checkbox" id="unjudgedOnly" checked> Not yet judged</label>
  </div>
  <p class="notice" id="notice">Loading saved picks…</p>
  <section class="request" id="request"></section>
  <div class="duel" id="duel"></div>
  <div id="peek" role="tooltip"></div>
  <details class="shared" id="shared"></details>
  <section class="ask">
    <h2>Which would you rather play for this request?</h2>
    <div class="picks" id="picks">
      <button type="button" data-w="A">A<kbd>1</kbd></button>
      <button type="button" data-w="tie">Same<kbd>2</kbd></button>
      <button type="button" data-w="B">B<kbd>3</kbd></button>
    </div>
    <div class="why" id="why">
      <span>Why, if you like:</span>
      <button type="button" data-r="request">Closer to the request</button>
      <button type="button" data-r="mana">Better mana</button>
      <button type="button" data-r="power">Stronger cards</button>
      <button type="button" data-r="plan">Clearer plan</button>
      <button type="button" data-r="odd">Fewer odd cards</button>
    </div>
    <div class="saved" id="saved" aria-live="polite"></div>
  </section>
</div>

"expert-legacy-belcher":{"format":"Legacy","prompt":"Brew me a Legacy deck built around Goblin Charbelcher.","lookFor":""},"expert-legacy-creative-technique":{"format":"Legacy","prompt":"Brew me a Legacy deck built around Apex Devastator, Call Forth the Tempest and Creative Technique.","lookFor":""},"expert-legacy-kaalia":{"format":"Legacy","prompt":"Brew me a Legacy deck built around Kaalia of the Vast.","lookFor":""},"expert-premodern-life":{"format":"Premodern","prompt":"Brew me a Premodern deck built around Daru Spiritualist and Worthy Cause.","lookFor":""},"expert-legacy-mystic-remora":{"format":"Legacy","prompt":"Brew me a Legacy control deck built around Mystic Remora.","lookFor":""}},"pairs":[{"id":"0ab3887c04b3","prompt":"expert-legacy-stoneforge","brew":true,"left":{"text":"I built an Azorius (white-blue) \"Blink-Stoneblade\" deck and submitted it. It's a brew: no recent Legacy list I found plays all three of your cards together. The mana and interaction come from Jeskai Control.\n\n**The plan**\nPlay Stoneforge Mystic or Phelia on turn 2. A turn-2 opening comes up 70.6% of the time on the play with 8 copies, before mulligans. Then protect the board with Force of Will and Swords to Plowshares. From there Phelia does most of the work. Whenever she attacks, she exiles a nonland permanent and returns it at the next end step. If it comes back under your control, she gets a +1/+1 counter. Use that on your own \"enters the battlefield\" effects to repeat them, or on an opponent's blocker to remove it for the turn.\n\n**Why these cards**\n- **Stoneforge Mystic (4):** Finds one of three equipment: Kaldra Compleat, Batterskull or Umezawa's Jitte. Its ability puts Kaldra or Batterskull into play for {1}{W}. If Phelia blinks Stoneforge, it searches again.\n- **Phelia (4):** She has flash, so you can cast her at the end of the opponent's turn. Extra copies (she's legendary) can be exiled to pay for Solitude's evoke.\n- **Phelia's best targets:**\n  - **Kaldra Compleat and Batterskull:** Living weapon triggers again when they come back, so you get a fresh Germ. Kaldra's equipped Germ is a 5/5 with indestructible.\n  - **Solitude:** Exiles another creature.\n  - **Teferi:** Comes back as a new permanent, so you can use his −3 again (bounce a permanent and draw).\n  - **Quantum Riddler:** Draws another card.\n- **Quantum Riddler (4):** A 4/6 flier that draws when it enters, and draws one extra while you hold one card or fewer. Warp lets you cast it early for {1}{U}. **This trick is my reading of the rules and isn't confirmed by any tool:** if Phelia blinks a warped Riddler, it returns as a new object and shouldn't get exiled by warp. That would mean keeping a 5-drop for 2 mana. Check it with a judge before relying on it.\n- **Thundertrap Trainer (2):** Its enters trigger can find an equipment, Swords or Force, and Phelia can blink it too.\n- **Interaction:** 4 Force of Will, 1 Force of Negation, 1 Spell Pierce, 4 Swords to Plowshares and 2 Prismatic Ending. Teferi also stops the tempo decks from casting at instant speed.\n\n**The mana**\n20 lands: 4 Flooded Strand, 3 Prismatic Vista, 3 Tundra, 1 Meticulous Archive, 1 Karakas, 5 Island and 3 Plains. That gives 16 blue and 15 white sources. Jeskai Control averages 19.9 lands. The deck checker suggested about 22, but I stayed at 20 because of 7 cantrips (Brainstorm and Ponder) and Riddler's cheap warp cost. Karakas can bounce your own Phelia to save her, or remove a legendary threat like an Emrakul brought in by Sneak and Show. The checker's only note was \"0 red sources,\" which doesn't matter in a two-color deck.\n\n**Sideboarding**\n- **Esper, Dimir and Izzet Tempo (about 32% of the field):** Bring in 2 Consign to Memory, plus 2 Hydroblast against Izzet. Take out Spell Pierce and Prismatic Ending if needed. Jitte is already in the main deck for these creature matchups.\n- **Mono-Red Prison:** Bring in Hydroblast and the second Force of Negation.\n- **Cephalid Breakfast and Reanimator:** Bring in 2 Rest in Peace, 2 Surgical Extraction and Consign to Memory. I chose Rest in Peace over Containment Priest because Priest would also exile your own Phelia-blinked creatures, which return without being cast.\n- **Storm, Oops All Spells and Doomsday:** Bring in 2 Lavinia, Flusterstorm and Deafening Silence. Take out Solitude and Jitte.\n- **Eldrazi Aggro, Ocelot Aggro and go-wide decks:** Bring in Wrath of the Skies and Supreme Verdict.\n- **Tron and Lands:** Bring in Force of Negation and Lavinia, and keep up pressure with Kaldra.\n\n**What I couldn't verify**\n- Whether Riddler's warp exile really misses the blinked Riddler (rules reading only).\n- Whether 4 copies of a legendary Phelia is the right number. 3 is a reasonable alternative.\n\nThe deck passed the legality and mana checks with no errors.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Stoneforge Mystic"},{"qty":4,"name":"Phelia, Exuberant Shepherd"},{"qty":4,"name":"Quantum Riddler"},{"qty":2,"name":"Solitude"},{"qty":2,"name":"Thundertrap Trainer"},{"qty":1,"name":"Kaldra Compleat"},{"qty":1,"name":"Batterskull"},{"qty":1,"name":"Umezawa's Jitte"},{"qty":4,"name":"Force of Will"},{"qty":1,"name":"Force of Negation"},{"qty":1,"name":"Spell Pierce"},{"qty":4,"name":"Brainstorm"},{"qty":3,"name":"Ponder"},{"qty":4,"name":"Swords to Plowshares"},{"qty":2,"name":"Prismatic Ending"},{"qty":2,"name":"Teferi, Time Raveler"},{"qty":4,"name":"Flooded Strand"},{"qty":3,"name":"Prismatic Vista"},{"qty":3,"name":"Tundra"},{"qty":1,"name":"Meticulous Archive"},{"qty":1,"name":"Karakas"},{"qty":5,"name":"Island"},{"qty":3,"name":"Plains"}],"side":[{"qty":2,"name":"Hydroblast"},{"qty":2,"name":"Consign to Memory"},{"qty":2,"name":"Surgical Extraction"},{"qty":2,"name":"Rest in Peace"},{"qty":2,"name":"Lavinia, Azorius Renegade"},{"qty":1,"name":"Wrath of the Skies"},{"qty":1,"name":"Supreme Verdict"},{"qty":1,"name":"Flusterstorm"},{"qty":1,"name":"Force of Negation"},{"qty":1,"name":"Deafening Silence"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built an Azorius (white-blue) brew around Stoneforge Mystic, Quantum Riddler and Phelia, Exuberant Shepherd, and the site accepted it.\n\n**Three directions I considered:**\n1. **Azorius tempo-control:** the requested cards plus the Force of Will / Brainstorm / Ponder / Tamiyo / Swords to Plowshares core from the Jeskai Control results, with the red cut.\n2. **Full Jeskai:** the same shell with red kept for Flame of Anor, Thundertrap Trainer and Pyroblast.\n3. **Death and Taxes splashing blue:** Stoneforge and Phelia already show up most in Death and Taxes, but that deck can't reliably pay for Riddler's two blue mana.\n\nI chose direction 1. Phelia needs white, Stoneforge needs white and Riddler needs two blue, so a two-color mana base casts all three most smoothly. It also keeps the proven Jeskai blue core.\n\n**The plan:** On turn 2, play Stoneforge Mystic to fetch an equipment (Batterskull, Kaldra Compleat or Umezawa's Jitte) or flash in Phelia. Then use Quantum Riddler's warp cost ({1}{U}) as a cheap \"draw a card\" early on.\n\nThe key combo is Phelia's attack trigger. When she attacks, she can exile one of your permanents, which comes back at the next end step and gives Phelia a +1/+1 counter. Use it on:\n- **A warped Riddler:** it comes back as a new copy, draws again, and (by my reading of the rules) stays on the battlefield instead of being exiled by warp.\n- **Batterskull:** it returns with a fresh germ token.\n- **Stoneforge Mystic:** it searches for another equipment.\n- **Solitude:** it exiles another creature.\n\nForce of Will, Swords to Plowshares, Prismatic Ending and Teferi, Time Raveler protect that engine.\n\n**Odds and mana:**\n- You have about a 71% chance to see Stoneforge or Phelia by turn 2 on the play.\n- The deck runs 19 lands, with 14 white and 18 blue sources.\n- The deck check only flagged that it has fewer red sources than Jeskai lists, which doesn't matter because this version plays no red cards.\n\nThe sideboard is aimed at the decks the results show most. Surgical Extraction, Consign to Memory, Containment Priest and Grafdigger's Cage are for Esper Tempo's Reanimate and for Cephalid Breakfast. Hydroblast and Blue Elemental Blast are for Izzet Tempo. Force of Negation and Supreme Verdict cover the artifact decks, combo and Ocelot Aggro.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Stoneforge Mystic"},{"qty":4,"name":"Phelia, Exuberant Shepherd"},{"qty":4,"name":"Quantum Riddler"},{"qty":4,"name":"Tamiyo, Inquisitive Student"},{"qty":2,"name":"Solitude"},{"qty":1,"name":"Batterskull"},{"qty":1,"name":"Kaldra Compleat"},{"qty":1,"name":"Umezawa's Jitte"},{"qty":4,"name":"Force of Will"},{"qty":4,"name":"Brainstorm"},{"qty":4,"name":"Ponder"},{"qty":4,"name":"Swords to Plowshares"},{"qty":2,"name":"Prismatic Ending"},{"qty":1,"name":"Spell Pierce"},{"qty":1,"name":"Teferi, Time Raveler"},{"qty":4,"name":"Flooded Strand"},{"qty":2,"name":"Scalding Tarn"},{"qty":2,"name":"Prismatic Vista"},{"qty":3,"name":"Tundra"},{"qty":5,"name":"Island"},{"qty":2,"name":"Plains"},{"qty":1,"name":"Karakas"}],"side":[{"qty":2,"name":"Surgical Extraction"},{"qty":2,"name":"Consign to Memory"},{"qty":2,"name":"Hydroblast"},{"qty":2,"name":"Containment Priest"},{"qty":2,"name":"Force of Negation"},{"qty":1,"name":"Supreme Verdict"},{"qty":1,"name":"Dress Down"},{"qty":1,"name":"Grafdigger's Cage"},{"qty":1,"name":"Lavinia, Azorius Renegade"},{"qty":1,"name":"Blue Elemental Blast"}],"mainCount":60,"sideCount":15}}},{"id":"47a99b0b45b0","prompt":"expert-legacy-helm-rip","brew":true,"left":{"text":"I built an **Azorius Tron Helm** brew (submitted and accepted as legal, 60 cards plus a 15-card sideboard).\n\n**How it wins:** With Rest in Peace out, your opponent's cards get exiled instead of going to the graveyard. So when you activate Helm of Obedience for X=1, a creature never lands in their graveyard and the count never reaches 1. They mill their whole library and lose on their next draw. Helm costs 4 to cast plus 1 to activate, so the deck uses Tron's fast mana to get there: Ancient Tomb, Grim Monolith, the Urza lands and Planar Nexus. A fast hand can be RIP on turn 1, then Tomb plus Monolith for Helm and the activation on turn 2.\n\n**Finding the pieces:**\n- 3 Helm in the deck, plus 4 Karn, the Great Creator. Karn's −2 grabs the 4th Helm from the sideboard.\n- 4 Enlightened Tutor finds whichever piece you're missing.\n- Stock Up and The One Ring dig for the rest.\n- Force of Will and Force of Negation protect the combo.\n- Rest in Peace is good on its own against Reanimator, Doomsday and graveyard-fuelled Tempo decks.\n\n**Odds:** I checked a version with 3 Enlightened Tutor instead of 4. With no mulligans, on the play, it had at least one Rest in Peace or Tutor and at least one Helm or Karn by turn 4 **53.7%** of the time. That's before Stock Up or the Ring dig. The 4th Tutor helps a little, but I didn't recheck the number. Expect turns 3–5 to be normal. This is untested: Helm showed up in only 5 lists in the last 90 days.\n\n**Three directions I sketched:**\n1. **Azorius Control:** Force, Brainstorm and Swords, with Helm and Tutor added. Good protection, but too slow to cast and activate a 4-mana artifact.\n2. **Orzhov:** Leyline of the Void and Dauthi Voidwalker as extra versions of Rest in Peace, plus discard. More copies of the enabler, but no fast mana and weak counterspells.\n3. **Tron package (chosen):** I picked this because Tron's fast mana is the natural home for a 4-mana artifact, and Karn can fetch Helm from the sideboard. The deck uses Tron's mana and counterspells, but Helm and Rest in Peace are the main win, and I cut Ugin entirely.\n\nThe sideboard is set up for Karn to fetch from (Mycosynth Lattice, Ensnaring Bridge, Pithing Needle, Engineered Explosives). The rest is aimed at Ocelot Aggro and Eldrazi (Swords to Plowshares, Wrath of the Skies) and at combo decks (Disruptor Flute, Consign to Memory).","error":false,"deck":{"commander":[],"main":[{"qty":3,"name":"Helm of Obedience"},{"qty":4,"name":"Rest in Peace"},{"qty":4,"name":"Enlightened Tutor"},{"qty":4,"name":"Karn, the Great Creator"},{"qty":4,"name":"Grim Monolith"},{"qty":4,"name":"Force of Will"},{"qty":4,"name":"Stock Up"},{"qty":3,"name":"The One Ring"},{"qty":4,"name":"Kozilek's Command"},{"qty":2,"name":"Force of Negation"},{"qty":2,"name":"Giant's Boulder"},{"qty":4,"name":"Urza's Tower"},{"qty":2,"name":"Urza's Mine"},{"qty":2,"name":"Urza's Power Plant"},{"qty":4,"name":"Planar Nexus"},{"qty":4,"name":"Ancient Tomb"},{"qty":2,"name":"Tundra"},{"qty":1,"name":"Plains"},{"qty":1,"name":"Island"},{"qty":2,"name":"Flooded Strand"}],"side":[{"qty":1,"name":"Helm of Obedience"},{"qty":1,"name":"Mycosynth Lattice"},{"qty":1,"name":"Ensnaring Bridge"},{"qty":1,"name":"Engineered Explosives"},{"qty":1,"name":"Pithing Needle"},{"qty":3,"name":"Disruptor Flute"},{"qty":3,"name":"Swords to Plowshares"},{"qty":2,"name":"Wrath of the Skies"},{"qty":2,"name":"Consign to Memory"}],"mainCount":60,"sideCount":15}},"right":{"text":"I've built a mono-plan Azorius control deck around the combo. Its card choices are new, but its mana base and interaction come from the Azorius Control lists in recent results.\n\n**How the combo works:** Helm of Obedience keeps milling until a creature card or X cards have been \"put into their graveyard this way.\" Rest in Peace exiles every card that would go to a graveyard. So nothing ever reaches their graveyard, the stop condition never happens, and Helm with X=1 mills the opponent's whole library for {1}. Helm also never sacrifices itself. The opponent loses on their next draw.\n\n## The plan\nUse the standard Legacy blue control package (Force of Will, Brainstorm, Ponder, Swords to Plowshares) to survive and protect yourself, then put the two pieces together, usually around turn 4. Rest in Peace is also a strong card by itself against the graveyard decks in the field.\n\n## Key cards\n- **4 Rest in Peace, 3 Helm of Obedience (plus 1 in the sideboard):** the combo.\n- **4 Enlightened Tutor:** finds either half, since it searches for an artifact or enchantment. Cast it at the end of the opponent's turn and you draw the card next turn.\n- **3 Transit Mage:** a 3-mana creature that searches for an artifact with mana value 4 or 5, which means Helm. It shows up in no recent lists. This is the brew's main new idea.\n- **2 Karn, the Great Creator:** its −2 gets an artifact from outside the game (the sideboard Helm). It can also get a face-up artifact you own from exile. That matters because a Helm destroyed while Rest in Peace is out goes to exile instead of the graveyard, and Karn can bring it back.\n- **2 Teferi, Time Raveler:** opponents can only cast spells at sorcery speed, so they can't counter Helm's activation or respond on your turn.\n- **Odds:** without mulligans, you see at least one combo piece or tutor by turn 3 on the play 94% of the time. You have a card from both halves by turn 4 on the draw at least 63% of the time. That figure undercounts, because it lets each Tutor count for only one half and ignores Brainstorm and Ponder.\n\n## Mana\n- **21 lands:** 3 Ancient Tomb, 4 Tundra, 8 fetchlands that can all find Tundra, 4 Island, 2 Plains.\n- **Ancient Tomb** lets you cast Helm or Karn on turn 3 and then use Helm the next turn.\n- **Colour counts:** the deck checker counted 14 blue and 12 white sources. Real Azorius lists run about 17 blue. The gap is the cost of the Tombs, and Lórien Revealed's islandcycling helps make up for it. The checker also flagged that I have no green sources; that's irrelevant here.\n\n## Sideboarding\n- **Dimir and Izzet Tempo:** bring in 2 Hydroblast (only against Izzet) and the third Force of Negation. Take out Wrath of the Skies and 1–2 Lórien Revealed.\n- **Ocelot Aggro and Eldrazi Aggro:** bring in 2 Solitude, 2 Prismatic Ending and the second Wrath. Take out Force of Negation and Lórien Revealed.\n  - **Warning about Wrath:** it destroys everything with mana value up to the energy you pay. Pay 1 or less so you don't kill your own Rest in Peace (mana value 2) or Helm (4).\n- **Doomsday, OmniTell, Sneak and Show, Storm:** bring in 2 Flusterstorm, 3 Consign to Memory, Deafening Silence and Force of Negation. Take out 4 Swords, Wrath and Lórien Revealed.\n- **Tron:** Consign to Memory counters colorless spells, so bring it in for Lórien Revealed and Wrath.\n- **Reanimator, Hogaak and Lands:** Rest in Peace in the main deck already does the work. Bring in Consign to Memory for triggered abilities if you need it.\n\n## Label and what I couldn't verify\n- **Label: brew.** Helm appeared in only 5 lists in the last 90 days, and none of them were built this way. Transit Mage appears in none.\n- **Untested:** none of the matchup advice above is backed by results.\n- **What the combo doesn't stop:** opponents can still win at instant speed before their next draw, or remove Rest in Peace in response to Helm's activation.","error":false,"deck":{"commander":[],"main":[{"qty":3,"name":"Helm of Obedience"},{"qty":4,"name":"Rest in Peace"},{"qty":4,"name":"Enlightened Tutor"},{"qty":3,"name":"Transit Mage"},{"qty":2,"name":"Karn, the Great Creator"},{"qty":2,"name":"Teferi, Time Raveler"},{"qty":4,"name":"Force of Will"},{"qty":2,"name":"Force of Negation"},{"qty":4,"name":"Brainstorm"},{"qty":4,"name":"Ponder"},{"qty":4,"name":"Swords to Plowshares"},{"qty":2,"name":"Lórien Revealed"},{"qty":1,"name":"Wrath of the Skies"},{"qty":3,"name":"Ancient Tomb"},{"qty":4,"name":"Tundra"},{"qty":4,"name":"Flooded Strand"},{"qty":2,"name":"Arid Mesa"},{"qty":2,"name":"Polluted Delta"},{"qty":4,"name":"Island"},{"qty":2,"name":"Plains"}],"side":[{"qty":1,"name":"Helm of Obedience"},{"qty":3,"name":"Consign to Memory"},{"qty":2,"name":"Hydroblast"},{"qty":2,"name":"Flusterstorm"},{"qty":2,"name":"Prismatic Ending"},{"qty":2,"name":"Solitude"},{"qty":1,"name":"Force of Negation"},{"qty":1,"name":"Deafening Silence"},{"qty":1,"name":"Wrath of the Skies"}],"mainCount":60,"sideCount":15}}},{"id":"49adf5a7420a","prompt":"expert-premodern-rector-combo","brew":true,"left":{"text":"I built a Bant (green-white-blue) Survival brew: **Academy Rector, Veteran Explorer and Future Sight**, using the green-blue engine from Tradewind Survival.\n\n**The plan:** Veteran Explorer and Academy Rector need to die, so the deck has four Phyrexian Altars, a Phyrexian Tower and two Natural Orders (which sacrifice a green creature, so they only work with Explorer). When Explorer dies you get two basic lands. It can fetch Islands, which makes Future Sight's triple-blue cost easy to pay by turn 3–4. When Rector dies, it puts an enchantment straight onto the battlefield: Future Sight to play cards off the top, Survival of the Fittest to search up creatures, or Opposition (tap your creatures to tap down the opponent's). Enlightened Tutor puts an Altar or enchantment on top of your library, and with Future Sight out you can cast it from there right away. Deranged Hermit's squirrels and the tutor targets (Uktabi Orangutan, Mystic Snake, Tradewind Rider, Verdant Force) give you sacrifice fodder, answers and ways to win.\n\n**Directions I considered:**\n1. A five-color build based on the Pattern Combo list (Cabal Therapy, Goblin Bombardment, Karmic Guide), with Future Sight as one more card for Rector to fetch.\n2. A Bant build borrowing Tradewind Survival's Survival/Opposition package.\n3. A black-green build based on Living Death, using Cabal Therapy as the way to sacrifice.\n\nI chose the Bant build because Future Sight needs three blue mana, and only the three-color version pays that reliably. Rector also gets three strong enchantments to fetch.\n\n**Things to know:**\n- **Sacrifice outlets are the weak point.** You have at least one of Rector, Explorer or Survival by turn 4 about 91% of the time. You also have a way to sacrifice them only about 68% of the time, and that count is from before I added the fourth Altar, so it's a bit higher now. When you have no outlet, Rector can still chump-block.\n- **Green sources are thin.** The deck has 16.5 green sources versus about 22 in Tradewind Survival lists. That's on purpose, to make room for white and triple blue, and the five mana creatures help cover it.\n- **Squee** is mostly a creature to discard to Survival, but City of Brass or Birds can make red to cast it.\n- **Phyrexian Altar** has no recent tournament results, so treat it as untested.\n\nThe 15-card sideboard is aimed at the current top decks: Hydroblasts and Meddling Mages for Stiflenought, enchantment removal and Tormod's Crypts for Enchantress and Replenish, and Swords, Ravenous Baloth and Spike Feeder for Goblins and Sligh.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Birds of Paradise"},{"qty":1,"name":"Llanowar Elves"},{"qty":4,"name":"Veteran Explorer"},{"qty":4,"name":"Academy Rector"},{"qty":3,"name":"Wall of Blossoms"},{"qty":1,"name":"Squee, Goblin Nabob"},{"qty":1,"name":"Deranged Hermit"},{"qty":1,"name":"Tradewind Rider"},{"qty":1,"name":"Mystic Snake"},{"qty":1,"name":"Uktabi Orangutan"},{"qty":1,"name":"Spike Feeder"},{"qty":1,"name":"Verdant Force"},{"qty":4,"name":"Survival of the Fittest"},{"qty":2,"name":"Future Sight"},{"qty":2,"name":"Opposition"},{"qty":2,"name":"Enlightened Tutor"},{"qty":2,"name":"Natural Order"},{"qty":4,"name":"Phyrexian Altar"},{"qty":1,"name":"Swords to Plowshares"},{"qty":4,"name":"Yavimaya Coast"},{"qty":2,"name":"Brushland"},{"qty":2,"name":"City of Brass"},{"qty":1,"name":"Phyrexian Tower"},{"qty":1,"name":"Windswept Heath"},{"qty":1,"name":"Flooded Strand"},{"qty":5,"name":"Forest"},{"qty":3,"name":"Island"},{"qty":1,"name":"Plains"}],"side":[{"qty":2,"name":"Meddling Mage"},{"qty":2,"name":"Swords to Plowshares"},{"qty":1,"name":"Ravenous Baloth"},{"qty":1,"name":"Spike Feeder"},{"qty":1,"name":"Monk Realist"},{"qty":2,"name":"Seal of Cleansing"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Hydroblast"},{"qty":1,"name":"Exalted Angel"},{"qty":1,"name":"Naturalize"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built a Bant (green-white-blue) Rector deck. It's a **brew**: Future Sight shows up in only 2 recent lists and Academy Rector in 2. The deck passed the legality check with no warnings and was accepted.\n\n## The plan\nVeteran Explorer gives you two extra basic lands when it dies, and Academy Rector finds an enchantment when it dies. So you kill your own creatures on purpose to ramp into Future Sight and keep drawing extra cards off it. The best start: Explorer on turn 1, then Altar of Bone on turn 2, sacrificing Explorer. You end up with 4 lands and also tutor a creature like Rector into your hand. On turn 3 you can cast Future Sight (5 mana), or play Rector and sacrifice it later to put Future Sight straight onto the battlefield. You win with Opposition taking over the board, or with Exalted Angel / Deranged Hermit beats.\n\n## Key cards\n- **Altar of Bone (GW, sorcery):** Sacrifice a creature as part of the cost, then search for any creature and put it in your hand. It kills your Explorer or Rector and tutors for the next piece. Its colors also match the deck exactly.\n- **Greater Good:** You can sacrifice creatures with it again and again. Rector can also find it, so one Rector becomes a lasting sacrifice engine.\n- **Phyrexian Tower:** Lets you sacrifice a creature at instant speed, for example in response to removal or when blocking.\n- **What Rector can fetch:** Future Sight (3 copies), Opposition, Greater Good, Seal of Cleansing. Out of the sideboard, Circle of Protection: Red joins that list.\n- **Wall of Blossoms and Birds:** Wall draws a card when it enters and Birds makes mana. Both are green creatures you're happy to sacrifice, and both tap for Opposition and Tradewind Rider.\n- **Interaction:** 4 Swords to Plowshares, 2 Meddling Mage, 1 Mana Leak.\n\n**The downside:** Explorer also gives your opponent two basic lands. Opposition can tap them down, and you get the most out of the extra mana because Future Sight lets you play lands and spells off the top of your library.\n\n**Honest odds:**\n- You'll have Future Sight or Rector by turn 4 about **74%** of the time.\n- The perfect start (Explorer plus Altar of Bone by turn 2) only happens **18%** of the time. It's a nice bonus, not something to count on.\n\n## Mana\n- **22 lands:** 4 Yavimaya Coast, 3 Brushland, 2 Adarkar Wastes, 2 Flooded Strand, 2 Windswept Heath, 1 Phyrexian Tower, 4 Island, 2 Forest, 2 Plains.\n- **Coloured sources:** 14 blue, 13 white, 13 green, plus 4 Birds.\n- **Why 8 basics:** Explorer only finds basic lands, so it can fetch the Islands you need for Future Sight's UUU.\n- **Why 22 lands:** I borrowed the dual lands and creature-tapping core from the Tradewind Survival deck. It runs about 20 lands, but it also has Gaea's Cradle and 8+ mana creatures. This deck has 4 Birds and needs 5 mana for Future Sight, so I kept 22.\n\n## Sideboarding\n- **Goblins / Sligh / GR Zoo (red decks):** Bring in 2 Hydroblast and 2 Circle of Protection: Red (Rector can fetch Circle). Take out Meddling Mage, Mana Leak and a Future Sight.\n- **Enchantress / Replenish:** Bring in 2 Ray of Revelation, the second Seal of Cleansing, 2 Tormod's Crypt (it exiles a graveyard, which hurts Replenish), and 2 Xantid Swarm (they can't cast spells while it attacks). Meddling Mage stays in. Take out the Angel, Hermit, Tradewind Rider and some Walls.\n- **Stiflenought / Standstill / blue control:** Bring in 2 Counterspell, 1 Mana Leak, Mystic Snake and Xantid Swarm. Take out the slower 5-drops.\n- **Moneyball Black:** Bring in Xantid Swarm and the counterspells. Keep Swords in.\n\n## What I couldn't verify\nNobody has played this exact deck, so the card counts are estimates, not tested numbers. I picked the sideboard from the recent meta share, not from match results. The 5-mana top end of the deck is the most likely thing to need adjusting once you play it.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Birds of Paradise"},{"qty":4,"name":"Veteran Explorer"},{"qty":4,"name":"Wall of Blossoms"},{"qty":4,"name":"Academy Rector"},{"qty":2,"name":"Meddling Mage"},{"qty":1,"name":"Tradewind Rider"},{"qty":1,"name":"Exalted Angel"},{"qty":1,"name":"Deranged Hermit"},{"qty":4,"name":"Altar of Bone"},{"qty":3,"name":"Future Sight"},{"qty":2,"name":"Opposition"},{"qty":2,"name":"Greater Good"},{"qty":1,"name":"Seal of Cleansing"},{"qty":4,"name":"Swords to Plowshares"},{"qty":1,"name":"Mana Leak"},{"qty":4,"name":"Yavimaya Coast"},{"qty":2,"name":"Adarkar Wastes"},{"qty":3,"name":"Brushland"},{"qty":2,"name":"Flooded Strand"},{"qty":2,"name":"Windswept Heath"},{"qty":1,"name":"Phyrexian Tower"},{"qty":4,"name":"Island"},{"qty":2,"name":"Forest"},{"qty":2,"name":"Plains"}],"side":[{"qty":2,"name":"Circle of Protection: Red"},{"qty":2,"name":"Hydroblast"},{"qty":2,"name":"Ray of Revelation"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Counterspell"},{"qty":2,"name":"Xantid Swarm"},{"qty":1,"name":"Mana Leak"},{"qty":1,"name":"Seal of Cleansing"},{"qty":1,"name":"Mystic Snake"}],"mainCount":60,"sideCount":15}}},{"id":"53b498ae9e14","prompt":"expert-premodern-living-death","brew":true,"left":{"text":"I built a black-green deck around Living Death, using Survival of the Fittest to fill the graveyard. It's a brew: none of the recent Premodern results show a Living Death deck, and the card turned up in only 7 lists over the last 90 days.\n\n**The three directions I considered**\n1. **Black-green Survival.** This borrows the Survival of the Fittest + Squee package from the Elves and BG Survival lists.\n2. **Blue-black discard-and-draw.** Careful Study and Deep Analysis fill the graveyard, with counterspells to protect Living Death.\n3. **Mono-black Dark Ritual.** Buried Alive plus Dark Ritual to cast Living Death on turn 2 or 3.\n\n**Why I chose black-green Survival:** Survival of the Fittest finds creatures and also discards them, so it puts exactly the bodies Living Death wants into the graveyard. The green cycling creatures also fetch your lands, so the deck can hold its own until turn 5.\n\n**How it plays**\n- **Early turns:** Wild Mongrel, Survival discards and cycling creatures put fatties in your graveyard. Krosan Tusker and Twisted Abomination find a land when cycled. Scion of Darkness and Squee are also in there.\n- **Disruption:** Duress, Cabal Therapy, Smother and Pernicious Deed slow the opponent down. Withered Wretch can exile their creatures from their graveyard before you cast Living Death.\n- **The payoff:** Living Death clears their board and brings back your whole graveyard at once. Many returning creatures do something when they enter: Bone Shredder kills a creature, Deranged Hermit makes four squirrels, Uktabi Orangutan destroys an artifact. Gravedigger returns one of the creatures Living Death just sacrificed.\n- **Downside:** Your Birds of Paradise and Wall of Roots get sacrificed too, and they don't come back.\n\n**Odds:** With no mulligans, you have a 56.6% chance of seeing Living Death by turn 5. You have a 93.4% chance of seeing at least one of the 12 graveyard fillers (Survival, Mongrel, cyclers). Cycling draws extra cards, which should raise the first number a bit. I left out tutors because the good ones (Demonic Tutor, Vampiric Tutor, Grim Tutor) aren't legal in Premodern.\n\n**Mana:** I used the BG Survival lists as the model for the mana base. The deck has 21 lands; real BG Survival lists average about 21.25. The deck checker recommended about 23.3. I stayed at 21 because there are 7 mana creatures and 5 cyclers that fetch lands. The checker also warned that Squee only has 2 red sources (Birds). That's on purpose: Squee is there to be discarded over and over, not cast.\n\n**Sideboard:** It's aimed at the decks showing up most right now:\n- Engineered Plague for Goblins and Elves.\n- Naturalize for Enchantress, Replenish and Oath.\n- Extra Smother, Ravenous Baloth and Spike Feeder for Sligh.\n- Masticore, Phyrexian Furnace and an extra Duress for the rest of the field.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Birds of Paradise"},{"qty":3,"name":"Wall of Roots"},{"qty":3,"name":"Wild Mongrel"},{"qty":1,"name":"Squee, Goblin Nabob"},{"qty":1,"name":"Withered Wretch"},{"qty":1,"name":"Bone Shredder"},{"qty":1,"name":"Uktabi Orangutan"},{"qty":1,"name":"Deranged Hermit"},{"qty":1,"name":"Gravedigger"},{"qty":1,"name":"Genesis"},{"qty":3,"name":"Krosan Tusker"},{"qty":2,"name":"Twisted Abomination"},{"qty":1,"name":"Visara the Dreadful"},{"qty":1,"name":"Scion of Darkness"},{"qty":4,"name":"Survival of the Fittest"},{"qty":4,"name":"Living Death"},{"qty":3,"name":"Duress"},{"qty":1,"name":"Cabal Therapy"},{"qty":2,"name":"Pernicious Deed"},{"qty":1,"name":"Smother"},{"qty":4,"name":"Llanowar Wastes"},{"qty":9,"name":"Forest"},{"qty":8,"name":"Swamp"}],"side":[{"qty":3,"name":"Engineered Plague"},{"qty":3,"name":"Naturalize"},{"qty":2,"name":"Smother"},{"qty":2,"name":"Ravenous Baloth"},{"qty":2,"name":"Spike Feeder"},{"qty":1,"name":"Masticore"},{"qty":1,"name":"Phyrexian Furnace"},{"qty":1,"name":"Duress"}],"mainCount":60,"sideCount":15}},"right":{"text":"# UB Living Death (Premodern brew)\n\n**Plan:** On turns 1 and 2, use Careful Study, Frantic Search, Putrid Imp and Intuition to put big creatures into your graveyard. On turn 3 (sometimes turn 2), cast Living Death. Your fatties come back, and anything the opponent built gets sacrificed. After that, protect the board with discard and win in the air.\n\n**Main deck (60)**\n- 4 Living Death\n- 4 Dark Ritual\n- 2 Lotus Petal\n- 4 Careful Study\n- 4 Frantic Search\n- 2 Intuition\n- 4 Cabal Therapy\n- 3 Duress\n- 4 Putrid Imp\n- 2 Akroma, Angel of Wrath\n- 2 Phantom Nishoba\n- 2 Symbiotic Wurm\n- 2 Avatar of Woe\n- 1 Visara the Dreadful\n- 2 Bone Shredder\n- 4 Underground River\n- 4 Polluted Delta\n- 6 Swamp\n- 4 Island\n\n**Sideboard (15)**\n- 3 Unmask\n- 2 Tormod's Crypt\n- 2 Engineered Plague\n- 2 Smother\n- 2 Snuff Out\n- 2 Hydroblast\n- 2 Withered Wretch\n\n**Why these cards**\n- **Living Death (4):** Your graveyard should be full of 7–8 drops while the opponent's has much less. That makes it a one-sided sweeper and a mass reanimation at once.\n- **Filling the graveyard:**\n  - Careful Study and Frantic Search each draw two and discard two. Frantic Search also untaps up to three lands, so it costs almost nothing.\n  - Putrid Imp lets you discard a card at any time.\n  - Intuition puts three creatures in front of the opponent. Whichever one they give you, the other two go to your graveyard.\n- **Speed:** Dark Ritual (adds BBB) plus two lands casts Living Death on turn 3. Add a Lotus Petal and it can come on turn 2.\n- **What comes back:**\n  - Akroma: flying, haste, protection from black and red.\n  - Phantom Nishoba: gains you life when it deals damage.\n  - Symbiotic Wurm: leaves seven 1/1 tokens if it dies, including to your own second Living Death.\n  - Visara and Avatar of Woe: tap to destroy a creature. Avatar costs just BB once 10+ creature cards are in all graveyards, so you can also simply cast it.\n- **Bone Shredder (best fit with Living Death):** It returns at the same moment as the opponent's creatures, so its enter-the-battlefield ability can kill one of them. Skip the echo payment and it goes back to the graveyard, ready for the next Living Death.\n- **Cabal Therapy and Duress:** They clear counters and graveyard hate. Cabal Therapy's flashback sacrifices a creature, which also feeds your graveyard.\n\n**Mana**\n- 18 lands plus 2 Petals and 4 Rituals. Black is the main color with 16 sources; blue has 14.\n- check_deck pointed out that Reanimator lists run about 14 lands. I kept more on purpose: Reanimator mostly casts 1–2 mana spells, while Living Death costs 5.\n- It also warned about having almost no white or green sources. That's fine: Akroma, Nishoba and the Wurm are only ever discarded and brought back, never cast.\n\n**Sideboarding against the current meta**\n- **Stiflenought (14.9%):** Bring in Unmask, Snuff Out and Hydroblast. Living Death also handles Phyrexian Dreadnought: it comes back on their side and has to be sacrificed again unless they sacrifice 12 power of creatures.\n- **Sligh and Goblins:** Bring in Engineered Plague (naming Goblin), Smother and Hydroblast. Take out Intuition and a Duress.\n- **Hermit Druid Combo and Reanimator:** Careful here, because Living Death would return *their* whole graveyard too. Use Tormod's Crypt or Withered Wretch to exile their graveyard before you cast it, and bring in Unmask.\n- **Enchantress and Replenish:** Bring in Unmask. Discard is the only answer UB really has. Akroma flies, so she still attacks past Moat.\n\n**Label:** This is a brew. Living Death showed up in only 7 tournament lists in the last 90 days (0.3% share), mostly BG Survival, and there's no established UB Living Death list. I took the general structure of the Reanimator archetype (Putrid Imp, Careful Study, Ritual, discard, its choice of fatties) and built the deck around mass reanimation instead of Exhume and Reanimate.\n\n**Honest odds and limits:** By turn 3 on the play, you'll have a discard enabler 92.5% of the time and Living Death or Intuition 64% of the time. You'll have both only 58% of the time, so this is a turn 3–4 deck, not a reliable turn-2 kill. Opposing graveyard hate is a serious problem: tournament data shows Tormod's Crypt in a huge number of lists. I haven't playtested any matchups, so the sideboard plans are based on how the cards work, not on match results.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Living Death"},{"qty":4,"name":"Dark Ritual"},{"qty":4,"name":"Careful Study"},{"qty":4,"name":"Frantic Search"},{"qty":2,"name":"Intuition"},{"qty":4,"name":"Cabal Therapy"},{"qty":3,"name":"Duress"},{"qty":2,"name":"Lotus Petal"},{"qty":4,"name":"Putrid Imp"},{"qty":2,"name":"Akroma, Angel of Wrath"},{"qty":2,"name":"Phantom Nishoba"},{"qty":2,"name":"Symbiotic Wurm"},{"qty":2,"name":"Avatar of Woe"},{"qty":1,"name":"Visara the Dreadful"},{"qty":2,"name":"Bone Shredder"},{"qty":4,"name":"Underground River"},{"qty":4,"name":"Polluted Delta"},{"qty":6,"name":"Swamp"},{"qty":4,"name":"Island"}],"side":[{"qty":3,"name":"Unmask"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Engineered Plague"},{"qty":2,"name":"Smother"},{"qty":2,"name":"Snuff Out"},{"qty":2,"name":"Hydroblast"},{"qty":2,"name":"Withered Wretch"}],"mainCount":60,"sideCount":15}}},{"id":"55c6fba40f35","prompt":"expert-legacy-worldgorger","brew":true,"left":{"text":"I built a Rakdos Worldgorger Dragon combo deck and the submit tool accepted it as a brew. It borrows its mana and discard spells from the Reanimator deck in the current results (4% of the field).\n\n**How the combo works**\n1. Put Worldgorger Dragon in your graveyard with Faithless Looting, Buried Alive or Collective Brutality.\n2. Bring it back with Animate Dead, Necromancy or Dance of the Dead.\n3. The Dragon exiles all your other permanents, including the aura. When the aura leaves, the Dragon is sacrificed, and everything comes back. Your lands return untapped and the aura returns Dragon again.\n4. Tap your lands each time around for unlimited mana. Tap red lands for red.\n5. Stop the loop by pointing the aura at Inferno of the Star Mounts instead. Spend {R} over and over until its power reaches 20, and it deals 20 damage to the opponent.\n\nBuried Alive gets Dragon, Inferno and Griselbrand in one card. Another way to finish is to stop the loop on Griselbrand with mana still floating, draw 14, then cast Inferno from your hand. Inferno can't be countered and has haste. Dark Ritual and Lotus Petal make a turn-1 or turn-2 win possible. Thoughtseize, Unmask and Brutality strip counterspells first.\n\n**Directions I considered**\n1. **Rakdos, using the Reanimator package (chosen).**\n2. Grixis tempo with Brainstorm, Force of Will, Careful Study and Intuition.\n3. Black-red with an Impact Tremors or Scourge of Valkas piece already in play, which deals damage each time Dragon enters.\n\nI chose the Reanimator package because its main cards (Animate Dead, Looting, Ritual, Petal, discard) are the same ones this combo needs, so you get proven speed and disruption without diluting the combo.\n\n**Things to know**\n- **Entomb and Bazaar of Baghdad are banned in Legacy.** That's why Buried Alive and Looting do the job here.\n- **Reanimate, Exhume and Stronghold Gambit don't start the loop.** Without an aura, Dragon just stays and exiles your lands. Use the single Reanimate only on Griselbrand or Inferno.\n- **Always have a way out before you start.** The loop can't stop on its own. Unless another creature card (Inferno, Griselbrand or an opponent's creature) is in a graveyard for the aura to target, the loop goes on forever and the game is a draw.\n- **Draw odds:** on the play, by turn 2 you have about a 79% chance of a discard enabler, 79% of a looping aura, and 61% of both.\n- **Land count:** the deck has 15 lands. check_deck's general formula suggests about 20, but real Reanimator lists average 14.6 because Petal and Ritual cover the gap. 14 sources make red, so the loop usually produces red mana.\n\nThe sideboard has Pyroblast for the blue Force of Will decks, Abrade and Kolaghan's Command against artifact graveyard hate, and Massacre and Snuff Out against Ocelot Aggro.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Worldgorger Dragon"},{"qty":2,"name":"Inferno of the Star Mounts"},{"qty":2,"name":"Griselbrand"},{"qty":4,"name":"Animate Dead"},{"qty":4,"name":"Necromancy"},{"qty":2,"name":"Dance of the Dead"},{"qty":1,"name":"Reanimate"},{"qty":4,"name":"Faithless Looting"},{"qty":4,"name":"Buried Alive"},{"qty":2,"name":"Collective Brutality"},{"qty":4,"name":"Dark Ritual"},{"qty":4,"name":"Lotus Petal"},{"qty":4,"name":"Thoughtseize"},{"qty":4,"name":"Unmask"},{"qty":4,"name":"Badlands"},{"qty":2,"name":"Raucous Theater"},{"qty":3,"name":"Bloodstained Mire"},{"qty":2,"name":"Polluted Delta"},{"qty":2,"name":"Verdant Catacombs"},{"qty":1,"name":"Swamp"},{"qty":1,"name":"Mountain"}],"side":[{"qty":3,"name":"Pyroblast"},{"qty":2,"name":"Abrade"},{"qty":2,"name":"Kolaghan's Command"},{"qty":2,"name":"Duress"},{"qty":2,"name":"Cabal Therapy"},{"qty":2,"name":"Massacre"},{"qty":2,"name":"Snuff Out"}],"mainCount":60,"sideCount":15}},"right":{"text":"I've built and submitted a **Rakdos Worldgorger Dragon combo** brew for Legacy. I couldn't find any recent tournament lists for it: Worldgorger Dragon and Necromancy both show 0 lists in the last 90 days. So this is new, but I borrowed the mana and disruption from the current Reanimator deck.\n\n## The plan\nGet Worldgorger Dragon into your graveyard, then bring it back with Animate Dead, Necromancy or Dance of the Dead. That starts a loop:\n1. The Dragon enters and exiles everything else you control, including the aura on it.\n2. The aura leaving makes you sacrifice the Dragon.\n3. The Dragon leaving returns everything it exiled. Your lands come back untapped, and the aura comes back needing a creature in a graveyard to enchant, so you pick the Dragon again.\n\nYou tap your lands each time around, so you build up as much mana as you want. The whole loop happens in one step, so the mana stays in your pool. To stop, have the aura enchant a different creature in a graveyard:\n- **Ambassador Laquatus** (main win): it has \"{3}: Target player mills three cards,\" so you spend the extra mana to mill your opponent's whole library.\n- **Griselbrand** (backup): stop on it with lots of mana floating, pay 7 life to draw 7 cards, and keep going.\n\n## Key cards\n- **Only aura reanimation (11 total):** 4 Animate Dead, 4 Necromancy, 3 Dance of the Dead. Reanimate and Exhume don't start the loop because they aren't auras. Necromancy can be cast at instant speed. That means it gets sacrificed at cleanup, but you win during the loop before then.\n- **Getting the Dragon into the graveyard:** The card search shows **Entomb is banned**, so this uses 4 Faithless Looting, 3 Buried Alive and 3 Putrid Imp.\n  - Buried Alive alone sets everything up: Dragon, Laquatus and Griselbrand in one go.\n  - Putrid Imp lets you discard at instant speed, and if it dies it's another creature you can stop the loop on.\n- **Speed and protection:** 4 Dark Ritual and 4 Lotus Petal for speed, and 4 Thoughtseize, 3 Cabal Therapy and 3 Unmask to clear the way. Unmask can be cast free by exiling one of the many black cards.\n- **Odds (no mulligans, 8 cards seen on the play):** 79% to have a way to bin the Dragon by turn 2, 82% to have an aura, and 64% to have both.\n\n## Mana\n- 15 lands, close to Reanimator's average of 14.6: 4 Badlands, 4 Bloodstained Mire, 2 Polluted Delta, 1 Verdant Catacombs, 3 Swamp, 1 Mountain.\n- I left out lands that enter tapped (Undercity Sewers, Raucous Theater). They would come back tapped every time around the loop and give no mana.\n- The deck checker warns that there's too little blue for Laquatus. You can ignore that: Laquatus is never cast, only brought back from the graveyard, and its ability costs colorless mana.\n\n## Rules to watch\n- **The loop can end in a draw.** If no other creature card is in any graveyard when you start, the loop can't stop and the game is a draw. Always have Laquatus, Griselbrand or Putrid Imp in a graveyard first. A creature in your opponent's graveyard also works.\n- **Mill can fail.** If your opponent has a card that shuffles their graveyard back into their library, stop on Griselbrand instead.\n\n## Sideboard (based on the current meta)\n- **Dimir Tempo (10.2%), Izzet Tempo:** add Pyroblast and Duress against counterspells; Fatal Push for their creatures.\n- **Ocelot Aggro, Death and Taxes:** add Abrade, Fatal Push, Collective Brutality, and Massacre. Massacre is only free if the opponent controls a Plains.\n- **Doomsday, OmniTell, Sneak and Show:** add Duress and Pyroblast; Surgical Extraction for key cards.\n- **Reanimator mirror, Hogaak:** add Surgical Extraction.\n- **Graveyard hate:** Abrade destroys artifact-based hate.\n- **What comes out:** Cabal Therapy and Unmask, plus one Dance of the Dead.\n\n## Couldn't verify\n- Exactly which hate cards and creatures the top decks run. The sideboard roles above are based on the deck names, not their actual lists.\n- Whether the decks you'll face run cards that shuffle the graveyard back (which stops the mill win).","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Worldgorger Dragon"},{"qty":1,"name":"Ambassador Laquatus"},{"qty":1,"name":"Griselbrand"},{"qty":3,"name":"Putrid Imp"},{"qty":4,"name":"Animate Dead"},{"qty":4,"name":"Necromancy"},{"qty":3,"name":"Dance of the Dead"},{"qty":4,"name":"Faithless Looting"},{"qty":3,"name":"Buried Alive"},{"qty":4,"name":"Dark Ritual"},{"qty":4,"name":"Lotus Petal"},{"qty":4,"name":"Thoughtseize"},{"qty":3,"name":"Cabal Therapy"},{"qty":3,"name":"Unmask"},{"qty":4,"name":"Badlands"},{"qty":4,"name":"Bloodstained Mire"},{"qty":2,"name":"Polluted Delta"},{"qty":1,"name":"Verdant Catacombs"},{"qty":3,"name":"Swamp"},{"qty":1,"name":"Mountain"}],"side":[{"qty":3,"name":"Pyroblast"},{"qty":2,"name":"Abrade"},{"qty":2,"name":"Collective Brutality"},{"qty":2,"name":"Fatal Push"},{"qty":2,"name":"Duress"},{"qty":2,"name":"Surgical Extraction"},{"qty":2,"name":"Massacre"}],"mainCount":60,"sideCount":15}}},{"id":"5b734107653c","prompt":"expert-legacy-pyromancer-ascension","brew":true,"left":{"text":"I built an Izzet Ascension brew around Pyromancer Ascension. Ascension appears in **0 recent Legacy results**, so there's no proven list to copy, and this deck is untested. The mana and counterspells come from Izzet Tempo, which has 195 lists in the last 90 days.\n\n**Directions I considered:**\n1. **Izzet cantrip deck:** use Izzet Tempo's Brainstorm, Ponder, Bolt, Force of Will and Daze, and give up most of its creatures to make room for Ascension.\n2. **Mono-red burn:** Ascension copying Lightning Bolt and Chain Lightning, plus more burn.\n3. **Grixis rituals:** a Dark Ritual-style storm build.\n\n**Why I picked the first:** Legacy's best cheap spells come in 4-copy sets of cheap instants and sorceries, which is exactly what Ascension needs. Force of Will and Daze also protect the 2-mana enchantment, which burn and storm can't do.\n\n**How it plays:** Ascension gets a counter each time you cast an instant or sorcery that shares a name with a card in your graveyard. Once it has two counters, it copies every instant and sorcery you cast. This deck has 22 cards that can do that:\n- 4 Brainstorm, 4 Ponder, 4 Preordain, 3 Consider\n- 3 Flow State\n- 4 Lightning Bolt, 2 Chain Lightning\n\nOnce Ascension is active, every card-draw spell digs twice as deep and every Bolt deals 6.\n\n**The rest of the deck:**\n- **Backup threats:** Dragon's Rage Channeler and Murktide Regent use the same full graveyard, so the deck still has something to win with when Ascension gets answered.\n- **Mystic Sanctuary:** it can put a used spell back on top of your library to restart the engine.\n\n**Odds:** On the play, you'll have Ascension in hand by turn 3 about 49% of the time without counting cantrips. With 15 cantrips digging for it, the real chance is higher. You'll almost always have something Ascension can copy (98.6%).\n\n**Mana:** 18 lands, one fewer than Izzet Tempo's average of 18.9. With 26 one-drops and an average spell cost of 1.9, that should be enough. The deck check passed with no warnings.\n\n**Sideboard:** It's aimed at the top decks in the field:\n- Pyroblast and Red Elemental Blast against Dimir Tempo\n- Pyroclasm against Ocelot Aggro\n- Price of Progress and Meltdown against Tron and Eldrazi\n- Surgical Extraction and Grafdigger's Cage against Reanimator\n- Force of Negation and Consign to Memory against the combo decks","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Pyromancer Ascension"},{"qty":4,"name":"Brainstorm"},{"qty":4,"name":"Ponder"},{"qty":4,"name":"Preordain"},{"qty":3,"name":"Consider"},{"qty":4,"name":"Lightning Bolt"},{"qty":2,"name":"Chain Lightning"},{"qty":1,"name":"Unholy Heat"},{"qty":3,"name":"Flow State"},{"qty":4,"name":"Force of Will"},{"qty":3,"name":"Daze"},{"qty":4,"name":"Dragon's Rage Channeler"},{"qty":2,"name":"Murktide Regent"},{"qty":4,"name":"Volcanic Island"},{"qty":1,"name":"Thundering Falls"},{"qty":1,"name":"Mystic Sanctuary"},{"qty":1,"name":"Island"},{"qty":1,"name":"Mountain"},{"qty":3,"name":"Scalding Tarn"},{"qty":2,"name":"Polluted Delta"},{"qty":2,"name":"Flooded Strand"},{"qty":1,"name":"Misty Rainforest"},{"qty":2,"name":"Wasteland"}],"side":[{"qty":2,"name":"Pyroblast"},{"qty":1,"name":"Red Elemental Blast"},{"qty":1,"name":"Hydroblast"},{"qty":2,"name":"Force of Negation"},{"qty":2,"name":"Surgical Extraction"},{"qty":1,"name":"Grafdigger's Cage"},{"qty":2,"name":"Pyroclasm"},{"qty":2,"name":"Price of Progress"},{"qty":1,"name":"Meltdown"},{"qty":1,"name":"Consign to Memory"}],"mainCount":60,"sideCount":15}},"right":{"text":"Here's an Izzet Pyromancer Ascension deck for Legacy. It's a brew: Ascension shows up in 0 recent tournament lists, so there's no proven version to copy.\n\n**Deck (60)**\n- **Engine:** 4 Pyromancer Ascension\n- **Cantrips:** 4 Brainstorm, 4 Ponder, 4 Preordain, 1 Flow State\n- **Burn:** 4 Lightning Bolt, 4 Chain Lightning, 2 Fireblast\n- **Counters:** 4 Force of Will, 3 Daze\n- **Creatures:** 4 Dragon's Rage Channeler, 4 Third Path Iconoclast\n- **Lands (18):** 4 Volcanic Island, 1 Steam Vents, 1 Island, 1 Mountain, 4 Scalding Tarn, 2 Polluted Delta, 2 Bloodstained Mire, 1 Flooded Strand, 2 Wasteland\n\n**Sideboard (15):** 3 Pyroblast, 1 Hydroblast, 2 Consign to Memory, 2 Force of Negation, 2 Surgical Extraction, 2 Price of Progress, 1 Meltdown, 2 Unholy Heat\n\n**The plan**\nPlay a fast Izzet tempo game, with four copies of nearly every spell so Ascension charges quickly. Ascension gets a counter each time you cast a spell that shares a name with a card in your graveyard. Once it has two counters, it copies every instant and sorcery you cast. At that point each Brainstorm is two, each Bolt deals 6 damage and each Fireblast deals 8. Force of Will and Daze protect it, and the creatures pressure the opponent while you set up.\n\n**Why these cards**\n- **Twelve one-mana cantrips (plus 1 Flow State):** They put copies of the same names in your graveyard fast, which charges Ascension. They also dig for Ascension itself. With no digging you see it naturally by turn 3 only 48.8% of the time, and 88.7% of the time you see at least one cantrip by then. Once Ascension is charged, copied cantrips are a card-draw engine.\n- **Bolt, Chain Lightning and Fireblast:** Copied burn is how you win. Fireblast costs no mana if you sacrifice two Mountains. Volcanic Island, Steam Vents and the basic count, giving you 6 Mountains. Two copied Fireblasts deal 16 damage at no mana cost.\n- **Watch out:** Chain Lightning lets the player or the controller of the creature it hit pay {R}{R} to copy it back at you. Don't aim it at red decks with open mana.\n- **Third Path Iconoclast:** It makes a 1/1 token for every noncreature spell you cast, including Ascension itself and its copied spells. That's how you pressure opponents with combo decks or counterspells.\n- **Dragon's Rage Channeler:** Its surveil puts spells in the graveyard, which helps charge Ascension. It also becomes a 3/3 flier once you have delirium (four card types in your graveyard).\n- **Force of Will and Daze:** Free counters protect a two-mana enchantment in a format full of fast combo decks. There are 24 blue cards for Force to exile.\n\n**Mana**\nI borrowed the mana base from Izzet Tempo, but trimmed to 18 lands (their average is 18.87). I cut Wasteland to 2 because the deck needs colored mana to cast several spells a turn. check_deck flagged no issues against Izzet Tempo, but counted 13 blue sources against their average of 14.8. That's because the tool doesn't count fetches the way you'd use them: every fetch can find Volcanic Island or Steam Vents, so you have 16 lands that can make blue. Its generic recommendation of 20 lands assumes a normal curve. This one has 24 one-drops and 12 cantrips, so 18 is enough.\n\n**Sideboarding against the current field**\n- **Dimir Tempo (10.2%), Izzet Tempo, Doomsday, OmniTell, Sneak and Show:** Bring in Pyroblast and Force of Negation. Take out Chain Lightning against Doomsday and the Show decks, and Fireblast against the tempo decks. Bring in Hydroblast against Izzet.\n- **Ocelot Aggro (9.0%):** Bring in Unholy Heat and Hydroblast. Cut Daze.\n- **Tron (7.1%), Eldrazi Aggro (6.1%), Lands (5.1%):** Bring in Price of Progress and Consign to Memory. Against Eldrazi, Unholy Heat and Meltdown also come in. Cut Daze and the extra cantrips.\n- **Reanimator, Hogaak, Sewer Combo:** Bring in Surgical Extraction, paying 2 life instead of {B}. Add Consign to Memory against triggered abilities.\n\n**What I couldn't verify**\n- How this performs: there's no tournament data on Ascension decks at all. The odds above are the only hard numbers.\n- Lower-risk swap: if Ascension feels too slow, swap the Iconoclasts for Cori-Steel Cutter. It's proven in Izzet Tempo (177 lists in the last 90 days) and also rewards casting two spells a turn.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Pyromancer Ascension"},{"qty":4,"name":"Brainstorm"},{"qty":4,"name":"Ponder"},{"qty":4,"name":"Preordain"},{"qty":4,"name":"Lightning Bolt"},{"qty":4,"name":"Chain Lightning"},{"qty":4,"name":"Force of Will"},{"qty":3,"name":"Daze"},{"qty":2,"name":"Fireblast"},{"qty":4,"name":"Dragon's Rage Channeler"},{"qty":4,"name":"Third Path Iconoclast"},{"qty":1,"name":"Flow State"},{"qty":4,"name":"Volcanic Island"},{"qty":1,"name":"Steam Vents"},{"qty":1,"name":"Island"},{"qty":1,"name":"Mountain"},{"qty":4,"name":"Scalding Tarn"},{"qty":2,"name":"Polluted Delta"},{"qty":2,"name":"Bloodstained Mire"},{"qty":1,"name":"Flooded Strand"},{"qty":2,"name":"Wasteland"}],"side":[{"qty":3,"name":"Pyroblast"},{"qty":1,"name":"Hydroblast"},{"qty":2,"name":"Consign to Memory"},{"qty":2,"name":"Force of Negation"},{"qty":2,"name":"Surgical Extraction"},{"qty":2,"name":"Price of Progress"},{"qty":1,"name":"Meltdown"},{"qty":2,"name":"Unholy Heat"}],"mainCount":60,"sideCount":15}}},{"id":"6687b86b32c3","prompt":"expert-premodern-miraris-wake","brew":true,"left":{"text":"I built **Wake Enchantress**, a brew. Mirari's Wake shows up in 0 lists from the last 90 days, so nothing proven exists to copy.\n\n**The plan:** Set up the Enchantress engine first: Argothian Enchantress, Enchantress's Presence and cheap enchantments that draw cards. Then land Mirari's Wake. Its text: \"Creatures you control get +1/+1. Whenever you tap a land for mana, add one mana of any type that land produced.\" Once it's out, you have more mana than you can spend, and you pour it into token makers that the Wake also pumps.\n\n**Why the key cards**\n- **3 Mirari's Wake + 3 Sterling Grove.** Grove can sacrifice itself to put an enchantment on top of your library, so it works as Wake #4–6. You have a 72.1% chance to see Wake or Grove by turn 5 on the play. The Wake is an enchantment, so it also draws you a card off your Enchantress or Presence.\n- **Serra's Sanctum.** It taps for W per enchantment you control, so it fuels the white token makers. One correction to a common assumption: the Wake adds just *one* extra mana per land tapped. It doesn't double Sanctum's output. Its real value is about +1 mana from every land, which is why the deck runs **3 Exploration** to get more lands down.\n- **Where the mana goes:**\n  - **Sacred Mesa** ({1}{W}: a 1/1 flier, 2/2 with the Wake)\n  - **Mobilization** ({2}{W}: a Soldier, and Soldiers get vigilance)\n  - **Decree of Justice**: X 4/4 flying Angels (5/5s with the Wake), or cycle it at instant speed for 1/1 Soldiers that Mobilization gives vigilance\n- **Opalescence.** It turns your other non-Aura enchantments into creatures with power and toughness equal to their mana value. With the Wake out, every enchantment you control also gets +1/+1, and the Wake itself becomes a 6/6.\n- **Interaction from the proven Enchantress shell:** Swords to Plowshares, Parallax Wave and Seal of Cleansing. There's also 1 Solitary Confinement, which prevents all damage to you, as an emergency stop against Sligh and Goblins.\n\n**The mana:** 22 lands, 16 green sources and 14 white, plus 4 Wild Growth. This copies the Enchantress archetype (about 22 lands, 15.7 G / 14.3 W in real lists). check_deck came back with no warnings.\n\n**Sideboarding against the current field**\n- **Sligh / Goblins (about 14% of the field combined):** +2 Warmth, +1 Swords, plus Crypt against Goblins' graveyard tricks. Take out Mobilization and the Decrees.\n- **Terrageddon:** +2 Sacred Ground (it returns lands that opponents' spells destroy), +1 Karmic Justice. Take out Solitary Confinement and 1 Opalescence.\n- **Enchantress mirror / Replenish:** +2 Aura of Silence, +3 Tormod's Crypt against Replenish. Take out Solitary and a Swords or two.\n- **Stiflenought / UB Psychatog / Hermit Druid:** +3 Xantid Swarm (when it attacks, they can't cast spells that turn), +1 Tsabo's Web, and Crypts against the graveyard decks. Take out Solitary and the extra creature removal.\n\n**Things I couldn't verify:**\n- Whether the Wake also adds extra mana when a land with Wild Growth is tapped. The tools don't show rulings, so I've assumed it doesn't count.\n- This deck has no tournament results at all.\n\nIt shares a lot with stock Enchantress (the engine, removal and mana). What's different: it drops Replenish and the Confinement lock and uses Wake-fueled tokens and Opalescence beatdown as the win condition instead. The 5-mana Wake is slower than stock's lock, so expect to rely on Parallax Wave and Swords to buy time.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Argothian Enchantress"},{"qty":4,"name":"Enchantress's Presence"},{"qty":4,"name":"Wild Growth"},{"qty":3,"name":"Exploration"},{"qty":3,"name":"Sterling Grove"},{"qty":3,"name":"Mirari's Wake"},{"qty":3,"name":"Seal of Cleansing"},{"qty":3,"name":"Parallax Wave"},{"qty":3,"name":"Swords to Plowshares"},{"qty":1,"name":"Solitary Confinement"},{"qty":2,"name":"Sacred Mesa"},{"qty":1,"name":"Mobilization"},{"qty":2,"name":"Decree of Justice"},{"qty":2,"name":"Opalescence"},{"qty":4,"name":"Serra's Sanctum"},{"qty":4,"name":"Brushland"},{"qty":4,"name":"Windswept Heath"},{"qty":2,"name":"Wooded Foothills"},{"qty":6,"name":"Forest"},{"qty":2,"name":"Plains"}],"side":[{"qty":3,"name":"Tormod's Crypt"},{"qty":3,"name":"Xantid Swarm"},{"qty":2,"name":"Aura of Silence"},{"qty":2,"name":"Warmth"},{"qty":2,"name":"Sacred Ground"},{"qty":1,"name":"Swords to Plowshares"},{"qty":1,"name":"Karmic Justice"},{"qty":1,"name":"Tsabo's Web"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built a Mirari's Wake Enchantress deck. It's a brew: Wake has 0 lists in the last 90 days of Premodern results, so there's no proven version to copy.\n\n**Directions I sketched:**\n1. **GW tokens/creatures** (Call of the Herd, Decree of Justice). Here Wake is mostly a 5-mana +1/+1 for your creatures, which is slow for an aggro deck.\n2. **GW ramp into X-spells.** Wake doubles your mana for big Decree of Justice casts. It needs too many expensive cards that do nothing early to get there.\n3. **The Enchantress package from the menu (chosen).** Wake is an enchantment, so every copy draws cards off Argothian Enchantress and Enchantress's Presence. Sterling Grove can find it and protect it, Replenish brings it back, and Opalescence makes it a 6/6 (it's a 5/5 that gets its own +1/+1).\n\nI picked the third because it's the only direction where every part of Wake does something: the extra mana, the +1/+1, and being an enchantment.\n\n**The plan:** Wake says \"whenever you tap a land for mana, add one mana of any type that land produced.\" With Serra's Sanctum, that turns six enchantments into 12 white mana. That mana goes into Sacred Mesa: 1W makes a 1/1 flying Pegasus, which Wake turns into a 2/2. It also makes your Opalescence enchantments bigger as creatures. Until then you play like normal Enchantress: draw cards with the engine and stay safe with Parallax Wave, Solitary Confinement and Swords to Plowshares.\n\n**Changes from the stock list (a 5-0 league list):**\n- Added 3 Mirari's Wake and 1 Sacred Mesa.\n- Moved both Aura of Silence to the sideboard and cut one Seal of Cleansing and one Replenish.\n- Kept both Solitary Confinements because Sligh is 10% of the field.\n\n**Mana and odds:** I kept the stock mana as is: 22 lands, 14 white and 16 green sources. The deck check passed with no warnings and matches real Enchantress lists. You'll have a Wake or a Sterling Grove by turn 5 about 72% of the time. That number ignores the cards your Enchantress engine draws, so it's the lowest it should be.\n\n**Sideboard:** I used the standard Enchantress sideboard, aimed at the current field:\n- 3 Tormod's Crypt for graveyard decks\n- 3 Xantid Swarm against counterspells\n- Warmth and Sacred Ground against burn and land destruction","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Argothian Enchantress"},{"qty":4,"name":"Enchantress's Presence"},{"qty":4,"name":"Mirri's Guile"},{"qty":4,"name":"Wild Growth"},{"qty":3,"name":"Sterling Grove"},{"qty":3,"name":"Mirari's Wake"},{"qty":3,"name":"Opalescence"},{"qty":3,"name":"Parallax Wave"},{"qty":2,"name":"Seal of Cleansing"},{"qty":2,"name":"Solitary Confinement"},{"qty":1,"name":"Sacred Mesa"},{"qty":3,"name":"Swords to Plowshares"},{"qty":2,"name":"Replenish"},{"qty":4,"name":"Brushland"},{"qty":6,"name":"Forest"},{"qty":2,"name":"Plains"},{"qty":4,"name":"Serra's Sanctum"},{"qty":4,"name":"Windswept Heath"},{"qty":2,"name":"Wooded Foothills"}],"side":[{"qty":3,"name":"Tormod's Crypt"},{"qty":3,"name":"Xantid Swarm"},{"qty":2,"name":"Aura of Silence"},{"qty":2,"name":"Warmth"},{"qty":1,"name":"Sacred Ground"},{"qty":1,"name":"Gaea's Blessing"},{"qty":1,"name":"Karmic Justice"},{"qty":1,"name":"Swords to Plowshares"},{"qty":1,"name":"Choke"}],"mainCount":60,"sideCount":15}}},{"id":"727499f4d80c","prompt":"expert-legacy-living-end","brew":true,"left":{"text":"I built this as **Sultai \"Cycle-Animator\"**. It's a brew, not a known deck. All three of your cards can discard themselves at instant speed, so they fill your own graveyard. Reanimation spells then bring the big ones back on turns 2–3.\n\n**The plan**\n- Discard Waker of Waves or Colossal Skyturtle, or cast Careful Study.\n- Then use Reanimate, Animate Dead or Exhume to put a 7/7 or a 6/5 flyer with ward 2 onto the battlefield.\n- Force of Will and Thoughtseize protect the combo, and Brainstorm and Ponder find the pieces.\n\n**Why the key cards**\n- **Waker of Waves (4):** The main thing to bring back. It's a 7/7 that gives your opponent's creatures -1/-0. Its {1}{U} discard ability puts it in the graveyard and also digs two cards deep. One goes to your hand, and the other goes to the graveyard, which might be another target.\n- **Colossal Skyturtle (3):** A 6/5 flyer with ward 2 when you bring it back. While it's in your hand, it does two other jobs:\n  - For {1}{U}, it bounces a creature, so it's also your removal.\n  - For {2}{G}, it returns any card from your graveyard to your hand, like a used Reanimate or Force of Will.\n- **Curator of Mysteries (4):** A 4/4 flyer you can actually cast for 4. It also cycles for {U}, and it scries 1 each time you cycle or discard another card. That happens a lot in this deck.\n- **Careful Study and Lotus Petal:** These replace Entomb, which the tools show is **banned in Legacy**. With Lotus Petal you can play Careful Study and Reanimate on turn 1.\n- **Odds:** With 10 reanimation spells and 11 discard enablers, you have both by turn 3 about 71% of the time on the play and 76% on the draw. The deck runs 11 reanimation spells, so the real numbers are a bit higher. Brainstorm and Ponder push them up further.\n\n**Mana**\n- 17 lands plus 3 Lotus Petal, with 17 blue sources and 14 black. The Reanimator deck I borrowed the mana from runs about 15 lands. I added two because the discard abilities and Skyturtle's bounce use mana every turn.\n- Green is a light splash: 9 sources counting fetches, through 1 Tropical Island and 1 Bayou. You only need it for Skyturtle's {2}{G} graveyard ability or the rare time you cast it for full price.\n- 26 blue cards make sure Force of Will usually has a card to exile.\n\n**Sideboarding against the current meta**\n- **Dimir Tempo and Izzet Tempo (the top two decks, 19% combined):** Bring in 2 Orcish Bowmasters, 2 Fatal Push and 1 Toxic Deluge. Take out Thoughtseize and 1 Exhume. Their graveyard hate (Surgical Extraction, Grafdigger's Cage) is common, so bring in 3 Show and Tell to cast Waker from your hand instead. Use 2 Consign to Memory on Cage.\n- **Sneak and Show, Doomsday, Oops All Spells, Epic Storm:** Bring in 2 Force of Negation and 2 Duress. Surgical Extraction is mainly for Doomsday. Take out Curators and 1 Exhume.\n- **Eldrazi Aggro, Affinity, Ocelot Aggro:** Bring in Consign to Memory (it counters colorless spells), plus Push, Bowmasters and Deluge. Take out Thoughtseize.\n\n**Unverified or risky**\n- Nobody has played this deck in recent results. Curator and Waker have 0 recorded lists, and Skyturtle has one Rogue list.\n- Exhume gives your opponent a creature too, so check their graveyard before you cast it.\n- These creatures are weaker targets than Atraxa or Griselbrand, the standard Reanimator creatures. You're trading raw power for the fact that your cards discard themselves, plus Skyturtle's extra uses.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Waker of Waves"},{"qty":3,"name":"Colossal Skyturtle"},{"qty":4,"name":"Curator of Mysteries"},{"qty":4,"name":"Reanimate"},{"qty":4,"name":"Animate Dead"},{"qty":3,"name":"Exhume"},{"qty":4,"name":"Careful Study"},{"qty":3,"name":"Lotus Petal"},{"qty":4,"name":"Brainstorm"},{"qty":3,"name":"Ponder"},{"qty":4,"name":"Force of Will"},{"qty":3,"name":"Thoughtseize"},{"qty":3,"name":"Underground Sea"},{"qty":1,"name":"Tropical Island"},{"qty":1,"name":"Bayou"},{"qty":1,"name":"Undercity Sewers"},{"qty":4,"name":"Polluted Delta"},{"qty":3,"name":"Misty Rainforest"},{"qty":1,"name":"Verdant Catacombs"},{"qty":2,"name":"Island"},{"qty":1,"name":"Swamp"}],"side":[{"qty":2,"name":"Force of Negation"},{"qty":2,"name":"Consign to Memory"},{"qty":3,"name":"Show and Tell"},{"qty":2,"name":"Fatal Push"},{"qty":2,"name":"Orcish Bowmasters"},{"qty":2,"name":"Duress"},{"qty":1,"name":"Toxic Deluge"},{"qty":1,"name":"Surgical Extraction"}],"mainCount":60,"sideCount":15}},"right":{"text":"This is a Dimir reanimator brew. Both 7-drops can discard themselves for value, so they act as their own way of getting into the graveyard. Discard Waker of Waves ({1}{U}: look at the top two cards, keep one) or use Colossal Skyturtle's blue channel ({1}{U}: bounce a creature). Either way you get a real effect and a 7-power body in the graveyard on turn 1–2. Then Reanimate, Animate Dead or Exhume brings it back as a 7/7 that gives the opponent's creatures -1/-0, or a 6/5 flyer with ward 2. Curator of Mysteries (cycling {U}) is the creature you can actually cast. It scries every time you discard, and Careful Study triggers it twice.\n\n**Three directions I considered:**\n1. **Dimir reanimator (chosen):** uses the reanimation spells, Thoughtseize, Lotus Petal and the mana base from the menu's Reanimator deck.\n2. **Blue-green value deck:** casts Skyturtle and uses its green channel ({2}{G}) to get back any card from the graveyard.\n3. **Dimir tempo deck:** Curator as the main threat and the 7-drops as late-game cards you discard for value.\n\nI chose the first because the 7-drops can't really be cast for 7 in Legacy. Their discard abilities do the graveyard setup for free, so reanimation is the only plan that puts all three cards to full use.\n\n**Things to know:**\n- **No Entomb.** The card tool lists it as banned in Legacy, so it's left out. Four Careful Study and the creatures' own discard abilities fill that role.\n- **Draw odds:** with no help from Brainstorm or Ponder, you see at least one way to discard a creature by turn 3 on the play 88.7% of the time. You see a reanimation spell 83.1% of the time, and both together 72.8%. The cantrips push that higher.\n- **Green left out.** I dropped green, which turns off Skyturtle's channel that returns a card from the graveyard. That keeps the mana clean. Skyturtle's blue bounce channel still gets it into the graveyard.\n- **Mana:** 16 lands is about one more than the average Reanimator list (15.1). The deck has 16 blue and 15 black sources, and check_deck found no problems.\n- **Sideboard:**\n  - Show and Tell is a backup way to get the fatties into play when the opponent has graveyard hate.\n  - Bowmasters, Fatal Push and Toxic Deluge are for the tempo and aggro decks.\n  - Force of Negation, Duress and Surgical Extraction are for combo.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Waker of Waves"},{"qty":4,"name":"Colossal Skyturtle"},{"qty":3,"name":"Curator of Mysteries"},{"qty":4,"name":"Reanimate"},{"qty":4,"name":"Animate Dead"},{"qty":2,"name":"Exhume"},{"qty":4,"name":"Careful Study"},{"qty":4,"name":"Brainstorm"},{"qty":4,"name":"Ponder"},{"qty":4,"name":"Force of Will"},{"qty":4,"name":"Thoughtseize"},{"qty":3,"name":"Lotus Petal"},{"qty":4,"name":"Polluted Delta"},{"qty":2,"name":"Flooded Strand"},{"qty":2,"name":"Bloodstained Mire"},{"qty":3,"name":"Underground Sea"},{"qty":1,"name":"Watery Grave"},{"qty":1,"name":"Undercity Sewers"},{"qty":2,"name":"Island"},{"qty":1,"name":"Swamp"}
