],"side":[{"qty":3,"name":"Show and Tell"},{"qty":2,"name":"Force of Negation"},{"qty":2,"name":"Fatal Push"},{"qty":2,"name":"Orcish Bowmasters"},{"qty":2,"name":"Duress"},{"qty":2,"name":"Surgical Extraction"},{"qty":2,"name":"Toxic Deluge"}],"mainCount":60,"sideCount":15}}},{"id":"89d1fbd05400","prompt":"expert-premodern-winter-orb","brew":true,"left":{"text":"I built **\"Orbnought\"**: Winter Orb on top of the Dreadnought + Stifle package from the menu, with Cloud of Faeries and Spiketail Hatchling as backup threats. It's a brew, and the deck checker passed it with no errors.\n\n**The plan:** Play Winter Orb early (4 copies), so each player can untap only one land per turn. Your own spells mostly don't need untapped lands:\n- **Free spells:** Daze, Foil, Gush and Misdirection can all be cast without paying mana.\n- **One-mana plays:** Stifle, Opt, Portent and Chain of Vapor.\n- **Dreadnought:** costs 1 and is a 12/12, but it's sacrificed when it enters unless you counter that with Stifle.\n- **Cloud of Faeries:** untaps two lands when it enters, so it's close to free under the Orb.\n\nWhile your opponent is stuck on one mana, you win with flyers or a 12/12 Dreadnought, and the counters stop whatever they can afford to cast.\n\n**The three directions I considered:**\n1. **Merfolk Orb.** This is where Winter Orb shows up most in recent results, but only 6 lists. Building it would just be rebuilding an existing deck.\n2. **A faerie/artifact flyer deck.** Too weak on its own.\n3. **The Stiflenought package from the menu plus Winter Orb (chosen).** Its free counters and 1-mana threat are exactly the cards Winter Orb doesn't hurt, and it's the strongest base of the three. Stiflenought lists don't play Orb or Wasteland, so this is a new deck, not a copy.\n\n**Mana:** 17 lands, matching Stiflenought's average of about 17.1. The checker suggested about 21 lands, but that count treats Gush and Foil as 5- and 4-mana spells, and you'll almost always cast them free. I cut to 2 Wastelands so you still have 15 Islands for Daze, Foil, Gush and Counterspell. That's still fewer Islands than Stiflenought's 17 blue sources, which is the price of running Wasteland.\n\n**Honest odds** (from the draw-odds tool, not counting mulligans or Opt and Portent digging):\n- **Winter Orb by turn 3:** about 49%.\n- **Dreadnought plus Stifle together by turn 4:** about 26.5%. That's why there are 7 other flyers, so the deck isn't just a combo.\n\n**Sideboard** (aimed at the current top decks):\n- Annul, Tsabo's Web and Back to Basics for Enchantress and Replenish.\n- Hydroblast, Blue Elemental Blast and Powder Keg for Sligh and Goblins.\n- Tormod's Crypt for Hermit Druid and Replenish.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Winter Orb"},{"qty":4,"name":"Phyrexian Dreadnought"},{"qty":4,"name":"Stifle"},{"qty":4,"name":"Cloud of Faeries"},{"qty":3,"name":"Spiketail Hatchling"},{"qty":4,"name":"Daze"},{"qty":4,"name":"Foil"},{"qty":4,"name":"Gush"},{"qty":3,"name":"Counterspell"},{"qty":4,"name":"Opt"},{"qty":3,"name":"Portent"},{"qty":1,"name":"Misdirection"},{"qty":1,"name":"Chain of Vapor"},{"qty":15,"name":"Island"},{"qty":2,"name":"Wasteland"}],"side":[{"qty":3,"name":"Annul"},{"qty":2,"name":"Hydroblast"},{"qty":2,"name":"Blue Elemental Blast"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Back to Basics"},{"qty":2,"name":"Tsabo's Web"},{"qty":2,"name":"Powder Keg"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built a mono-blue Winter Orb tempo deck I'm calling \"Faerie Orb,\" and it passed the legality check.\n\n**Main deck (60)**\n- **Creatures (13):** 4 Cloud of Faeries, 4 Spiketail Hatchling, 3 Gilded Drake, 2 Thalakos Seer\n- **Artifact (4):** 4 Winter Orb\n- **Counterspells (17):** 4 Daze, 4 Counterspell, 3 Mana Leak, 2 Foil, 4 Gush (card draw, not a counter)\n- **Other spells (8):** 2 Snap, 4 Opt, 2 Portent\n- **Lands (18):** 14 Island, 2 Mishra's Factory, 2 Wasteland\n\n**Sideboard (15):** 3 Annul, 3 Hydroblast, 2 Blue Elemental Blast, 2 Tormod's Crypt, 2 Powder Keg, 2 Stifle, 1 Back to Basics\n\n**The plan**\nPlay a cheap flier and drop Winter Orb on turn 2 or 3. Orb lets each player untap only one land per turn. That cripples the opponent while your deck keeps working through free spells, cards that untap your lands, and two-mana threats. The fliers win quickly while the opponent can only cast one spell a turn, and you counter that one.\n\n**Key cards**\n- **Winter Orb (4):** The core. It only works while it's untapped, so protect it and don't plan on switching it off. You see one in the top 9 cards about 49% of the time; Opt and Portent push that up. The deck still plays fine as tempo without it.\n- **Cloud of Faeries:** A 2-mana flier that untaps two lands when it enters. Under Orb it costs you nothing. Snap does the same: it bounces a creature and untaps two lands.\n- **Spiketail Hatchling:** A flier that you can sacrifice to counter a spell unless its controller pays 1. Under Orb, that is usually a hard counter. Daze works the same way, and Mana Leak's \"pay 3\" is close to impossible for them.\n- **Gush, Daze and Foil:** All free. Gush returns two Islands to your hand, and under Orb that's an upside: each Island you replay comes in untapped and ready.\n- **Gilded Drake:** A 2-mana card that swaps itself for the opponent's best creature. It's very good against Phyrexian Dreadnought, Terravore and Goblins. Side it out against Enchantress, which has few creatures; with no target, the Drake is sacrificed.\n- **Thalakos Seer and Mishra's Factory:** Evasive or extra threats that draw a card when they leave or don't use up a spell.\n\n**The mana**\n18 lands, which matches the 18-land average of real Merfolk lists (the existing mono-blue Winter Orb deck). The checker recommends 21, but that number is inflated by Gush's and Foil's listed costs, which you almost never pay. 14 Islands keep Daze, Gush and Counterspell working. Two Wastelands are especially strong under Orb, because they often hit the opponent's only untapped land.\n\n**Sideboarding against the current meta**\n- **Enchantress (12.5%):** Bring in 3 Annul and Back to Basics (against Serra's Sanctum and other nonbasic lands). Take out 3 Gilded Drake and 1 Snap.\n- **Sligh, Goblins (about 14% together):** Bring in 3 Hydroblast, 2 Blue Elemental Blast and 2 Powder Keg. Take out the Seers, Portents and one Foil.\n- **Terrageddon:** Bring in 2 Stifle to stop land searches and triggers. Your Islands and cheap counters already line up well against Armageddon.\n- **Stiflenought:** Drake steals Dreadnought. Powder Keg on 1 also kills it. Mana Leak gets weaker in this matchup.\n- **Hermit Druid, Replenish, Psychatog:** Bring in 2 Tormod's Crypt and 2 Stifle (Stifle counters Hermit Druid's ability). Take out Portents and one Snap.\n\n**Stock, tuned or brew?**\nIt's a brew. Only the mana base and part of the counterspell suite are borrowed from Merfolk. The creature package (Cloud of Faeries, Spiketail Hatchling, Gilded Drake) and the four-Orb build are new.\n\n**What I couldn't verify**\n- Spiketail Hatchling and Thalakos Seer have no recent tournament results, so they're untested in this meta. Cloud of Faeries shows up mostly in Frantic Storm.\n- The matchup notes are reasoning from card text, not results from playing games.\n- Watch out for Null Rod and artifact removal after sideboarding; Winter Orb is an artifact.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Winter Orb"},{"qty":4,"name":"Cloud of Faeries"},{"qty":4,"name":"Spiketail Hatchling"},{"qty":3,"name":"Gilded Drake"},{"qty":2,"name":"Thalakos Seer"},{"qty":4,"name":"Daze"},{"qty":4,"name":"Gush"},{"qty":4,"name":"Counterspell"},{"qty":3,"name":"Mana Leak"},{"qty":2,"name":"Foil"},{"qty":2,"name":"Snap"},{"qty":4,"name":"Opt"},{"qty":2,"name":"Portent"},{"qty":14,"name":"Island"},{"qty":2,"name":"Mishra's Factory"},{"qty":2,"name":"Wasteland"}],"side":[{"qty":3,"name":"Annul"},{"qty":3,"name":"Hydroblast"},{"qty":2,"name":"Blue Elemental Blast"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Powder Keg"},{"qty":2,"name":"Stifle"},{"qty":1,"name":"Back to Basics"}],"mainCount":60,"sideCount":15}}},{"id":"8a2a0eedee06","prompt":"expert-premodern-pandeburst","brew":true,"left":{"text":"I submitted a Naya (green/red/white) ramp deck built around the two cards. It's a **brew**: recent results show just one list running either card, a Replenish deck.\n\n## The plan\nYou ramp with mana creatures, find whichever half of the combo you're missing, and win with Pandemonium plus Saproling Burst. Burst enters with 7 fade counters. Each token's power equals the counters left, and Pandemonium makes each token deal its power as damage when it enters. Make one token at a time and let each Pandemonium trigger resolve before making the next. That deals 6+5+4+3+2+1 = **21 damage**, enough to kill from 20 in one turn.\n- **Don't make all the tokens at once.** If you stack the activations, the counters drain before the triggers resolve and the tokens deal much less.\n- **Cast Burst on the turn you go off,** ideally after Pandemonium is already out. It loses a counter every upkeep, so a Burst cast early is worth less.\n\n## Why the key cards\n- **4 Pandemonium, 4 Saproling Burst:** the combo. Each half is also useful alone. Burst makes a 6/6 right away. Pandemonium turns every creature you cast into damage.\n- **4 Enlightened Tutor, 3 Sterling Grove:** these find either half. Grove also gives your other enchantments shroud, which stops targeted answers like Seal of Cleansing and Naturalize. The Enchantress, Terrageddon and Oath Ponza lists all play those.\n- **12 one-mana creatures (Llanowar Elves, Fyndhorn Elves, Birds of Paradise) and Gaea's Cradle:** a turn-1 creature lets you cast a 4-drop on turn 3 and Burst on turn 4. With Pandemonium out, each one also deals 1 damage when it enters.\n- **4 Flametongue Kavu, 2 Ravenous Baloth:** creatures that do something with Pandemonium out. Kavu's 4 damage to a creature plus its own 4 from Pandemonium is 8 damage. Baloth deals 4 and can gain you 4 life.\n- **4 Swords to Plowshares, 2 Sylvan Library:** removal and card selection.\n\n**Honest odds** (no mulligans, on the play): you'll see at least one Pandemonium-or-tutor and a natural Burst by turn 5 about **51%** of the time. You'll have both natural pieces only about 31% of the time, so the tutors matter. In real games the chance is somewhat higher, since a tutor can fetch either half.\n\n## The mana\n21 lands plus 12 mana creatures, mostly pain lands and fetch lands. Green is the main color (25 sources). There are 12 red and 11 white sources, plus 4 Birds that make any color. The deck checker noted 11 white land sources, against about 14 in Enchantress lists. I accepted that because white here is only one-mana tutors and removal, and the Birds cover the gap.\n\n## Sideboarding (field: Enchantress 12.5%, Terrageddon 11%, Stiflenought 10%, Sligh 10%, Hermit Druid 5.5%)\n- **Stiflenought, Psychatog, Standstill, Replenish:** +3 Pyroblast, +3 Xantid Swarm (when it attacks, they can't cast spells, so counters can't stop your combo turn). Take out the Baloths and 1–2 Swords.\n- **Sligh, Goblins:** +2 Circle of Protection: Red, +1 Baloth; take out the Sylvan Libraries and a tutor. **Pandemonium works for both players,** so their creatures deal damage when they enter too. Against Goblins, hold it until the turn you can win.\n- **Enchantress, Oath, Replenish:** +2 Aura of Silence, +2 Naturalize (they hit Opalescence, Parallax Wave and Oath of Druids).\n- **Hermit Druid, Replenish, Psychatog:** +2 Tormod's Crypt.\n\n## What I couldn't verify\nNone of this has been tested in play. The tools show this exact shell has never been played, and only one recent list runs either combo card. The sideboard numbers are my estimates, not taken from tournament results.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Llanowar Elves"},{"qty":4,"name":"Fyndhorn Elves"},{"qty":4,"name":"Birds of Paradise"},{"qty":4,"name":"Flametongue Kavu"},{"qty":2,"name":"Ravenous Baloth"},{"qty":4,"name":"Pandemonium"},{"qty":4,"name":"Saproling Burst"},{"qty":4,"name":"Enlightened Tutor"},{"qty":3,"name":"Sterling Grove"},{"qty":4,"name":"Swords to Plowshares"},{"qty":2,"name":"Sylvan Library"},{"qty":1,"name":"Gaea's Cradle"},{"qty":4,"name":"Karplusan Forest"},{"qty":4,"name":"Brushland"},{"qty":2,"name":"City of Brass"},{"qty":3,"name":"Wooded Foothills"},{"qty":2,"name":"Windswept Heath"},{"qty":3,"name":"Forest"},{"qty":1,"name":"Mountain"},{"qty":1,"name":"Plains"}],"side":[{"qty":3,"name":"Pyroblast"},{"qty":3,"name":"Xantid Swarm"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Aura of Silence"},{"qty":2,"name":"Circle of Protection: Red"},{"qty":1,"name":"Ravenous Baloth"},{"qty":2,"name":"Naturalize"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built this as a Green-White-red Enchantress brew (the deck is accepted). Pandemonium and Saproling Burst are the kill, and the Enchantress shell draws the cards and makes the mana to cast both. Cast Saproling Burst with Pandemonium already out, then remove one fade counter at a time and let each token's trigger resolve before removing the next. That's 6+5+4+3+2+1 = 21 damage. If you remove all the counters at once, the earlier tokens shrink before their damage resolves.\n\n**The three directions I considered:**\n1. **The Replenish package** (blue-white, with Attunement and Frantic Search to discard enchantments, then Replenish them back). One Replenish list in the results did run 3 Pandemonium and 3 Saproling Burst. But adding red and green to a blue-white deck makes the mana too shaky.\n2. **Red-green ramp** with Fires of Yavimaya and burn. Without Pandemonium, Saproling Burst is weak because its tokens shrink each turn, and this version has no card draw or ways to search for its pieces.\n3. **The Enchantress package plus a red splash. This is the one I picked**, because Enchantress is already 13% of the field and its cards all happen to help this combo:\n   - Argothian Enchantress and Enchantress's Presence draw a card every time you cast an enchantment.\n   - Wild Growth and Serra's Sanctum make the 9 mana you need across two turns.\n   - Sterling Grove and Enlightened Tutor find whichever piece you're missing.\n   - Solitary Confinement and Parallax Wave buy time while you set up.\n\n**Backup ways to win:**\n- With Opalescence out, each enchantment you cast becomes a creature as it enters, so Pandemonium has it deal damage equal to its mana value.\n- If you cast Replenish with Opalescence out, every enchantment returning from your graveyard triggers Pandemonium.\n\n**Mana:** I kept the Enchantress mana base and swapped in 3 Karplusan Forest, 1 Mountain and 2 Wooded Foothills. That gives 6 red sources (normal Enchantress has about 2). White drops to 13 sources against the usual 14, which I'm fine with because Serra's Sanctum makes lots of white mana. The splash also lets the sideboard run Pyroblast and Red Elemental Blast against the blue decks (Stiflenought and Psychatog). The rest of the sideboard is the usual Enchantress lineup aimed at the current field.\n\n**Honest odds:** By turn 6 on the play, not counting the extra cards from the Enchantresses or Mirri's Guile:\n- 80.9% to have Pandemonium or a card that finds it\n- 49.5% to have a natural Saproling Burst\n- 39.1% to have both\n\nThe Enchantresses' card draw should push those numbers up in real games.\n\n**Weak spots:** Opalescence turns Pandemonium and Saproling Burst into creatures, so Swords to Plowshares can hit them. Sterling Grove gives your other enchantments shroud, so keeping it in play protects your combo pieces. Armageddon from Terrageddon is a real threat when you need 9 mana.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Argothian Enchantress"},{"qty":4,"name":"Enchantress's Presence"},{"qty":4,"name":"Wild Growth"},{"qty":3,"name":"Mirri's Guile"},{"qty":3,"name":"Sterling Grove"},{"qty":3,"name":"Pandemonium"},{"qty":3,"name":"Saproling Burst"},{"qty":2,"name":"Opalescence"},{"qty":2,"name":"Parallax Wave"},{"qty":2,"name":"Seal of Cleansing"},{"qty":2,"name":"Solitary Confinement"},{"qty":2,"name":"Replenish"},{"qty":3,"name":"Swords to Plowshares"},{"qty":1,"name":"Enlightened Tutor"},{"qty":4,"name":"Serra's Sanctum"},{"qty":3,"name":"Brushland"},{"qty":3,"name":"Karplusan Forest"},{"qty":4,"name":"Windswept Heath"},{"qty":2,"name":"Wooded Foothills"},{"qty":1,"name":"Mountain"},{"qty":3,"name":"Forest"},{"qty":2,"name":"Plains"}],"side":[{"qty":3,"name":"Xantid Swarm"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Aura of Silence"},{"qty":2,"name":"Warmth"},{"qty":2,"name":"Pyroblast"},{"qty":1,"name":"Red Elemental Blast"},{"qty":1,"name":"Sacred Ground"},{"qty":1,"name":"Gaea's Blessing"},{"qty":1,"name":"Swords to Plowshares"}],"mainCount":60,"sideCount":15}}},{"id":"8a7688a79d5b","prompt":"expert-legacy-ruby-storm","brew":true,"left":{"text":"I built a mono-red \"Ruby Storm\" deck for Legacy. It's a brew: Desperate Ritual, Ral, Monsoon Mage and Ruby Medallion each show 0 Legacy lists in the last 90 days, so there's no proven version to copy.\n\n**The plan**\nYou play a cost reducer on turn 2, then on turn 3 or 4 chain rituals, card-draw spells and Past in Flames into a lethal Grapeshot. Burning Wish fetches Empty the Warrens if the opponent has too much life to burn out.\n\n**Why the key cards**\n- **Ruby Medallion and Ral (4 each):** Each one makes a 2-mana ritual cost 1 and produce 3, so every ritual nets 2 mana. With both out, a ritual costs just {R}. Ral also flips a coin whenever you cast an instant or sorcery on your turn. Lose and he deals 1 damage to you. Win and you can flip him into Ral, Leyline Prodigy, who enters with an extra loyalty counter for every instant and sorcery you've cast that turn. In a big turn that can get him to his −8 right away: exile your top 8 cards and cast the instants and sorceries among them for free.\n- **Rituals (12 total):** 4 Desperate Ritual, 4 Pyretic Ritual (a second copy of the same effect) and 4 Rite of Flame. This deck has no other Arcane spells, so Desperate Ritual's splice ability is never used.\n- **Free mana:** 4 Lotus Petal and 2 Simian Spirit Guide give you mana without using a land.\n- **Card flow:** 4 Manamorphose (makes 2 mana and draws a card, so it's free with a reducer out), 4 Reckless Impulse and 2 Wrenn's Resolve (each exiles your top two cards and lets you play them through the end of your next turn).\n- **Jeska's Will (3):** You'll never control a commander in Legacy, so you only get one mode. The mana mode adds {R} for each card in the opponent's hand, often 5–7 mana early, and the Medallion makes it cost 2.\n- **Finishers:** 2 Past in Flames, 2 Grapeshot and 3 Burning Wish.\n\n**Odds (from the draw calculator, no mulligans)**\n- You have a Medallion or Ral by turn 2 on the play 70.6% of the time.\n- You see a reducer plus a Grapeshot, Wish or Past in Flames in your opening hand plus draws by turn 3 46.6% of the time.\n- The card-draw spells and Manamorphose raise that last number in practice. Expect a lot of turn-3 and turn-4 kills, not turn-1 ones.\n\n**Mana**\n- 14 lands: 11 Mountain, 2 Ancient Tomb, 1 City of Traitors. The Medallion and Ral both cost {1}{R}, so the colorless lands help cast them.\n- The checker suggested about 14.4 lands. Real Epic Storm lists average 13.1, but this deck has to land a 2-drop, so I kept one extra land.\n- The check_deck comparison says the deck is short on white, blue, black and green sources. That doesn't matter: the deck is mono-red, and the only off-color mana is from Lotus Petal and Manamorphose.\n\n**Sideboard plan**\n- **Wish targets:** Empty the Warrens, a third Grapeshot and a third Past in Flames.\n- **Blue tempo decks (Esper, Izzet and Dimir Tempo, about 24% of the field):** Bring in 4 Pyroblast to counter their counterspells or destroy their threats. Cut 2 Wrenn's Resolve and 2 Simian Spirit Guide.\n- **Creature decks (Eldrazi Aggro, Ocelot Aggro, Initiative, plus Thalia-style hate creatures):** Bring in 3 Pyrokinesis, which you can cast free by exiling a red card from your hand, and 2 Abrade.\n- **Mono-Red Prison:** Bring in 2 Abrade to destroy their artifacts, such as Chalice of the Void or Trinisphere.\n- **Graveyard decks (Cephalid Breakfast, Oops All Spells, Reanimator):** Bring in 2 Tormod's Crypt.\n- **Tron and Lands:** Bring in Blood Moon. Your mana is all Mountains and colorless lands, so it barely hurts you.\n- For each of these, trim Jeska's Will or Wrenn's Resolve first.\n\n**What I couldn't verify**\nNo tournament results exist for this shell, so I couldn't test the ratios. Ral's coin-flip damage and Ancient Tomb add up against aggro decks. I didn't count how many cards opponents hold on average for Jeska's Will. There's also no protection in the main deck, so the first games against counterspell decks will be hard.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Ruby Medallion"},{"qty":4,"name":"Ral, Monsoon Mage"},{"qty":4,"name":"Desperate Ritual"},{"qty":4,"name":"Pyretic Ritual"},{"qty":4,"name":"Rite of Flame"},{"qty":4,"name":"Manamorphose"},{"qty":4,"name":"Lotus Petal"},{"qty":4,"name":"Reckless Impulse"},{"qty":2,"name":"Wrenn's Resolve"},{"qty":3,"name":"Jeska's Will"},{"qty":2,"name":"Past in Flames"},{"qty":2,"name":"Grapeshot"},{"qty":3,"name":"Burning Wish"},{"qty":2,"name":"Simian Spirit Guide"},{"qty":11,"name":"Mountain"},{"qty":2,"name":"Ancient Tomb"},{"qty":1,"name":"City of Traitors"}],"side":[{"qty":1,"name":"Empty the Warrens"},{"qty":1,"name":"Grapeshot"},{"qty":1,"name":"Past in Flames"},{"qty":4,"name":"Pyroblast"},{"qty":3,"name":"Pyrokinesis"},{"qty":2,"name":"Abrade"},{"qty":2,"name":"Tormod's Crypt"},{"qty":1,"name":"Blood Moon"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built this as a brew: **Izzet Ruby Storm**. The plan is to land Ral, Monsoon Mage or Ruby Medallion on turn 2. Each one makes Desperate Ritual and Pyretic Ritual cost 1 mana and still give 3 red, and makes Manamorphose cost 1 while still giving 2 mana and drawing a card. With both out, Manamorphose is free and replaces itself. You chain those into a storm finisher: Grapeshot, Empty the Warrens, or Past in Flames to cast every spell in your graveyard again. Burning Wish can fetch extra copies of those from the sideboard.\n\n**Three directions I considered:**\n1. **Mono-red Ruby Storm.** Rituals, the two cost reducers and storm cards, with Simian Spirit Guide and Chrome Mox from the menu as fast mana.\n2. **Izzet Ruby Storm.** The same engine, plus Brainstorm, Ponder and Force of Will taken from the Izzet Tempo package on the menu.\n3. **Rakdos Storm.** Dark Ritual, Infernal Tutor and Thoughtseize, borrowed from The Epic Storm.\n\nI chose Izzet. Brainstorm and Ponder help you find the 8 cost reducers. Force of Will protects the combo turn against a field that's mostly blue tempo. The Rakdos version would have pushed your three cards to the side in favour of Dark Ritual and Infernal Tutor.\n\n**Numbers:**\n- You see Ral or Medallion by turn 3 about 75% of the time, and a ritual about 94% of the time (no mulligans).\n- I run 14 lands, one more than the Epic Storm average of 13. This deck has no Chrome Mox or Lion's Eye Diamond, and it needs to hit its 2-drop on time.\n- check_deck flagged low white, black and green mana sources compared with Epic Storm. That doesn't matter here: this deck only uses blue and red.\n\n**Things to know:**\n- Ral costs you life. Each instant or sorcery you cast on your turn makes him flip a coin, and a lost flip deals 1 damage to you. A won flip lets him transform into a planeswalker, so long chains will cost some life.\n- Chalice of the Void is the biggest threat. Eldrazi Aggro and Mono-Red Prison run it, and set on 2 it stops most of your deck. The sideboard has Abrade, Chain of Vapor and Echoing Truth to answer it.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Desperate Ritual"},{"qty":4,"name":"Pyretic Ritual"},{"qty":3,"name":"Rite of Flame"},{"qty":4,"name":"Manamorphose"},{"qty":4,"name":"Ral, Monsoon Mage"},{"qty":4,"name":"Ruby Medallion"},{"qty":4,"name":"Brainstorm"},{"qty":4,"name":"Ponder"},{"qty":2,"name":"Reckless Impulse"},{"qty":2,"name":"Burning Wish"},{"qty":2,"name":"Grapeshot"},{"qty":1,"name":"Empty the Warrens"},{"qty":1,"name":"Past in Flames"},{"qty":4,"name":"Lotus Petal"},{"qty":3,"name":"Force of Will"},{"qty":4,"name":"Volcanic Island"},{"qty":4,"name":"Scalding Tarn"},{"qty":2,"name":"Bloodstained Mire"},{"qty":1,"name":"Polluted Delta"},{"qty":2,"name":"Mountain"},{"qty":1,"name":"Island"}],"side":[{"qty":1,"name":"Empty the Warrens"},{"qty":1,"name":"Past in Flames"},{"qty":1,"name":"Pyroclasm"},{"qty":1,"name":"Fiery Confluence"},{"qty":4,"name":"Pyroblast"},{"qty":2,"name":"Flusterstorm"},{"qty":2,"name":"Chain of Vapor"},{"qty":2,"name":"Abrade"},{"qty":1,"name":"Echoing Truth"}],"mainCount":60,"sideCount":15}}},{"id":"97b094c12949","prompt":"expert-premodern-draco-explosion","brew":true,"left":{"text":"I built **Five-Color Domain Draco Explosion**. It's a brew, since neither card shows up in any recent Premodern results.\n\n**The plan:** Get Draco (mana value 16) to the top of your library, then cast Erratic Explosion. It reveals Draco and deals 16 damage. There are two ways to set it up for 4 mana in one main phase:\n- **Tutor first:** Worldly Tutor or Enlightened Tutor puts Draco on top, then you cast Explosion.\n- **Sylvan Library:** if you draw Draco with it, put it back on top and fire Explosion that turn.\n\nTribal Flames (5 damage with all five land types) or Lightning Bolt covers the last 4 points. Draco is also a real backup threat: with all five basic land types it costs just {6} and its upkeep drops to {0}, so it's a 9/9 flier with no drawback.\n\n**Directions I considered:**\n1. **Green-base five-color domain (chosen).** It uses the Sylvan Library and fetchland package from Terrageddon, adds Birds of Paradise and Rampant Growth to get every land type out, and has two tutors that put cards on top.\n2. **Grixis control** with Lim-Dûl's Vault and Scroll Rack, using Stiflenought's Counterspell and Foil.\n3. **Green-white with a little red,** using Enchantress's Mirri's Guile and Sylvan Library.\n\nI picked the first because domain is the only thing that turns Draco from a dead card in hand into a castable 6-drop, and green-white has the most legal ways to put Draco on top. The usual tools are out: Mystical Tutor, Vampiric Tutor and Brainstorm are banned, and Personal Tutor isn't legal in Premodern.\n\n**Things to know:**\n- **Erratic Explosion is a sorcery,** so you can't respond with it at instant speed. Plan on tutoring and exploding in the same main phase.\n- **Odds:** the chance of having Explosion plus a tutor, Library or Scroll Rack by turn 5 is about 52%, before counting Library's extra draws. Explosion is the bottleneck, since nothing in these colors can tutor for it.\n- **Mana:** the deck checker flagged 23 lands as low next to Terrageddon's 26 and white as light (8 sources). I kept 23 because Birds and Rampant Growth add 7 more mana sources. Only one Island and one Swamp are needed, since they're there just to fill out the five land types.\n\n**Sideboard:** aimed at the current field. Pyroblast and Pyroclasm for blue decks and creature swarms, Naturalize and Seal of Cleansing for Enchantress, Tormod's Crypt for Replenish and Hermit Druid, and Exalted Angel against Sligh.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Erratic Explosion"},{"qty":3,"name":"Draco"},{"qty":4,"name":"Sylvan Library"},{"qty":4,"name":"Worldly Tutor"},{"qty":3,"name":"Enlightened Tutor"},{"qty":1,"name":"Scroll Rack"},{"qty":4,"name":"Birds of Paradise"},{"qty":3,"name":"Rampant Growth"},{"qty":4,"name":"Swords to Plowshares"},{"qty":3,"name":"Lightning Bolt"},{"qty":4,"name":"Tribal Flames"},{"qty":4,"name":"Wooded Foothills"},{"qty":3,"name":"Windswept Heath"},{"qty":2,"name":"Polluted Delta"},{"qty":2,"name":"Bloodstained Mire"},{"qty":1,"name":"Flooded Strand"},{"qty":4,"name":"Forest"},{"qty":3,"name":"Mountain"},{"qty":2,"name":"Plains"},{"qty":1,"name":"Island"},{"qty":1,"name":"Swamp"}],"side":[{"qty":3,"name":"Pyroblast"},{"qty":3,"name":"Naturalize"},{"qty":2,"name":"Tormod's Crypt"},{"qty":3,"name":"Pyroclasm"},{"qty":2,"name":"Exalted Angel"},{"qty":2,"name":"Seal of Cleansing"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built you **Draco Explosion**, a Naya burn-combo brew with basics from all five land types. It's legal in Premodern and passed the deck check with no errors or warnings.\n\n**The plan:** Put Draco (mana value 16) on top of your library, then cast Erratic Explosion. It reveals Draco and deals 16 damage. 16 doesn't kill from 20, so Lightning Bolt, Tribal Flames and Fireblast do two jobs: they clear blockers early and knock the opponent down to 16 or less before the combo. The usual kill is turn 4 or 5: a 1-mana tutor plus a 3-mana Explosion in the same main phase.\n\n**Main deck (60)**\n- *Combo:* 4 Erratic Explosion, 2 Draco, 4 Worldly Tutor, 2 Enlightened Tutor, 4 Sylvan Library, 3 Gamble\n- *Burn and removal:* 4 Lightning Bolt, 4 Tribal Flames, 2 Fireblast, 2 Swords to Plowshares\n- *Land fetching:* 3 Rampant Growth, 3 Krosan Tusker\n- *Lands (23):* 4 Wooded Foothills, 3 Windswept Heath, 2 Bloodstained Mire, 2 Flooded Strand, 1 Karplusan Forest, 4 Mountain, 3 Forest, 2 Plains, 1 Island, 1 Swamp\n\n**Sideboard (15):** 3 Pyroblast, 2 Red Elemental Blast, 3 Pyroclasm, 2 Swords to Plowshares, 2 Tranquil Grove, 2 Tormod's Crypt, 1 Naturalize\n\n**Why these cards**\n- **Brainstorm, Mystical Tutor and Vampiric Tutor are banned.** Sensei's Divining Top and Personal Tutor aren't legal. So the deck uses these to put Draco on top instead:\n  - **Worldly Tutor** finds any creature and **Enlightened Tutor** finds any artifact. Draco is an artifact creature, so either one works.\n  - **Timing:** Cast the tutor in your own main phase, right before Explosion. If you tutor at the end of the opponent's turn, you'll just draw Draco.\n- **Sylvan Library** works best here. If you draw Draco off it, you can put Draco back on top and then Explode. It only puts back cards drawn that turn, so it can't save a Draco from your opening hand.\n- **Mirri's Guile** was left out. It sets the top card in your upkeep, so you'd draw Draco before you could cast the sorcery.\n- **Gamble** is extra copies of Explosion. Its random discard can hit the card you just fetched, so cast it with a full hand.\n- **Two Dracos:** One stuck in hand isn't dead weight, because the tutors can still find the other. You can also hard-cast it: Draco costs 2 less for each basic land type you control, so with all five it's a 6-mana 9/9 flier with no upkeep.\n- **Krosan Tusker** fetches a basic land when you cycle it. If Explosion hits it by chance, it still deals 7.\n\n**The mana:** 23 lands is low next to the Terrageddon lists I borrowed the mana from (they average 26). That's on purpose: 15 of my spells cost 1 mana, and Rampant Growth and Tusker find more lands. The single Island and Swamp are only there to complete the five land types, which powers Tribal Flames (5 damage) and cheap Draco. Get them with Polluted… no — with Flooded Strand, Bloodstained Mire, Rampant Growth or Tusker. There are four Mountains plus the Foothills and Mire to fetch more, so Fireblast's \"sacrifice two Mountains\" cost works. White comes from only 7 sources, which is fine since it's a light splash.\n\n**Sideboarding against the current meta**\n- **Stiflenought, UB Psychatog, Standstill:** Bring in Pyroblast and Red Elemental Blast to protect the combo turn. Take out Swords and Rampant Growth.\n- **Sligh and Goblins:** Bring in Pyroclasm and the extra Swords. Take out Gamble and Tusker. Here you're mostly a burn deck that finishes with the combo.\n- **Enchantress:** Bring in Tranquil Grove and Naturalize. Grove also destroys your own Sylvan Library, so activate it carefully. Take out Swords.\n- **Hermit Druid Combo and Replenish:** Bring in Tormod's Crypt, plus Pyroblast if they're blue.\n- **Terrageddon:** Bring in Pyroclasm against their small creatures. Against Armageddon, the 1-mana tutor plus 3-mana Explosion kill is your out.\n\n**Honest odds:** Counting Gamble, you have about a 68% chance to see Explosion (or Gamble) and something to put Draco on top by turn 5 on the play. Explosion by itself shows up by turn 4 only about 53% of the time, so Sylvan Library digging for it matters a lot.\n\n**What I couldn't verify:** This is a brew. Neither Erratic Explosion nor Draco shows up in any recent Premodern results, so nothing here is tested. The odds above come from simple draw math, not games played.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Erratic Explosion"},{"qty":2,"name":"Draco"},{"qty":4,"name":"Worldly Tutor"},{"qty":2,"name":"Enlightened Tutor"},{"qty":4,"name":"Sylvan Library"},{"qty":3,"name":"Gamble"},{"qty":4,"name":"Lightning Bolt"},{"qty":4,"name":"Tribal Flames"},{"qty":2,"name":"Fireblast"},{"qty":2,"name":"Swords to Plowshares"},{"qty":3,"name":"Rampant Growth"},{"qty":3,"name":"Krosan Tusker"},{"qty":4,"name":"Wooded Foothills"},{"qty":3,"name":"Windswept Heath"},{"qty":2,"name":"Bloodstained Mire"},{"qty":2,"name":"Flooded Strand"},{"qty":1,"name":"Karplusan Forest"},{"qty":4,"name":"Mountain"},{"qty":3,"name":"Forest"},{"qty":2,"name":"Plains"},{"qty":1,"name":"Island"},{"qty":1,"name":"Swamp"}],"side":[{"qty":3,"name":"Pyroblast"},{"qty":2,"name":"Red Elemental Blast"},{"qty":3,"name":"Pyroclasm"},{"qty":2,"name":"Swords to Plowshares"},{"qty":2,"name":"Tranquil Grove"},{"qty":2,"name":"Tormod's Crypt"},{"qty":1,"name":"Naturalize"}],"mainCount":60,"sideCount":15}}},{"id":"9e968f74b40a","prompt":"expert-legacy-phoenix","brew":true,"left":{"text":"I built you a Grixis Phoenix brew (Grixis means blue, black and red) and it's been accepted. No current Legacy results have a deck like this: Arclight Phoenix shows up in 0 lists in the last 90 days, and Buried Alive in just 1 (a Reanimator list). Only Flow State is widely played: 338 lists, mostly Dimir and Izzet Tempo.\n\n**Main deck (60)**\n- **Creatures (8):** 4 Arclight Phoenix, 4 Dragon's Rage Channeler\n- **Card draw and selection (20):** 4 Brainstorm, 4 Ponder, 4 Consider, 4 Flow State, 4 Faithless Looting\n- **Graveyard setup (3):** 3 Buried Alive\n- **Interaction (11):** 4 Lightning Bolt, 4 Force of Will, 2 Lava Dart, 1 Unholy Heat\n- **Lands (18):** 4 Volcanic Island, 2 Underground Sea, 1 Badlands, 4 Scalding Tarn, 4 Polluted Delta, 2 Bloodstained Mire, 1 Island\n\n**Sideboard (15):** 3 Pyroblast, 2 Force of Negation, 2 Surgical Extraction, 2 Pyroclasm, 2 Blood Moon, 2 Consign to Memory, 2 Thoughtseize\n\n**The plan**\nGet Phoenixes into your graveyard early, then cast three instants or sorceries in one turn. At the start of combat, every Phoenix in the graveyard comes back as a 3/2 flier with haste. Most of the deck costs one mana (27 cards at 1 mana; average mana value 1.9), so three spells in one turn usually comes from a normal turn 3 or 4 hand.\n\n**Why these cards**\n- **Buried Alive:** puts three Phoenixes straight into the graveyard. Once you've cast it, two more cheap spells that turn bring them back next turn.\n- **Faithless Looting:** a 1-mana way to discard Phoenixes. Its flashback is another spell toward the three.\n- **Odds:** with 11 ways to get a Phoenix into the graveyard (4 Phoenix, 3 Buried Alive, 4 Looting), you have at least one by turn 3 on the play 86.1% of the time.\n- **Flow State:** your refuel. The deck has both instants (Brainstorm, Consider, Bolt, Lava Dart, Force of Will) and sorceries (Ponder, Looting, Buried Alive). With one of each in your graveyard, Flow State puts two of the top three cards into your hand instead of one. It's a sorcery, so it also counts toward Phoenix.\n- **Spells that count twice:** Lava Dart can be cast again from the graveyard by sacrificing a Mountain (Volcanic Island or Badlands), so one card is two spells. Force of Will can be cast for free, so it counts as a spell without using mana.\n- **Dragon's Rage Channeler:** a 1-drop that grows with each spell you cast and puts cards into your graveyard. That gets you to delirium (four card types in the graveyard), which makes Channeler bigger and turns Unholy Heat into 6 damage.\n\n**Mana**\nI copied the land mix from Izzet Tempo and added a little black for Buried Alive: three black-producing duals, plus fetch lands that can find them. Check_deck counts 18 lands (it recommends 18.4) and 15 blue, 11 red and 9 black sources. It raised no warnings against the 253 Izzet Tempo lists, which average 18.87 lands.\n\n**Sideboarding**\n- **Dimir and Izzet Tempo (the two most-played decks):** bring in Pyroblast and Pyroclasm. Take out Unholy Heat and 1 Buried Alive, which is slow against counterspells like Daze.\n- **Sneak and Show, OmniTell, Doomsday:** bring in Force of Negation, Thoughtseize and Consign to Memory. Take out Lava Dart and Unholy Heat.\n- **Tron and Eldrazi Aggro:** bring in Blood Moon. Consign to Memory can counter their colorless spells.\n- **Reanimator and Oops All Spells:** bring in Surgical Extraction, Thoughtseize and Force of Negation. I left out Grafdigger's Cage because it would also stop your own Phoenixes from coming back.\n- **Ocelot Aggro:** bring in Pyroclasm.\n\n**What I couldn't check**\nSince nobody plays this deck, there's no win-rate data. My counts (how many card-draw spells versus Buried Alive, and only 2 Lava Dart) are judgment calls. Your graveyard plan is open to the graveyard hate that's common in this field: Surgical Extraction is in 1,222 recent lists and Consign to Memory in 2,079. If the tempo decks keep beating you, a reasonable next step is adding 2 Daze in place of 2 Consider.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Arclight Phoenix"},{"qty":4,"name":"Dragon's Rage Channeler"},{"qty":4,"name":"Brainstorm"},{"qty":4,"name":"Ponder"},{"qty":4,"name":"Consider"},{"qty":4,"name":"Flow State"},{"qty":4,"name":"Faithless Looting"},{"qty":3,"name":"Buried Alive"},{"qty":4,"name":"Lightning Bolt"},{"qty":4,"name":"Force of Will"},{"qty":2,"name":"Lava Dart"},{"qty":1,"name":"Unholy Heat"},{"qty":4,"name":"Volcanic Island"},{"qty":2,"name":"Underground Sea"},{"qty":1,"name":"Badlands"},{"qty":4,"name":"Scalding Tarn"},{"qty":4,"name":"Polluted Delta"},{"qty":2,"name":"Bloodstained Mire"},{"qty":1,"name":"Island"}],"side":[{"qty":3,"name":"Pyroblast"},{"qty":2,"name":"Force of Negation"},{"qty":2,"name":"Surgical Extraction"},{"qty":2,"name":"Pyroclasm"},{"qty":2,"name":"Blood Moon"},{"qty":2,"name":"Consign to Memory"},{"qty":2,"name":"Thoughtseize"}],"mainCount":60,"sideCount":15}},"right":{"text":"I submitted **Grixis Phoenix**, a brew. It runs 17 lands and has a full 15-card sideboard.\n\n**The plan:** Buried Alive puts up to three Phoenixes straight into your graveyard on turn 3. Faithless Looting, Thought Scour and Dragon's Rage Channeler's surveil can also bin them. After that, you need to cast three instants or sorceries in one turn. That's easy with this many cheap spells: 24 one-mana spells, plus Manamorphose, which gives back the mana it costs and draws a card. Do that before combat and every Phoenix in your graveyard comes back with haste. Flow State keeps the chain going: once you have an instant and a sorcery in your graveyard (Looting and Bolt get you there quickly), it puts two of the three cards it looks at into your hand instead of one.\n\n**Three directions I considered:**\n1. **The one I chose:** a Grixis spell chain that borrows Izzet Tempo's package (Brainstorm, Ponder, Force of Will, Lightning Bolt, Dragon's Rage Channeler) and its fetch land and dual land mana. Black is only a light splash for Buried Alive (8 black sources).\n2. **A Reanimator hybrid:** Buried Alive would fetch Griselbrand plus Phoenixes, with lots of Reanimate. I rejected it because the big reanimation targets would take over the deck and make Phoenix a side plan.\n3. **A Dimir Tempo shell with Phoenix added:** Fatal Push, Thoughtseize and Orcish Bowmasters, splashing red. I rejected it because Phoenix needs red mana every turn and needs a high count of instants and sorceries, which that shell doesn't have.\n\nI picked direction 1 because Izzet Tempo already plays Flow State in 38% of its lists, so its cards and lands fit what Phoenix needs while keeping all three of your cards at the center.\n\n**Things to know:**\n- **Banned cards:** I looked up Gitaxian Probe and Mental Misstep, the classic free spells for this kind of deck. Both are banned in Legacy. Manamorphose is the free spell that's still legal.\n- **One Reanimate:** It's a one-mana sorcery that counts toward the three, and it can bring back a Phoenix or a creature from your opponent's graveyard.\n- **Odds:** Without mulligans, you'll have Buried Alive, Looting or Thought Scour by turn 3 about 83% of the time. You'll have Flow State by then only about 49% of the time. Brainstorm and Ponder help you find whichever piece is missing.\n- **Land count:** The deck check said Izzet Tempo usually runs about 19 lands. I stayed at 17 because this deck has no Wasteland, averages about 2 mana per spell, and has Manamorphose making mana. The checker's own recommendation for this list was 16.9 lands.\n- **Graveyard hate:** The sideboard avoids Grafdigger's Cage and Tormod's Crypt because they would stop Phoenix too. Surgical Extraction targets one specific card instead.\n\nThe deck passed the legality check and was accepted.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Arclight Phoenix"},{"qty":3,"name":"Dragon's Rage Channeler"},{"qty":3,"name":"Buried Alive"},{"qty":4,"name":"Flow State"},{"qty":4,"name":"Faithless Looting"},{"qty":4,"name":"Brainstorm"},{"qty":4,"name":"Ponder"},{"qty":3,"name":"Thought Scour"},{"qty":4,"name":"Manamorphose"},{"qty":4,"name":"Lightning Bolt"},{"qty":1,"name":"Unholy Heat"},{"qty":4,"name":"Force of Will"},{"qty":1,"name":"Reanimate"},{"qty":4,"name":"Volcanic Island"},{"qty":2,"name":"Underground Sea"},{"qty":1,"name":"Badlands"},{"qty":1,"name":"Island"},{"qty":4,"name":"Scalding Tarn"},{"qty":3,"name":"Polluted Delta"},{"qty":2,"name":"Bloodstained Mire"}],"side":[{"qty":3,"name":"Pyroblast"},{"qty":2,"name":"Consign to Memory"},{"qty":2,"name":"Force of Negation"},{"qty":2,"name":"Surgical Extraction"},{"qty":2,"name":"Fatal Push"},{"qty":2,"name":"Thoughtseize"},{"qty":1,"name":"Pyroclasm"},{"qty":1,"name":"Meltdown"}],"mainCount":60,"sideCount":15}}},{"id":"9fa6c67b0644","prompt":"expert-legacy-belcher","brew":true,"left":{"text":"I built a brew I'm calling **Zero-Land Belcher**. It's an R/G/b turn-1 combo deck. Goblin Charbelcher is the main kill, and Empty the Warrens is the backup.\n\n**The plan:** The deck has no real lands. Its five \"lands\" are Shatterskull Smashing and Agadeem's Awakening, which are cards with a land on the back side. In the library they count as spells. Charbelcher reveals cards until it finds a land card, so here it reveals the whole library and deals about 50 damage from one activation. You need 7 mana: 4 to cast it and 3 to use it. You get there by chaining free mana (Lotus Petal, Chrome Mox, the two Spirit Guides), rituals (Dark Ritual, Rite of Flame, Desperate Ritual, Seething Song) and Lion's Eye Diamond, which pays for the activation. Spoils of the Vault naming Charbelcher works as extra copies. If an artifact answer shows up, Burning Wish gets Empty the Warrens, Grapeshot or Wear Down from the sideboard. Thoughtseize and Pact of Negation get you past Force of Will.\n\n**Three directions I considered:**\n1. **Zero-land Belcher (chosen).** It borrows the Oops All Spells package from the results: double-faced cards as lands, Dark Ritual and Pact of Negation.\n2. **Classic mono-red Belcher.** One or two real Mountains plus Land Grant. Revealing a Mountain doubles the damage, but you can also reveal it early and deal almost nothing.\n3. **Artifact storm.** Built on The Epic Storm's Mox Opal shell. That turns Charbelcher into a side card.\n\nI picked the first because with no real land in the library, one activation kills from any life total, which keeps Charbelcher at the center.\n\n**The numbers:**\n- You see Charbelcher, Spoils, Empty or Wish in your opening 7 on the play 77.8% of the time.\n- Charbelcher appeared in only 12 lists in the last 90 days, almost all of them Oops All Spells sideboards. So this deck is untested.\n\n**Check warnings I'm ignoring:**\n- **\"Add about 11 lands\":** Adding real lands would break the kill, so the low land count is the point. I run 5 land cards, close to the 5.5 that Oops All Spells lists average.\n- **Not enough black to cast Agadeem's Awakening:** You only ever play it as a land, never cast the spell side.\n\n**Risks to know:**\n- Pact of Negation makes you lose at your next upkeep if you can't pay its cost, so only use it on the turn you win.\n- Spoils of the Vault costs life for every card it passes over on the way to Charbelcher.\n\n**Sideboard:** Pyroblast, Veil of Summer and Leyline of Sanctity are for Dimir Tempo and other blue or discard decks. Defense Grid is against counterspells. Wear Down (fetched with Wish) is for Chalice of the Void from Eldrazi Aggro.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Goblin Charbelcher"},{"qty":2,"name":"Empty the Warrens"},{"qty":2,"name":"Burning Wish"},{"qty":3,"name":"Spoils of the Vault"},{"qty":4,"name":"Lotus Petal"},{"qty":4,"name":"Chrome Mox"},{"qty":2,"name":"Lion's Eye Diamond"},{"qty":4,"name":"Elvish Spirit Guide"},{"qty":4,"name":"Simian Spirit Guide"},{"qty":2,"name":"Tinder Wall"},{"qty":4,"name":"Dark Ritual"},{"qty":4,"name":"Rite of Flame"},{"qty":4,"name":"Desperate Ritual"},{"qty":4,"name":"Seething Song"},{"qty":1,"name":"Pyretic Ritual"},{"qty":2,"name":"Manamorphose"},{"qty":2,"name":"Thoughtseize"},{"qty":3,"name":"Pact of Negation"},{"qty":3,"name":"Shatterskull Smashing"},{"qty":2,"name":"Agadeem's Awakening"}],"side":[{"qty":1,"name":"Empty the Warrens"},{"qty":1,"name":"Grapeshot"},{"qty":1,"name":"Wear Down"},{"qty":3,"name":"Pyroblast"},{"qty":2,"name":"Defense Grid"},{"qty":3,"name":"Veil of Summer"},{"qty":4,"name":"Leyline of Sanctity"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built this as a \"Zero-Land Belcher\" brew.\n\n**The plan**\nEvery card that could count as a land in this deck is a two-sided card whose front face is a spell. In your library those count as spells. So when Goblin Charbelcher \"reveal[s] cards… until you reveal a land card,\" it never finds one. It goes through your whole library and does roughly 50 damage. You make 7 mana in one turn (4 to cast it, 3 to activate it). A non-creature artifact can tap the turn it comes in, so you win right away. Empty the Warrens is the backup plan when Belcher gets answered.\n\n**Key cards**\n- **4 Goblin Charbelcher, plus 2 Spoils of the Vault and 1 Gamble as ways to find it.** There's no land to stop Spoils either: name Belcher, and it costs you about 1 life per card it skips.\n- **4 Lion's Eye Diamond.** This is your last step: cast Belcher, then sacrifice LED (discarding your hand) for the 3 mana to activate it. Your hand doesn't matter once Belcher fires.\n- **Fast mana: 4 Lotus Petal, 4 Chrome Mox, 4 Simian Spirit Guide, 4 Elvish Spirit Guide, 4 Dark Ritual, 4 Rite of Flame, 3 Desperate Ritual, 3 Seething Song.** Belcher's costs are all generic, so mana of any color helps. Colors only matter for the rituals.\n- **4 Street Wraith and 4 Manamorphose.** These draw cards for no net mana. Wraith cycles for 2 life, which effectively shrinks the deck to 56 cards.\n- **3 Pact of Negation.** It's a free counterspell. You're trying to win the same turn, so its \"pay next upkeep or lose\" cost usually never comes due.\n- **2 Empty the Warrens.** Every ritual and Petal adds to its storm count, so it's a real second way to win when someone has an artifact answer.\n\n**The mana**\nThe deck runs 0 real lands. The 4 Agadeem's Awakening and 2 Shatterskull Smashing can each be played as a land (pay 3 life to have it enter untapped). That gives you land drops in longer games, and they still don't stop Belcher. check_deck warned that 3 lands is far below normal (it recommends about 13, and Oops All Spells lists average 5.5). That's on purpose: any real land would stop Belcher partway through your library.\n\n**Odds**\nTreating the deck as 56 cards because of Street Wraith (an approximation):\n- 72.9% to see Belcher, a tutor or Empty in your opening 7.\n- 68.3% to see Belcher or a tutor by turn 2.\n- 30.4% to have both that and an LED by turn 2.\n\nThis is a high-variance deck. Expect to mulligan aggressively.\n\n**Sideboarding**\n- **Dimir Tempo, Izzet Tempo, OmniTell, Doomsday, Sneak and Show (blue counterspells and discard):** bring in Pyroblast, Veil of Summer, Defense Grid and Thoughtseize. Cut Gamble, a Desperate Ritual and Empty the Warrens.\n- **Eldrazi Aggro, Tron (Chalice of the Void) and Death and Taxes (Thalia):** bring in Abrade to kill Chalice or Thalia before you go off.\n- **Lands and GX Midrange (Force of Vigor kills Belcher):** add Thoughtseize to strip it first, or go off on your own turn when they can't cast it for free. Lean on Empty the Warrens.\n\n**Label and what I couldn't check**\nThis is a **brew**. Current results only show Belcher as a 1–4 copy extra in Oops All Spells (11 of its 12 recent lists), so there's no proven list to copy. I only borrowed that deck's general shape: Petals, both Spirit Guides, Dark Ritual and Agadeem. I didn't test the exact turn-1 kill rate, and the 56-card numbers above are approximate.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Goblin Charbelcher"},{"qty":2,"name":"Empty the Warrens"},{"qty":2,"name":"Spoils of the Vault"},{"qty":1,"name":"Gamble"},{"qty":4,"name":"Street Wraith"},{"qty":4,"name":"Manamorphose"},{"qty":4,"name":"Lotus Petal"},{"qty":4,"name":"Chrome Mox"},{"qty":4,"name":"Lion's Eye Diamond"},{"qty":4,"name":"Simian Spirit Guide"},{"qty":4,"name":"Elvish Spirit Guide"},{"qty":4,"name":"Dark Ritual"},{"qty":4,"name":"Rite of Flame"},{"qty":3,"name":"Desperate Ritual"},{"qty":3,"name":"Seething Song"},{"qty":3,"name":"Pact of Negation"},{"qty":2,"name":"Shatterskull Smashing"},{"qty":4,"name":"Agadeem's Awakening"}],"side":[{"qty":4,"name":"Pyroblast"},{"qty":3,"name":"Veil of Summer"},{"qty":2,"name":"Defense Grid"},{"qty":3,"name":"Abrade"},{"qty":3,"name":"Thoughtseize"}],"mainCount":60,"sideCount":15}}},{"id":"b5f2f793ca55","prompt":"expert-legacy-creative-technique","brew":true,"left":{"text":"This is a brew called **RG \"Post Technique,\"** built on the land base of the Cloudpost deck from recent results.\n\n**Directions I considered:**\n1. **The Mono-Red Prison package:** Ancient Tomb, City of Traitors, Chrome Mox, Simian Spirit Guide and Chalice of the Void, with green splashed in for the Devastator.\n2. **A blue Show and Tell / Omniscience shell:** casting Apex Devastator for free with Omniscience out still triggers cascade.\n3. **The Cloudpost / Tron land package, played in red and green.** This is the one I picked.\n\nThe land deck wins because both of your engines skip lands. Creative Technique reveals until it finds a nonland card, and cascade does the same, so a deck that gets its fast mana from lands (Cloudpost, Urza's Tower with Planar Nexus, Ancient Tomb) instead of rituals, Moxen or Spirit Guides turns almost every reveal into a big spell.\n\n**The plan:** Crop Rotation, Echoing Deeps and Vesuva put together Cloudpost and Urza's Tower mana by turn 3 or 4, and then you cast Creative Technique ({4}{R}). It hits a payoff:\n- **Apex Devastator:** cascades four times into anything under 10.\n- **Call Forth the Tempest:** cascades twice, often into another Technique, Ugin or Karn. Then it deals damage to each of the opponent's creatures equal to the total mana value of the other spells you cast that turn, so it usually wipes their board.\n- **Emrakul or Ulamog:** cascade skips them, but Technique can still flip them, for an extra turn or to exile two permanents.\n\nWith Karn, The One Ring and Ugin (colorless, so it fires its exile trigger off your own colorless spells), 18 of the 34 nonland cards are strong reveals. The rest are the land-fetching spells and Kozilek's Command.\n\n**Things to know:**\n- **Odds:** with no mulligans, on the play you have a 48.8% chance to see Technique by turn 3. You have a 90.8% chance to see a Cloudpost, Tower, Planar Nexus or Ancient Tomb, and a 43.3% chance to have both.\n- **Demonstrate:** you choose whether to copy Technique, but if you do, the opponent gets a copy too. Only copy it when they have little to gain.\n- **Land count:** I run 26 lands, compared with the usual 24–25 in Cloudpost decks. More lands means a cleaner Technique and better cascade hits, and there are no Spirit Guides to make up the difference.\n- **Hard-casting:** Call Forth costs {5}{R}{R}{R}, so it will mostly come off Technique or cascade.\n- **Sideboard:** it's aimed at the blue tempo decks, Esper's graveyard plan, and Ocelot Aggro and Cephalid Breakfast. The single artifacts (Karn's Sylex, Tormod's Crypt, Ensnaring Bridge) can also be fetched with Karn's −2.\n\nThe deck passed the legality check with no warnings.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Creative Technique"},{"qty":4,"name":"Call Forth the Tempest"},{"qty":3,"name":"Apex Devastator"},{"qty":3,"name":"Karn, the Great Creator"},{"qty":3,"name":"The One Ring"},{"qty":3,"name":"Ugin, Eye of the Storms"},{"qty":1,"name":"Emrakul, the Aeons Torn"},{"qty":1,"name":"Ulamog, the Ceaseless Hunger"},{"qty":4,"name":"Crop Rotation"},{"qty":4,"name":"Once Upon a Time"},{"qty":4,"name":"Kozilek's Command"},{"qty":4,"name":"Cloudpost"},{"qty":4,"name":"Planar Nexus"},{"qty":4,"name":"Urza's Tower"},{"qty":2,"name":"Glimmerpost"},{"qty":2,"name":"Echoing Deeps"},{"qty":1,"name":"Vesuva"},{"qty":1,"name":"Ancient Tomb"},{"qty":3,"name":"Taiga"},{"qty":2,"name":"Karplusan Forest"},{"qty":1,"name":"Boseiju, Who Endures"},{"qty":1,"name":"Wooded Foothills"},{"qty":1,"name":"Mountain"}],"side":[{"qty":2,"name":"Pyroblast"},{"qty":2,"name":"Veil of Summer"},{"qty":2,"name":"Force of Vigor"},{"qty":2,"name":"Fiery Confluence"},{"qty":2,"name":"Soul-Guide Lantern"},{"qty":1,"name":"Karn's Sylex"},{"qty":1,"name":"Tormod's Crypt"},{"qty":1,"name":"Ensnaring Bridge"},{"qty":2,"name":"Disruptor Flute"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built and submitted a Gruul (red-green) fast-mana deck around your three cards. Nobody has played any of them in recent Legacy results, so this is an untested brew.\n\n## Decklist\n\n**Main deck (60)**\n- 4 Creative Technique\n- 4 Apex Devastator\n- 4 Call Forth the Tempest\n- 2 Emrakul, the Aeons Torn\n- 4 Fury\n- 4 Fable of the Mirror-Breaker\n- 3 The One Ring\n- 2 Sibylline Soothsayer\n- 4 Grim Monolith\n- 4 Chrome Mox\n- 2 Lotus Petal\n- 4 Simian Spirit Guide\n- 2 Elvish Spirit Guide\n- 4 Ancient Tomb\n- 4 City of Traitors\n- 2 Taiga\n- 6 Mountain\n- 1 Forest\n\n**Sideboard (15)**\n- 4 Leyline of the Void\n- 4 Pyroblast\n- 2 Force of Vigor\n- 2 Fiery Confluence\n- 2 Mindbreak Trap\n- 1 Pithing Needle\n\n## The plan\nUse Ancient Tomb, City of Traitors and fast mana to cast Creative Technique on turn 2 or 3. It casts a random nonland card from your deck for free. Your three cards feed into each other:\n- **Apex Devastator** cascades four times. Each cascade can hit anything except Emrakul, including Call Forth or another Technique.\n- **Call Forth the Tempest** cascades twice. It then deals damage to each opposing creature equal to the total mana value of the other spells you cast that turn. After a chain like Apex → Call Forth, that wipes their board.\n- **Creative Technique** can hit anything, including Apex Devastator or Emrakul.\n\n## Key cards\n- **Emrakul (2):** The only card cascade can't reach, but Technique can. Casting it for free still gives you the extra turn. It's colorless, so you can't use it on Chrome Mox.\n- **Sibylline Soothsayer (2):** A backup for Technique. It skips cards with mana value under 3, so it never hits your 0- and 2-mana artifacts. If it exiles Apex or Call Forth, the card gets suspend and is cast free three turns later. Because it's cast, the cascades still trigger. It's slow, but it adds more ways to start a chain.\n- **Fury, Fable, The One Ring:** These come from the Mono-Red Prison deck. They're strong to cast early and good to hit off a cascade. Fury can also be cast for free by exiling a red card to kill creatures, which matters a lot against Tempo decks.\n- **Leaving out Chalice and Blood Moon:** A cascade or Technique casts Chalice with X=0, which shuts off your own Moxen and Petals. Blood Moon would turn your Ancient Tombs and Cities into Mountains.\n- **Don't copy Creative Technique.** Its demonstrate option gives the opponent a free random spell too. Only copy it when you're desperate.\n\n## Mana\nI borrowed the fast mana from Mono-Red Prison, which runs about 16.8 lands. This deck has 17 lands plus 16 non-land mana cards: Grim Monolith, Chrome Mox, Petal and the Spirit Guides. check_deck found no errors and recommended 19 lands. I stayed at 17 because more lands means fewer Moxen and Monoliths, and those are what make a turn-2 Technique possible. The cost is that 16 of the 42 other nonland cards are mana, so about 38% of Technique and cascade hits will be duds.\n\nGreen is light (9 sources, counting Chrome Mox and Petal) because you'll rarely hard-cast Apex. Your free casts don't need green mana.\n\n**Odds (on the play):**\n- 59% to have Technique or Soothsayer by turn 2.\n- 94.6% to have Technique, Call Forth, Apex or Soothsayer by turn 4.\n\n## Sideboarding\n- **Tempo decks (Esper, Izzet, Dimir; about 32% of results):** Bring in 4 Pyroblast and 2 Fiery Confluence. Take out Soothsayers, Elvish Spirit Guides and a Petal.\n- **Cephalid Breakfast, Oops All Spells, Doomsday:** Bring in 4 Leyline of the Void and Mindbreak Trap. Leyline only works if it's in your opening hand, since you can't cast it.\n- **The Epic Storm:** Mindbreak Trap is the card here. You're unlikely to cast it for free because of the three-spell requirement, but it's still worth bringing in.\n- **Mystic Forge, Affinity, Lands:** Bring in Force of Vigor, which you can cast for free by exiling Apex or Elvish Spirit Guide. Add Pithing Needle and Confluence.\n- **Out:** Cut Fable or One Ring before you cut any of the three core cards.\n\n## What I couldn't verify\n- All rules text, legality and play rates above come from the tools.\n- How well this performs is untested.\n- I'm assuming suspend casts Soothsayer's exiled card for free and that cascade triggers when it does. That's standard rules, but I didn't check it with a tool.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Creative Technique"},{"qty":4,"name":"Apex Devastator"},{"qty":4,"name":"Call Forth the Tempest"},{"qty":2,"name":"Emrakul, the Aeons Torn"},{"qty":4,"name":"Fury"},{"qty":3,"name":"The One Ring"},{"qty":4,"name":"Fable of the Mirror-Breaker"},{"qty":2,"name":"Sibylline Soothsayer"},{"qty":4,"name":"Chrome Mox"},{"qty":4,"name":"Simian Spirit Guide"},{"qty":2,"name":"Elvish Spirit Guide"},{"qty":4,"name":"Grim Monolith"},{"qty":2,"name":"Lotus Petal"},{"qty":4,"name":"Ancient Tomb"},{"qty":4,"name":"City of Traitors"},{"qty":2,"name":"Taiga"},{"qty":6,"name":"Mountain"},{"qty":1,"name":"Forest"}],"side":[{"qty":4,"name":"Leyline of the Void"},{"qty":4,"name":"Pyroblast"},{"qty":2,"name":"Force of Vigor"},{"qty":2,"name":"Fiery Confluence"},{"qty":2,"name":"Mindbreak Trap"},{"qty":1,"name":"Pithing Needle"}],"mainCount":60,"sideCount":15}}},{"id":"c30e6463f48d","prompt":"expert-legacy-kaalia","brew":true,"left":{"text":"This is a brew, so no tournament list backs it up. It's a Mardu (red, white, black) \"Kaalia Reanimator\": every big creature in the deck is an Angel or Demon, so each one works with both Kaalia and the reanimation spells.\n\n**Plan:** If a fatty is stuck in your hand, cast Kaalia (turn 2 or 3 with Dark Ritual and Lotus Petal) and attack. Her trigger puts Griselbrand, Atraxa or Serra's Emissary into play tapped and attacking. Lightning Greaves gives her haste and shroud (spells and abilities can't target her) so she can attack the turn she lands and survive to do it. If the fatty is in your graveyard instead, Faithless Looting or Collective Brutality discards it, and Reanimate, Animate Dead or Exhume brings it back. Thoughtseize and Unmask strip the opponent's answers either way. Unmask can be cast free by exiling Kaalia or Griselbrand, since both are black.\n\n**The three directions I sketched:**\n1. **Mardu Reanimator hybrid.** Takes the menu's Reanimator package (Reanimate, Animate Dead, Dark Ritual, Lotus Petal, Faithless Looting, discard) and makes Kaalia a second way to cheat out the same creatures.\n2. **Mardu midrange.** Kaalia with Swords to Plowshares, Greaves and castable 5-mana Dragons like Goldspan.\n3. **Mardu cheat deck.** Kaalia plus red's Sneak Attack.\n\n**I picked #1** because Griselbrand (a Demon) and Atraxa (an Angel) already fit Kaalia's trigger. That gives two routes to the same win instead of one fragile 4-mana 2/2.\n\n**Things to know:**\n- **Entomb is banned in Legacy** (I checked), so Looting and Brutality do the discarding instead.\n- **Archon of Cruelty doesn't work here.** It's an Archon, not an Angel, Demon or Dragon, so I left out Reanimator's usual 8-drop.\n- **Atraxa is never cast,** only put into play, so her green and blue cost doesn't matter. The deck checker's \"too few blue sources\" warning doesn't apply.\n- **I run 16 lands** where Reanimator lists average about 14.6, because Kaalia needs four mana in three colors.\n\n**Honest odds** (seven-card hands, no mulligans, on the play):\n- Kaalia plus a fatty by turn 3: about 35%.\n- A reanimation spell plus Looting or Brutality by turn 2: about 43%.\n- The two routes back each other up, so many hands that miss one have the other.\n\nThe sideboard is aimed at the current field: Pyroblast and Red Elemental Blast for the blue tempo decks, Abrade for Chalice of the Void and Sewer Combo, Surgical Extraction for opposing graveyard decks, and Swords to Plowshares for Ocelot and Eldrazi.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Kaalia of the Vast"},{"qty":4,"name":"Griselbrand"},{"qty":3,"name":"Atraxa, Grand Unifier"},{"qty":1,"name":"Serra's Emissary"},{"qty":4,"name":"Reanimate"},{"qty":4,"name":"Animate Dead"},{"qty":1,"name":"Exhume"},{"qty":4,"name":"Faithless Looting"},{"qty":2,"name":"Collective Brutality"},{"qty":4,"name":"Dark Ritual"},{"qty":4,"name":"Lotus Petal"},{"qty":4,"name":"Thoughtseize"},{"qty":3,"name":"Unmask"},{"qty":2,"name":"Lightning Greaves"},{"qty":2,"name":"Badlands"},{"qty":3,"name":"Scrubland"},{"qty":1,"name":"Plateau"},{"qty":3,"name":"Bloodstained Mire"},{"qty":3,"name":"Marsh Flats"},{"qty":1,"name":"Arid Mesa"},{"qty":3,"name":"Swamp"}],"side":[{"qty":3,"name":"Swords to Plowshares"},{"qty":2,"name":"Pyroblast"},{"qty":1,"name":"Red Elemental Blast"},{"qty":2,"name":"Abrade"},{"qty":2,"name":"Surgical Extraction"},{"qty":2,"name":"Stronghold Gambit"},{"qty":2,"name":"Duress"},{"qty":1,"name":"Fatal Push"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built Mardu Kaalia Cheats. The deck was accepted and is labelled a **brew**. Kaalia shows up in 0 recent Legacy lists, so there was nothing proven to copy. I took the mana base and disruption from Reanimator and built the rest around Kaalia.\n\n**Main deck (60)**\n- **Creatures (12):** 4 Kaalia of the Vast, 4 Griselbrand, 3 Atraxa, Grand Unifier, 1 Serra's Emissary\n- **Ways to cheat creatures in (12):** 2 Sneak Attack, 2 Stronghold Gambit, 4 Reanimate, 4 Animate Dead\n- **Fast mana (8):** 4 Dark Ritual, 4 Lotus Petal\n- **Discard and graveyard filling (12):** 4 Faithless Looting, 4 Thoughtseize, 2 Unmask, 2 Bitter Triumph\n- **Lands (16):** 3 Badlands, 2 Scrubland, 2 Plateau, 4 Bloodstained Mire, 3 Marsh Flats, 2 Swamp\n\n**Sideboard (15):** 2 Abrade, 3 Pyroblast, 2 Massacre, 2 Magus of the Moon, 2 Surgical Extraction, 2 Cabal Therapy, 2 Collective Brutality\n\n**The plan**\nPut an 8-mana creature onto the battlefield on turns 1–3 without paying for it. Kaalia is the main way: when she attacks, she puts an Angel, Demon or Dragon from your hand onto the battlefield, tapped and attacking. Every big creature card in your hand doubles as a reanimation target once it's in the graveyard. So when Kaalia doesn't show up, the same creatures win through other cheats.\n\n**Why these cards**\n- **The 8 big creatures are all Angels or Demons, so Kaalia can put every one into play.**\n  - Griselbrand (Demon): flying, lifelink, and you can pay 7 life to draw seven cards.\n  - Atraxa (Angel): its ETB reveals the top ten cards and you keep one of each card type. Its cost includes green and blue, which this deck can't make. It only ever enters by being cheated in.\n  - Serra's Emissary (Angel): gives you and your creatures protection from a card type you choose. Name \"creature\" against aggro or \"instant\" against tempo.\n  - I left out Archon of Cruelty on purpose. It's Reanimator's best target, but it's an Archon, so Kaalia can't put it into play.\n- **Sneak Attack works especially well with Kaalia.** Its {R} ability puts a creature from your hand into play with haste, so Kaalia can attack the turn you cast her. Her trigger then brings in Griselbrand. Sneak Attack sacrifices Kaalia at end of turn, but Griselbrand stays. It can also put a big creature into play directly.\n- **Stronghold Gambit** is a third way to cheat from your hand. Each player reveals a card from hand, and the cheapest creature revealed goes onto the battlefield, so if your opponent shows no creature, your Griselbrand comes in.\n- **Reanimate and Animate Dead** are the backup plan. Faithless Looting, Unmask and Bitter Triumph put the big creatures in the graveyard. Unmask can be cast for free by exiling a black card from your hand. Bitter Triumph can discard a card as its extra cost, and it doubles as creature removal.\n- **Entomb is banned in Legacy**, so the deck relies on Looting and those discard costs to fill the graveyard.\n\n**Odds (no mulligans, on the play, by turn 3)**\n- 95.2% to see at least one cheat (Kaalia, Sneak Attack, Gambit, Reanimate or Animate Dead).\n- 75.1% to see a big creature.\n- 71% to see both. Looting and Unmask improve the real number.\n- Kaalia herself: 48.8%. She's the best way to win, but you can't count on her every game.\n\n**The mana**\n- Kaalia needs red, white and black, so I'm running 16 lands, more than Reanimator's average of 14.6. All seven fetches can find any of the three dual lands.\n- Black sources: 14 lands, plus 4 Lotus Petal.\n- Red sources: 12 lands.\n- White sources: 11 lands, plus the Petals.\n- Dark Ritual plus two lands (one for red, one for white) casts Kaalia on turn 2.\n- The deck checker warned that I have few blue sources compared with Reanimator lists. That doesn't matter, because there are no blue cards in the deck. It also suggested about 19.6 lands, a generic figure. I went with 16 because the Petals and Rituals make up the difference.\n\n**Sideboarding against the current meta**\n- **Dimir Tempo and Izzet Tempo (the two tempo decks make up about 15% of the field):** bring in Pyroblast and Collective Brutality. Take out Bitter Triumph and Serra's Emissary.\n- **Ocelot Aggro, Death and Taxes and Eldrazi Aggro:** bring in Massacre (free if they control a Plains and you control a Swamp) and Abrade. Take out Unmask and Stronghold Gambit.\n- **Tron and Lands:** bring in Magus of the Moon and Surgical Extraction. Take out Bitter Triumph.\n- **Doomsday, OmniTell, Sneak and Show and Storm (the fast combo decks):** bring in Cabal Therapy and Pyroblast (against the blue decks). Take out Bitter Triumph and Gambit.\n- **Opposing Reanimator:** bring in Surgical Extraction.\n\n**What I couldn't check**\nI have no game results for this deck. The sideboard plan comes from what the meta tool shows is being played, not from testing.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Kaalia of the Vast"},{"qty":4,"name":"Griselbrand"},{"qty":3,"name":"Atraxa, Grand Unifier"},{"qty":1,"name":"Serra's Emissary"},{"qty":2,"name":"Sneak Attack"},{"qty":2,"name":"Stronghold Gambit"},{"qty":4,"name":"Reanimate"},{"qty":4,"name":"Animate Dead"},{"qty":4,"name":"Faithless Looting"},{"qty":4,"name":"Dark Ritual"},{"qty":4,"name":"Lotus Petal"},{"qty":4,"name":"Thoughtseize"},{"qty":2,"name":"Unmask"},{"qty":2,"name":"Bitter Triumph"},{"qty":3,"name":"Badlands"},{"qty":2,"name":"Scrubland"},{"qty":2,"name":"Plateau"},{"qty":4,"name":"Bloodstained Mire"},{"qty":3,"name":"Marsh Flats"},{"qty":2,"name":"Swamp"}],"side":[{"qty":2,"name":"Abrade"},{"qty":3,"name":"Pyroblast"},{"qty":2,"name":"Massacre"},{"qty":2,"name":"Magus of the Moon"},{"qty":2,"name":"Surgical Extraction"},{"qty":2,"name":"Cabal Therapy"},{"qty":2,"name":"Collective Brutality"}],"mainCount":60,"sideCount":15}}},{"id":"dd2e26fa1297","prompt":"expert-premodern-life","brew":true,"left":{"text":"I built a green-white combo deck (a brew) where your two cards give you endless life, and Test of Endurance wins the game from there.\n\n**How the combo works:** Daru Spiritualist gives +0/+2 every time one of your Clerics is targeted. The en-Kor creatures (Shaman, Nomads, Warrior) have a {0} ability that targets one of your creatures, and you can use it as many times as you like. Point it at a Cleric and that Cleric's toughness keeps going up with no limit. Shaman en-Kor is a Cleric, so it can target itself. Task Force does the same thing without Daru, getting +0/+3 each time it's targeted. Then sacrifice the huge creature to Worthy Cause (or to Starlit Sanctum, which only takes Clerics) and you gain that much life. Test of Endurance wins on your next upkeep, since you'll have well over 50 life. Worship backs it up.\n\n**Three directions I considered:**\n1. **White-black drain:** Unspeakable Symbol plus Starlit Sanctum's black ability as the kill. This is essentially the one recorded list that already plays these cards (\"Cephalid Breakfast\", one 5-0 league finish), so going this way would mostly rebuild an existing deck.\n2. **Mono-white:** Test of Endurance as the win, plus Swords to Plowshares from the menu. The mana is clean, but nothing finds your combo pieces.\n3. **Green-white tutors (chosen):** Takes Sylvan Library and Windswept Heath from the menu's green-white decks, plus Worldly Tutor. **I picked this because a two-card combo needs consistency most, and Worldly Tutor and Sylvan Library turn half a combo into the whole thing.**\n\n**Odds:** Counting only natural draws, you have about a 52% chance of holding an en-Kor, a Daru, Task Force or Worldly Tutor, and a sacrifice outlet by turn 4 on the play. That number is a bit low because it ignores Shaman + Daru as a complete pair and Sylvan Library's extra cards. Mother of Runes and Swords to Plowshares keep you alive and protect your pieces until then.\n\n**Things to know:**\n- **Green sources:** The deck check flagged 10 green sources, compared with about 15.7 in typical Enchantress lists. That's on purpose: green is only a splash for Worldly Tutor and Sylvan Library.\n- **Counters:** Stifle can counter Daru's trigger, so that matchup is weaker. The 3 Orim's Chant in the sideboard are there to make the opponent's spells sit out the turn you go off.\n- **Sideboard:** The rest is aimed at the top decks in the field: Seal of Cleansing and Naturalize for the enchantment decks, Circle of Protection: Red, Exalted Angel and the second Worship for Sligh, and Tormod's Crypt for the graveyard decks.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Daru Spiritualist"},{"qty":4,"name":"Shaman en-Kor"},{"qty":4,"name":"Nomads en-Kor"},{"qty":1,"name":"Warrior en-Kor"},{"qty":3,"name":"Task Force"},{"qty":3,"name":"Mother of Runes"},{"qty":1,"name":"Weathered Wayfarer"},{"qty":4,"name":"Worthy Cause"},{"qty":4,"name":"Worldly Tutor"},{"qty":4,"name":"Swords to Plowshares"},{"qty":3,"name":"Sylvan Library"},{"qty":1,"name":"Enlightened Tutor"},{"qty":2,"name":"Test of Endurance"},{"qty":1,"name":"Worship"},{"qty":3,"name":"Starlit Sanctum"},{"qty":4,"name":"Brushland"},{"qty":4,"name":"Windswept Heath"},{"qty":8,"name":"Plains"},{"qty":2,"name":"Forest"}],"side":[{"qty":3,"name":"Seal of Cleansing"},{"qty":2,"name":"Naturalize"},{"qty":3,"name":"Orim's Chant"},{"qty":2,"name":"Exalted Angel"},{"qty":2,"name":"Tormod's Crypt"},{"qty":1,"name":"Worship"},{"qty":2,"name":"Circle of Protection: Red"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built a mono-white Daru Spiritualist / Worthy Cause combo deck. It wins with **Test of Endurance**, which is 50-life alt-win.\n\n**The plan**\n- Daru Spiritualist gives a Cleric +0/+2 every time that Cleric becomes the target of a spell or ability.\n- The en-Kor creatures have a free ability: \"{0}: …dealt to target creature you control instead.\"\n- So you aim an en-Kor's {0} ability at a Cleric again and again for no mana, and that Cleric gets as much toughness as you want.\n- Then sacrifice it to Worthy Cause and gain life equal to its toughness. That's as much life as you like.\n- If Test of Endurance is on the battlefield, you win at your next upkeep (it checks for 50 or more life).\n\n**Key cards**\n- **Shaman en-Kor:** It's a Cleric and it has the free ability, so it can target itself. Shaman plus Spiritualist is a full combo by itself.\n- **Nomads en-Kor:** The 1-mana way to target Spiritualist.\n- **Task Force:** A backup that skips Spiritualist. It gets +0/+3 each time it's targeted, so en-Kor plus Task Force plus Worthy Cause also gives you as much life as you want.\n- **Worthy Cause:** Costs W, and you sacrifice a creature as part of the cost. With buyback (+{2}) it goes back to your hand, so you can use it again after a counterspell or removal.\n- **Starlit Sanctum:** A second sacrifice outlet built into a land: {W}, {T}, sacrifice a Cleric, gain life equal to its toughness. Weathered Wayfarer can fetch it.\n- **Test of Endurance (3) and Enlightened Tutor (3):** Six ways to find the win. Tutor can also find Worship.\n- **Mother of Runes and Benevolent Bodyguard:** Protect your combo creature from removal in response.\n- **Soltari Priest (a Cleric with shadow and protection from red) and Swords to Plowshares:** A real backup plan. Once your life is that high, burn and creature decks basically can't kill you, so you can just attack.\n\n**Odds (no mulligans):** On the play, you see Spiritualist or Task Force, an en-Kor, and a sacrifice outlet all together by turn 4 about 46% of the time. You see Test of Endurance or a Tutor by turn 5 about 65% of the time. This deck is a fun brew, not a tier-one deck.\n\n**Mana:** 16 Plains and 4 Starlit Sanctum (20 lands). check_deck suggested about 23 lands. I went lower because the average mana value is only 1.73, nothing costs more than 4, and the one proven list with these cards ran 21.\n\n**Sideboarding**\n- **Sligh / Goblins:** Bring in Circle of Protection: Red and the second Worship. Soltari Priest's protection from red already helps. Huge life ends these games even without Test.\n- **Enchantress / Replenish:** Bring in Seal of Cleansing and Disenchant. Add Tormod's Crypt against Replenish.\n- **Stiflenought / Psychatog / UW Control:** Bring in Orim's Chant to stop them casting spells on your combo turn. If Worthy Cause gets countered, Starlit Sanctum still works.\n- **Terrageddon:
