d Mystic Remora: Azorius \"Remora Basics\" control.\n\n**The plan**\nPlay Mystic Remora on turn 1 and collect cards while Legacy players cast their usual cantrips and Forces. Back to Basics locks down their dual lands, which makes the {4} Remora tax very hard to pay. After that, Force of Will, Swords and Teferi keep control until Quantum Riddler, Jace or Phelia win the game.\n\n**Main deck (60)**\n- **Remora package:** 4 Mystic Remora, 2 Back to Basics, 2 Stifle, 3 Phelia, Exuberant Shepherd, 2 Teferi, Time Raveler\n- **Card flow:** 4 Brainstorm, 4 Ponder, 3 Tamiyo, Inquisitive Student, 1 Lórien Revealed\n- **Interaction:** 4 Force of Will, 2 Force of Negation, 4 Swords to Plowshares, 1 Wrath of the Skies\n- **Win conditions:** 3 Quantum Riddler, 1 Jace, the Mind Sculptor\n- **Lands (20):** 4 Flooded Strand, 2 Prismatic Vista, 1 Scalding Tarn, 3 Tundra, 6 Island, 2 Plains, 1 Meticulous Archive, 1 Wasteland\n\n**Why these cards**\n- **Mystic Remora:** It draws whenever an opponent casts a noncreature spell, unless they pay {4}. The decks that cast the most noncreature spells are the most popular ones: Dimir Tempo (10.2%), Tron (7.1%), Doomsday, OmniTell, Storm and Beanstalk.\n- **Back to Basics:** It stops nonbasic lands from untapping. With it out, opponents on dual lands can almost never pay {4}, so every spell they cast draws you a card.\n- **Ways to keep Remora around:** Its upkeep cost grows by {1} every turn, so the deck has ways to reset it or skip the payment:\n  - **Stifle** counters Remora's upkeep trigger, so it gets no new age counter and you pay nothing that turn.\n  - **Phelia** can attack and exile your own Remora. It comes back at end of turn with no age counters, and Phelia gets a +1/+1 counter.\n  - **Teferi's −3** returns Remora to your hand and draws you a card. Teferi's static ability also stops opponents from casting spells at instant speed.\n- **Tamiyo:** She transforms when you draw your third card in a turn. One Remora draw plus a Brainstorm on the opponent's turn does that.\n- **Quantum Riddler:** Warp lets you cast it for {1}{U}, and it draws an extra card whenever you have one or fewer cards in hand. That turns your drawn cards into a big flier.\n\n**The mana**\nI borrowed the mana base from Azorius Control. check_deck found no problems against 36 real lists: 20 lands (they average 20.6), 18.5 blue sources (16.9), 13.5 white sources (12.5).\n- I leaned on basics and fetch lands that can find basics so that Back to Basics hurts you less than the opponent.\n- There is only one Wasteland and one Meticulous Archive, and Lórien Revealed can be cycled for an Island.\n\n**Sideboard plan**\n- **Dimir/Izzet Tempo:** Bring in +2 Hydroblast. Remora is at its best here, so keep all four.\n- **Doomsday, Storm, OmniTell, Sneak and Show:** Bring in +Flusterstorm, +Deafening Silence, +Lavinia and +Consign to Memory. Cut Swords and Wrath.\n- **Reanimator:** Bring in +2 Containment Priest, +Rest in Peace, +Surgical Extraction and +Consign.\n- **Tron, Eldrazi, Lands:** Bring in +3 Consign to Memory (it counters colorless spells and triggers) and +Prismatic Ending. Back to Basics is your best card in these matchups.\n- **Ocelot Aggro, Death and Taxes, Eldrazi:** Bring in +Wrath of the Skies, +Solitude and +Prismatic Ending. Cut 2–3 Remora, since creature spells don't trigger it.\n\n**Odds and caveats**\n- **Draw odds (no mulligans):** You have Remora in your opening hand 39.9% of the time. By turn 4 on the play it's 52.8%, plus whatever Brainstorm and Ponder find. You'll have both Remora and Back to Basics by turn 4 only 15.3% of the time, so treat the lock as a bonus rather than the deck's engine.\n- **Wrath of the Skies kills your own Remora** at any X of 1 or more, so play Wrath before Remora or after it has done its job.\n- **Untested:** In the last 90 days, Remora showed up in a single tournament list (a Doomsday deck). How well this deck performs is untested. The interaction and mana are borrowed from proven Azorius lists.\n- **Creature decks are the weak spot:** Remora is weakest against creature decks. Ocelot Aggro, Eldrazi Aggro and Death and Taxes make up about 18% of the field.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Mystic Remora"},{"qty":3,"name":"Tamiyo, Inquisitive Student"},{"qty":3,"name":"Phelia, Exuberant Shepherd"},{"qty":3,"name":"Quantum Riddler"},{"qty":2,"name":"Teferi, Time Raveler"},{"qty":1,"name":"Jace, the Mind Sculptor"},{"qty":4,"name":"Force of Will"},{"qty":2,"name":"Force of Negation"},{"qty":4,"name":"Brainstorm"},{"qty":4,"name":"Ponder"},{"qty":4,"name":"Swords to Plowshares"},{"qty":2,"name":"Back to Basics"},{"qty":2,"name":"Stifle"},{"qty":1,"name":"Wrath of the Skies"},{"qty":1,"name":"Lórien Revealed"},{"qty":4,"name":"Flooded Strand"},{"qty":2,"name":"Prismatic Vista"},{"qty":1,"name":"Scalding Tarn"},{"qty":3,"name":"Tundra"},{"qty":6,"name":"Island"},{"qty":2,"name":"Plains"},{"qty":1,"name":"Meticulous Archive"},{"qty":1,"name":"Wasteland"}],"side":[{"qty":3,"name":"Consign to Memory"},{"qty":2,"name":"Containment Priest"},{"qty":1,"name":"Surgical Extraction"},{"qty":2,"name":"Hydroblast"},{"qty":1,"name":"Wrath of the Skies"},{"qty":1,"name":"Rest in Peace"},{"qty":1,"name":"Lavinia, Azorius Renegade"},{"qty":1,"name":"Flusterstorm"},{"qty":1,"name":"Solitude"},{"qty":1,"name":"Prismatic Ending"},{"qty":1,"name":"Deafening Silence"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built this as a brew: Azorius \"Remora Prison\". It's 60 cards plus a 15-card sideboard, and the deck checker found no errors.\n\n**Directions I considered:**\n1. **Dimir Tempo package with Remora:** Thoughtseize, Fatal Push and Daze, with Remora as extra card draw.\n2. **Beanstalk Control shell:** Remora doesn't fit well here. That deck's card draw comes from casting spells that cost 5 or more, and Remora is a 1-drop.\n3. **Azorius Control shell built around Remora:** Remora lets the opponent stop each draw by paying {4}, so this xt upkeep, pay {3}{U}{U}. If you don't, you lose the game."},"Shatterskull Smashing":{"cost":"{X}{R}{R}","type":"Sorcery // Land","text":"Shatterskull Smashing deals X damage divided as you choose among up to two target creatures and/or planeswalkers. If X is 6 or more, Shatterskull Smashing deals twice X damage divided as you choose among them instead. // As this land enters, you may pay 3 life. If you don't, it enters tapped.\n{T}: Add {R}."},"Agadeem's Awakening":{"cost":"{X}{B}{B}{B}","type":"Sorcery // Land","text":"Return from your graveyard to the battlefield any number of target creature cards that each have a different mana value X or less. // As this land enters, you may pay 3 life. If you don't, it enters tapped.\n{T}: Add {B}."},"Wear Down":{"cost":"{1}{G}","type":"Sorcery","text":"Gift a card (You may promise an opponent a gift as you cast this spell. If you do, they draw a card before its other effects.)\nDestroy target artifact or enchantment. If the gift was promised, instead destroy two target artifacts and/or enchantments."},"Defense Grid":{"cost":"{2}","type":"Artifact","text":"Each spell costs {3} more to cast except during its controller's turn."},"Veil of Summer":{"cost":"{G}","type":"Instant","text":"Draw a card if an opponent has cast a blue or black spell this turn. Spells you control can't be countered this turn. You and permanents you control gain hexproof from blue and from black until end of turn. (You and they can't be the targets of blue or black spells or abilities your opponents control.)"},"Leyline of Sanctity":{"cost":"{2}{W}{W}","type":"Enchantment","text":"If this card is in your opening hand, you may begin the game with it on the battlefield.\nYou have hexproof. (You can't be the target of spells or abilities your opponents control.)"},"Street Wraith":{"cost":"{3}{B}{B}","type":"Creature — Wraith","text":"Swampwalk (This creature can't be blocked as long as defending player controls a Swamp.)\nCycling—Pay 2 life. (Pay 2 life, Discard this card: Draw a card.)","pt":"3/4"},"Creative Technique":{"cost":"{4}{R}","type":"Sorcery","text":"Demonstrate (When you cast this spell, you may copy it. If you do, choose an opponent to also copy it.)\nShuffle your library, then reveal cards from the top of it until you reveal a nonland card. Exile that card and put the rest on the bottom of your library in a random order. You may cast the exiled card without paying its mana cost."},"Call Forth the Tempest":{"cost":"{5}{R}{R}{R}","type":"Sorcery","text":"Cascade, cascade (When you cast this spell, exile cards from the top of your library until you exile a nonland card that costs less. You may cast it without paying its mana cost. Put the exiled cards on the bottom of your library in a random order. Then do it again.)\nCall Forth the Tempest deals damage to each creature your opponents control equal to the total mana value of other spells you've cast this turn."},"Apex Devastator":{"cost":"{8}{G}{G}","type":"Creature — Chimera Hydra","text":"Cascade, cascade, cascade, cascade (When you cast this spell, exile cards from the top of your library until you exile a nonland card that costs less. You may cast it without paying its mana cost. Put the exiled cards on the bottom in a random order. Multiple instances of cascade each trigger separately.)","pt":"10/10"},"Ugin, Eye of the Storms":{"cost":"{7}","type":"Legendary Planeswalker — Ugin","text":"When you cast this spell, exile up to one target permanent that's one or more colors.\nWhenever you cast a colorless spell, exile up to one target permanent that's one or more colors.\n+2: You gain 3 life and draw a card.\n0: Add {C}{C}{C}.\n−11: Search your library for any number of colorless nonland cards, exile them, then shuffle. Until end of turn, you may cast those cards without paying their mana costs."},"Emrakul, the Aeons Torn":{"cost":"{15}","type":"Legendary Creature — Eldrazi","text":"This spell can't be countered.\nWhen you cast this spell, take an extra turn after this one.\nFlying, protection from spells that are one or more colors, annihilator 6\nWhen Emrakul is put into a graveyard from anywhere, its owner shuffles their graveyard into their library.","pt":"15/15"},"Ulamog, the Ceaseless Hunger":{"cost":"{10}","type":"Legendary Creature — Eldrazi","text":"When you cast this spell, exile two target permanents.\nIndestructible\nWhenever Ulamog attacks, defending player exiles the top twenty cards of their library.","pt":"10/10"},"Crop Rotation":{"cost":"{G}","type":"Instant","text":"As an additional cost to cast this spell, sacrifice a land.\nSearch your library for a land card, put that card onto the battlefield, then shuffle."},"Once Upon a Time":{"cost":"{1}{G}","type":"Instant","text":"If this spell is the first spell you've cast this game, you may cast it without paying its mana cost.\nLook at the top five cards of your library. You may reveal a creature or land card from among them and put it into your hand. Put the rest on the bottom of your library in a random order."},"Cloudpost":{"cost":"","type":"Land — Locus","text":"This land enters tapped.\n{T}: Add {C} for each Locus on the battlefield."},"Glimmerpost":{"cost":"","type":"Land — Locus","text":"When this land enters, you gain 1 life for each Locus on the battlefield.\n{T}: Add {C}."},"Echoing Deeps":{"cost":"","type":"Land — Cave","text":"You may have this land enter tapped as a copy of any land card in a graveyard, except it's a Cave in addition to its other types.\n{T}: Add {C}."},"Vesuva":{"cost":"","type":"Land","text":"You may have this land enter tapped as a copy of any land on the battlefield."},"Taiga":{"cost":"","type":"Land — Mountain Forest","text":"({T}: Add {R} or {G}.)"},"Boseiju, Who Endures":{"cost":"","type":"Legendary Land","text":"{T}: Add {G}.\nChannel — {1}{G}, Discard this card: Destroy target artifact, enchantment, or nonbasic land an opponent controls. That player may search their library for a land card with a basic land type, put it onto the battlefield, then shuffle. This ability costs {1} less to activate for each legendary creature you control."},"Force of Vigor":{"cost":"{2}{G}{G}","type":"Instant","text":"If it's not your turn, you may exile a green card from your hand rather than pay this spell's mana cost.\nDestroy up to two target artifacts and/or enchantments."},"Soul-Guide Lantern":{"cost":"{1}","type":"Artifact","text":"When this artifact enters, exile target card from a graveyard.\n{T}, Sacrifice this artifact: Exile each opponent's graveyard.\n{1}, {T}, Sacrifice this artifact: Draw a card."},"Karn's Sylex":{"cost":"{3}","type":"Legendary Artifact","text":"Karn's Sylex enters tapped.\nPlayers can't pay life to cast spells or to activate abilities that aren't mana abilities.\n{X}, {T}, Exile Karn's Sylex: Destroy each nonland permanent with mana value X or less. Activate only as a sorcery."},"Fury":{"cost":"{3}{R}{R}","type":"Creature — Elemental Incarnation","text":"Double strike\nWhen this creature enters, it deals 4 damage divided as you choose among any number of target creatures and/or planeswalkers.\nEvoke—Exile a red card from your hand.","pt":"3/3"},"Fable of the Mirror-Breaker":{"cost":"{2}{R}","type":"Enchantment — Saga // Enchantment Creature — Goblin Shaman","text":"(As this Saga enters and after your draw step, add a lore counter.)\nI — Create a 2/2 red Goblin Shaman creature token with \"Whenever this token attacks, create a Treasure token.\"\nII — You may discard up to two cards. If you do, draw that many cards.\nIII — Exile this Saga, then return it to the battlefield transformed under your control. // {1}, {T}: Create a token that's a copy of another target nonlegendary creature you control, except it has haste. Sacrifice it at the beginning of the next end step."},"Sibylline Soothsayer":{"cost":"{2}{R}","type":"Creature — Human Warlock","text":"Temporal Foresight — When this creature enters, reveal cards from the top of your library until you reveal a nonland card with mana value 3 or greater. Exile that card with three time counters on it. If it doesn't have suspend, it gains suspend. Put the rest of the revealed cards on the bottom of your library in a random order.","pt":"3/2"},"Leyline of the Void":{"cost":"{2}{B}{B}","type":"Enchantment","text":"If this card is in your opening hand, you may begin the game with it on the battlefield.\nIf a card would be put into an opponent's graveyard from anywhere, exile it instead."},"Mindbreak Trap":{"cost":"{2}{U}{U}","type":"Instant — Trap","text":"If an opponent cast three or more spells this turn, you may pay {0} rather than pay this spell's mana cost.\nExile any number of target spells."},"Kaalia of the Vast":{"cost":"{1}{R}{W}{B}","type":"Legendary Creature — Human Cleric","text":"Flying\nWhenever Kaalia attacks an opponent, you may put an Angel, Demon, or Dragon creature card from your hand onto the battlefield tapped and attacking that opponent.","pt":"2/2"},"Atraxa, Grand Unifier":{"cost":"{3}{G}{W}{U}{B}","type":"Legendary Creature — Phyrexian Angel","text":"Flying, vigilance, deathtouch, lifelink\nWhen Atraxa enters, reveal the top ten cards of your library. For each card type, you may put a card of that type from among the revealed cards into your hand. Put the rest on the bottom of your library in a random order. (Artifact, battle, creature, enchantment, instant, land, planeswalker, and sorcery are card types.)","pt":"7/7"},"Serra's Emissary":{"cost":"{4}{W}{W}{W}","type":"Creature — Angel","text":"Flying\nAs this creature enters, choose a card type.\nYou and creatures you control have protection from the chosen card type.","pt":"7/7"},"Lightning Greaves":{"cost":"{2}","type":"Artifact — Equipment","text":"Equipped creature has haste and shroud. (It can't be the target of spells or abilities.)\nEquip {0}"},"Scrubland":{"cost":"","type":"Land — Plains Swamp","text":"({T}: Add {W} or {B}.)"},"Plateau":{"cost":"","type":"Land — Mountain Plains","text":"({T}: Add {R} or {W}.)"},"Marsh Flats":{"cost":"","type":"Land","text":"{T}, Pay 1 life, Sacrifice this land: Search your library for a Plains or Swamp card, put it onto the battlefield, then shuffle."},"Stronghold Gambit":{"cost":"{1}{R}","type":"Sorcery","text":"Each player chooses a card in their hand. Then each player reveals their chosen card. The owner of each creature card revealed this way with the lowest mana value puts it onto the battlefield."},"Sneak Attack":{"cost":"{3}{R}","type":"Enchantment","text":"{R}: You may put a creature card from your hand onto the battlefield. That creature gains haste. Sacrifice the creature at the beginning of the next end step."},"Bitter Triumph":{"cost":"{1}{B}","type":"Instant","text":"As an additional cost to cast this spell, discard a card or pay 3 life.\nDestroy target creature or planeswalker."},"Magus of the Moon":{"cost":"{2}{R}","type":"Creature — Human Wizard","text":"Nonbasic lands are Mountains.","pt":"2/2"},"Daru Spiritualist":{"cost":"{1}{W}","type":"Creature — Human Cleric","text":"Whenever a Cleric creature you control becomes the target of a spell or ability, it gets +0/+2 until end of turn.","pt":"1/1"},"Shaman en-Kor":{"cost":"{1}{W}","type":"Creature — Kor Cleric Shaman","text":"{0}: The next 1 damage that would be dealt to this creature this turn is dealt to target creature you control instead.\n{1}{W}: The next time a source of your choice would deal damage to target creature this turn, that damage is dealt to this creature instead.","pt":"1/2"},"Nomads en-Kor":{"cost":"{W}","type":"Creature — Kor Nomad Soldier","text":"{0}: The next 1 damage that would be dealt to this creature this turn is dealt to target creature you control instead.","pt":"1/1"},"Warrior en-Kor":{"cost":"{W}{W}","type":"Creature — Kor Warrior Knight","text":"{0}: The next 1 damage that would be dealt to this creature this turn is dealt to target creature you control instead.","pt":"2/2"},"Task Force":{"cost":"{2}{W}","type":"Creature — Human Rebel","text":"Whenever this creature becomes the target of a spell or ability, it gets +0/+3 until end of turn.","pt":"1/3"},"Mother of Runes":{"cost":"{W}","type":"Creature — Human Cleric","text":"{T}: Target creature you control gains protection from the color of your choice until end of turn.","pt":"1/1"},"Weathered Wayfarer":{"cost":"{W}","type":"Creature — Human Nomad Cleric","text":"{W}, {T}: Search your library for a land card, reveal it, put it into your hand, then shuffle. Activate only if an opponent controls more lands than you.","pt":"1/1"},"Worthy Cause":{"cost":"{W}","type":"Instant","text":"Buyback {2} (You may pay an additional {2} as you cast this spell. If you do, put this card into your hand as it resolves.)\nAs an additional cost to cast this spell, sacrifice a creature.\nYou gain life equal to the sacrificed creature's toughness."},"Test of Endurance":{"cost":"{2}{W}{W}","type":"Enchantment","text":"At the beginning of your upkeep, if you have 50 or more life, you win the game."},"Worship":{"cost":"{3}{W}","type":"Enchantment","text":"If you control a creature, damage that would reduce your life total to less than 1 reduces it to 1 instead."},"Starlit Sanctum":{"cost":"","type":"Land","text":"{T}: Add {C}.\n{W}, {T}, Sacrifice a Cleric creature: You gain life equal to the sacrificed creature's toughness.\n{B}, {T}, Sacrifice a Cleric creature: Target player loses life equal to the sacrificed creature's power."},"Orim's Chant":{"cost":"{W}","type":"Instant","text":"Kicker {W} (You may pay an additional {W} as you cast this spell.)\nTarget player can't cast spells this turn. If this spell was kicked, creatures can't attack this turn."},"Soltari Priest":{"cost":"{W}{W}","type":"Creature — Soltari Cleric","text":"Protection from red\nShadow (This creature can block or be blocked by only creatures with shadow.)","pt":"2/1"},"Benevolent Bodyguard":{"cost":"{W}","type":"Creature — Human Cleric","text":"Sacrifice this creature: Target creature you control gains protection from the color of your choice until end of turn.","pt":"1/1"},"Disenchant":{"cost":"{1}{W}","type":"Instant","text":"Destroy target artifact or enchantment."},"Mystic Remora":{"cost":"{U}","type":"Enchantment","text":"Cumulative upkeep {1} (At the beginning of your upkeep, put an age counter on this permanent, then sacrifice it unless you pay its upkeep cost for each age counter on it.)\nWhenever an opponent casts a noncreature spell, you may draw a card unless that player pays {4}."},"Jace, the Mind Sculptor":{"cost":"{2}{U}{U}","type":"Legendary Planeswalker — Jace","text":"+2: Look at the top card of target player's library. You may put that card on the bottom of that player's library.\n0: Draw three cards, then put two cards from your hand on top of your library in any order.\n−1: Return target creature to its owner's hand.\n−12: Exile all cards from target player's library, then that player shuffles their hand into their library."},"Null Rod":{"cost":"{2}","type":"Artifact","text":"Activated abilities of artifacts can't be activated."},"Damping Sphere":{"cost":"{2}","type":"Artifact","text":"If a land is tapped for two or more mana, it produces {C} instead of any other type and amount.\nEach spell a player casts costs {1} more to cast for each other spell that player has cast this turn."},"Narset, Parter of Veils":{"cost":"{1}{U}{U}","type":"Legendary Planeswalker — Narset","text":"Each opponent can't draw more than one card each turn.\n−2: Look at the top four cards of your library. You may reveal a noncreature, nonland card from among them and put it into your hand. Put the rest on the bottom of your library in a random order."}}}</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const picks = new Map();
  let db = null;
  let canWrite = false;
  let current = 0;
  let chain = Promise.resolve();
  let advanceTimer = null;
  const brewsOnly = document.getElementById("brewsOnly");
  const unjudgedOnly = document.getElementById("unjudgedOnly");

  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
    }
    for (const kid of kids) if (kid) n.append(kid);
    return n;
  };
  const judged = (id) => Boolean(picks.get(id) && picks.get(id).winner);
  const inView = (i) => (!brewsOnly.checked || DATA.pairs[i].brew) && (!unjudgedOnly.checked || !judged(DATA.pairs[i].id) || i === current);

  /** Card -> copies across main, side and commander. */
  function counts(deck) {
    const m = new Map();
    if (!deck) return m;
    for (const zone of ["commander", "main", "side"]) {
      for (const c of deck[zone] || []) {
        const k = (zone === "side" ? "SB: " : "") + c.name;
        m.set(k, (m.get(k) || 0) + c.qty);
      }
    }
    return m;
  }
  function diff(a, b) {
    const onlyA = [];
    const onlyB = [];
    const both = [];
    for (const k of new Set([...a.keys(), ...b.keys()])) {
      const x = a.get(k) || 0;
      const y = b.get(k) || 0;
      const shared = Math.min(x, y);
      if (shared) both.push(`${shared} ${k}`);
      if (x > shared) onlyA.push(`${x - shared} ${k}`);
      if (y > shared) onlyB.push(`${y - shared} ${k}`);
    }
    const byMain = (s) => (s.includes("SB: ") ? 1 : 0);
    const sort = (xs) => xs.sort((p, q) => byMain(p) - byMain(q) || p.replace(/^\d+ /, "").localeCompare(q.replace(/^\d+ /, "")));
    return { onlyA: sort(onlyA), onlyB: sort(onlyB), both: sort(both) };
  }
  /** The reply's opening: its first two sentences, where answers put the plan. */
  function opening(text) {
    if (!text) return "";
    const clean = text.replace(/\*\*/g, "").replace(/\s+/g, " ").trim();
    const parts = clean.match(/[^.!?]+[.!?]+/g) || [clean];
    const out = parts.slice(0, 2).join(" ").trim();
    return out.length > 360 ? out.slice(0, 357) + "…" : out;
  }

  function renderProgress() {
    const pool = DATA.pairs.filter((p) => !brewsOnly.checked || p.brew);
    const done = pool.filter((p) => judged(p.id)).length;
    document.getElementById("progress").replaceChildren(el("b", { text: `${done} of ${pool.length}` }), brewsOnly.checked ? " brew pairs judged" : " pairs judged");
  }

  function save(patch, advance) {
    if (!db || !canWrite) return;
    const p = DATA.pairs[current];
    const body = { ...(picks.get(p.id) || {}), ...patch, pair: p.id, prompt: p.prompt, quick: true, updatedAt: new Date().toISOString() };
    picks.set(p.id, body);
    sync();
    renderProgress();
    const status = document.getElementById("saved");
    status.textContent = "Saving…";
    chain = chain
      .then(() => db.collection("pairs").doc(p.id).set(body))
      .then(() => { status.textContent = advance ? "Saved. Next pair in a moment (change your mind with Previous)." : "Saved"; })
      .catch((e) => { status.textContent = e && e.code === "invalid_argument" ? "Only the owner can save picks on this page." : "Could not save. Try again in a moment."; });
    if (advance) {
      clearTimeout(advanceTimer);
      advanceTimer = setTimeout(() => go(1), 900);
    }
  }

  /** The whole list, by zone; lines with more copies than the other deck are highlighted. */
  /** A card name that shows the card's text on hover, focus or tap (artifact pages can't load outside images). */
  function cardName(name) {
    return el("span", { class: "card", "data-card": name, tabindex: "0", text: name });
  }
  const peek = document.getElementById("peek");
  let peekFor = null;
  function showPeek(target, x, y) {
    const name = target.dataset.card;
    const c = DATA.cards && DATA.cards[name];
    if (name !== peekFor) {
      peekFor = name;
      // el() skips null children; replaceChildren would render them as the text "null".
      peek.replaceChildren(
        ...[
          el("div", { class: "pk-head" }, el("span", { text: name }), c ? el("span", { class: "pk-cost", text: c.cost }) : null),
          c ? el("div", { class: "pk-type", text: c.type }) : el("div", { class: "pk-type", text: "No card text on file." }),
          c ? el("div", { class: "pk-text", text: c.text }) : null,
          c && c.pt ? el("div", { class: "pk-pt", text: c.pt }) : null,
        ].filter(Boolean),
      );
    }
    peek.classList.add("on");
    const w = peek.offsetWidth;
    const h = peek.offsetHeight;
    peek.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x + 16)) + "px";
    peek.style.top = Math.max(8, Math.min(window.innerHeight - h - 8, y - h / 2)) + "px";
  }
  function hidePeek() { peek.classList.remove("on"); }
  document.addEventListener("mouseover", (e) => { const t = e.target.closest && e.target.closest(".card"); if (t) showPeek(t, e.clientX, e.clientY); });
  document.addEventListener("mousemove", (e) => { if (peek.classList.contains("on") && e.target.closest && e.target.closest(".card")) showPeek(e.target.closest(".card"), e.clientX, e.clientY); });
  document.addEventListener("mouseout", (e) => { if (e.target.closest && e.target.closest(".card")) hidePeek(); });
  document.addEventListener("focusin", (e) => { const t = e.target.closest && e.target.closest(".card"); if (t) { const r = t.getBoundingClientRect(); showPeek(t, r.right, r.top + r.height / 2); } });
  document.addEventListener("focusout", (e) => { if (e.target.closest && e.target.closest(".card")) hidePeek(); });
  // Touch: tap a name to show, tap anywhere else to hide.
  document.addEventListener("click", (e) => { const t = e.target.closest && e.target.closest(".card"); if (t) { if (peek.classList.contains("on") && peekFor === t.dataset.card) hidePeek(); else showPeek(t, e.clientX, e.clientY); } else hidePeek(); });

  /** "4 Card Name" or "1 SB: Card Name" as a list item with a hoverable name. */
  function cardLine(line) {
    const m = line.match(/^(\d+) (SB: )?(.+)$/);
    if (!m) return el("li", { text: line });
    return el("li", {}, `${m[1]} ${m[2] || ""}`, cardName(m[3]));
  }

  function fullList(deck, other) {
    const d = el("details", { class: "full", open: "" }, el("summary", { text: "Full decklist" }));
    const theirs = counts(other);
    for (const [zone, label] of [["commander", "Commander"], ["main", "Main"], ["side", "Sideboard"]]) {
      const lines = deck[zone] || [];
      if (!lines.length) continue;
      const total = lines.reduce((n, c) => n + c.qty, 0);
      const ul = el("ul");
      for (const c of lines) {
        const k = (zone === "side" ? "SB: " : "") + c.name;
        ul.append(el("li", { class: c.qty > (theirs.get(k) || 0) ? "uniq" : null }, `${c.qty} `, cardName(c.name)));
      }
      d.append(el("h4", { text: `${label} (${total})` }), ul);
    }
    return d;
  }

  function side(letter, ans, only, other) {
    const box = el("article", { class: "side" });
    box.append(el("div", { class: "side-head" }, el("span", { class: "letter", text: letter }), ans.deck ? null : el("span", { class: "fmt", text: "No deck" })));
    if (ans.text) box.append(el("p", { class: "lead", text: opening(ans.text) }));
    const o = el("div", { class: "only" }, el("h3", { text: `Only in ${letter}` }));
    o.append(only.length ? el("ul", {}, ...only.map(cardLine)) : el("p", { class: "none", text: "Nothing: every card is also in the other deck." }));
    box.append(o);
    if (ans.deck) box.append(fullList(ans.deck, other));
    if (ans.text) {
      const d = el("details", {}, el("summary", { text: "Full reply" }));
      d.append(el("div", { class: "reply", text: ans.text }));
      box.append(d);
    }
    return box;
  }

  function sync() {
    const s = picks.get(DATA.pairs[current].id) || {};
    for (const b of document.querySelectorAll("#picks button")) {
      b.setAttribute("aria-pressed", String(s.winner === b.dataset.w));
      b.disabled = !canWrite;
    }
    for (const b of document.querySelectorAll("#why button")) {
      b.setAttribute("aria-pressed", String((s.reasons || []).includes(b.dataset.r)));
      b.disabled = !canWrite;
    }
  }

  function render() {
    const p = DATA.pairs[current];
    const pr = DATA.prompts[p.prompt];
    const first = pr.prompt.split("\n")[0];
    const req = [el("span", { class: "fmt", text: pr.format }), el("p", { class: "prompt", text: first })];
    if (pr.prompt.includes("\n") && pr.prompt.length > 220) {
      const d = el("details", {}, el("summary", { text: "Show the pasted list" }));
      d.append(el("div", { class: "reply", text: pr.prompt.slice(first.length).trim() }));
      req.push(d);
    }
    document.getElementById("request").replaceChildren(...req);
    const d = diff(counts(p.left.deck), counts(p.right.deck));
    document.getElementById("duel").replaceChildren(side("A", p.left, d.onlyA, p.right.deck), side("B", p.right, d.onlyB, p.left.deck));
    const shared = document.getElementById("shared");
    shared.replaceChildren(el("summary", { text: `Both decks play ${d.both.length} of the same card lines` }), el("pre", { text: d.both.join("\n") || "None" }));
    shared.open = false;
    document.getElementById("saved").textContent = "";
    document.getElementById("prev").disabled = !DATA.pairs.some((_, i) => i < current && inView(i));
    document.getElementById("next").disabled = !DATA.pairs.some((_, i) => i > current && inView(i));
    sync();
    renderProgress();
  }

  function go(dir) {
    let i = current + dir;
    while (i >= 0 && i < DATA.pairs.length && !inView(i)) i += dir;
    if (i < 0 || i >= DATA.pairs.length) {
      if (dir > 0) document.getElementById("saved").textContent = "That was the last one in this view. Thank you!";
      return;
    }
    current = i;
    try { localStorage.setItem("quick-pair", String(current)); } catch (e) {}
    render();
    window.scrollTo(0, 0);
  }
  function jumpToFirst() {
    const i = DATA.pairs.findIndex((_, j) => (!brewsOnly.checked || DATA.pairs[j].brew) && (!unjudgedOnly.checked || !judged(DATA.pairs[j].id)));
    if (i >= 0) { current = i; render(); }
  }

  document.getElementById("prev").addEventListener("click", () => go(-1));
  document.getElementById("next").addEventListener("click", () => go(1));
  brewsOnly.addEventListener("change", jumpToFirst);
  unjudgedOnly.addEventListener("change", jumpToFirst);
  for (const b of document.querySelectorAll("#picks button")) b.addEventListener("click", () => save({ winner: b.dataset.w }, true));
  for (const b of document.querySelectorAll("#why button")) {
    b.addEventListener("click", () => {
      clearTimeout(advanceTimer);
      const s = picks.get(DATA.pairs[current].id) || {};
      const set = new Set(s.reasons || []);
      set.has(b.dataset.r) ? set.delete(b.dataset.r) : set.add(b.dataset.r);
      save({ reasons: [...set] }, false);
    });
  }
  document.addEventListener("keydown", (e) => {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    const map = { "1": "A", "2": "tie", "3": "B" };
    if (map[e.key] && canWrite) save({ winner: map[e.key] }, true);
    if (e.key === "ArrowRight") go(1);
    if (e.key === "ArrowLeft") go(-1);
  });

  try { current = Math.min(Number(localStorage.getItem("quick-pair") || 0), DATA.pairs.length - 1) || 0; } catch (e) {}
  render();

  (async () => {
    const notice = document.getElementById("notice");
    const claude = window.claude;
    const dbNs = claude && claude.use ? await claude.use("db") : null;
    const user = claude && claude.use ? await claude.use("user") : null;
    if (!dbNs) { notice.textContent = "Picks save only when this page is open on claude.ai and you're signed in."; return; }
    db = dbNs;
    canWrite = user ? (user.isOwner() ?? false) : false;
    let first = true;
    db.collection("pairs").onSnapshot(
      (snap) => {
        picks.clear();
        for (const d of snap.docs) picks.set(d.id, d.data());
        if (first) {
          first = false;
          notice.textContent = canWrite
            ? "Hover (or tap) any card name to see what it does. The cards that differ are at the top; full lists are below, with those cards highlighted. Press 1, 2 or 3 (or click) and it moves on. The opening two sentences of each reply say what the deck is going for."
            : "Read-only: only the page owner can judge.";
          jumpToFirst();
          return;
        }
        sync();
        renderProgress();
      },
      () => { notice.textContent = "Saved picks could not be loaded. Reload the page to try again."; },
    );
  })();
})();
</script>
