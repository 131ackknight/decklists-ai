in the actual deck.\n- The site reports that all the cards in my sample winning line are drawn by turn 6 in only about 0.4% of games. That's expected, because the line lists alternative finishers that you'll rarely all draw, and it ignores Worldly Tutor and Sylvan Library.\n\n**Weak spots:**\n- **Sligh and Goblins:** they kill your mana creatures easily. The sideboard has Ravenous Baloth and Spike Feeder for those matchups.\n- **Enchantress and Replenish:** Tranquility comes in.\n- **Counterspell decks:** Xantid Swarm stops them casting spells on turns it attacks.\n- **Other:** Naturalize handles artifacts like Phyrexian Dreadnought and Mox Diamond. Tormod's Crypt covers graveyard decks like Hermit Druid.","error":false,"deck":{"commander":[],"main":[{"qty":18,"name":"Forest"},{"qty":2,"name":"Gaea's Cradle"},{"qty":4,"name":"Llanowar Elves"},{"qty":4,"name":"Fyndhorn Elves"},{"qty":4,"name":"Rofellos, Llanowar Emissary"},{"qty":3,"name":"Quirion Ranger"},{"qty":2,"name":"Priest of Titania"},{"qty":2,"name":"Wall of Blossoms"},{"qty":3,"name":"Deranged Hermit"},{"qty":2,"name":"Masticore"},{"qty":2,"name":"Kamahl, Fist of Krosa"},{"qty":2,"name":"Krosan Tusker"},{"qty":3,"name":"Worldly Tutor"},{"qty":3,"name":"Sylvan Library"},{"qty":3,"name":"Plow Under"},{"qty":3,"name":"Hurricane"},{"qty":2,"name":"Skyshroud Claim"}],"side":[{"qty":3,"name":"Tranquility"},{"qty":3,"name":"Naturalize"},{"qty":2,"name":"Ravenous Baloth"},{"qty":2,"name":"Tormod's Crypt"},{"qty":3,"name":"Xantid Swarm"},{"qty":2,"name":"Spike Feeder"}],"mainCount":62,"sideCount":15}},"right":{"text":"I built a mono-green deck that ramps with Rofellos and destroys lands. The deck uses your green mana to knock out the opponent's lands early, then lands big creatures before they can recover. Rofellos taps for one green per Forest you control. With 17 Forests and 2 Wood Elves (which put a Forest onto the battlefield untapped), he can make 3–4 mana by turn 3. That pays for Thermokarst and Winter's Grasp on turn 2–3, Plow Under on turn 3–4, and then Deranged Hermit, Masticore, Ravenous Baloth or Kamahl. Kamahl's +3/+3 and trample pump on the whole team ends the game. Sylvan Library keeps you drawing land destruction and threats. This is a brew: no Rofellos list shows up in the last 90 days of results.\n\n**Three directions I considered:**\n1. **Rofellos land destruction (chosen):** The 8 land-destruction spells (Thermokarst and Winter's Grasp) are taken from Oath Ponza, which shows up in 81 lists. Sylvan Library comes from Terrageddon and Oath Ponza.\n2. **Rofellos with Winter Orb / Tangle Wire lock:** Your creatures make mana even when the opponent's lands are locked down. This package is borrowed from Elves and Cradle Control.\n3. **Cradle Elves with a Kamahl pump finish:** Gaea's Cradle plus Survival of the Fittest.\n\nI picked #1 because it uses Rofellos's mana best. Hitting a land on turn 2 is a real threat to the top decks (Stiflenought, Psychatog, Enchantress, Replenish), which all need their lands to function. #3 would mostly have been the existing Elves deck with Rofellos added.\n\n**Notes:**\n- **Starts:** You'll have Rofellos by turn 2 only 44.5% of the time on the play. But 12 cards can come down on turn 1–2 and add mana (Rofellos plus 8 one-drop elves), and you'll draw at least one of those 85.3% of the time.\n- **20 lands:** check_deck suggests 21.3, but the Elves deck averages 19. You also have 14 creatures that make or fetch mana, and Krosan Tusker can be cycled to find a basic land.\n- **Sideboard:**\n  - Naturalize, Creeping Mold and Tranquil Domain for Enchantress and Replenish.\n  - Uktabi Orangutan for Phyrexian Dreadnought.\n  - Xantid Swarm for the counterspell decks.\n  - Tormod's Crypt for Hermit Druid Combo and Psychatog.\n  - Spike Feeder for Sligh.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Rofellos, Llanowar Emissary"},{"qty":4,"name":"Llanowar Elves"},{"qty":4,"name":"Fyndhorn Elves"},{"qty":2,"name":"Wood Elves"},{"qty":4,"name":"Sylvan Library"},{"qty":4,"name":"Thermokarst"},{"qty":4,"name":"Winter's Grasp"},{"qty":2,"name":"Plow Under"},{"qty":3,"name":"Deranged Hermit"},{"qty":2,"name":"Masticore"},{"qty":3,"name":"Ravenous Baloth"},{"qty":2,"name":"Krosan Tusker"},{"qty":1,"name":"Kamahl, Fist of Krosa"},{"qty":1,"name":"Multani, Maro-Sorcerer"},{"qty":17,"name":"Forest"},{"qty":3,"name":"Treetop Village"}],"side":[{"qty":3,"name":"Naturalize"},{"qty":2,"name":"Creeping Mold"},{"qty":2,"name":"Uktabi Orangutan"},{"qty":2,"name":"Tormod's Crypt"},{"qty":3,"name":"Xantid Swarm"},{"qty":2,"name":"Spike Feeder"},{"qty":1,"name":"Tranquil Domain"}],"mainCount":60,"sideCount":15}}},{"id":"e9eff603b14f","prompt":"expert2-premodern-seismic-assault","brew":true,"left":{"text":"I built **RG Terravore Assault**, a red-green brew that runs 26 lands on purpose because extra lands are the ammunition.\n\n**The plan:** Seismic Assault ({R}{R}{R}: \"Discard a land card: deal 2 damage to any target\") turns every spare land into a Lightning Bolt-style shot. Each land you discard also grows Terravore, which is as big as the number of lands in all graveyards. Groundskeeper ({1}{G}: return a basic land from your graveyard to hand) makes the Assault damage repeatable, so you clear blockers and then burn the opponent out around turn 5.\n\n**The three directions I considered:**\n1. **RG lands-matter** (chosen). It borrows the Terrageddon package from the menu: Mox Diamond, Terravore, Sylvan Library, Wasteland, Treetop Village, Call of the Herd and Wild Mongrel.\n2. **UR Dream Halls.** The only Seismic Assault list in recent results (1 list in 90 days) is a Dream Halls combo deck, where Assault is just one finisher. Building that would mostly copy an existing deck.\n3. **Mono-red big-land burn.** Plenty of burn, but nothing to keep finding lands.\n\n**Why I chose the first one:** It's the only direction where every part of the deck feeds Assault.\n- Mox Diamond, Wild Mongrel, fetchlands and Wasteland all put lands in the graveyard for Terravore.\n- Sylvan Library, Mulch and Krosan Tusker's cycling put lands in your hand.\n- Groundskeeper turns spare mana into 2 damage over and over.\n\n**How consistent it is:**\n- You'll have Seismic Assault by turn 4 in about 53% of games just from normal draws. Sylvan Library, Mulch and Tusker raise that, but the tool didn't calculate how much.\n- The tool says all six win-line cards are drawn by turn 5 in only 0.6% of games, but you don't need all of them. In practice you need Assault plus extra lands, and Terravore or Groundskeeper.\n\n**Mana:** check_deck passed with no errors. It flagged that I have far fewer white, blue and black sources than Terrageddon lists. That's expected: those come from Mox Diamond, and this deck is only red and green. It has 20 red and 20 green sources, and the 8 Mountains and 6 Forests are basics so Groundskeeper can return them.\n\n**Sideboard:** It targets the decks the meta tool showed. Pyroblast, Red Elemental Blast and Choke are for the blue decks (Stiflenought and Psychatog). Naturalize is for Enchantress and Replenish. Tormod's Crypt is for Hermit Druid. Pyroclasm is for Goblins. Zuran Orb is for Sligh, and Groundskeeper can return the lands you sacrifice to it.\n\nOne weakness: Assault has to target, so it can't hit shroud creatures like Argothian Enchantress.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Seismic Assault"},{"qty":4,"name":"Mox Diamond"},{"qty":4,"name":"Sylvan Library"},{"qty":4,"name":"Terravore"},{"qty":4,"name":"Wild Mongrel"},{"qty":3,"name":"Groundskeeper"},{"qty":4,"name":"Lightning Bolt"},{"qty":3,"name":"Mulch"},{"qty":2,"name":"Call of the Herd"},{"qty":2,"name":"Krosan Tusker"},{"qty":8,"name":"Mountain"},{"qty":6,"name":"Forest"},{"qty":4,"name":"Wooded Foothills"},{"qty":4,"name":"Karplusan Forest"},{"qty":2,"name":"Treetop Village"},{"qty":2,"name":"Wasteland"}],"side":[{"qty":2,"name":"Pyroblast"},{"qty":2,"name":"Red Elemental Blast"},{"qty":2,"name":"Choke"},{"qty":3,"name":"Naturalize"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Pyroclasm"},{"qty":2,"name":"Zuran Orb"}],"mainCount":60,"sideCount":15}},"right":{"text":"I submitted it as a brew: **RG Terravore Assault**. The deck is 60 cards plus a 15-card sideboard, and it passed the legality check.\n\n**Directions I considered:**\n1. **UR Gush Assault.** Gush returns two Islands to your hand, and Seismic Assault turns each one into 2 damage. The problem is mana: Assault costs RRR and the counterspells want blue, so the mana base fights itself.\n2. **Mono-red land-dump burn.** The mana is simple, but it's just a weaker Sligh with no real use for Assault's discards.\n3. **RG Terravore Assault (chosen).** This takes the green package from Terrageddon (11% of the field): Mox Diamond, Terravore and Sylvan Library. The mana base is mostly borrowed from GR Zoo.\n\nI chose the third because each part makes the others better. Every land you discard to Assault or Mox Diamond, and every fetchland or Wasteland you crack, adds +1/+1 to Terravore. Sylvan Library finds you more lands to throw.\n\n**The plan:** You open with fast threats like Mox Diamond, Wild Mongrel, Werebear and Terravore. Lightning Bolt and Incinerate handle early creatures. Once Seismic Assault is out, every extra land in your hand becomes 2 damage to any target, which kills creatures and finishes the opponent. Late in the game, Groundskeeper returns a basic land from your graveyard to your hand for {1}{G}, so you can keep firing Assault.\n\n**Things to know:**\n- **Land count:** The deck plays 24 lands. The check said GR Zoo lists average 22.4 and suggested cutting about 2. I kept the extra lands on purpose, because here lands are ammunition for Assault and Mox Diamond, not just mana.\n- **How often you'll have Assault:** Four is the most copies you can play, and you'll see one by turn 4 only 52.8% of the time (no mulligans counted). The deck has to win without it some games, wh act. You only run two of each, and when you go off one copy is on the battlefield and the other on the stack, so the library never has the same name twice. The mana follows the same rule: one Island, one Snow-Covered Island, one Swamp, one Snow-Covered Swamp, and one of each fetch land and dual land. The sideboard has no names from the main deck, so sideboarding can't break the combo.\n\n**Finding the pieces:**\n- **Tutors:** Grim Tutor, Intuition, Lim-Dûl's Vault, and Spellseeker (it fetches Pact, which costs 2 or less).\n- **Pact as a tutor:** Pact can also fetch Oracle, since everything in the library is unique.\n- **Getting Pact back:** If you used Pact that way, you need it again. Snapcaster Mage gives it flashback, Tamiyo's −3 returns it to your hand, and Mystic Sanctuary puts it back on top of your library.\n\n**Directions I considered:**\n1. **This one:** a singleton version of Dimir Tempo, the most played deck right now (10% of the field), with its Force of Will, Daze, Thoughtseize, Bowmasters and removal.\n2. **A Doomsday hybrid:** Doomsday is the deck that already plays Oracle.\n3. **Grixis (adding red):** Imperial Recruiter and Spellseeker as a creature package for finding the combo.\n\nI chose the first because Tainted Pact only works with a library that never repeats a name. Doomsday needs four copies of its cantrips and rituals to work, so the two don't fit together, and red only added one extra way to find Oracle. The one real deck that pairs these two cards is a singleton blue-black list like this one.\n\n**Odds:** If you count only drawing the actual cards, with no tutors or card draw, you're at about 36% to see an Oracle and about 50% to see a Pact or Spellseeker by turn 6. You have 74% to see at least one combo piece or tutor by turn 4. Seven cantrips (cheap spells that draw a card) and Brainstorm-style digging push the real numbers up. The submission's simulator puts the full line (including the Snapcaster backup, which isn't required) at about  tapped and attacking.)\nDuring your turn, as long as Kaito has one or more loyalty counters on him, he's a 3/4 Ninja creature and has hexproof.\n+1: You get an emblem with \"Ninjas you control get +1/+1.\"\n0: Surveil 2. Then draw a card for each opponent who lost life this turn.\n−2: Tap target creature. Put two stun counters on it."},"Murktide Regent":{"cost":"{5}{U}{U}","type":"Creature — Dragon","text":"Delve (Each card you exile from your graveyard while casting this spell pays for {1}.)\nFlying\nThis creature enters with a +1/+1 counter on it for each instant and sorcery card exiled with it.\nWhenever an instant or sorcery card leaves your graveyard, put a +1/+1 counter on this creature.","pt":"3/3"},"Snapcaster Mage":{"cost":"{1}{U}","type":"Creature — Human Wizard","text":"Flash\nWhen this creature enters, target instant or sorcery card in your graveyard gains flashback until end of turn. The flashback cost is equal to its mana cost. (You may cast that card from your graveyard for its flashback cost. Then exile it.)","pt":"2/1"},"Dauthi Voidwalker":{"cost":"{B}{B}","type":"Creature — Dauthi Rogue","text":"Shadow (This creature can block or be blocked by only creatures with shadow.)\nIf a card would be put into an opponent's graveyard from anywhere, instead exile it with a void counter on it.\n{T}, Sacrifice this creature: Choose an exiled card an opponent owns with a void counter on it. You may play it this turn without paying its mana cost.","pt":"3/2"},"Marsh Flats":{"cost":"","type":"Land","text":"{T}, Pay 1 life, Sacrifice this land: Search your library for a Plains or Swamp card, put it onto the battlefield, then shuffle."},"Prismatic Vista":{"cost":"","type":"Land","text":"{T}, Pay 1 life, Sacrifice this land: Search your library for a basic land card, put it onto the battlefield, then shuffle."},"Underground Sea":{"cost":"","type":"Land — Island Swamp","text":"({T}: Add {U} or {B}.)"},"Watery Grave":{"cost":"","type":"Land — Island Swamp","text":"({T}: Add {U} or {B}.)\nAs this land enters, you may pay 2 life. If you don't, it enters tapped."},"Undercity Sewers":{"cost":"","type":"Land — Island Swamp","text":"({T}: Add {U} or {B}.)\nThis land enters tapped.\nWhen this land enters, surveil 1. (Look at the top card of your library. You may put it into your graveyard.)"},"Mystic Sanctuary":{"cost":"","type":"Land — Island","text":"({T}: Add {U}.)\nThis land enters tapped unless you control three or more other Islands.\nWhen this land enters untapped, you may put target instant or sorcery card from your graveyard on top of your library."},"Snow-Covered Island":{"cost":"","type":"Basic Snow Land — Island","text":"({T}: Add {U}.)"},"Snow-Covered Swamp":{"cost":"","type":"Basic Snow Land — Swamp","text":"({T}: Add {B}.)"},"Otawara, Soaring City":{"cost":"","type":"Legendary Land","text":"{T}: Add {U}.\nChannel — {3}{U}, Discard this card: Return target artifact, creature, enchantment, or planeswalker to its owner's hand. This ability costs {1} less to activate for each legendary creature you control."},"Takenuma, Abandoned Mire":{"cost":"","type":"Legendary Land","text":"{T}: Add {B}.\nChannel — {3}{B}, Discard this card: Mill three cards, then return a creature or planeswalker card from your graveyard to your hand. This ability costs {1} less to activate for each legendary creature you control."},"Massacre":{"cost":"{2}{B}{B}","type":"Sorcery","text":"If an opponent controls a Plains and you control a Swamp, you may cast this spell without paying its mana cost.\nAll creatures get -2/-2 until end of turn."},"Nihil Spellbomb":{"cost":"{1}","type":"Artifact","text":"{T}, Sacrifice this artifact: Exile target player's graveyard.\nWhen this artifact is put into a graveyard from the battlefield, you may pay {B}. If you do, draw a card."},"Null Rod":{"cost":"{2}","type":"Artifact","text":"Activated abilities of artifacts can't be activated."},"Engineered Explosives":{"cost":"{X}","type":"Artifact","text":"Sunburst (This artifact enters with a charge counter on it for each color of mana spent to cast it.)\n{2}, Sacrifice this artifact: Destroy each nonland permanent with mana value equal to the number of charge counters on this artifact."},"Hurkyl's Recall":{"cost":"{1}{U}","type":"Instant","text":"Return all artifacts target player owns to their hand."},"Harbinger of the Seas":{"cost":"{1}{U}{U}","type":"Creature — Merfolk Wizard","text":"Nonbasic lands are Islands.","pt":"2/2"},"Disruptor Flute":{"cost":"{2}","type":"Artifact","text":"Flash\nAs this artifact enters, choose a card name.\nSpells with the chosen name cost {3} more to cast.\nActivated abilities of sources with the chosen name can't be activated unless they're mana abilities."},"Doomsday":{"cost":"{B}{B}{B}","type":"Sorcery","text":"Search your library and graveyard for five cards and exile the rest. Put the chosen cards on top of your library in any order. You lose half your life, rounded up."},"Jace, Wielder of Mysteries":{"cost":"{1}{U}{U}{U}","type":"Legendary Planeswalker — Jace","text":"If you would draw a card while your library has no cards in it, you win the game instead.\n+1: Target player mills two cards. Draw a card.\n−8: Draw seven cards. Then if your library has no cards in it, you win the game."},"Muddle the Mixture":{"cost":"{U}{U}","type":"Instant","text":"Counter target instant or sorcery spell.\nTransmute {1}{U}{U} ({1}{U}{U}, Discard this card: Search your library for a card with the same mana value as this card, reveal it, put it into your hand, then shuffle. Transmute only as a sorcery.)"},"Solve the Equation":{"cost":"{2}{U}","type":"Sorcery","text":"Search your library for an instant or sorcery card, reveal it, put it into your hand, then shuffle."},"Insatiable Avarice":{"cost":"{B}","type":"Sorcery","text":"Spree (Choose one or more additional costs.)\n+ {2} — Search your library for a card, then shuffle and put that card on top.\n+ {B}{B} — Target player draws three cards and loses 3 life."},"Wishclaw Talisman":{"cost":"{1}{B}","type":"Artifact","text":"This artifact enters with three wish counters on it.\n{1}, {T}, Remove a wish counter from this artifact: Search your library for a card, put it into your hand, then shuffle. An opponent gains control of this artifact. Activate only during your turn."},"Cabal Ritual":{"cost":"{1}{B}","type":"Instant","text":"Add {B}{B}{B}.\nThreshold — Add {B}{B}{B}{B}{B} instead if there are seven or more cards in your graveyard."},"Flow State":{"cost":"{1}{U}","type":"Sorcery","text":"Look at the top three cards of your library. Put one of them into your hand and the rest on the bottom of your library in any order. If there is an instant card and a sorcery card in your graveyard, instead put two of them into your hand and the rest on the bottom of your library in any order."},"Street Wraith":{"cost":"{3}{B}{B}","type":"Creature — Wraith","text":"Swampwalk (This creature can't be blocked as long as defending player controls a Swamp.)\nCycling—Pay 2 life. (Pay 2 life, Discard this card: Draw a card.)","pt":"3/4"},"Pact of Negation":{"cost":"{0}","type":"Instant","text":"Counter target spell.\nAt the beginning of your next upkeep, pay {3}{U}{U}. If you don't, you lose the game."},"Darkslick Shores":{"cost":"","type":"Land","text":"This land enters tapped unless you control two or fewer other lands.\n{T}: Add {U} or {B}."},"Waterlogged Teachings // Inundated Archive":{"cost":"{3}{U/B}","type":"Instant // Land","text":"Search your library for an instant card or a card with flash, reveal it, put it into your hand, then shuffle. // This land enters tapped.\n{T}: Add {U} or {B}."},"Subtlety":{"cost":"{2}{U}{U}","type":"Creature — Elemental Incarnation","text":"Flash\nFlying\nWhen this creature enters, choose up to one target creature spell or planeswalker spell. Its owner puts it on their choice of the top or bottom of their library.\nEvoke—Exile a blue card from your hand.","pt":"3/3"},"Long Goodbye":{"cost":"{1}{B}","type":"Instant","text":"This spell can't be countered. (This includes by the ward ability.)\nDestroy target creature or planeswalker with mana value 3 or less."}}}</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const picks = new Map();
  let db = null;
  let canWrite = false;
  let current = 0;
  let chain = Promise.resolve();
  let advanceTimer = null;
  const brewsOnly = document.getElementById("brewsOnly");
  const unjudgedOnly = document.getElementById("unjudgedOnly");

  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
    }
    for (const kid of kids) if (kid) n.append(kid);
    return n;
  };
  const judged = (id) => Boolean(picks.get(id) && picks.get(id).winner);
  const inView = (i) => (!brewsOnly.checked || DATA.pairs[i].brew) && (!unjudgedOnly.checked || !judged(DATA.pairs[i].id) || i === current);

  /** Card -> copies across main, side and commander. */
  function counts(deck) {
    const m = new Map();
    if (!deck) return m;
    for (const zone of ["commander", "main", "side"]) {
      for (const c of deck[zone] || []) {
        const k = (zone === "side" ? "SB: " : "") + c.name;
        m.set(k, (m.get(k) || 0) + c.qty);
      }
    }
    return m;
  }
  function diff(a, b) {
    const onlyA = [];
    const onlyB = [];
    const both = [];
    for (const k of new Set([...a.keys(), ...b.keys()])) {
      const x = a.get(k) || 0;
      const y = b.get(k) || 0;
      const shared = Math.min(x, y);
      if (shared) both.push(`${shared} ${k}`);
      if (x > shared) onlyA.push(`${x - shared} ${k}`);
      if (y > shared) onlyB.push(`${y - shared} ${k}`);
    }
    const byMain = (s) => (s.includes("SB: ") ? 1 : 0);
    const sort = (xs) => xs.sort((p, q) => byMain(p) - byMain(q) || p.replace(/^\d+ /, "").localeCompare(q.replace(/^\d+ /, "")));
    return { onlyA: sort(onlyA), onlyB: sort(onlyB), both: sort(both) };
  }
  /** The reply's opening: its first two sentences, where answers put the plan. */
  function opening(text) {
    if (!text) return "";
    const clean = text.replace(/\*\*/g, "").replace(/\s+/g, " ").trim();
    const parts = clean.match(/[^.!?]+[.!?]+/g) || [clean];
    const out = parts.slice(0, 2).join(" ").trim();
    return out.length > 360 ? out.slice(0, 357) + "…" : out;
  }

  function renderProgress() {
    const pool = DATA.pairs.filter((p) => !brewsOnly.checked || p.brew);
    const done = pool.filter((p) => judged(p.id)).length;
    document.getElementById("progress").replaceChildren(el("b", { text: `${done} of ${pool.length}` }), brewsOnly.checked ? " brew pairs judged" : " pairs judged");
  }

  function save(patch, advance) {
    if (!db || !canWrite) return;
    const p = DATA.pairs[current];
    const body = { ...(picks.get(p.id) || {}), ...patch, pair: p.id, prompt: p.prompt, quick: true, updatedAt: new Date().toISOString() };
    picks.set(p.id, body);
    sync();
    renderProgress();
    const status = document.getElementById("saved");
    status.textContent = "Saving…";
    chain = chain
      .then(() => db.collection("pairs").doc(p.id).set(body))
      .then(() => { status.textContent = advance ? "Saved. Next pair in a moment (change your mind with Previous)." : "Saved"; })
      .catch((e) => { status.textContent = e && e.code === "invalid_argument" ? "Only the owner can save picks on this page." : "Could not save. Try again in a moment."; });
    if (advance) {
      clearTimeout(advanceTimer);
      advanceTimer = setTimeout(() => go(1), 900);
    }
  }

  /** The whole list, by zone; lines with more copies than the other deck are highlighted. */
  /** A card name that shows the card's text on hover, focus or tap (artifact pages can't load outside images). */
  function cardName(name) {
    return el("span", { class: "card", "data-card": name, tabindex: "0", text: name });
  }
  const peek = document.getElementById("peek");
  let peekFor = null;
  function showPeek(target, x, y) {
    const name = target.dataset.card;
    const c = DATA.cards && DATA.cards[name];
    if (name !== peekFor) {
      peekFor = name;
      // el() skips null children; replaceChildren would render them as the text "null".
      peek.replaceChildren(
        ...[
          el("div", { class: "pk-head" }, el("span", { text: name }), c ? el("span", { class: "pk-cost", text: c.cost }) : null),
          c ? el("div", { class: "pk-type", text: c.type }) : el("div", { class: "pk-type", text: "No card text on file." }),
          c ? el("div", { class: "pk-text", text: c.text }) : null,
          c && c.pt ? el("div", { class: "pk-pt", text: c.pt }) : null,
        ].filter(Boolean),
      );
    }
    peek.classList.add("on");
    const w = peek.offsetWidth;
    const h = peek.offsetHeight;
    peek.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x + 16)) + "px";
    peek.style.top = Math.max(8, Math.min(window.innerHeight - h - 8, y - h / 2)) + "px";
  }
  function hidePeek() { peek.classList.remove("on"); }
  document.addEventListener("mouseover", (e) => { const t = e.target.closest && e.target.closest(".card"); if (t) showPeek(t, e.clientX, e.clientY); });
  document.addEventListener("mousemove", (e) => { if (peek.classList.contains("on") && e.target.closest && e.target.closest(".card")) showPeek(e.target.closest(".card"), e.clientX, e.clientY); });
  document.addEventListener("mouseout", (e) => { if (e.target.closest && e.target.closest(".card")) hidePeek(); });
  document.addEventListener("focusin", (e) => { const t = e.target.closest && e.target.closest(".card"); if (t) { const r = t.getBoundingClientRect(); showPeek(t, r.right, r.top + r.height / 2); } });
  document.addEventListener("focusout", (e) => { if (e.target.closest && e.target.closest(".card")) hidePeek(); });
  // Touch: tap a name to show, tap anywhere else to hide.
  document.addEventListener("click", (e) => { const t = e.target.closest && e.target.closest(".card"); if (t) { if (peek.classList.contains("on") && peekFor === t.dataset.card) hidePeek(); else showPeek(t, e.clientX, e.clientY); } else hidePeek(); });

  /** "4 Card Name" or "1 SB: Card Name" as a list item with a hoverable name. */
  function cardLine(line) {
    const m = line.match(/^(\d+) (SB: )?(.+)$/);
    if (!m) return el("li", { text: line });
    return el("li", {}, `${m[1]} ${m[2] || ""}`, cardName(m[3]));
  }

  function fullList(deck, other) {
    const d = el("details", { class: "full", open: "" }, el("summary", { text: "Full decklist" }));
    const theirs = counts(other);
    for (const [zone, label] of [["commander", "Commander"], ["main", "Main"], ["side", "Sideboard"]]) {
      const lines = deck[zone] || [];
      if (!lines.length) continue;
      const total = lines.reduce((n, c) => n + c.qty, 0);
      const ul = el("ul");
      for (const c of lines) {
        const k = (zone === "side" ? "SB: " : "") + c.name;
        ul.append(el("li", { class: c.qty > (theirs.get(k) || 0) ? "uniq" : null }, `${c.qty} `, cardName(c.name)));
      }
      d.append(el("h4", { text: `${label} (${total})` }), ul);
    }
    return d;
  }

  function side(letter, ans, only, other) {
    const box = el("article", { class: "side" });
    box.append(el("div", { class: "side-head" }, el("span", { class: "letter", text: letter }), ans.deck ? null : el("span", { class: "fmt", text: "No deck" })));
    if (ans.text) box.append(el("p", { class: "lead", text: opening(ans.text) }));
    const o = el("div", { class: "only" }, el("h3", { text: `Only in ${letter}` }));
    o.append(only.length ? el("ul", {}, ...only.map(cardLine)) : el("p", { class: "none", text: "Nothing: every card is also in the other deck." }));
    box.append(o);
    if (ans.deck) box.append(fullList(ans.deck, other));
    if (ans.text) {
      const d = el("details", {}, el("summary", { text: "Full reply" }));
      d.append(el("div", { class: "reply", text: ans.text }));
      box.append(d);
    }
    return box;
  }

  function sync() {
    const s = picks.get(DATA.pairs[current].id) || {};
    for (const b of document.querySelectorAll("#picks button")) {
      b.setAttribute("aria-pressed", String(s.winner === b.dataset.w));
      b.disabled = !canWrite;
    }
    for (const b of document.querySelectorAll("#why button")) {
      b.setAttribute("aria-pressed", String((s.reasons || []).includes(b.dataset.r)));
      b.disabled = !canWrite;
    }
  }

  function render() {
    const p = DATA.pairs[current];
    const pr = DATA.prompts[p.prompt];
    const first = pr.prompt.split("\n")[0];
    const req = [el("span", { class: "fmt", text: pr.format }), el("p", { class: "prompt", text: first })];
    if (pr.prompt.includes("\n") && pr.prompt.length > 220) {
      const d = el("details", {}, el("summary", { text: "Show the pasted list" }));
      d.append(el("div", { class: "reply", text: pr.prompt.slice(first.length).trim() }));
      req.push(d);
    }
    document.getElementById("request").replaceChildren(...req);
    const d = diff(counts(p.left.deck), counts(p.right.deck));
    document.getElementById("duel").replaceChildren(side("A", p.left, d.onlyA, p.right.deck), side("B", p.right, d.onlyB, p.left.deck));
    const shared = document.getElementById("shared");
    shared.replaceChildren(el("summary", { text: `Both decks play ${d.both.length} of the same card lines` }), el("pre", { text: d.both.join("\n") || "None" }));
    shared.open = false;
    document.getElementById("saved").textContent = "";
    document.getElementById("prev").disabled = !DATA.pairs.some((_, i) => i < current && inView(i));
    document.getElementById("next").disabled = !DATA.pairs.some((_, i) => i > current && inView(i));
    sync();
    renderProgress();
  }

  function go(dir) {
    let i = current + dir;
    while (i >= 0 && i < DATA.pairs.length && !inView(i)) i += dir;
    if (i < 0 || i >= DATA.pairs.length) {
      if (dir > 0) document.getElementById("saved").textContent = "That was the last one in this view. Thank you!";
      return;
    }
    current = i;
    try { localStorage.setItem("quick-pair", String(current)); } catch (e) {}
    render();
    window.scrollTo(0, 0);
  }
  function jumpToFirst() {
    const i = DATA.pairs.findIndex((_, j) => (!brewsOnly.checked || DATA.pairs[j].brew) && (!unjudgedOnly.checked || !judged(DATA.pairs[j].id)));
    if (i >= 0) { current = i; render(); }
  }

  document.getElementById("prev").addEventListener("click", () => go(-1));
  document.getElementById("next").addEventListener("click", () => go(1));
  brewsOnly.addEventListener("change", jumpToFirst);
  unjudgedOnly.addEventListener("change", jumpToFirst);
  for (const b of document.querySelectorAll("#picks button")) b.addEventListener("click", () => save({ winner: b.dataset.w }, true));
  for (const b of document.querySelectorAll("#why button")) {
    b.addEventListener("click", () => {
      clearTimeout(advanceTimer);
      const s = picks.get(DATA.pairs[current].id) || {};
      const set = new Set(s.reasons || []);
      set.has(b.dataset.r) ? set.delete(b.dataset.r) : set.add(b.dataset.r);
      save({ reasons: [...set] }, false);
    });
  }
  document.addEventListener("keydown", (e) => {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    const map = { "1": "A", "2": "tie", "3": "B", "4": "neither" };
    if (map[e.key] && canWrite) save({ winner: map[e.key] }, true);
    if (e.key === "ArrowRight") go(1);
    if (e.key === "ArrowLeft") go(-1);
  });

  try { current = Math.min(Number(localStorage.getItem("quick-pair") || 0), DATA.pairs.length - 1) || 0; } catch (e) {}
  render();

  (async () => {
    const notice = document.getElementById("notice");
    const claude = window.claude;
    const dbNs = claude && claude.use ? await claude.use("db") : null;
    const user = claude && claude.use ? await claude.use("user") : null;
    if (!dbNs) { notice.textContent = "Picks save only when this page is open on claude.ai and you're signed in."; return; }
    db = dbNs;
    canWrite = user ? (user.isOwner() ?? false) : false;
    let first = true;
    db.collection("pairs").onSnapshot(
      (snap) => {
        picks.clear();
        for (const d of snap.docs) picks.set(d.id, d.data());
        if (first) {
          first = false;
          notice.textContent = canWrite
            ? "Hover (or tap) any card name to see what it does. The cards that differ are at the top; full lists are below, with those cards highlighted. Press 1, 2 or 3 (or click) and it moves on. The opening two sentences of each reply say what the deck is going for."
            : "Read-only: only the page owner can judge.";
          jumpToFirst();
          return;
        }
        sync();
        renderProgress();
      },
      () => { notice.textContent = "Saved picks could not be loaded. Reload the page to try again."; },
    );
  })();
})();
</script>
