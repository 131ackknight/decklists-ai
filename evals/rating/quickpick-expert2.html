<style>
/* Layout: one question per screen. The request, each answer's opening, only the cards that differ, then A / Same / B. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --ink: #1b2236;
  --muted: #5d667d;
  --line: #dde2ec;
  --accent: #2459a6;
  --pick: #b5650d;
  --chip: #e8edf6;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141d; --surface: #181e2b; --ink: #e5e9f2; --muted: #9aa4ba; --line: #2a3346;
    --accent: #6f9fe0; --pick: #e2a04f; --chip: #222b3d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141d; --surface: #181e2b; --ink: #e5e9f2; --muted: #9aa4ba; --line: #2a3346;
  --accent: #6f9fe0; --pick: #e2a04f; --chip: #222b3d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 64px; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.top h1 { font-size: 1.3rem; }
.progress { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.progress b { color: var(--pick); }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 0.9rem; color: var(--muted); }
.controls label { display: inline-flex; gap: 6px; align-items: center; }
.btn { font: 600 0.88rem var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.btn:disabled { opacity: 0.5; cursor: default; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.notice { margin: 0; color: var(--muted); font-size: 0.9rem; }
.request { display: grid; gap: 6px; }
.fmt { font: 600 0.75rem var(--font-body); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.prompt { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.duel { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 14px; }
.side { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.side-head { display: flex; gap: 10px; align-items: center; }
.letter { font: 700 1.2rem var(--font-display); width: 2.1rem; height: 2.1rem; display: grid; place-items: center; border-radius: 8px; background: var(--ink); color: var(--surface); }
.lead { margin: 0; font-size: 0.94rem; overflow-wrap: anywhere; }
.only h3 { font: 600 0.78rem var(--font-body); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
.only pre { margin: 0; font: 0.84rem/1.5 var(--font-mono); padding: 10px 12px; background: var(--bg); border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
.none { color: var(--muted); font-style: italic; }
.full summary { font-size: 0.85rem; }
.full h4 { font: 600 0.72rem var(--font-body); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 8px 0 2px; }
.full ul { list-style: none; margin: 0; padding: 0; font: 0.8rem/1.5 var(--font-mono); columns: 2 170px; column-gap: 14px; }
.full li { break-inside: avoid; overflow-wrap: anywhere; }
.full li.uniq { color: var(--accent); font-weight: 600; }
.only ul { list-style: none; margin: 0; padding: 10px 12px; background: var(--bg); border-radius: 8px; font: 0.84rem/1.5 var(--font-mono); }
.only li { overflow-wrap: anywhere; }
.card { cursor: help; border-bottom: 1px dotted var(--muted); }
.card:hover, .card:focus-visible { color: var(--accent); }
#peek { position: fixed; z-index: 10; width: min(300px, calc(100vw - 16px)); max-height: 60vh; overflow: auto; border-radius: 10px; border: 1px solid var(--line); box-shadow: 0 8px 28px rgba(0,0,0,0.3); background: var(--surface); color: var(--ink); padding: 10px 12px; display: none; pointer-events: none; font: 0.84rem/1.45 var(--font-body); }
#peek.on { display: block; }
#peek .pk-head { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; }
#peek .pk-cost { font-family: var(--font-mono); font-weight: 400; color: var(--muted); white-space: nowrap; }
#peek .pk-type { color: var(--muted); font-size: 0.78rem; margin: 2px 0 6px; }
#peek .pk-text { white-space: pre-wrap; }
#peek .pk-pt { text-align: right; font-weight: 700; margin-top: 6px; }
.peek-note { font-size: 0.78rem; color: var(--muted); margin: 0; }
details summary { cursor: pointer; color: var(--accent); font-size: 0.9rem; }
.shared pre { margin: 6px 0 0; font: 0.8rem/1.45 var(--font-mono); padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; columns: 2 220px; }
.reply { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 20rem; overflow: auto; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.9rem; margin-top: 6px; }
.ask { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.ask h2 { font-size: 1.1rem; }
.picks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.picks button { font: 700 1.05rem var(--font-display); padding: 16px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); cursor: pointer; }
.picks button kbd { display: block; font: 0.75rem var(--font-mono); color: var(--muted); margin-top: 2px; }
.picks button[aria-pressed="true"] { background: var(--pick); color: var(--surface); border-color: var(--pick); }
.picks button[aria-pressed="true"] kbd { color: var(--surface); }
.why { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.85rem; color: var(--muted); }
.why button { font: 0.85rem var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 4px 10px; border-radius: 999px; cursor: pointer; }
.why button[aria-pressed="true"] { background: var(--chip); border-color: var(--accent); color: var(--accent); }
button:disabled { cursor: not-allowed; opacity: 0.6; }
.saved { font-size: 0.8rem; color: var(--muted); min-height: 1.2em; }
@media (max-width: 560px) { .picks { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: no-preference) { .picks button, .why button { transition: background 120ms ease, color 120ms ease; } }
</style>

<script type="application/json" id="data">{"prompts":{"expert2-premodern-mind-over-matter":{"format":"Premodern","prompt":"Brew me a Premodern deck built around Mind Over Matter.","lookFor":""},"expert2-premodern-phyrexian-processor":{"format":"Premodern","prompt":"Brew me a Premodern deck built around Phyrexian Processor.","lookFor":""},"expert2-legacy-hypergenesis":{"format":"Legacy","prompt":"Brew me a Legacy deck built around Hypergenesis.","lookFor":""},"expert2-premodern-shapeshifter-phage":{"format":"Premodern","prompt":"Brew me a Premodern deck built around Volrath's Shapeshifter and Phage the Untouchable.","lookFor":""},"expert2-legacy-kiki-pestermite":{"format":"Legacy","prompt":"Brew me a Legacy deck built around Kiki-Jiki, Mirror Breaker and Pestermite.","lookFor":""},"expert2-legacy-glimpse-elves":{"format":"Legacy","prompt":"Brew me a Legacy Elves deck built around Glimpse of Nature and Heritage Druid.","lookFor":""},"expert2-legacy-scapeshift":{"format":"Legacy","prompt":"Brew me a Legacy deck built around Scapeshift and Valakut, the Molten Pinnacle.","lookFor":""},"expert2-legacy-bomberman":{"format":"Legacy","prompt":"Brew me a Legacy deck built around Auriok Salvagers and Lion's Eye Diamond.","lookFor":""},"expert2-premodern-rising-waters":{"format":"Premodern","prompt":"Brew me a Premodern deck built around Rising Waters.","lookFor":""},"expert2-premodern-rofellos":{"format":"Premodern","prompt":"Brew me a mono-green Premodern ramp deck built around Rofellos, Llanowar Emissary.","lookFor":""},"expert2-premodern-seismic-assault":{"format":"Premodern","prompt":"Brew me a Premodern deck built around Seismic Assault.","lookFor":""},"expert2-legacy-oracle-pact":{"format":"Legacy","prompt":"Brew me a Legacy deck built around Thassa's Oracle and Tainted Pact.","lookFor":""}},"pairs":[{"id":"135e66a0307f","prompt":"expert2-premodern-mind-over-matter","brew":true,"left":{"text":"I built a mono-blue Show and Tell combo deck that uses Mind Over Matter as a mana engine. Every card left in your hand becomes 2–3 mana, which goes into Stroke of Genius again and again until the last one makes the opponent draw more cards than they have left. The deck is accepted and legal; I labelled it a brew because Mind Over Matter shows up in only one Premodern list in the last 90 days.\n\n**The three directions I considered**\n1. **Mono-blue big mana (chosen):** Borrows the Show and Tell / Ancient Tomb / City of Traitors package from the field's Dream Halls deck. Mind Over Matter untaps those mana sources.\n2. **White-blue Academy Rector:** When Rector dies, it fetches Mind Over Matter from the library, which then combines with Arcanis the Omnipotent and Prodigal Sorcerer. Getting Rector to die needs a sacrifice outlet, so it's slower and has more pieces.\n3. **Green-blue Enchantress:** Borrows the Enchantress package and untaps Serra's Sanctum. It has no clean way to win off that mana.\n\nI picked the first because its mana package already works in real Premodern results and it pays Mind Over Matter's {U}{U}{U}{U} cost (four blue mana) by skipping it.\n\n**How it wins**\n- **Turn 2 (on the play):** Play City of Traitors, then cast Show and Tell with City's {C}{C} plus one Island to put Mind Over Matter onto the battlefield. Show and Tell lets your opponent put a permanent in too.\n- **Building mana:** Discard cards to untap City of Traitors or Ancient Tomb (2 mana each) or Thran Dynamo (3).\n- **The loop:** Cast Stroke of Genius on yourself. With 5 or more cards to discard, each Stroke draws more cards than you threw away. Intuition, Merchant Scroll, Impulse and Opt find the next Stroke.\n- **The kill:** Aim the last Stroke at your opponent with X larger than their library.\n- **Backup engine:** One Arcanis the Omnipotent, which draws 3 every time Mind Over Matter untaps it, once it's been on the battlefield since the start of your turn.\n\n**Rules to remember**\n- Don't play another land after City of Traitors while you're comboing, or City gets sacrificed.\n- Untapping Ancient Tomb costs you 2 life each time.\n\n**Odds**\n- **Engine plus Stroke:** About 53% to have Mind Over Matter or Show and Tell plus Stroke of Genius or Merchant Scroll by turn 4. That counts only natural draws, with no digging and no mulligans.\n- **The listed turn-4 line:** The tool gives only 2.4% to naturally draw every card in it by turn 4. That's mainly because it names two Strokes, City of Traitors and Intuition, while in practice the second Stroke usually comes from the chain itself.\n- **Weak spots:** Discard (Duress, Cabal Therapy) and Stifle/Counterspell decks are the biggest problems. The 3 Counterspell and 2 Arcane Denial in the main deck, plus Defense Grid in the sideboard, are there for those.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Mind Over Matter"},{"qty":4,"name":"Show and Tell"},{"qty":4,"name":"Stroke of Genius"},{"qty":4,"name":"Intuition"},{"qty":2,"name":"Merchant Scroll"},{"qty":4,"name":"Impulse"},{"qty":4,"name":"Opt"},{"qty":3,"name":"Counterspell"},{"qty":2,"name":"Arcane Denial"},{"qty":2,"name":"Thran Dynamo"},{"qty":1,"name":"Arcanis the Omnipotent"},{"qty":3,"name":"Lotus Petal"},{"qty":2,"name":"Frantic Search"},{"qty":14,"name":"Island"},{"qty":4,"name":"City of Traitors"},{"qty":3,"name":"Ancient Tomb"}],"side":[{"qty":3,"name":"Hydroblast"},{"qty":2,"name":"Blue Elemental Blast"},{"qty":2,"name":"Annul"},{"qty":2,"name":"Stifle"},{"qty":2,"name":"Defense Grid"},{"qty":2,"name":"Chain of Vapor"},{"qty":1,"name":"Tormod's Crypt"},{"qty":1,"name":"Misdirection"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built a two-card combo deck: **Mind Over Matter + Arcanis the Omnipotent**. Tapping Arcanis draws three cards. Discarding one card to Mind Over Matter untaps it, so each loop nets two cards, and you can pull almost your whole library in one turn. Spare cards then go to Mind Over Matter to untap Thran Dynamo (3 mana each) or Islands (1 each). That pays for a Kaervek's Torch with X of 20 or more. The backup finisher is Stroke of Genius aimed at the opponent with X bigger than their library. Show and Tell, Ancient Tomb and City of Traitors get the 6-drops down on turns 2–4. This is a brew; it borrows its fast mana and card draw from the Dream Halls deck.\n\n**The three directions I considered:**\n1. **Blue-red Arcanis combo** (chosen), using Dream Halls' fast mana and draw: Ancient Tomb, City of Traitors, Show and Tell, Rush of Knowledge, Intuition, Frantic Search.\n2. **White-blue, using the menu's Replenish package:** Attunement and Frantic Search throw Mind Over Matter into the graveyard, and Replenish brings it back cheaply. Then Mind Over Matter locks the opponent by tapping their lands and creatures, alongside Opalescence and Parallax Wave.\n3. **Mono-blue Stroke of Genius chain:** Mind Over Matter untaps Thran Dynamo, so each card Stroke draws becomes 3 mana for the next, bigger Stroke.\n\nI picked the first because Arcanis is the only card I found where Mind Over Matter's discard gives back more cards than it costs. That makes it a real one-turn kill, where the other two are a slow lock or a chain that needs several draws to line up.\n\n**Things to know when playing it:**\n- **Don't untap Ancient Tomb with Mind Over Matter.** It deals 2 damage to you every time it taps. Loop Islands, City of Traitors, Thran Dynamo and Shivan Reef instead.\n- **Stop drawing with a card or two left in your library.** Otherwise you lose at your next draw step if something goes wrong.\n- **Show and Tell lets the opponent put a card into play too,** for example Phyrexian Dreadnought or Terravore. Against those decks, hard-casting your 6-drops is often better.\n- **Arcanis needs a full turn in play before it can tap.** Usually you put it in with Show and Tell first, then cast Mind Over Matter the next turn.\n\n**Mana:**\n- **Red sources:** the deck checker warned there are only 4 red sources for Kaervek's Torch. That's fine here: you only cast Torch during the combo, after you've drawn your deck. Mind Over Matter can untap your one Shivan Reef, or you can use a Lotus Petal.\n- **Land count:** it runs 21 lands; the checker recommended about 23. Dream Halls decks average 19 plus Lotus Petals, so I stayed close to that.\n\n**Odds:** you have about a 43% chance to see Mind Over Matter (or Intuition), Arcanis (or Rush of Knowledge) and a fast-mana card all by turn 5 on the play. That figure leaves out Impulse and Opt, which help you find the pieces.\n\n**Sideboard:** Hydroblast for the Sligh and Goblins decks, Annul for Enchantress and Replenish, Stifle for Phyrexian Dreadnought and Hermit Druid, plus Tormod's Crypt, Powder Keg and Defense Grid.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Mind Over Matter"},{"qty":3,"name":"Arcanis the Omnipotent"},{"qty":4,"name":"Show and Tell"},{"qty":3,"name":"Intuition"},{"qty":2,"name":"Thran Dynamo"},{"qty":2,"name":"Lotus Petal"},{"qty":2,"name":"Rush of Knowledge"},{"qty":2,"name":"Kaervek's Torch"},{"qty":1,"name":"Stroke of Genius"},{"qty":4,"name":"Counterspell"},{"qty":1,"name":"Arcane Denial"},{"qty":4,"name":"Impulse"},{"qty":4,"name":"Opt"},{"qty":3,"name":"Frantic Search"},{"qty":11,"name":"Island"},{"qty":4,"name":"Ancient Tomb"},{"qty":2,"name":"City of Traitors"},{"qty":2,"name":"Shivan Reef"},{"qty":2,"name":"Svyelunite Temple"}],"side":[{"qty":4,"name":"Hydroblast"},{"qty":3,"name":"Annul"},{"qty":2,"name":"Stifle"},{"qty":2,"name":"Powder Keg"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Defense Grid"}],"mainCount":60,"sideCount":15}}},{"id":"19b582d17bca","prompt":"expert2-premodern-phyrexian-processor","brew":true,"left":{"text":"I built a mono-black fast-mana deck around 4 Phyrexian Processor, labeled as a brew. The plan: protect the Processor with Duress and Cabal Therapy, then cast it on turn 2 using Dark Ritual or Ancient Tomb (or on turn 1 with City of Traitors or Lotus Petal). Pay about 7 life and start making a 7/7 Minion every turn from turn 3. Phyrexian Negator and Hypnotic Specter are a second wave of early threats, so a single Swords to Plowshares or Disenchant doesn't stop the deck.\n\n**Three directions I considered:**\n1. **Mono-black with Ritual and discard (chosen).** It borrows the discard and removal package from The Rack and Moneyball Black on the menu, adds the colorless lands Ancient Tomb and City of Traitors, and supports the Processor with Dark Ritual and Lotus Petal.\n2. **Blue Tinker artifact ramp.** This borrows from the Devourer Combo shell, which already runs Processor as a sideboard card: sacrifice a Lotus Petal to Tinker and put Processor onto the battlefield, then use Mind Stone or Thran Dynamo to pay for activations.\n3. **Prison deck.** Processor alongside Tangle Wire and Smokestack, with the Minion tokens as things to sacrifice.\n\n**Why the first one:** Dark Ritual and Ancient Tomb pay for both the 4-mana cast and the {4} activation. Discard is the only proactive way black has to keep a Processor deck safe from Swords to Plowshares, Disenchant-type cards and counterspells. Tinker gives up that protection, and the prison version wins too slowly.\n\n**Odds and caveats:**\n- About 45% of games you'll have a Processor in your opening hand plus the turn-2 draw, on the play. About 90% of games you'll have fast mana by then.\n- Diabolic Intent can fetch a Processor if you sacrifice a Ravenous Rats after its discard trigger.\n- The submit tool rated the full listed win line at only 2.2%. That number requires drawing every card in the line. The deck itself only needs a Processor plus enough mana.\n- Pay less life against Sligh and more against slow decks like Enchantress or Stiflenought.\n- Running 21 lands is lower than The Rack's average of about 22.5. The 4 Lotus Petals and 4 Dark Rituals make up for it, and the deck check passed with no warnings.\n\n**Sideboard:** It targets the decks at the top of the menu:\n- **Enchantress and Terrageddon:** Dystopia and Gloom.\n- **Goblins and other creature-type decks:** Engineered Plague.\n- **Sligh:** Drain Life.\n- **Big single threats like Terravore or Phyrexian Dreadnought:** Snuff Out.\n- **Graveyard decks:** Tormod's Crypt and Withered Wretch.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Phyrexian Processor"},{"qty":4,"name":"Dark Ritual"},{"qty":4,"name":"Lotus Petal"},{"qty":4,"name":"Duress"},{"qty":4,"name":"Cabal Therapy"},{"qty":4,"name":"Phyrexian Negator"},{"qty":4,"name":"Hypnotic Specter"},{"qty":3,"name":"Ravenous Rats"},{"qty":2,"name":"Smother"},{"qty":2,"name":"Diabolic Edict"},{"qty":2,"name":"Masticore"},{"qty":2,"name":"Diabolic Intent"},{"qty":4,"name":"Ancient Tomb"},{"qty":2,"name":"City of Traitors"},{"qty":15,"name":"Swamp"}],"side":[{"qty":3,"name":"Dystopia"},{"qty":3,"name":"Engineered Plague"},{"qty":2,"name":"Gloom"},{"qty":2,"name":"Drain Life"},{"qty":2,"name":"Snuff Out"},{"qty":2,"name":"Tormod's Crypt"},{"qty":1,"name":"Withered Wretch"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built a mono-black brew around Phyrexian Processor. Discard spells clear the way, then Processor makes a big black Minion token every turn. Use Duress or Cabal Therapy to take their answer, then cast Processor on turn 2 or 3 using Dark Ritual or Ancient Tomb, paying about 6–8 life as it enters (less against burn). Ancient Tomb and City of Traitors also help pay the {4} it costs to make each Minion. Until it lands, the deck plays like a disruptive black deck: Hypnotic Specter, Phyrexian Negator and removal.\n\n**Three directions I considered:**\n1. **Mono-black Ritual Processor**, borrowing the discard, Ritual and removal package from Moneyball Black.\n2. **Colorless artifact ramp** with Metalworker, Thran Dynamo and Tangle Wire. Grim Monolith turned out to be banned, which leaves this direction slow.\n3. **Blue Tinker** that cheats Processor into play, using the Devourer Combo shell. Processor shows up in that deck's sideboard in 43% of its lists.\n\nI chose the first because Ritual and Ancient Tomb get Processor down early, and discard protects it from the counterspells, Swords to Plowshares and Seal of Cleansing in the field better than the other two directions could.\n\n**The deck (60):**\n- **Artifacts:** 4 Phyrexian Processor, 2 Masticore\n- **Fast mana and tutors:** 4 Dark Ritual, 2 Diabolic Intent (sacrifice a creature to find a Processor)\n- **Discard:** 4 Duress, 4 Cabal Therapy, 4 Ravenous Rats. The Rats and spare Minions pay for Therapy's flashback.\n- **Creatures:** 4 Hypnotic Specter, 3 Phyrexian Negator\n- **Removal:** 3 Smother, 2 Diabolic Edict, 2 Snuff Out\n- **Lands (22):** 15 Swamp, 4 Ancient Tomb, 2 Mishra's Factory, 1 City of Traitors\n- **Sideboard:** 3 Engineered Plague, 3 Dystopia, 2 Gloom, 3 Withered Wretch, 2 Perish, 2 Bottle Gnomes\n\n**Things to know:**\n- **Odds:** Without mulligans, you have a Processor by turn 3 49% of the time. Counting Diabolic Intent, you have a Processor or a way to find one by turn 2 59% of the time. You have both that and a fast-mana card (Ritual, Tomb or City) 43% of the time.\n- **Mana:** There are 15 black sources, fewer than Moneyball's usual 17. I gave up some for Ancient Tomb's colorless mana, which matters more for Processor. The deck check passed with no warnings.\n- **Life:** Processor, Ancient Tomb and Snuff Out all cost life. Against Sligh, pay less into Processor; the Bottle Gnomes in the sideboard help there.\n- **Banned cards:** Grim Monolith, Vampiric Tutor and Demonic Consultation are all banned, so Diabolic Intent is the tutor.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Phyrexian Processor"},{"qty":2,"name":"Masticore"},{"qty":4,"name":"Dark Ritual"},{"qty":4,"name":"Duress"},{"qty":4,"name":"Cabal Therapy"},{"qty":4,"name":"Hypnotic Specter"},{"qty":3,"name":"Phyrexian Negator"},{"qty":4,"name":"Ravenous Rats"},{"qty":2,"name":"Diabolic Intent"},{"qty":3,"name":"Smother"},{"qty":2,"name":"Diabolic Edict"},{"qty":2,"name":"Snuff Out"},{"qty":15,"name":"Swamp"},{"qty":4,"name":"Ancient Tomb"},{"qty":1,"name":"City of Traitors"},{"qty":2,"name":"Mishra's Factory"}],"side":[{"qty":3,"name":"Engineered Plague"},{"qty":3,"name":"Dystopia"},{"qty":2,"name":"Gloom"},{"qty":3,"name":"Withered Wretch"},{"qty":2,"name":"Perish"},{"qty":2,"name":"Bottle Gnomes"}],"mainCount":60,"sideCount":15}}},{"id":"21cdbc26b1d9","prompt":"expert2-legacy-hypergenesis","brew":true,"left":{"text":"I built a Temur cascade deck, and it was accepted as a brew.\n\n**The plan:** Every nonland card except Hypergenesis costs 3 or more. So when you cast Shardless Agent, Violent Outburst or Bloodbraid Elf, cascade has to find Hypergenesis and cast it for free. Elvish Spirit Guide, Simian Spirit Guide and Chancellor of the Tangle's opening-hand mana let you do this on turn 1 or 2. Hypergenesis then puts your hand onto the battlefield for free. Maelstrom Wanderer gives everything haste, so Emrakul (annihilator 6, the opponent sacrifices six permanents), Archon of Cruelty and Griselbrand attack that same turn. If you draw Hypergenesis instead of a cascade spell, you can still suspend it on turn 1 or 2 for {1}{G}{G}.\n\n**Odds:**\n- **On the play, by turn 2:** about 83% to have both a way to cast Hypergenesis (14 cards) and at least one big creature in hand (16 cards).\n- **On the draw, by turn 3:** about 91%.\n- **The full turn-2 line:** the submit tool says you'll almost never draw every card in it. That's expected, because cascade finds Hypergenesis from the library rather than your hand, and the line doesn't need Archon specifically.\n- **What's not counted:** these numbers ignore mulligans and having enough mana.\n\n**Directions I considered:**\n1. **Temur cascade (chosen):** Shardless Agent, Violent Outburst, spirit guides and Force of Will.\n2. **Red fast-mana cascade:** Ancient Tomb, Throes of Chaos and Bloodbraid Elf, borrowed from Creative Technique, with no blue.\n3. **Four-colour cascade:** Ardent Plea and Demonic Dread for more cascade spells, with the Reanimator package from the menu (Griselbrand, Archon of Cruelty, Atraxa) as the creatures you drop.\n\nI picked the first because Living End's 3-mana cascade list with spirit guides and free counterspells fits Hypergenesis almost exactly, and Force of Will protects the combo against the blue decks that make up a large share of the field. I still took the best creatures from the Reanimator package to put into play.\n\n**Things to know:**\n- **Card rules:**\n  - Fury and Endurance work either way: cast for free early to stop aggro and graveyard decks, or as creatures that come in through Hypergenesis.\n  - Wanderer and Atraxa are blue, so they can pay for Force of Will.\n- **Black-mana warning:** The check flagged that Griselbrand has no black mana sources. That's intentional: none of the big creatures are ever cast with mana.\n- **Land count:** I run 16 lands where Living End plays about 14.5, to make up for having no Lotus Petal or Brainstorm. Any spell costing 0–2 would sometimes be hit by cascade instead of Hypergenesis.\n- **Chalice of the Void:**\n  - **Set to 0:** it counters Hypergenesis.\n  - **Set to 3:** it counters every cascade spell.\n\n  Both are common in Eldrazi lists, which is why there are 3 Force of Vigor in the sideboard.\n- **Hypergenesis is symmetric:** the opponent also gets to put cards from their hand onto the battlefield, but at Legacy speed they usually have little to add.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Hypergenesis"},{"qty":4,"name":"Shardless Agent"},{"qty":4,"name":"Violent Outburst"},{"qty":2,"name":"Bloodbraid Elf"},{"qty":4,"name":"Elvish Spirit Guide"},{"qty":3,"name":"Simian Spirit Guide"},{"qty":4,"name":"Force of Will"},{"qty":2,"name":"Force of Negation"},{"qty":1,"name":"Mystical Dispute"},{"qty":3,"name":"Emrakul, the Aeons Torn"},{"qty":3,"name":"Maelstrom Wanderer"},{"qty":2,"name":"Griselbrand"},{"qty":2,"name":"Archon of Cruelty"},{"qty":2,"name":"Chancellor of the Tangle"},{"qty":1,"name":"Atraxa, Grand Unifier"},{"qty":2,"name":"Fury"},{"qty":1,"name":"Endurance"},{"qty":2,"name":"Tropical Island"},{"qty":2,"name":"Volcanic Island"},{"qty":2,"name":"Taiga"},{"qty":4,"name":"Misty Rainforest"},{"qty":2,"name":"Scalding Tarn"},{"qty":2,"name":"Wooded Foothills"},{"qty":1,"name":"Forest"},{"qty":1,"name":"Island"}],"side":[{"qty":3,"name":"Force of Vigor"},{"qty":2,"name":"Mystical Dispute"},{"qty":2,"name":"Fury"},{"qty":2,"name":"Endurance"},{"qty":2,"name":"Leyline of the Void"},{"qty":2,"name":"Magus of the Moon"},{"qty":2,"name":"Dismember"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built a Temur cascade deck that casts Hypergenesis for free on turn 2. It's a brew, and it passed the deck check.\n\n**Three directions I considered:**\n1. **Temur cascade:** take the cascade-and-counterspell package from Legacy's Living End deck (4 Violent Outburst, 4 Shardless Agent, Force of Will, Force of Negation, Elvish Spirit Guide) and replace the graveyard creatures with big creatures and artifacts for Hypergenesis to put into play.\n2. **Creative Technique's shell:** about 30 lands, with Violent Outburst and Throes of Chaos as the cascade spells.\n3. **Free elementals:** Esper with Ardent Plea or Jund with Demonic Dread, built on the creatures you can cast for free by exiling a card (Solitude, Grief, Fury).\n\nI chose **direction 1**. It's the only one that has 8 three-mana cascade spells, counterspells to protect the combo, and Spirit Guides that are both free mana and extra bodies to put into play. The land-heavy shell would leave too few creatures in hand when Hypergenesis resolves.\n\n**The plan:** Every nonland card except Hypergenesis costs 3 or more. Lands count as 0, and cascade skips them. So when Violent Outburst or Shardless Agent cascades, it always flips Hypergenesis and casts it for free. Two lands, or one land plus a Spirit Guide, gets you there on turn 2. You go first in the Hypergenesis loop. You put in Fires of Yavimaya, Akroma's Memorial or Thundermaw Hellkite for haste, then Emrakul, Archon of Cruelty, Griselbrand or Atraxa. Fury's damage on entering clears out whatever creatures the opponent drops, and you attack that turn. Force of Will and Force of Negation protect the combo or stop the opponent's.\n\n**Odds:**\n- **Turn 2:** 70.6% to see a cascade spell by turn 2 on the play.\n- **Turn 3:** 35% to have a cascade spell, a haste card and a big creature all by turn 3, before mulligans.\n\n**About the two warnings:**\n- **Land count:** The check wants about 22 lands, but the big creatures are never cast, and Living End lists run about 14.5 lands. The 8 Spirit Guides make up the rest.\n- **No black mana:** The check flags that Griselbrand can't be cast, which is true and doesn't matter. Hypergenesis puts cards into play regardless of their color.\n\n**Watch out:**\n- **The rule cuts both ways.** Any card costing 0 to 2 that you add, including from the sideboard, can get flipped by cascade instead of Hypergenesis. The whole sideboard costs 3 or more for that reason.\n- **Leyline of the Void** only works if it's in your opening hand.\n- **Hypergenesis helps the opponent too.** They put cards in after you, so your haste and Fury matter.\n\n**Main deck (60)**\n- 3 Hypergenesis\n- 4 Violent Outburst\n- 4 Shardless Agent\n- 4 Force of Will\n- 3 Force of Negation\n- 3 Fury\n- 1 Endurance\n- 4 Elvish Spirit Guide\n- 4 Simian Spirit Guide\n- 3 Fires of Yavimaya\n- 1 Akroma's Memorial\n- 2 Thundermaw Hellkite\n- 3 Emrakul, the Aeons Torn\n- 2 Griselbrand\n- 2 Archon of Cruelty\n- 2 Atraxa, Grand Unifier\n- 15 lands:\n  - 4 Misty Rainforest\n  - 2 Scalding Tarn\n  - 2 Wooded Foothills\n  - 2 Tropical Island\n  - 2 Volcanic Island\n  - 2 Taiga\n  - 1 Forest\n\n**Sideboard (15)**\n- 3 Mystical Dispute\n- 3 Force of Vigor\n- 3 Leyline of the Void\n- 2 Magus of the Moon\n- 3 Pyrokinesis\n- 1 Endurance","error":false,"deck":{"commander":[],"main":[{"qty":3,"name":"Hypergenesis"},{"qty":4,"name":"Violent Outburst"},{"qty":4,"name":"Shardless Agent"},{"qty":4,"name":"Force of Will"},{"qty":3,"name":"Force of Negation"},{"qty":3,"name":"Fury"},{"qty":1,"name":"Endurance"},{"qty":4,"name":"Elvish Spirit Guide"},{"qty":4,"name":"Simian Spirit Guide"},{"qty":3,"name":"Fires of Yavimaya"},{"qty":1,"name":"Akroma's Memorial"},{"qty":2,"name":"Thundermaw Hellkite"},{"qty":3,"name":"Emrakul, the Aeons Torn"},{"qty":2,"name":"Griselbrand"},{"qty":2,"name":"Archon of Cruelty"},{"qty":2,"name":"Atraxa, Grand Unifier"},{"qty":4,"name":"Misty Rainforest"},{"qty":2,"name":"Scalding Tarn"},{"qty":2,"name":"Wooded Foothills"},{"qty":2,"name":"Tropical Island"},{"qty":2,"name":"Volcanic Island"},{"qty":2,"name":"Taiga"},{"qty":1,"name":"Forest"}],"side":[{"qty":3,"name":"Mystical Dispute"},{"qty":3,"name":"Force of Vigor"},{"qty":3,"name":"Leyline of the Void"},{"qty":2,"name":"Magus of the Moon"},{"qty":3,"name":"Pyrokinesis"},{"qty":1,"name":"Endurance"}],"mainCount":60,"sideCount":15}}},{"id":"3a8a9cf2632e","prompt":"expert2-premodern-shapeshifter-phage","brew":true,"left":{"text":"I submitted a brew: **UG Survival-Shapeshifter**, 21 lands plus 4 Birds of Paradise, with a 15-card sideboard.\n\n**How it wins:** Volrath's Shapeshifter copies the full text of whatever creature is on top of your graveyard. Phage the Untouchable never enters the battlefield, so its \"you lose if you didn't cast it\" trigger never happens. But Shapeshifter still gets Phage's \"deals combat damage to a player → that player loses the game.\" You attack with Shapeshifter, and after blockers are declared you discard Phage at instant speed. You can do that with Shapeshifter's own {2} discard ability, Wild Mongrel (free) or Survival of the Fittest ({G}), and the hit ends the game.\n\n**The key rule:** the discard has to come from an ability, not a spell. An instant or sorcery like Frantic Search or Intuition goes to the graveyard after it resolves and lands on top of Phage. That's why the outlets here are Shapeshifter's own ability, Mongrel, Survival and Merfolk Looter.\n\n**Getting through blockers:** Wonder gives all your creatures flying while it's anywhere in your graveyard and you control an Island. Phantom Warrior is a second option: while it's on top of the graveyard, Shapeshifter is unblockable, and you discard Phage after blocks.\n\n**Why I chose this direction:** I considered three:\n1. A UB Psychatog-style deck with Intuition and Looters.\n2. The 5-color Hermit Druid shell (which already runs 2 Shapeshifters) with Phage added.\n3. Green-blue (UG) Survival tempo with Wild Mongrel and Survival from the Survival Madness/Hermit Druid decks and counterspells from the blue control decks.\n\nI picked the UG Survival version because Survival does three jobs: it finds Shapeshifter, it finds Phage, and it's an instant-speed way to discard Phage. Phage is never cast, so black would only weigh down the mana.\n\n**Things to know:**\n- **Black mana warning:** check_deck flagged that Phage \"wants ~20 black sources.\" I left it because you never cast Phage.\n- **Odds** (on the play, no mulligans):\n  - Drawing Shapeshifter plus Phage or Survival by turn 4: **34.7%**.\n  - By turn 5, holding Survival or Shapeshifter plus a way to Phage (Survival, Phage or Impulse): **72.7%**.\n- **Weak spot:** Shapeshifter is a 0/1 that has to survive a turn before it can attack. Daze, Counterspell and Mana Leak are there to protect it.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Volrath's Shapeshifter"},{"qty":2,"name":"Phage the Untouchable"},{"qty":1,"name":"Wonder"},{"qty":1,"name":"Phantom Warrior"},{"qty":4,"name":"Wild Mongrel"},{"qty":4,"name":"Birds of Paradise"},{"qty":2,"name":"Merfolk Looter"},{"qty":4,"name":"Survival of the Fittest"},{"qty":4,"name":"Counterspell"},{"qty":4,"name":"Daze"},{"qty":2,"name":"Mana Leak"},{"qty":4,"name":"Impulse"},{"qty":2,"name":"Sylvan Library"},{"qty":1,"name":"Fact or Fiction"},{"qty":4,"name":"Yavimaya Coast"},{"qty":9,"name":"Island"},{"qty":8,"name":"Forest"}],"side":[{"qty":3,"name":"Naturalize"},{"qty":3,"name":"Hydroblast"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Annul"},{"qty":2,"name":"Submerge"},{"qty":1,"name":"Uktabi Orangutan"},{"qty":2,"name":"Ravenous Baloth"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built a blue-green Survival deck that never casts Phage. The plan is to get Volrath's Shapeshifter into play first, then discard Phage the Untouchable at instant speed. Shapeshifter copies the text of whatever creature card is on top of your graveyard, so it becomes a 4/4 Phage. Phage's \"you lose the game if it enters without being cast from hand\" only triggers when Phage itself enters, so it never goes off. Its other trigger still does: when it deals combat damage to a player, that player loses the game.\n\n**Directions I considered:**\n1. **Blue-green Survival (chosen).** Borrows the Survival of the Fittest and Birds of Paradise package from Hermit Druid Combo, where Shapeshifter already shows up in 81 of 90 recent lists.\n2. **Blue-black Buried Alive.** Buried Alive puts Phage and Wonder into the graveyard together, with Phage on top. But it's a sorcery and it can't find Shapeshifter.\n3. **Blue-black Psychatog-style control** with Shapeshifter as a backup finisher. It's slow and Phage barely matters.\n\nI picked the first because Survival handles both halves of the combo. Discarding a creature is part of its cost, and it works at instant speed, so it's both the discard outlet and a tutor for Shapeshifter.\n\n**How it wins:**\n- **Turns 1–3:** Birds of Paradise turn 1, Survival turn 2, Shapeshifter turn 3.\n- **Turn 3 or 4:** use Survival to discard Wonder and fetch Phage. While Wonder is in your graveyard and you control an Island, your creatures have flying.\n- **Turn 4:** attack with Shapeshifter. Once blockers are declared, discard Phage to Survival. Shapeshifter is now a flying 4/4 Phage, and its combat damage makes them lose.\n- **Protecting the switch:** Xantid Swarm stops the opponent from casting spells on any turn it attacks, so they can't kill Shapeshifter in response.\n- **Backup ways to discard Phage:** Intuition (2 copies of Phage means the opponent can't keep both out of your graveyard), Merfolk Looter, Frantic Search, Careful Study, and Shapeshifter's own \"{2}: Discard a card.\"\n\n**Honest odds:** without a mulligan, you have about an 86% chance by turn 4 to hold both a way to get Shapeshifter (Shapeshifter, Survival or Intuition) and a way to discard. That number doesn't check that you've already binned Wonder, so a turn-4 win with flying is less likely than that. When Wonder isn't in the graveyard yet, you need the opponent to not block, or you need Swarm's protection.\n\n**Notes:**\n- The checker warns there are only 4 black sources for Phage. That's intended: Phage is never meant to be cast.\n- The deck has 21 lands with 16 blue and 15 green sources, which suits a two-color deck. The checker flags the gap against Hermit Druid Combo's 19+ sources of each color, but that deck runs five colors.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Volrath's Shapeshifter"},{"qty":2,"name":"Phage the Untouchable"},{"qty":1,"name":"Wonder"},{"qty":4,"name":"Birds of Paradise"},{"qty":3,"name":"Merfolk Looter"},{"qty":2,"name":"Xantid Swarm"},{"qty":2,"name":"Wall of Roots"},{"qty":4,"name":"Survival of the Fittest"},{"qty":3,"name":"Intuition"},{"qty":3,"name":"Frantic Search"},{"qty":4,"name":"Counterspell"},{"qty":3,"name":"Careful Study"},{"qty":2,"name":"Mana Leak"},{"qty":2,"name":"Impulse"},{"qty":4,"name":"Yavimaya Coast"},{"qty":2,"name":"City of Brass"},{"qty":8,"name":"Island"},{"qty":7,"name":"Forest"}],"side":[{"qty":3,"name":"Hydroblast"},{"qty":2,"name":"Naturalize"},{"qty":1,"name":"Uktabi Orangutan"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Sylvan Safekeeper"},{"qty":1,"name":"Gilded Drake"},{"qty":2,"name":"Spike Feeder"},{"qty":2,"name":"Wall of Blossoms"}],"mainCount":60,"sideCount":15}}},{"id":"5fc1433dd9d4","prompt":"expert2-legacy-kiki-pestermite","brew":true,"left":{"text":"I call this deck **Sneak Twin**. It's a brew: no published list in the last 400 days runs Kiki-Jiki and Pestermite together.\n\n**The combo:** Pestermite's enter trigger can untap Kiki-Jiki. Kiki-Jiki taps to make a hasty copy of Pestermite, the copy untaps Kiki-Jiki, and that repeats for as many hasty 2/1 fliers as you want. You attack with all of them for the win.\n\n**The plan:** Kiki-Jiki costs {2}{R}{R}{R}, which is the real problem in Legacy. So the deck uses Sneak Attack and Show and Tell to cheat it into play. With Sneak Attack down, you pay {R} to put in Kiki-Jiki and another {R} to put in Pestermite, which wins on the spot. Ancient Tomb, City of Traitors, Lotus Petal and Simian Spirit Guide can get Sneak Attack down on turn 2. Brainstorm, Ponder and Stock Up dig for the missing piece, and Force of Will and Spell Pierce protect the combo turn.\n\n**Backup untappers:**\n- **Deceiver Exarch:** its untap mode does the same job as Pestermite.\n- **Zealous Conscripts:** its copies untap Kiki-Jiki too. It costs 5, but Sneak Attack makes that irrelevant.\n\nLightning Bolt handles small creatures like Ocelot Pride and hatebears.\n\n**Directions I considered:**\n1. **Izzet tempo with Splinter Twin:** taking Izzet Tempo's Bolt, Daze and cantrips. Rejected because it would mean hard-casting a 5-mana Kiki-Jiki in a fast format.\n2. **Red Goblins-style deck:** using Imperial Recruiter to find Pestermite. Rejected because it's too slow and too short on blue.\n3. **Sneak Attack shell (chosen):** I took the package from Sneak and Show, which is 2.5% of the field. Sneak Attack turns Kiki-Jiki's worst trait, its cost, into a single {R}, and it also makes the 2-card combo cheaper.\n\n**Odds:**\n- By turn 4, without counting card draw, you'll have Kiki-Jiki, an untapper and Sneak Attack or Show and Tell together about 28% of the time.\n- The exact turn-3 line (Ancient Tomb into Sneak Attack, Kiki-Jiki, Pestermite) shows up naturally only about 3% of the time. Neither number includes the 10 Brainstorm/Ponder/Stock Up, which improve them a lot.\n- Kiki-Jiki is the hardest piece to find, since you can only run 4.\n\n**Mana:** The deck runs 18 lands plus Lotus Petal and Simian Spirit Guide. That's in line with real Sneak and Show lists (about 19 lands on average), even though the deck checker suggested around 20.\n\n**Sideboard:** It targets the current top decks:\n- **Pyroblast, Hydroblast and Force of Negation:** for the Tempo decks.\n- **Grafdigger's Cage and Surgical Extraction:** for Reanimator.\n- **Flusterstorm, Hexing Squelcher and Consign to Memory:** for the combo decks.\n- **Brotherhood's End and Abrade:** for Ocelot Aggro and Sewer Combo.\n- **Magus of the Moon:** for Lands and Tron.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Kiki-Jiki, Mirror Breaker"},{"qty":4,"name":"Pestermite"},{"qty":3,"name":"Deceiver Exarch"},{"qty":1,"name":"Zealous Conscripts"},{"qty":4,"name":"Sneak Attack"},{"qty":3,"name":"Show and Tell"},{"qty":4,"name":"Brainstorm"},{"qty":4,"name":"Ponder"},{"qty":2,"name":"Stock Up"},{"qty":4,"name":"Force of Will"},{"qty":2,"name":"Spell Pierce"},{"qty":3,"name":"Lotus Petal"},{"qty":2,"name":"Simian Spirit Guide"},{"qty":2,"name":"Lightning Bolt"},{"qty":4,"name":"Volcanic Island"},{"qty":1,"name":"Thundering Falls"},{"qty":3,"name":"Ancient Tomb"},{"qty":1,"name":"City of Traitors"},{"qty":2,"name":"Island"},{"qty":1,"name":"Mountain"},{"qty":3,"name":"Scalding Tarn"},{"qty":2,"name":"Misty Rainforest"},{"qty":1,"name":"Polluted Delta"}],"side":[{"qty":2,"name":"Pyroblast"},{"qty":1,"name":"Hydroblast"},{"qty":2,"name":"Consign to Memory"},{"qty":2,"name":"Force of Negation"},{"qty":2,"name":"Hexing Squelcher"},{"qty":1,"name":"Abrade"},{"qty":1,"name":"Grafdigger's Cage"},{"qty":1,"name":"Brotherhood's End"},{"qty":1,"name":"Flusterstorm"},{"qty":1,"name":"Surgical Extraction"},{"qty":1,"name":"Magus of the Moon"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built a red fast-mana deck that splashes blue: \"Sol-Land Kiki Twin.\" It borrows its mana base and Chalice of the Void from the Mono-Red Prison lists, and it's a brew. Neither main card has a current proven home: in the last 90 days Kiki-Jiki showed up in 1 list and Pestermite in none.\n\n**The plan:** Ancient Tomb, City of Traitors, Simian Spirit Guide, Chrome Mox and Lotus Petal pay for Kiki-Jiki's {2}{R}{R}{R} on turn 2–3. Before that, flash in Pestermite or Deceiver Exarch at the end of the opponent's turn. When Kiki lands it has haste, so it can copy the Pestermite right away; the copy untaps Kiki, and you repeat for as many hasty fliers as you need. Splinter Twin on either untapper is a second way to do the same loop. Zealous Conscripts also loops with Kiki and needs no blue at all. Imperial Recruiter can fetch Kiki, Pestermite or Exarch, so it counts as a combo piece. Chalice of the Void set to 1 shuts off the cheap removal and cantrips that would stop the combo (Swords to Plowshares, Fatal Push, Brainstorm, Ponder). Fury, Fable and The One Ring keep you in the game until the combo comes together.\n\n**Directions I considered:**\n1. **Izzet Tempo shell** (Brainstorm, Ponder, Force of Will, Daze) with Twin and Kiki. Those lists average about 8 red sources, which is too few for Kiki's RRR.\n2. **Mono-Red Prison fast-mana shell splashing blue** (chosen).\n3. **A white build with Restoration Angel** as an extra loop with Kiki. It's slower, adds a third color, and Angel can't loop with Pestermite.\n\nI picked option 2 because fast mana is the only way a five-mana creature with RRR in its cost comes down early, and Chalice protects the combo in a way counterspells can't in a mostly red deck.\n\n**Things to know:**\n- **Odds:** On the play, you have about a 67% chance to see both a Kiki/Twin/Recruiter and a Pestermite/Exarch by turn 4, with no mulligans.\n- **Land count:** The deck checker suggests about 23 lands and this list runs about 17.5. That's on purpose: the Prison lists average about 16.7 lands and lean on Spirit Guide, Chrome Mox and Petal the same way.\n- **Blue mana:** There are only 8 blue-producing lands. That's thin, but Pestermite and Exarch only need one blue each, and Petal or Chrome Mox can cover it.\n- **Blood Moon:** It's sideboard-only, because it turns Volcanic Island into a Mountain and cuts off your blue.\n\nThe sideboard is aimed at the current field: Blood Moon and Pithing Needle for Tron, Lands and Eldrazi; Pyroblast for the blue tempo decks and OmniTell; Leyline of the Void for Reanimator and Doomsday; Trinisphere and Mindbreak Trap for the storm and combo decks; Fiery Confluence for Ocelot Aggro.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Pestermite"},{"qty":4,"name":"Deceiver Exarch"},{"qty":3,"name":"Kiki-Jiki, Mirror Breaker"},{"qty":1,"name":"Zealous Conscripts"},{"qty":3,"name":"Splinter Twin"},{"qty":4,"name":"Imperial Recruiter"},{"qty":4,"name":"Fable of the Mirror-Breaker"},{"qty":4,"name":"Chalice of the Void"},{"qty":3,"name":"Fury"},{"qty":2,"name":"The One Ring"},{"qty":4,"name":"Simian Spirit Guide"},{"qty":4,"name":"Chrome Mox"},{"qty":2,"name":"Lotus Petal"},{"qty":4,"name":"Ancient Tomb"},{"qty":3,"name":"City of Traitors"},{"qty":4,"name":"Volcanic Island"},{"qty":2,"name":"Scalding Tarn"},{"qty":2,"name":"Bloodstained Mire"},{"qty":2,"name":"Mountain"},{"qty":1,"name":"Shatterskull Smashing"}],"side":[{"qty":2,"name":"Blood Moon"},{"qty":2,"name":"Trinisphere"},{"qty":2,"name":"Fiery Confluence"},{"qty":3,"name":"Leyline of the Void"},{"qty":3,"name":"Pyroblast"},{"qty":2,"name":"Mindbreak Trap"},{"qty":1,"name":"Pithing Needle"}],"mainCount":60,"sideCount":15}}},{"id":"6a87dbc8683b","prompt":"expert2-legacy-glimpse-elves","brew":true,"left":{"text":"I built Golgari Glimpse Elves, a brew based on the old Legacy Elves combo with a light black splash. It isn't in recent results as its own deck. Glimpse of Nature and Heritage Druid both show 0 lists in the last 90 days, so treat it as untested.\n\n**How it wins:** Get Heritage Druid out next to cheap Elves. Each three Elves become GGG, and Nettle Sentinel untaps every time you cast a green spell. Glimpse of Nature makes every creature you cast that turn draw a card, so a turn of one-drops keeps paying for itself. Wirewood Symbiote and Quirion Ranger untap your Elves and let you recast them for more draws. The chain ends with Natural Order (or Green Sun's Zenith for 8) fetching Craterhoof Behemoth, which has haste and gives every creature +X/+X and trample. Shaman of the Pack is a backup finisher: it makes the opponent lose life equal to your Elf count.\n\n**The three directions I considered:**\n1. **Mono-green all-in combo** with Summoner's Pact and Lotus Petal. It's the fastest, but it has no answer to the field's combo decks.\n2. **Golgari Elves using the GX Midrange package** (Thoughtseize, Gaea's Cradle, Natural Order + Craterhoof, Allosaurus Shepherd, plus Force of Vigor, Endurance and Leyline of the Void in the sideboard).\n3. **Simic Elves** with Beck // Call and Distant Melody for card draw. Those cards are clunky, and blue adds little here.\n\n**Why I picked direction 2:** The GX Midrange package already wins in this field and fits your two cards well. Thoughtseize handles Doomsday, Reanimator and OmniTell, and Allosaurus Shepherd stops counterspells against your green spells, which matters against Dimir and Izzet Tempo's Force of Will.\n\n**Odds and choices to know about:**\n- **Glimpse isn't guaranteed early.** You'll see a Glimpse by turn 3 only about 49% of the time. You'll have Heritage Druid or Green Sun's Zenith (which can fetch it) about 75% of the time.\n- **Plan B:** You'll find Natural Order or Green Sun's Zenith by turn 4 about 74% of the time. Leaf-Crowned Visionary is a second draw engine (pay G to draw whenever you cast an Elf), so the deck still works without Glimpse.\n- **Only 17 lands.** That's against a GX Midrange average of about 21, but the deck has 31 one-drops, plenty of mana Elves and three Cradles. The deck checker suggested about 18.\n- **Black mana:** The checker counted 5 black sources. In practice every fetch land can grab Bayou, so it's closer to 8.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Heritage Druid"},{"qty":4,"name":"Nettle Sentinel"},{"qty":4,"name":"Quirion Ranger"},{"qty":4,"name":"Wirewood Symbiote"},{"qty":4,"name":"Elvish Visionary"},{"qty":2,"name":"Fyndhorn Elves"},{"qty":2,"name":"Allosaurus Shepherd"},{"qty":2,"name":"Leaf-Crowned Visionary"},{"qty":1,"name":"Priest of Titania"},{"qty":1,"name":"Shaman of the Pack"},{"qty":1,"name":"Craterhoof Behemoth"},{"qty":4,"name":"Glimpse of Nature"},{"qty":4,"name":"Green Sun's Zenith"},{"qty":3,"name":"Natural Order"},{"qty":3,"name":"Thoughtseize"},{"qty":3,"name":"Gaea's Cradle"},{"qty":1,"name":"Dryad Arbor"},{"qty":4,"name":"Forest"},{"qty":2,"name":"Bayou"},{"qty":3,"name":"Verdant Catacombs"},{"qty":2,"name":"Misty Rainforest"},{"qty":1,"name":"Windswept Heath"},{"qty":1,"name":"Boseiju, Who Endures"}],"side":[{"qty":2,"name":"Force of Vigor"},{"qty":2,"name":"Endurance"},{"qty":2,"name":"Abrupt Decay"},{"qty":2,"name":"Fatal Push"},{"qty":3,"name":"Leyline of the Void"},{"qty":1,"name":"Collector Ouphe"},{"qty":1,"name":"Thoughtseize"},{"qty":2,"name":"Snuff Out"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built a classic \"Nettle-Glimpse\" Elves combo deck (labeled a brew). It's almost all green, with Bayou as a light black splash, and it borrows the Green Sun's Zenith / Natural Order / Craterhoof / Gaea's Cradle package from the GX Midrange lists on the menu.\n\nNo published list in the last 400 days plays Glimpse and Heritage Druid together. Neither card shows up in recent Legacy results, but both are legal.\n\n**The plan:** Play one-mana Elves on turns 1–2. On turn 3, cast Glimpse of Nature so every creature you cast draws a card, then chain cheap Elves:\n- **Heritage Druid** taps any three Elves for GGG, even ones you just cast, so each new one-drop pays for more than itself.\n- **Nettle Sentinel** untaps every time you cast a green spell, so it helps pay for Heritage Druid over and over.\n- **Birchlore Rangers** turns two Elves into one mana of any color.\n- **Quirion Ranger** and **Wirewood Symbiote** untap creatures for extra mana. Symbiote can also bounce a spent Elf so you can recast it for another draw.\n\nOnce the chain has drawn enough, Natural Order sacrifices a spent Elf and puts Craterhoof Behemoth onto the battlefield. It has haste and gives each creature +X/+X and trample, which with a board of about eight creatures is lethal around turn 3–4. If the combo stalls, Gaea's Cradle and Priest of Titania (one green mana per Elf) still give you huge mana, and you can just win by attacking.\n\n**Why this direction:** I compared three options:\n1. A pure mono-green combo deck.\n2. This version, with the GSZ/Natural Order/Cradle package from GX Midrange.\n3. An Eladamri/Formidable Speaker midrange deck.\n\nI chose the second because it keeps Glimpse and Heritage Druid at the center while doubling your access to both:\n- **More Heritage Druids:** Green Sun's Zenith for X=1 finds a Druid, so you have 8 ways to get one instead of 4.\n- **More ways to Craterhoof:** besides the 3 Natural Orders, Zenith can find Formidable Speaker, which searches out Craterhoof. That's 8 routes in all.\n- **Protection:** Zenith can also find Allosaurus Shepherd, which stops counterspells on your green spells. That matters against the Force of Will and Daze decks in the field.\n\n**Honest odds:**\n- On the play, you see Glimpse by turn 3 about 49% of the time, and the same for a natural Heritage Druid. You have both naturally only about 14% of the time; Zenith makes this better, but the tool doesn't simulate tutors.\n- A turn-3 kill depends on a good draw, so expect turn 4 to be more typical.\n- You draw Natural Order or Formidable Speaker by turn 4 about 53% of the time, before counting Zenith.\n\n**Lands:** I run 16, while GX Midrange lists average about 21. That's on purpose: average mana value is 1.5, there are 7 one-drop mana Elves plus Heritage Druid and Birchlore, and the deck checker suggests 15.8.\n\n**Sideboard:** The black splash is there for discard (Thoughtseize, Duress) against Doomsday, Storm, OmniTell and Reanimator. Abrupt Decay and Collector Ouphe handle problem permanents, artifacts and Sewer Combo. Force of Vigor deals with Lands and other artifact/enchantment decks, Endurance answers graveyard decks, and Choke is for the Dimir and Izzet tempo decks.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Heritage Druid"},{"qty":4,"name":"Nettle Sentinel"},{"qty":3,"name":"Birchlore Rangers"},{"qty":4,"name":"Quirion Ranger"},{"qty":4,"name":"Wirewood Symbiote"},{"qty":4,"name":"Fyndhorn Elves"},{"qty":2,"name":"Llanowar Elves"},{"qty":1,"name":"Elvish Mystic"},{"qty":2,"name":"Elvish Visionary"},{"qty":2,"name":"Priest of Titania"},{"qty":1,"name":"Formidable Speaker"},{"qty":1,"name":"Allosaurus Shepherd"},{"qty":1,"name":"Craterhoof Behemoth"},{"qty":4,"name":"Glimpse of Nature"},{"qty":4,"name":"Green Sun's Zenith"},{"qty":3,"name":"Natural Order"},{"qty":3,"name":"Gaea's Cradle"},{"qty":1,"name":"Dryad Arbor"},{"qty":6,"name":"Forest"},{"qty":2,"name":"Bayou"},{"qty":2,"name":"Verdant Catacombs"},{"qty":2,"name":"Misty Rainforest"}],"side":[{"qty":3,"name":"Thoughtseize"},{"qty":2,"name":"Duress"},{"qty":2,"name":"Abrupt Decay"},{"qty":2,"name":"Force of Vigor"},{"qty":3,"name":"Endurance"},{"qty":1,"name":"Collector Ouphe"},{"qty":2,"name":"Choke"}],"mainCount":60,"sideCount":15}}},{"id":"7cce3171e8f0","prompt":"expert2-legacy-scapeshift","brew":true,"left":{"text":"I've built and submitted **Temur Omen-Shift**, a brew. Scapeshift and Valakut have essentially no recent Legacy results (Scapeshift appears in 1 rogue list in 90 days, Valakut in none), so there was no proven list to copy.\n\n**Directions I considered:**\n1. **Temur Scapeshift with the cantrip-and-Force package** from Dimir and Izzet Tempo: Brainstorm, Ponder and Force of Will around ramp and Scapeshift.\n2. **Gruul Valakut using the Lands package:** Exploration, Crop Rotation, Mox Diamond and Life from the Loam.\n3. **Mono-green ramp:** Summoner's Pact and Primeval Titan.\n\nI chose the first. The field is full of combo and blue tempo decks (Doomsday, OmniTell, Reanimator, Storm), and only Force of Will plus cantrips can both protect a slow combo and dig for it. Mox Diamond also works against Scapeshift, because it costs you a land.\n\n**The plan:** Taiga and Volcanic Island are Mountains, and Nature's Lore and Three Visits fetch Taiga or Tropical Island untapped, so your ramp builds the Mountain count Valakut needs.\n- **Main kill:** Prismatic Omen makes every land you control every basic land type, including Mountain. With Omen out, Scapeshift on 6 lands deals 18 damage, or 36 if it fetches both Valakuts.\n- **Without Omen:** Scapeshift on 7 lands fetches Valakut plus 6 Mountains, which is also 18.\n- **Backup:** Primeval Titan fetches Valakut and Mountains.\n- **Protection:** Veil of Summer stops Scapeshift from being countered, and Force of Will covers you against fast combo.\n- **The target is a turn-5 kill.** Without mulligans, you have about a 61% chance to see Scapeshift or Titan by turn 4 on the play. About 91% of your openers have Scapeshift, Titan or a cantrip by turn 3.\n\n**Notes on the build:**\n- **Land count:** The deck runs 21 lands even though the deck checker recommends about 15 based on the average mana value. A Scapeshift deck needs lands in play, and 21 matches what GX Midrange decks run.\n- **Fetchable sources:** The checker counts only 6 blue sources and 13 green ones because it doesn't credit the fetchlands' targets. In practice every fetchland can find a blue dual: Wooded Foothills can find Volcanic Island and Tropical Island.\n- **Sideboard:**\n  - Pyroblast and Carpet of Flowers for the blue decks\n  - Endurance and Tormod's Crypt for Reanimator\n  - Flusterstorm for Storm and Doomsday\n  - Pyroclasm for Ocelot Aggro\n  - Krosan Grip for The One Ring, Chalice of the Void and Omniscience","error":false,"deck":{"commander":[],"main":[{"qty":2,"name":"Valakut, the Molten Pinnacle"},{"qty":3,"name":"Taiga"},{"qty":2,"name":"Volcanic Island"},{"qty":2,"name":"Tropical Island"},{"qty":4,"name":"Wooded Foothills"},{"qty":2,"name":"Misty Rainforest"},{"qty":4,"name":"Mountain"},{"qty":2,"name":"Forest"},{"qty":4,"name":"Scapeshift"},{"qty":4,"name":"Prismatic Omen"},{"qty":1,"name":"Primeval Titan"},{"qty":4,"name":"Brainstorm"},{"qty":4,"name":"Ponder"},{"qty":4,"name":"Force of Will"},{"qty":4,"name":"Nature's Lore"},{"qty":2,"name":"Three Visits"},{"qty":4,"name":"Utopia Sprawl"},{"qty":3,"name":"Sakura-Tribe Elder"},{"qty":3,"name":"Lightning Bolt"},{"qty":2,"name":"Veil of Summer"}],"side":[{"qty":3,"name":"Pyroblast"},{"qty":2,"name":"Carpet of Flowers"},{"qty":2,"name":"Endurance"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Flusterstorm"},{"qty":2,"name":"Pyroclasm"},{"qty":2,"name":"Krosan Grip"}],"mainCount":60,"sideCount":15}},"right":{"text":"I submitted **RG Prismatic Valakut**, a brew. Its ramp engine is borrowed from the Lands deck. Scapeshift and Valakut have no Legacy tournament results right now (one Scapeshift list in the last 90 days, none for Valakut). The only decks running the pair are Modern Amulet Titan and RG Valakut.\n\n**How it wins:** Turn 1 Exploration lets you play two lands a turn. Turn 2 Prismatic Omen or Dryad of the Ilysian Grove makes every land you control every basic land type, so they all count as Mountains. Turn 3, cast Scapeshift with 6 lands out: sacrifice all 6 and fetch Valakut plus 5 more. All six enter at once, each sees at least 5 other Mountains, so Valakut triggers six times for 18 damage.\n- **The line I submitted has a gap.** 18 damage only kills an opponent who has already lost 2 life. Lightning Bolt, Valakut triggers from earlier land drops, or a 7th land makes up the difference: with 7 lands and Omen, Scapeshift deals 21.\n- **Without Omen or Dryad:** Scapeshift with 7 lands fetches Valakut plus 6 real Mountains. The deck has 13 lands that are actually Mountains (Taiga, Stomping Ground and basics).\n- **Backup plan:** with Omen and Valakut in play, every land drop after you have 5 other lands deals 3. Exploration doubles that, and Primeval Titan (fetched by Green Sun's Zenith) adds two more Mountains each time it enters or attacks.\n\n**Three directions I considered:**\n1. A straight port of Modern RG Valakut (Sakura-Tribe Elder, Primeval Titan, Bolts).\n2. Lands' Exploration / Mox Diamond / Crop Rotation package.\n3. Temur Scapeshift using the blue Brainstorm / Ponder / Force of Will package.\n\nI went with 1 plus part of 2. Exploration, Arboreal Grazer and Azusa give Legacy-speed extra land drops, and land count is the only resource Scapeshift needs. I dropped Mox Diamond because it costs you a land. Blue would cost Mountain slots and the mana that pays for Scapeshift's GG.\n\n**Things to know:**\n- **Finding Scapeshift is the weak point.** You have about a 53% chance of drawing one by turn 4 (no mulligans), so 4 Once Upon a Time and 2 Sylvan Library are there to smooth draws. The tool says all four line cards are drawn by turn 3 in only 2.7% of games. That ignores tutors and card draw, so a turn-3 kill is the best case and turn 4 is the normal goal.\n- **26 lands is on purpose.** The deck checker flagged it as about 6 fewer than Lands decks run, but Lands needs more because it rebuys lands with Life from the Loam. Here the cheap ramp makes up the difference.\n- **Valakut isn't legendary.** I run 3 copies because each one triggers separately when a Mountain enters.\n- **The sideboard targets the field.** Veil of Summer and Pyroblast fight Force of Will from the blue decks. Force of Vigor handles Chalice of the Void and Static Prison. Endurance and Grafdigger's Cage are for Reanimator, Pyroclasm for Ocelot Aggro, and Damping Sphere for Storm and Doomsday.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Scapeshift"},{"qty":4,"name":"Exploration"},{"qty":4,"name":"Prismatic Omen"},{"qty":3,"name":"Dryad of the Ilysian Grove"},{"qty":4,"name":"Once Upon a Time"},{"qty":4,"name":"Arboreal Grazer"},{"qty":3,"name":"Green Sun's Zenith"},{"qty":1,"name":"Azusa, Lost but Seeking"},{"qty":1,"name":"Primeval Titan"},{"qty":2,"name":"Explore"},{"qty":2,"name":"Sylvan Library"},{"qty":2,"name":"Lightning Bolt"},{"qty":3,"name":"Valakut, the Molten Pinnacle"},{"qty":4,"name":"Taiga"},{"qty":2,"name":"Stomping Ground"},{"qty":4,"name":"Wooded Foothills"},{"qty":2,"name":"Arid Mesa"},{"qty":7,"name":"Mountain"},{"qty":3,"name":"Forest"},{"qty":1,"name":"Boseiju, Who Endures"}],"side":[{"qty":3,"name":"Veil of Summer"},{"qty":3,"name":"Pyroblast"},{"qty":2,"name":"Force of Vigor"},{"qty":2,"name":"Endurance"},{"qty":2,"name":"Pyroclasm"},{"qty":1,"name":"Grafdigger's Cage"},{"qty":2,"name":"Damping Sphere"}],"mainCount":60,"sideCount":15}}},{"id":"adcb229b0880","prompt":"expert2-legacy-bomberman","brew":true,"left":{"text":"**Mono-White Salvagers Combo (brew, uses the Mono-White Stompy shell)**\n\n**How it wins:** Auriok Salvagers plus Lion's Eye Diamond makes as much mana as you want. Sacrifice LED for WWW, pay {1}{W} to return it with Salvagers, recast it for 0 and sacrifice it again. Each loop nets +1 mana, and your hand is already empty so LED's discard costs nothing after the first time. To win, have Salvagers return Walking Ballista from the graveyard (it has mana value 0 there, usually because LED discarded it). Cast it with a huge X and shoot the opponent.\n\nAgatha's Soul Cauldron is the backup line. If LED discards Salvagers, Cauldron exiles it and puts a +1/+1 counter on a creature, which then gets Salvagers' ability. The lifegain creatures (Haliya, The Destined White Mage) also put counters on creatures, so they can carry that ability too.\n\n**Three directions I considered:**\n1. **Mono-White with Karn, Urza's Saga, Ancient Tomb and Chalice of the Void.** This is the only shell where Salvagers and LED show up together in recent results: 4 Mono-White Stompy lists.\n2. **Azorius:** Trinket Mage and Enlightened Tutor to find LED, with Brainstorm and Force of Will for protection.\n3. **Boros:** Imperial Recruiter to find Salvagers, plus Goblin Welder from the Sewer Combo package.\n\nI picked direction 1. Its fast mana (Tomb, City of Traitors, Lotus Petal) casts the 4-mana Salvagers on turn 2–3. It also has the most ways to get LED: Karn's −2 can pull an LED or Ballista from the sideboard, Urza's Saga's third chapter puts a 0- or 1-cost artifact onto the battlefield, and Enlightened Tutor sets one up as your next draw.\n\n**Honest odds:**\n- **LED:** with 13 ways to find it (3 LED, 4 Karn, 4 Saga, 2 Enlightened Tutor), you see at least one by turn 4 about 93% of the time.\n- **Salvagers:** only 4 copies, and I found no white tutor that can fetch it. You draw one by turn 4 just 52.8% of the time, and both pieces together 48.4% (no mulligans).\n- **Turn 3 kill:** the game summary reported 1.1% for drawing every card in the win line by turn 3. That number counts the backup Cauldron and ignores tutors, so it understates the real chance, but don't expect fast kills often.\n\nWhen you don't have the combo, the deck plays as a Stompy deck: Chalice, Karn, the lifegain creatures and Swords to Plowshares keep you in the game.\n\n**Notes:**\n- I left out Deafening Silence and Damping Sphere because each one stops the LED loop.\n- The sideboard includes a fourth LED and a fourth Ballista for Karn to fetch. Voice of Victory stops opponents from casting spells on your turn, so they can't Force of Will the combo. Ethersworn Canonist and the graveyard hate are aimed at Doomsday, Epic Storm and Reanimator. Portable Hole is for Ocelot Aggro.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Auriok Salvagers"},{"qty":3,"name":"Lion's Eye Diamond"},{"qty":3,"name":"Walking Ballista"},{"qty":2,"name":"Agatha's Soul Cauldron"},{"qty":4,"name":"Karn, the Great Creator"},{"qty":3,"name":"Chalice of the Void"},{"qty":4,"name":"Lotus Petal"},{"qty":1,"name":"Mox Opal"},{"qty":4,"name":"Haliya, Guided by Light"},{"qty":3,"name":"The Destined White Mage"},{"qty":1,"name":"Shadowspear"},{"qty":1,"name":"Pithing Needle"},{"qty":1,"name":"Soul-Guide Lantern"},{"qty":4,"name":"Swords to Plowshares"},{"qty":2,"name":"Enlightened Tutor"},{"qty":4,"name":"Urza's Saga"},{"qty":4,"name":"Ancient Tomb"},{"qty":2,"name":"City of Traitors"},{"qty":2,"name":"Cavern of Souls"},{"qty":8,"name":"Plains"}],"side":[{"qty":1,"name":"Lion's Eye Diamond"},{"qty":1,"name":"Walking Ballista"},{"qty":1,"name":"Ensnaring Bridge"},{"qty":1,"name":"Tormod's Crypt"},{"qty":1,"name":"Grafdigger's Cage"},{"qty":3,"name":"Ethersworn Canonist"},{"qty":3,"name":"Voice of Victory"},{"qty":3,"name":"Portable Hole"},{"qty":1,"name":"Pithing Needle"}],"mainCount":60,"sideCount":15}},"right":{"text":"I submitted a **Boros \"Engineer Salvagers\"** brew. It's a new build, not a copy of an existing list.\n\n**The combo:** Auriok Salvagers can return an artifact with mana value 1 or less from your graveyard for {1}{W}. Lion's Eye Diamond costs 0 and sacrifices for three mana of one color. Each time you sacrifice the Diamond, return it with Salvagers and cast it again, you net one extra mana. That gives you as much mana of any color as you want. Salvagers has no tap ability, so it can start the loop the turn it comes down.\n\nThe Diamond makes you discard your hand, but that doesn't hurt here. Anything discarded can be returned with Salvagers too. That includes Pyrite Spellbomb ({1} to cast, then {R} and sacrifice for 2 damage, over and over) and Walking Ballista (cast it with a huge X). The plan is to set this up and win on turns 3–4. Fast 4-mana comes from Ancient Tomb, Lotus Petal and Chrome Mox.\n\n**Three directions I considered:**\n1. **Mono-White Stompy** (Ancient Tomb, Karn and Chalice prison). A small group of real lists already runs Salvagers this way. It's slow, and its only ways to find pieces are Karn and Urza's Saga.\n2. **Boros with the Sewer Combo package (chosen).** It borrows Goblin Engineer, Goblin Welder, Urza's Saga and the Petal/fast-mana base from Sewer Combo, which shows up in about 105 recent lists.\n3. **Azorius tempo** with Brainstorm, Force of Will and Enlightened Tutor.\n\n**Why I chose Boros:** Goblin Engineer's enter ability puts any artifact from your library straight into your graveyard. That's exactly where Salvagers wants the Diamond or the Spellbomb, so the deck gets the most ways to set up the combo.\n\n**How the deck finds the combo:**\n- **Salvagers:** 4 copies, plus 3 Imperial Recruiter (Salvagers has 2 power, so Recruiter can fetch it).\n- **Lion's Eye Diamond:** 4 copies. Engineer and Urza's Saga can also find it, and Karn can pull extras from the sideboard.\n- **Backup:** Agatha's Soul Cauldron lets a creature with a +1/+1 counter (like Walking Ballista) use Salvagers' ability if Salvagers gets removed.\n- **Interaction:** 4 Swords to Plowshares and 4 Lightning Bolt.\n\n**Honest odds:** On the play with no mulligans, you have a 74% chance to see Salvagers or Recruiter by turn 4. You have a 95% chance to see a way to get the Diamond. The chance of having both is about 70%.\n\n**Choices worth knowing about:**\n- **Land count:** The deck runs 21 lands. The checker suggested about 4 fewer, based on Sewer Combo. I kept 21 because six cards cost 4 and Urza's Saga eventually sacrifices itself. The Mono-White Salvagers lists also run about 20.\n- **Sideboard:** It's aimed at blue tempo, graveyard decks and storm. It also holds a spare Pyrite Spellbomb that Karn can fetch.\n- **Weak spot:** Chalice of the Void on 0 or 1 is a real problem, and Eldrazi Aggro runs it.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Auriok Salvagers"},{"qty":4,"name":"Goblin Engineer"},{"qty":3,"name":"Imperial Recruiter"},{"qty":2,"name":"Walking Ballista"},{"qty":2,"name":"Goblin Welder"},{"qty":4,"name":"Lion's Eye Diamond"},{"qty":2,"name":"Pyrite Spellbomb"},{"qty":4,"name":"Lotus Petal"},{"qty":3,"name":"Chrome Mox"},{"qty":1,"name":"Agatha's Soul Cauldron"},{"qty":2,"name":"Karn, the Great Creator"},{"qty":4,"name":"Swords to Plowshares"},{"qty":4,"name":"Lightning Bolt"},{"qty":4,"name":"Urza's Saga"},{"qty":4,"name":"Ancient Tomb"},{"qty":3,"name":"Plateau"},{"qty":1,"name":"Sacred Foundry"},{"qty":1,"name":"Plains"},{"qty":1,"name":"Mountain"},{"qty":3,"name":"Arid Mesa"},{"qty":2,"name":"Bloodstained Mire"},{"qty":2,"name":"Wooded Foothills"}],"side":[{"qty":3,"name":"Pyroblast"},{"qty":1,"name":"Red Elemental Blast"},{"qty":2,"name":"Containment Priest"},{"qty":2,"name":"Ethersworn Canonist"},{"qty":2,"name":"Abrade"},{"qty":1,"name":"Tormod's Crypt"},{"qty":1,"name":"Pithing Needle"},{"qty":1,"name":"Grafdigger's Cage"},{"qty":1,"name":"Ensnaring Bridge"},{"qty":1,"name":"Pyrite Spellbomb"}],"mainCount":60,"sideCount":15}}},{"id":"b1ba2a6c8fb5","prompt":"expert2-premodern-rising-waters","brew":true,"left":{"text":"I submitted **UG \"High Tide\" Waters**, a brew that uses the mana-creature and Opposition package from Cradle Control.\n\n**The plan:** Rising Waters means each player untaps only one land per upkeep. Creatures that make mana are unaffected. We play 11 one-mana creatures that add mana (Birds of Paradise, Llanowar Elves, Fyndhorn Elves) plus Wall of Roots, cast Rising Waters on turn 2–3, and leave the opponent with one usable land per turn while our creatures keep making mana. Force Spike and Mana Leak normally ask for only 1 or 3 extra mana, but against one land they're nearly hard counters. From there Opposition taps the opponent's one untapped land and their blockers. Call of the Herd, Deranged Hermit, Man-o'-War, Tradewind Rider and Masticore win the game.\n\n**Built-in synergies:**\n- **Gaea's Cradle:** if it's the one land we untap each turn, it adds a mana for every creature we have, so we have far more mana than the opponent.\n- **Quirion Ranger:** it returns a tapped Forest to hand, which we can play again untapped.\n- **Tradewind Rider:** it can send the opponent's only untapped land back to their hand.\n\n**Three directions I considered:**\n1. **Mono-blue Stiflenought shell** (free counterspells like Daze and Gush). Its threats cost 1–2 mana, so a 4-mana enchantment that limits mana fights the deck.\n2. **Terrageddon-style UG tempo** (Mox Diamond, Werebear, Nimble Mongoose, with Rising Waters taking Armageddon's place). It works, but it has too few ways to make mana that aren't lands.\n3. **Mana creatures + Opposition from Cradle Control (chosen).** It wins because it's the only direction where Rising Waters hurts the opponent and barely hurts us.\n\n**Things to know:**\n- **No track record:** no published list in the last 400 days runs Rising Waters.\n- **Odds:** you'll see a Rising Waters by turn 3 in about 49% of games. Opposition is a second lock when you don't.\n- **Win-line number:** the tool says all seven example cards show up together by turn 7 in only 0.7% of games. You don't need that exact sequence; the deck needs a mana creature plus one of the locks (Rising Waters or Opposition).\n- **Land count:** I run 19 lands against Cradle Control's average of 20.1. The 11 one-mana creatures make up for it, and with Rising Waters out, extra lands are worth less.\n\nThe sideboard is aimed at Enchantress, Sligh, Goblins and graveyard decks.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Birds of Paradise"},{"qty":4,"name":"Llanowar Elves"},{"qty":3,"name":"Fyndhorn Elves"},{"qty":2,"name":"Quirion Ranger"},{"qty":2,"name":"Wall of Roots"},{"qty":2,"name":"Man-o'-War"},{"qty":2,"name":"Tradewind Rider"},{"qty":2,"name":"Deranged Hermit"},{"qty":1,"name":"Masticore"},{"qty":4,"name":"Rising Waters"},{"qty":3,"name":"Opposition"},{"qty":4,"name":"Call of the Herd"},{"qty":3,"name":"Force Spike"},{"qty":3,"name":"Mana Leak"},{"qty":2,"name":"Sylvan Library"},{"qty":7,"name":"Forest"},{"qty":5,"name":"Island"},{"qty":4,"name":"Yavimaya Coast"},{"qty":3,"name":"Gaea's Cradle"}],"side":[{"qty":3,"name":"Naturalize"},{"qty":2,"name":"Tranquil Domain"},{"qty":3,"name":"Hydroblast"},{"qty":2,"name":"Blue Elemental Blast"},{"qty":2,"name":"Xantid Swarm"},{"qty":2,"name":"Tormod's Crypt"},{"qty":1,"name":"Ravenous Baloth"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built **Merfolk Waters**, a mono-blue tempo-prison deck. Turns 1–2 you play cheap Merfolk, then land Rising Waters around turn 3 or 4. From then on each player untaps only one land per turn (\"lands don't untap… at the beginning of each player's upkeep, that player untaps a land they control\"). Your cheap creatures keep attacking with islandwalk while free spells keep you casting through your own lock: Daze, Gush and Foil can be paid by returning or discarding Islands instead of mana, and an Island returned by Gush comes back untapped when you replay it.\n\n**The three directions I sketched:**\n1. **Stiflenought + Rising Waters:** Rising Waters added to the Stiflenought deck from your list.\n2. **Stasis/Kismet lock:** Rising Waters stacked with Stasis and Kismet in the Stasis shell.\n3. **Merfolk + Orb lock:** the Merfolk deck that already wins with Winter Orb, with Rising Waters as extra Orb copies.\n\nI picked the third because Merfolk's 1–2 mana creatures are already on the board before the lock goes down. Rising Waters is also an enchantment, so the artifact removal that answers Winter Orb doesn't touch it. In Stasis it would mostly repeat what Stasis already does.\n\n**The deck:**\n- **Mana from my own find:** Sea Scryer ({T}: add {C}) is a Merfolk that makes mana and untaps normally under the lock. It also helps you reach 4 mana for Rising Waters.\n- **Lock odds:** with 4 Rising Waters and 2 Winter Orb, you have about a 68% chance to see a lock piece by turn 4 on the play.\n- **Islandwalk against non-Island decks:** Tidal Warrior can turn one of the opponent's lands into an Island, so the Lords' islandwalk still works against Terrageddon, Sligh and Enchantress.\n- **Where it comes from:** the counterspell and Gush package and the mana come from a recent 5-0 Merfolk league list.\n\n**Land count:** the deck checker suggests about 22 lands. I kept 17 on purpose: real Merfolk lists run about 18, the 5-0 list ran 16, and this deck has free spells and Sea Scryers for extra mana. A lock deck also wants to run out of lands later than the opponent does.\n\n**Sideboard:**\n- **Annul:** for Enchantress, Mox Diamond and Replenish.\n- **Blue Elemental Blast, Hydroblast and Chill:** for Sligh and Goblins.\n- **Tormod's Crypt:** for Hermit Druid and Psychatog.\n- **Back to Basics:** for decks that rely on nonbasic lands.\n\nThis is a brew that hasn't been tested: Rising Waters has no recent tournament results.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Rising Waters"},{"qty":2,"name":"Winter Orb"},{"qty":4,"name":"Lord of Atlantis"},{"qty":4,"name":"Tidal Warrior"},{"qty":3,"name":"Rootwater Mystic"},{"qty":3,"name":"Sea Scryer"},{"qty":2,"name":"Waterfront Bouncer"},{"qty":4,"name":"Daze"},{"qty":4,"name":"Gush"},{"qty":4,"name":"Counterspell"},{"qty":4,"name":"Opt"},{"qty":2,"name":"Foil"},{"qty":2,"name":"Stifle"},{"qty":1,"name":"Unsummon"},{"qty":13,"name":"Island"},{"qty":4,"name":"Flooded Strand"}],"side":[{"qty":3,"name":"Annul"},{"qty":3,"name":"Blue Elemental Blast"},{"qty":2,"name":"Hydroblast"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Back to Basics"},{"qty":3,"name":"Chill"}],"mainCount":60,"sideCount":15}}},{"id":"bddb20aa20a4","prompt":"expert2-premodern-rofellos","brew":true,"left":{"text":"I've built a mono-green Rofellos ramp deck, labelled as a brew (no recent Premodern results include Rofellos), and the site accepted it.\n\n**The plan:** Play a mana elf on turn 1 and Rofellos on turn 2. On turn 3, Rofellos taps for one green per Forest, so you typically have about 7 mana. Use it on Plow Under to set the opponent back, or on Deranged Hermit, Masticore or Kamahl. Quirion Ranger returns a tapped Forest to your hand to untap Rofellos, so he taps twice a turn. You win with Hermit's squirrels and Kamahl's +3/+3 trample, or with a large Hurricane to the opponent's face.\n\n**Directions I considered:**\n1. **Mono-green elves with heavy Forests.** This takes the mana creatures from the Elves deck: Llanowar Elves, Fyndhorn Elves, Quirion Ranger, Priest of Titania and Gaea's Cradle. The difference is that the deck uses almost only basic Forests and Rofellos is the engine.\n2. **Land ramp with land denial.** Skyshroud Claim, Krosan Tusker and Plow Under, plus Sylvan Library from the Terrageddon deck in your list, aiming to keep the opponent off mana.\n3. **Survival toolbox.** Survival of the Fittest, as in the Cradle Control and Elves decks, to find Rofellos and one-of creatures.\n\n**What I chose:** Direction 1, with Plow Under, Skyshroud Claim and Sylvan Library from direction 2. Rofellos needs a high Forest count above all else, and the Elves decks never run him because they play fetch lands, dual lands and off-colour basics. With 18 basic Forests he becomes a 5-to-8-mana card on his own. I left Survival out so the deck doesn't turn back into the existing Survival and Elves decks.\n\n**Key numbers:**\n- Rofellos costs {G}{G} and is legal in Premodern.\n- Skyshroud Claim puts two Forests onto the battlefield untapped, so each one adds a green to Rofellos immediately.\n- You see Rofellos or a Worldly Tutor by turn 2 about 59% of the time on the play. That figure counts only two of the three Tutors, so it's slightly higher
