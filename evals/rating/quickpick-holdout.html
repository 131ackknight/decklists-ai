<title>Holdout Quick Pick</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one question per screen. The request, each answer's opening, only the cards that differ, then A / Same / B. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --ink: #1b2236;
  --muted: #5d667d;
  --line: #dde2ec;
  --accent: #2459a6;
  --pick: #b5650d;
  --chip: #e8edf6;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141d; --surface: #181e2b; --ink: #e5e9f2; --muted: #9aa4ba; --line: #2a3346;
    --accent: #6f9fe0; --pick: #e2a04f; --chip: #222b3d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141d; --surface: #181e2b; --ink: #e5e9f2; --muted: #9aa4ba; --line: #2a3346;
  --accent: #6f9fe0; --pick: #e2a04f; --chip: #222b3d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 64px; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.top h1 { font-size: 1.3rem; }
.progress { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.progress b { color: var(--pick); }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 0.9rem; color: var(--muted); }
.controls label { display: inline-flex; gap: 6px; align-items: center; }
.btn { font: 600 0.88rem var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.btn:disabled { opacity: 0.5; cursor: default; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.notice { margin: 0; color: var(--muted); font-size: 0.9rem; }
.request { display: grid; gap: 6px; }
.fmt { font: 600 0.75rem var(--font-body); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.prompt { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.duel { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 14px; }
.side { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.side-head { display: flex; gap: 10px; align-items: center; }
.letter { font: 700 1.2rem var(--font-display); width: 2.1rem; height: 2.1rem; display: grid; place-items: center; border-radius: 8px; background: var(--ink); color: var(--surface); }
.lead { margin: 0; font-size: 0.94rem; overflow-wrap: anywhere; }
.only h3 { font: 600 0.78rem var(--font-body); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
.only pre { margin: 0; font: 0.84rem/1.5 var(--font-mono); padding: 10px 12px; background: var(--bg); border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
.none { color: var(--muted); font-style: italic; }
.full summary { font-size: 0.85rem; }
.full h4 { font: 600 0.72rem var(--font-body); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 8px 0 2px; }
.full ul { list-style: none; margin: 0; padding: 0; font: 0.8rem/1.5 var(--font-mono); columns: 2 170px; column-gap: 14px; }
.full li { break-inside: avoid; overflow-wrap: anywhere; }
.full li.uniq { color: var(--accent); font-weight: 600; }
details summary { cursor: pointer; color: var(--accent); font-size: 0.9rem; }
.shared pre { margin: 6px 0 0; font: 0.8rem/1.45 var(--font-mono); padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; columns: 2 220px; }
.reply { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 20rem; overflow: auto; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.9rem; margin-top: 6px; }
.ask { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.ask h2 { font-size: 1.1rem; }
.picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.picks button { font: 700 1.05rem var(--font-display); padding: 16px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); cursor: pointer; }
.picks button kbd { display: block; font: 0.75rem var(--font-mono); color: var(--muted); margin-top: 2px; }
.picks button[aria-pressed="true"] { background: var(--pick); color: var(--surface); border-color: var(--pick); }
.picks button[aria-pressed="true"] kbd { color: var(--surface); }
.why { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.85rem; color: var(--muted); }
.why button { font: 0.85rem var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 4px 10px; border-radius: 999px; cursor: pointer; }
.why button[aria-pressed="true"] { background: var(--chip); border-color: var(--accent); color: var(--accent); }
button:disabled { cursor: not-allowed; opacity: 0.6; }
.saved { font-size: 0.8rem; color: var(--muted); min-height: 1.2em; }
@media (max-width: 560px) { .picks { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .picks button, .why button { transition: background 120ms ease, color 120ms ease; } }
</style>

<div class="wrap">
  <div class="top">
    <h1>Holdout Quick Pick</h1>
    <span class="progress" id="progress"></span>
  </div>
  <div class="controls">
    <button class="btn" id="prev" type="button">Previous</button>
    <button class="btn" id="next" type="button">Next</button>
    <label><input type="checkbox" id="brewsOnly" checked> Brews only</label>
    <label><input type="checkbox" id="unjudgedOnly" checked> Not yet judged</label>
  </div>
  <p class="notice" id="notice">Loading saved picks…</p>
  <section class="request" id="request"></section>
  <div class="duel" id="duel"></div>
  <details class="shared" id="shared"></details>
  <section class="ask">
    <h2>Which would you rather play for this request?</h2>
    <div class="picks" id="picks">
      <button type="button" data-w="A">A<kbd>1</kbd></button>
      <button type="button" data-w="tie">Same<kbd>2</kbd></button>
      <button type="button" data-w="B">B<kbd>3</kbd></button>
    </div>
    <div class="why" id="why">
      <span>Why, if you like:</span>
      <button type="button" data-r="request">Closer to the request</button>
      <button type="button" data-r="mana">Better mana</button>
      <button type="button" data-r="power">Stronger cards</button>
      <button type="button" data-r="plan">Clearer plan</button>
      <button type="button" data-r="odd">Fewer odd cards</button>
    </div>
    <div class="saved" id="saved" aria-live="polite"></div>
  </section>
</div>

<script type="application/json" id="data">{"prompts":{"holdout-modern-fanatic-eldrazi":{"format":"Modern","prompt":"Brew me a Modern deck built around Fight Rigging, Turntimber Symbiosis and Slumbering Trudge.","lookFor":""},"holdout-modern-persist":{"format":"Modern","prompt":"Brew me a Modern deck built around Eyetwitch, Stitcher's Supplier and Flare of Malice.","lookFor":""},"holdout-premodern-living-death":{"format":"Premodern","prompt":"Brew me a Premodern deck built around Living Death.","lookFor":""},"holdout-pauper-inside-out":{"format":"Pauper","prompt":"Brew me a Pauper deck built around Aurora Eidolon, Sandstorm Eidolon and Spirit Mascot.","lookFor":""},"holdout-standard-mardu-discard":{"format":"Standard","prompt":"Brew me a Standard deck built around Iron-Shield Elf, Bloodthorn Flail and Flamewake Phoenix.","lookFor":""}},"pairs":[{"id":"003edeec7709","prompt":"holdout-modern-fanatic-eldrazi","brew":true,"left":{"text":"I submitted a mono-green brew called **\"Rigged Fights.\"** It uses the Mono-Green Midrange shell from recent results and is built around your three cards.\n\n**The plan**\nSlumbering Trudge is the cheapest way to get a huge creature onto the battlefield. It's a 6/6 for {X}{G}. With X=0 it costs one mana, but it enters tapped with three stun counters. That doesn't matter much here, because Fight Rigging only needs you to *control* a creature with power 7 or more, not attack with it. Fight Rigging puts a +1/+1 counter on the Trudge at your first beginning of combat, making it 7/7, and you get to play the exiled hideaway card for free. Fight spells also work with a tapped creature, so a stunned 6/6 Trudge plus Tail Swipe is one-mana removal.\n\n**Key cards**\n- **Slumbering Trudge (4) and Green Sun's Zenith (4):** Zenith with X=1 fetches the Trudge and puts it onto the battlefield, so you have 8 ways to get a turn-one or turn-two 6/6. With mana dorks you can also cast Trudge with X=3 on turn three as an untapped 6/6 with no stun counters.\n- **Fight Rigging (4):** Your engine. It grows a creature every turn and plays free cards. The best free cast is Turntimber Symbiosis (normally 7 mana), which digs 7 cards deep for a creature.\n- **Turntimber Symbiosis (4):** A land when you need one, a 7-mana spell late, or a free spell off Fight Rigging. If it finds a creature with mana value 3 or less (a Trudge counts as 1 in your library), that creature gets three extra +1/+1 counters.\n- **Ghalta, Primal Hunger (2):** It costs {X} less for each point of power you control. One Trudge cuts it to six mana; Trudge plus another big creature makes it nearly free.\n- **Mosswort Bridge (2):** A second hideaway card. You can play its exiled card once your creatures have 10 total power, which this deck reaches easily.\n- **Interaction and protection:** Tail Swipe, the two Bridgeworks Battle (a fight spell or a land) and Vines of Vastwood. Steel Leaf Champion and Old-Growth Troll give you three-mana attackers in the 7-power range.\n\n**Mana**\n- 19 real lands plus 4 Turntimber, and 8 Hierarchs. All 23 sources make green.\n- The shell's own lists run about 19.7 lands. check_deck passed against that archetype with no warnings.\n- Mosswort Bridge always enters tapped, which is why there are only two.\n\n**Honest odds:** You'll see at least one Fight Rigging by turn four only 52.8% of the time. You'll have both Rigging and a Trudge/Zenith by then 40.5% of the time. When Rigging doesn't show up, the deck still plays as a fair green stompy deck.\n\n**Sideboarding against the top decks**\n- **Affinity (9.9%):** +3 Force of Vigor, +1 Collector Ouphe. Take out Aspect of Hydra and a Vines.\n- **Energy (16.6%), Prowess, Domain Zoo:** +2 Dismember, +2 Snakeskin Veil. Take out Aspect of Hydra. Your 6/6s already outclass their creatures.\n- **Goryo's Vengeance, Living End:** +2 Endurance. Living End also runs Force of Vigor targets in some lists.\n- **Storm, Amulet Titan:** +2 Damping Sphere. Be aware it also turns a Forest enchanted by Old-Growth Troll's aura into a single colorless mana.\n- **Blink, control:** +1 Thrun, +2 Snakeskin Veil. +2 Pawpatch Formation for flyers and enchantments.\n- I left Vexing Bauble out on purpose, even though it's popular. It counters spells cast without paying mana, which includes your own free Fight Rigging and Mosswort Bridge casts.\n\n**Label:** This is a brew. None of the three cards show up in recent results, except Trudge in 4 rogue lists. Only the mana base and the Hierarch/Zenith core come from proven Mono-Green Midrange.\n\n**What I couldn't verify**\n- None of this has been tested in actual games.\n- I'm relying on the rules text for two interactions: Zenith fetching Trudge with X=0, and Rigging counting a tapped Trudge for the power check. Both read cleanly, but confirm with a judge if one is ever disputed.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Noble Hierarch"},{"qty":4,"name":"Ignoble Hierarch"},{"qty":4,"name":"Slumbering Trudge"},{"qty":4,"name":"Steel Leaf Champion"},{"qty":4,"name":"Old-Growth Troll"},{"qty":2,"name":"Ghalta, Primal Hunger"},{"qty":4,"name":"Fight Rigging"},{"qty":4,"name":"Green Sun's Zenith"},{"qty":3,"name":"Tail Swipe"},{"qty":3,"name":"Vines of Vastwood"},{"qty":2,"name":"Aspect of Hydra"},{"qty":4,"name":"Turntimber Symbiosis"},{"qty":2,"name":"Bridgeworks Battle"},{"qty":2,"name":"Mosswort Bridge"},{"qty":1,"name":"Boseiju, Who Endures"},{"qty":1,"name":"Dryad Arbor"},{"qty":12,"name":"Forest"}],"side":[{"qty":3,"name":"Force of Vigor"},{"qty":2,"name":"Endurance"},{"qty":2,"name":"Dismember"},{"qty":1,"name":"Collector Ouphe"},{"qty":2,"name":"Damping Sphere"},{"qty":2,"name":"Pawpatch Formation"},{"qty":1,"name":"Thrun, the Last Troll"},{"qty":2,"name":"Snakeskin Veil"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built a red-green \"Rigged Trudge\" ramp brew. It's legal in Modern and the site accepted it.\n\n**How it works:** On turn 1, cast Slumbering Trudge for X=0. It's a 6/6 that enters tapped with three stun counters, but its power still counts. Fight Rigging puts a +1/+1 counter on it at the start of your combat, which makes it 7 power. That lets you play the card Fight Rigging hid away (it hides one of your top five cards when it enters) for free on turn 2–3. The deck is packed with good cards to hide: Turntimber Symbiosis, Emrakul, the Promised End, both Ghaltas and Trumpeting Carnosaur. I estimate about a 75% chance that Fight Rigging finds one in its top five. If Fight Rigging isn't around:\n* **Turntimber Symbiosis:** you can cast it with fast mana. If it puts Slumbering Trudge into play, Trudge gets three extra counters and becomes a 9/9. Otherwise it's an untapped green land.\n* **Ghalta, Primal Hunger:** costs one less for each point of power you control, so it's cheap once Trudge is out.\n* **Formidable Speaker:** finds Trudge, and its untap ability removes Trudge's stun counters early.\n\n**Three directions I considered:**\n1. **Red-green ramp using Eldrazi Ramp's mana package:** Utopia Sprawl, Malevolent Rumble, Stomping Ground, fetch lands and Formidable Speaker.\n2. **Mono-green with Arbor Elf and Quirion Ranger:** these untap Trudge to remove its stun counters faster.\n3. **Neoform-style:** sacrifice Trudge to Eldritch Evolution.\n\nI chose the first. Its proven fast mana and graveyard filling (which makes Emrakul cheaper) work best with Fight Rigging. I added Arbor Elf from the second option because it untaps a Forest enchanted with Utopia Sprawl for 3 mana on turn 2. I dropped the third because sacrificing Trudge works against Fight Rigging. Four Lightning Bolts and a Galvanic Discharge give you some early interaction.\n\n**Honest odds:** With 4 copies, you have Fight Rigging by turn 3 only 48.8% of the time on the play. You have both Fight Rigging and a 7-power enabler by then 39.3% of the time. The rest of the time it plays like a normal ramp deck.\n\n**Deck check:**\n* It has 21 lands, about one fewer than Eldrazi Ramp's average of 22.3. I trimmed because the 4 Arbor Elves and 4 Utopia Sprawls add more mana.\n* The deck check flagged zero black sources. That's fine, because the deck has no black cards.\n* The sideboard targets the decks winning now:\n  * **Energy, Affinity and Prowess:** Force of Vigor, Pick Your Poison, Haywire Mite, Ancient Grudge, Obstinate Baloth.\n  * **Storm and the fast decks:** Trinisphere.\n  * **Goryo's Vengeance and Persist:** Tormod's Crypt.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Slumbering Trudge"},{"qty":4,"name":"Arbor Elf"},{"qty":4,"name":"Formidable Speaker"},{"qty":2,"name":"Ghalta, Primal Hunger"},{"qty":2,"name":"Ghalta, Stampede Tyrant"},{"qty":2,"name":"Emrakul, the Promised End"},{"qty":2,"name":"Trumpeting Carnosaur"},{"qty":4,"name":"Fight Rigging"},{"qty":4,"name":"Turntimber Symbiosis"},{"qty":4,"name":"Utopia Sprawl"},{"qty":4,"name":"Malevolent Rumble"},{"qty":4,"name":"Lightning Bolt"},{"qty":1,"name":"Galvanic Discharge"},{"qty":9,"name":"Forest"},{"qty":3,"name":"Stomping Ground"},{"qty":3,"name":"Wooded Foothills"},{"qty":2,"name":"Windswept Heath"},{"qty":1,"name":"Boseiju, Who Endures"},{"qty":1,"name":"Mountain"}],"side":[{"qty":3,"name":"Force of Vigor"},{"qty":2,"name":"Pick Your Poison"},{"qty":2,"name":"Trinisphere"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Haywire Mite"},{"qty":2,"name":"Obstinate Baloth"},{"qty":2,"name":"Ancient Grudge"}],"mainCount":60,"sideCount":15}}},{"id":"0a439044f973","prompt":"holdout-modern-persist","brew":true,"left":{"text":"I've built a Rakdos \"Eyetwitch Recursion\" brew for Modern. Its creatures keep coming back from the graveyard, and they double as free sacrifices for Flare of Malice.\n\n**The plan**\nYou play cheap black creatures that want to die. Stitcher's Supplier mills three cards when it enters and again when it dies. Eyetwitch \"learns\" when it dies. You sacrifice them to Flare of Malice (free, and it makes the opponent sacrifice their highest-mana-value creature or planeswalker), Village Rites or Carrion Feeder. Bloodghast, Retriever Phoenix and an escaped Kroxa then come back to finish the game.\n\n**Main deck (60)**\n- **Creatures (24):** 4 Eyetwitch, 4 Stitcher's Supplier, 4 Carrion Feeder, 4 Bloodghast, 2 Orcish Bowmasters, 4 Retriever Phoenix, 2 Kroxa, Titan of Death's Hunger\n- **Spells (18):** 4 Flare of Malice, 4 Village Rites, 3 Fatal Push, 3 Lightning Bolt, 2 Faithless Looting, 2 Igneous Inspiration\n- **Lands (18):** 4 Bloodstained Mire, 1 Polluted Delta, 1 Wooded Foothills, 3 Blood Crypt, 2 Raucous Theater, 2 Spymaster's Vault, 3 Swamp, 2 Mountain\n\n**Why these cards**\n- **Eyetwitch and Retriever Phoenix:** This is the main idea. When Eyetwitch dies, its learn can do one of three things:\n  - Bring back a Retriever Phoenix from your graveyard. Phoenix says that if it's in your graveyard when you would learn, it can return to the battlefield instead. That gives you a 2/2 flying, haste creature for free.\n  - Discard a card to draw a card. Discarding a Phoenix or Kroxa sets up later turns.\n  - Fetch a Lesson from your sideboard. That turns Eyetwitch into a tutor for an answer.\n- **Igneous Inspiration:** It deals 3 damage and also learns, so it's a second way to trigger Phoenix.\n- **Stitcher's Supplier:** Gets Phoenix and Kroxa into the graveyard and fuels Kroxa's escape (exile five other graveyard cards). It's also a Zombie that Flare can sacrifice.\n- **Flare of Malice:** 20 of the main-deck creatures are black and can pay its free cost. With 22 counted (an earlier draft), you draw Flare plus a creature to sacrifice by turn 3 about 48% of the time, and nearly every time you have Flare, you can cast it free.\n- **Other sacrifice outlets and payoffs:** Carrion Feeder and Village Rites let you sacrifice at instant speed or for cards. Spymaster's Vault rewards turns where several creatures died.\n\n**Honest odds**\nSeeing both Eyetwitch and a Phoenix by turn 4 is only about 26.5% without help. Supplier's milling, Faithless Looting and Eyetwitch's own discard push that higher. The Phoenix loop is a bonus engine, not something you rely on every game. The base deck is a sacrifice deck with efficient removal.\n\n**Mana**\n- 18 lands with 15 black and 12 red sources. That matches the proven Reanimator lists (18.2 lands, 14.5 black, 12.7 red).\n- The deck checker suggested about 20 lands, but that's a generic number. The average mana value is 1.86, and Flare is usually free, so I followed the real lists.\n- The fetch lands also trigger Bloodghast's landfall twice.\n\n**Sideboard (15)**\n- **Lessons (Firebending Lesson, Dai Li Indoctrination, Price of Freedom):** These work as normal sideboard cards and are also what Eyetwitch and Phoenix can fetch in game 1. Firebending Lesson is for Energy and Prowess creatures. Dai Li Indoctrination takes a key permanent out of a combo or Tron hand. Price of Freedom destroys an Affinity artifact or a land from Tron or Amulet, and draws a card.\n- **Energy (20.6% of the meta) and Prowess:** Bring in 2 Brotherhood's End (3 damage to everything). Take out Faithless Looting and some Igneous Inspiration.\n- **Affinity (9.4%):** Bring in Brotherhood's End (artifact mode), Rakdos Charm and Price of Freedom.\n- **Eldrazi Tron, Amulet Titan and Eldrazi Ramp:** Bring in 2 Obsidian Charmaw. It costs less for each land they control that makes colorless mana, and it destroys a nonbasic land.\n- **Living End, Goryo's Vengeance, Belcher and Storm:** Bring in 3 Vexing Bauble (counters any spell cast without spending mana), 2 Rakdos Charm (exile a graveyard) and 2 Dauthi Voidwalker (exiles their cards instead of letting them hit the graveyard).\n- **Blink and control decks:** Bring in Extract the Truth and Dai Li Indoctrination.\n\n**Label and limits**\n- This is a **brew**. I took the mana base and some sideboard ideas from Modern's Reanimator archetype, which already plays Supplier and Flare. But there's no Archon of Cruelty or Persist here. The engine is learn, Phoenix and recursion.\n- Eyetwitch, Retriever Phoenix and Igneous Inspiration appear in 0 recent tournament lists. Nothing here has been tested in real matches, and the card choices and sideboard plans are my judgment.\n- I'm assuming Lessons in your sideboard count as \"outside the game\" for learn, which is how constructed tournament rules have handled it. The tools don't confirm that ruling.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Eyetwitch"},{"qty":4,"name":"Stitcher's Supplier"},{"qty":4,"name":"Carrion Feeder"},{"qty":4,"name":"Bloodghast"},{"qty":2,"name":"Orcish Bowmasters"},{"qty":4,"name":"Retriever Phoenix"},{"qty":2,"name":"Kroxa, Titan of Death's Hunger"},{"qty":4,"name":"Flare of Malice"},{"qty":4,"name":"Village Rites"},{"qty":3,"name":"Fatal Push"},{"qty":3,"name":"Lightning Bolt"},{"qty":2,"name":"Faithless Looting"},{"qty":2,"name":"Igneous Inspiration"},{"qty":4,"name":"Bloodstained Mire"},{"qty":1,"name":"Polluted Delta"},{"qty":1,"name":"Wooded Foothills"},{"qty":3,"name":"Blood Crypt"},{"qty":2,"name":"Raucous Theater"},{"qty":2,"name":"Spymaster's Vault"},{"qty":3,"name":"Swamp"},{"qty":2,"name":"Mountain"}],"side":[{"qty":1,"name":"Firebending Lesson"},{"qty":1,"name":"Dai Li Indoctrination"},{"qty":1,"name":"Price of Freedom"},{"qty":2,"name":"Brotherhood's End"},{"qty":2,"name":"Rakdos Charm"},{"qty":3,"name":"Vexing Bauble"},{"qty":2,"name":"Dauthi Voidwalker"},{"qty":2,"name":"Obsidian Charmaw"},{"qty":1,"name":"Extract the Truth"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built **Rakdos Eyetwitch Reanimator**, a brew. Stitcher's Supplier and Flare of Malice aren't new together: they're already in the small Rakdos Reanimator archetype (17 lists in the last 90 days). Eyetwitch shows up in 0 recent lists, and it's what makes this version different.\n\n**How it plays:** Eyetwitch and Stitcher's Supplier are cheap black creatures you can sacrifice to cast Flare of Malice for free. Flare makes the opponent sacrifice their biggest creature or planeswalker, so a 1-mana creature trades for their best threat on turn 1 or 2.\n- **Filling the graveyard:** When Eyetwitch dies, it lets you \"learn\": you can discard a card to draw one. That's a way to discard Archon of Cruelty. Supplier mills 3 cards when it enters and 3 more when it dies.\n- **Getting Archon back:** Persist returns Archon from your graveyard to the battlefield.\n- **Other sacrifice outlets:** Village Rites, Corrupted Conviction and Spymaster's Vault turn creature deaths into extra cards. Bloodghast keeps coming back when you play lands, so you rarely run out of things to sacrifice.\n\n**Directions I considered:**\n1. A mono-black sacrifice combo deck like Soultrader Combo, with Flare and Phyrexian Tower.\n2. A Golgari grind deck with Carrion Feeder and token-making Lessons.\n3. Borrowing the Archon/Persist/Faithless Looting package from the menu. **I picked this one** because only Archon gives a free sacrifice, a learn-discard or a mill a reward big enough to win.\n\n**What's new versus the stock list:**\n- **Eyetwitch replaces Voldaren Epicure and a Detective's Phoenix.** It flies, counts as fodder for Flare, and lets you discard an Archon when it dies.\n- **Some sideboard cards are Lessons.** Learn can fetch a Lesson from your sideboard instead of discarding, so 5 sideboard slots also work in game 1:\n  - Price of Freedom (2): breaks an artifact or land, good against Affinity and Tron.\n  - Firebending Lesson (1) and Iroh's Demonstration (1): kill Energy's small creatures.\n  - Dai Li Indoctrination (1): takes a key card from the opponent's hand.\n- **The rest of the sideboard** (Brotherhood's End, Vexing Bauble, Obsidian Charmaw, Dauthi Voidwalker, Rakdos Charm) comes from proven Reanimator lists and covers Energy, Affinity, Blink and Tron.\n\n**Odds and mana:**\n- You start with at least one of the 8 one-drop sacrifice creatures 70.6% of the time by turn 2. Having both a 1-drop and Flare by turn 2 happens 29.8% of the time.\n- A full turn-3 Persist into Archon (all three pieces in hand) is only 18.8%. Treat it as your best draw, not the plan every game. The deck also wins as a grindy sacrifice deck.\n- It runs 18 lands, with 14 black and 13 red sources. The deck checker suggested about 20. I kept 18 to match real Reanimator lists (18.2 on average) because Flare and Archon are rarely paid for with mana, and Faithless Looting turns extra cards into fuel.\n\nThe deck passed the legality check with no errors and no warnings.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Eyetwitch"},{"qty":4,"name":"Stitcher's Supplier"},{"qty":4,"name":"Bloodghast"},{"qty":3,"name":"Orcish Bowmasters"},{"qty":1,"name":"Detective's Phoenix"},{"qty":4,"name":"Archon of Cruelty"},{"qty":4,"name":"Flare of Malice"},{"qty":4,"name":"Persist"},{"qty":4,"name":"Faithless Looting"},{"qty":3,"name":"Village Rites"},{"qty":2,"name":"Corrupted Conviction"},{"qty":3,"name":"Fatal Push"},{"qty":2,"name":"Lightning Bolt"},{"qty":3,"name":"Blood Crypt"},{"qty":4,"name":"Bloodstained Mire"},{"qty":1,"name":"Polluted Delta"},{"qty":1,"name":"Wooded Foothills"},{"qty":2,"name":"Raucous Theater"},{"qty":2,"name":"Spymaster's Vault"},{"qty":2,"name":"Swamp"},{"qty":2,"name":"Mountain"},{"qty":1,"name":"Den of the Bugbear"}],"side":[{"qty":2,"name":"Price of Freedom"},{"qty":1,"name":"Firebending Lesson"},{"qty":1,"name":"Iroh's Demonstration"},{"qty":1,"name":"Dai Li Indoctrination"},{"qty":3,"name":"Brotherhood's End"},{"qty":2,"name":"Vexing Bauble"},{"qty":2,"name":"Obsidian Charmaw"},{"qty":2,"name":"Dauthi Voidwalker"},{"qty":1,"name":"Rakdos Charm"}],"mainCount":60,"sideCount":15}}},{"id":"1e65cd08bbd6","prompt":"holdout-modern-fanatic-eldrazi","brew":true,"left":{"text":"I submitted a mono-green brew called **\"Rigged Fights.\"** It uses the Mono-Green Midrange shell from recent results and is built around your three cards.\n\n**The plan**\nSlumbering Trudge is the cheapest way to get a huge creature onto the battlefield. It's a 6/6 for {X}{G}. With X=0 it costs one mana, but it enters tapped with three stun counters. That doesn't matter much here, because Fight Rigging only needs you to *control* a creature with power 7 or more, not attack with it. Fight Rigging puts a +1/+1 counter on the Trudge at your first beginning of combat, making it 7/7, and you get to play the exiled hideaway card for free. Fight spells also work with a tapped creature, so a stunned 6/6 Trudge plus Tail Swipe is one-mana removal.\n\n**Key cards**\n- **Slumbering Trudge (4) and Green Sun's Zenith (4):** Zenith with X=1 fetches the Trudge and puts it onto the battlefield, so you have 8 ways to get a turn-one or turn-two 6/6. With mana dorks you can also cast Trudge with X=3 on turn three as an untapped 6/6 with no stun counters.\n- **Fight Rigging (4):** Your engine. It grows a creature every turn and plays free cards. The best free cast is Turntimber Symbiosis (normally 7 mana), which digs 7 cards deep for a creature.\n- **Turntimber Symbiosis (4):** A land when you need one, a 7-mana spell late, or a free spell off Fight Rigging. If it finds a creature with mana value 3 or less (a Trudge counts as 1 in your library), that creature gets three extra +1/+1 counters.\n- **Ghalta, Primal Hunger (2):** It costs {X} less for each point of power you control. One Trudge cuts it to six mana; Trudge plus another big creature makes it nearly free.\n- **Mosswort Bridge (2):** A second hideaway card. You can play its exiled card once your creatures have 10 total power, which this deck reaches easily.\n- **Interaction and protection:** Tail Swipe, the two Bridgeworks Battle (a fight spell or a land) and Vines of Vastwood. Steel Leaf Champion and Old-Growth Troll give you three-mana attackers in the 7-power range.\n\n**Mana**\n- 19 real lands plus 4 Turntimber, and 8 Hierarchs. All 23 sources make green.\n- The shell's own lists run about 19.7 lands. check_deck passed against that archetype with no warnings.\n- Mosswort Bridge always enters tapped, which is why there are only two.\n\n**Honest odds:** You'll see at least one Fight Rigging by turn four only 52.8% of the time. You'll have both Rigging and a Trudge/Zenith by then 40.5% of the time. When Rigging doesn't show up, the deck still plays as a fair green stompy deck.\n\n**Sideboarding against the top decks**\n- **Affinity (9.9%):** +3 Force of Vigor, +1 Collector Ouphe. Take out Aspect of Hydra and a Vines.\n- **Energy (16.6%), Prowess, Domain Zoo:** +2 Dismember, +2 Snakeskin Veil. Take out Aspect of Hydra. Your 6/6s already outclass their creatures.\n- **Goryo's Vengeance, Living End:** +2 Endurance. Living End also runs Force of Vigor targets in some lists.\n- **Storm, Amulet Titan:** +2 Damping Sphere. Be aware it also turns a Forest enchanted by Old-Growth Troll's aura into a single colorless mana.\n- **Blink, control:** +1 Thrun, +2 Snakeskin Veil. +2 Pawpatch Formation for flyers and enchantments.\n- I left Vexing Bauble out on purpose, even though it's popular. It counters spells cast without paying mana, which includes your own free Fight Rigging and Mosswort Bridge casts.\n\n**Label:** This is a brew. None of the three cards show up in recent results, except Trudge in 4 rogue lists. Only the mana base and the Hierarch/Zenith core come from proven Mono-Green Midrange.\n\n**What I couldn't verify**\n- None of this has been tested in actual games.\n- I'm relying on the rules text for two interactions: Zenith fetching Trudge with X=0, and Rigging counting a tapped Trudge for the power check. Both read cleanly, but confirm with a judge if one is ever disputed.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Noble Hierarch"},{"qty":4,"name":"Ignoble Hierarch"},{"qty":4,"name":"Slumbering Trudge"},{"qty":4,"name":"Steel Leaf Champion"},{"qty":4,"name":"Old-Growth Troll"},{"qty":2,"name":"Ghalta, Primal Hunger"},{"qty":4,"name":"Fight Rigging"},{"qty":4,"name":"Green Sun's Zenith"},{"qty":3,"name":"Tail Swipe"},{"qty":3,"name":"Vines of Vastwood"},{"qty":2,"name":"Aspect of Hydra"},{"qty":4,"name":"Turntimber Symbiosis"},{"qty":2,"name":"Bridgeworks Battle"},{"qty":2,"name":"Mosswort Bridge"},{"qty":1,"name":"Boseiju, Who Endures"},{"qty":1,"name":"Dryad Arbor"},{"qty":12,"name":"Forest"}],"side":[{"qty":3,"name":"Force of Vigor"},{"qty":2,"name":"Endurance"},{"qty":2,"name":"Dismember"},{"qty":1,"name":"Collector Ouphe"},{"qty":2,"name":"Damping Sphere"},{"qty":2,"name":"Pawpatch Formation"},{"qty":1,"name":"Thrun, the Last Troll"},{"qty":2,"name":"Snakeskin Veil"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built a mono-green deck around your three cards and borrowed the ramp and colorless lands from Eldrazi Ramp. It's a brew: Fight Rigging and Turntimber Symbiosis have no recent tournament results, and Slumbering Trudge has only 4 lists in the last 90 days, all marked \"Rogue.\"\n\n**How the three cards work together**\n- **Slumbering Trudge** costs one green mana for a 6/6. Cast that way, it enters tapped with three stun counters. That doesn't matter here, because Fight Rigging only needs a creature with 7 power, not one that can attack.\n- **Fight Rigging:** at the start of combat it puts a +1/+1 counter on a creature, so the Trudge becomes 7/6 right away. You then get to play the hidden card for free.\n- **The free card can be huge.** The hidden card comes from your top five, and the deck is full of 7- and 13-mana Eldrazi. Playing one for free still counts as casting it, so their cast abilities trigger. A free Emrakul, the Promised End means you control your opponent's next turn. A free Devourer of Destiny exiles any coloured permanent.\n- **Turntimber Symbiosis** works as a land early and a 7-mana spell late. It looks at your top 7 cards and puts a creature onto the battlefield. If it finds a Trudge, the Trudge gets three extra +1/+1 counters and comes in as a 9/9. If it finds an Eldrazi, you get the Eldrazi for free.\n\n**Three directions I considered**\n1. **Mono-green stompy:** Mossborn Hydra, fetch lands and mana creatures.\n2. **Neoform-style:** Summoner's Pact to find the Trudge.\n3. **Eldrazi Ramp package (chosen):** Utopia Sprawl, Talisman of Impulse, Malevolent Rumble, Eldrazi Temple, Ugin's Labyrinth and the big Eldrazi.\n\nI picked the Eldrazi Ramp package because it fixes both weak spots of the other two. It reliably reaches 7 mana for Symbiosis, and it makes every Fight Rigging free card a game-winning threat instead of a random spell. Malevolent Rumble also digs for both Fight Rigging and the Trudge, since it finds permanents.\n\n**Changes from the borrowed deck**\n- I dropped red completely, because none of the spells need it. The deck check flagged 2 red sources against about 4.9 in Eldrazi Ramp lists. That only matters if you add red cards.\n- There are 20 real lands plus 3 Symbiosis that can be played as lands, a bit under the shell's average of about 22. Sprawl and Talisman make up the difference.\n- 2 Mossborn Hydra give you a second creature that can reach 7 power. Kozilek's Command is the main removal and card draw.\n\n**Honest odds:** if you draw first, you'll have Fight Rigging and a 7-power creature (Trudge or Mossborn Hydra) together by turn 3 about 35% of the time. Without that pairing, Fight Rigging still adds a counter every turn, and the deck plays like a normal ramp deck.\n\nThe 15-card sideboard uses cards that Eldrazi Ramp lists actually run. It's aimed at Affinity, graveyard decks (Goryo's, Living End, Persist), free spells, and Energy's Goblin Bombardment.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Slumbering Trudge"},{"qty":2,"name":"Mossborn Hydra"},{"qty":4,"name":"Sowing Mycospawn"},{"qty":3,"name":"Emrakul, the Promised End"},{"qty":2,"name":"Devourer of Destiny"},{"qty":1,"name":"Sire of Seven Deaths"},{"qty":1,"name":"World Breaker"},{"qty":4,"name":"Fight Rigging"},{"qty":4,"name":"Utopia Sprawl"},{"qty":4,"name":"Malevolent Rumble"},{"qty":4,"name":"Talisman of Impulse"},{"qty":4,"name":"Kozilek's Command"},{"qty":3,"name":"Turntimber Symbiosis"},{"qty":4,"name":"Eldrazi Temple"},{"qty":3,"name":"Ugin's Labyrinth"},{"qty":1,"name":"Bojuka Bog"},{"qty":2,"name":"Wooded Foothills"},{"qty":10,"name":"Forest"}],"side":[{"qty":2,"name":"Trinisphere"},{"qty":2,"name":"Vexing Bauble"},{"qty":2,"name":"Force of Vigor"},{"qty":1,"name":"Haywire Mite"},{"qty":2,"name":"Grafdigger's Cage"},{"qty":2,"name":"Disruptor Flute"},{"qty":1,"name":"Ensnaring Bridge"},{"qty":1,"name":"Tormod's Crypt"},{"qty":2,"name":"Nature's Claim"}],"mainCount":60,"sideCount":15}}},{"id":"3b4b73217514","prompt":"holdout-modern-persist","brew":true,"left":{"text":"I submitted a mono-black reanimator brew called \"Twitch & Stitch.\" Cheap black creatures go to the graveyard and get value on the way. Flare of Malice is free removal, and Persist or Emperor of Bones brings back Archon of Cruelty.\n\n**How it works:** Stitcher's Supplier mills three cards when it enters and again when it dies. When Eyetwitch dies, it lets you discard a card to draw one, so you can throw away an Archon. Buried Alive (legal in Modern) and Unmarked Grave can put Archon straight into the graveyard on turn 2–3. Persist (2 mana) or Emperor of Bones then puts it into play.\n\nFlare of Malice ties it together. Instead of paying its cost, you can sacrifice a nontoken black creature. If that's Eyetwitch or Supplier, its death trigger fires too, so you remove their best creature for free and dig toward Archon. Village Rites (sacrifice a creature, draw two) does the same job. Orcish Bowmasters, Thoughtseize and Fatal Push help against Energy, the most common deck.\n\n**The three directions I considered:**\n1. **Mono-black Buried Alive Persist (chosen).** It takes the Persist + Archon package from the Grixis Persist deck in your list.\n2. **Golgari sacrifice combo**, built like Soultrader Combo with Gravecrawler, Warren Soultrader and Carrion Feeder.\n3. **Orzhov tokens** with Hunt for Specimens, Blood Artist and Lessons.\n\nI picked the first because both of your cards and Flare do the most there: every sacrifice fills the graveyard toward an 8-mana Archon you never pay for.\n\n**Numbers:**\n- **Odds:** On the play, you'll have a way to fill the graveyard by turn 3 90.8% of the time, and a reanimation spell 70% of the time. You'll have both together 62.7% of the time. It's a fast, disruptive deck, not a guaranteed turn-2 combo.\n- **Not a copy:** The checker found 53% overlap with the closest existing list, a Rakdos Reanimator deck (its limit is 65%). The difference is that this build drops red (no Faithless Looting or Lightning Bolt) and uses Buried Alive and Unmarked Grave instead.\n- **18 lands:** That's below the checker's suggested 20.6, but it counts Archon at 8 mana and you never cast it. Real Reanimator lists run about 18.\n- **Off-color lands:** Undercity Sewers and Raucous Theater are only there to surveil Archons into the graveyard. Every land makes black mana.\n\n**Sideboard:** It targets Energy (Toxic Deluge, the extra Bowmasters), graveyard decks (Nihil Spellbomb, Dauthi Voidwalker) and combo/Tron (Duress, Extract the Truth, Damping Sphere, Vexing Bauble). It also holds two Lessons, Dai Li Indoctrination and Ruinous Waterbending. When Eyetwitch dies, you can take one of them from the sideboard instead of drawing.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Eyetwitch"},{"qty":4,"name":"Stitcher's Supplier"},{"qty":3,"name":"Orcish Bowmasters"},{"qty":3,"name":"Emperor of Bones"},{"qty":2,"name":"Bloodghast"},{"qty":4,"name":"Archon of Cruelty"},{"qty":4,"name":"Flare of Malice"},{"qty":4,"name":"Persist"},{"qty":3,"name":"Buried Alive"},{"qty":2,"name":"Unmarked Grave"},{"qty":3,"name":"Village Rites"},{"qty":3,"name":"Thoughtseize"},{"qty":2,"name":"Fatal Push"},{"qty":1,"name":"Unearth"},{"qty":9,"name":"Swamp"},{"qty":2,"name":"Polluted Delta"},{"qty":1,
