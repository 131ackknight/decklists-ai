 a free sacrifice, a learn-discard or a mill a reward big enough to win.\n\n**What's new versus the stock list:**\n- **Eyetwitch replaces Voldaren Epicure and a Detective's Phoenix.** It flies, counts as fodder for Flare, and lets you discard an Archon when it dies.\n- **Some sideboard cards are Lessons.** Learn can fetch a Lesson from your sideboard instead of discarding, so 5 sideboard slots also work in game 1:\n  - Price of Freedom (2): breaks an artifact or land, good against Affinity and Tron.\n  - Firebending Lesson (1) and Iroh's Demonstration (1): kill Energy's small creatures.\n  - Dai Li Indoctrination (1): takes a key card from the opponent's hand.\n- **The rest of the sideboard** (Brotherhood's End, Vexing Bauble, Obsidian Charmaw, Dauthi Voidwalker, Rakdos Charm) comes from proven Reanimator lists and covers Energy, Affinity, Blink and Tron.\n\n**Odds and mana:**\n- You start with at least one of the 8 one-drop sacrifice creatures 70.6% of the time by turn 2. Having both a 1-drop and Flare by turn 2 happens 29.8% of the time.\n- A full turn-3 Persist into Archon (all three pieces in hand) is only 18.8%. Treat it as your best draw, not the plan every game. The deck also wins as a grindy sacrifice deck.\n- It runs 18 lands, with 14 black and 13 red sources. The deck checker suggested about 20. I kept 18 to match real Reanimator lists (18.2 on average) because Flare and Archon are rarely paid for with mana, and Faithless Looting turns extra cards into fuel.\n\nThe deck passed the legality check with no errors and no warnings.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Eyetwitch"},{"qty":4,"name":"Stitcher's Supplier"},{"qty":4,"name":"Bloodghast"},{"qty":3,"name":"Orcish Bowmasters"},{"qty":1,"name":"Detective's Phoenix"},{"qty":4,"name":"Archon of Cruelty"},{"qty":4,"name":"Flare of Malice"},{"qty":4,"name":"Persist"},{"qty":4,"name":"Faithless Looting"},{"qty":3,"name":"Village Rites"},{"qty":2,"name":"Corrupted Conviction"},{"qty":3,"name":"Fatal Push"},{"qty":2,"name":"Lightning Bolt"},{"qty":3,"name":"Blood Crypt"},{"qty":4,"name":"Bloodstained Mire"},{"qty":1,"name":"Polluted Delta"},{"qty":1,"name":"Wooded Foothills"},{"qty":2,"name":"Raucous Theater"},{"qty":2,"name":"Spymaster's Vault"},{"qty":2,"name":"Swamp"},{"qty":2,"name":"Mountain"},{"qty":1,"name":"Den of the Bugbear"}],"side":[{"qty":2,"name":"Price of Freedom"},{"qty":1,"name":"Firebending Lesson"},{"qty":1,"name":"Iroh's Demonstration"},{"qty":1,"name":"Dai Li Indoctrination"},{"qty":3,"name":"Brotherhood's End"},{"qty":2,"name":"Vexing Bauble"},{"qty":2,"name":"Obsidian Charmaw"},{"qty":2,"name":"Dauthi Voidwalker"},{"qty":1,"name":"Rakdos Charm"}],"mainCount":60,"sideCount":15}}},{"id":"4fccf6dfb50b","prompt":"holdout-premodern-living-death","brew":true,"left":{"text":"I built **BG Survival-Death**, a brew that uses the Survival of the Fittest shell from BG Survival with 4 Living Death as the payoff.\n\n**How it plays:** Survival (discard a creature card to search up another one), Buried Alive and the cycling big creatures fill your graveyard with large creatures. The cyclers are Krosan Tusker (cycling also finds a basic land) and Twisted Abomination (cycles into a Swamp). Living Death then swaps boards: your cheap creatures die and your graveyard comes back. Many of those creatures do something when they return or when they die. Bone Shredder destroys an opposing creature when it enters. Deranged Hermit brings four squirrels, Uktabi Orangutan destroys an artifact, and Symbiotic Wurm leaves seven insects when it's sacrificed. Withered Wretch can exile the opponent's creature cards from their graveyard first, so only your side comes back big. Duress and Cabal Therapy clear counterspells out of the way before you cast it.\n\n**Three directions I considered:**\n1. **BG Survival.** Takes the Survival package that Elves and BG Survival run. This is the one I chose.\n2. **Mono-black Dark Ritual.** Duress, Therapy and Ritual from Moneyball Black, plus Buried Alive, to cast Living Death fast.\n3. **Hermit Druid self-mill.** Uses Hermit Druid to dump the library into the graveyard, with Living Death as the way to bring it back.\n\nI picked BG Survival because Survival lets you discard creatures at will, which fills the graveyard. It also searches up a creature for whatever the situation needs, so the deck still plays well in games where you don't draw Living Death. And Living Death works as a one-sided board wipe against Sligh, Goblins and GW Madness.\n\n**Things to know:**\n- **Living Death odds:** there are only 4 copies, and Survival can't search for a sorcery. You'll have one by turn 5 about 57% of the time, but you'll have something that fills the graveyard 91% of the time.\n- **Squee has no red mana on purpose:** you never cast it. You discard it to Survival over and over, and Living Death brings it back as a free body.\n- **20 lands:** that's one fewer than BG Survival usually runs (about 21). 4 Birds, 3 Wall of Roots and the four cyclers make up for it.\n- **Reanimator and Hermit Druid decks get your Living Death too:** that's why Withered Wretch is in the main deck and Tormod's Crypt is in the sideboard.\n\nThe 15-card sideboard is aimed at the decks the meta search showed: Pernicious Deed, Smother, Engineered Plague, Naturalize, Tormod's Crypt, Diabolic Edict, Spike Feeder and a second Ravenous Baloth.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Living Death"},{"qty":4,"name":"Survival of the Fittest"},{"qty":3,"name":"Buried Alive"},{"qty":4,"name":"Duress"},{"qty":3,"name":"Cabal Therapy"},{"qty":4,"name":"Birds of Paradise"},{"qty":3,"name":"Wall of Roots"},{"qty":2,"name":"Wall of Blossoms"},{"qty":1,"name":"Squee, Goblin Nabob"},{"qty":2,"name":"Krosan Tusker"},{"qty":2,"name":"Twisted Abomination"},{"qty":1,"name":"Symbiotic Wurm"},{"qty":1,"name":"Verdant Force"},{"qty":1,"name":"Ravenous Baloth"},{"qty":1,"name":"Bone Shredder"},{"qty":1,"name":"Genesis"},{"qty":1,"name":"Deranged Hermit"},{"qty":1,"name":"Uktabi Orangutan"},{"qty":1,"name":"Withered Wretch"},{"qty":4,"name":"Llanowar Wastes"},{"qty":8,"name":"Forest"},{"qty":8,"name":"Swamp"}],"side":[{"qty":3,"name":"Pernicious Deed"},{"qty":3,"name":"Smother"},{"qty":2,"name":"Engineered Plague"},{"qty":2,"name":"Naturalize"},{"qty":2,"name":"Tormod's Crypt"},{"qty":1,"name":"Diabolic Edict"},{"qty":1,"name":"Spike Feeder"},{"qty":1,"name":"Ravenous Baloth"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built **BG Living Death**, a brew that uses BG Survival's mana base.\n\n**The plan**\nSpend turns 1–4 filling your graveyard with big creatures while staying alive behind Wild Mongrel, Wall of Blossoms and discard. Then cast Living Death. It's a board wipe that only costs you a Bird or a Mongrel, and it puts Krosan Tusker (6/5), Twisted Abomination (5/3, regenerates), Visara (5/5 flier that kills creatures), Avatar of Woe and Symbiotic Wurm onto the battlefield. If Living Death is answered or the Wurm dies again, Genesis, Volrath's Stronghold and seven Insect tokens give you more to work with.\n\n**Key cards**\n- **Living Death ×4:** The card you asked to build around. Living Death has shown up in 7 recent lists, mostly BG Survival, so it's proven as a one-of. A whole deck built around it hasn't been tried.\n- **Ways to fill the graveyard:**\n  - **Survival of the Fittest:** Each activation discards a creature and finds another, so it fills the graveyard and finds targets at the same time.\n  - **Buried Alive:** Puts three creatures in the graveyard at once.\n  - **Wild Mongrel:** Lets you discard cards for free.\n  - **Krosan Tusker and Twisted Abomination:** You can cycle them early for a land, and they're also the big creatures you bring back.\n- **Insidious Dreams ×3:** You cast it at instant speed by discarding cards. Discard two big creatures at the end of your opponent's turn, put Living Death on top of your library, and draw it next turn. With 4 Living Death and 3 Dreams, you have a **77.8%** chance of seeing one by turn 5 on the play (no mulligans). You have a 98.3% chance of having a graveyard enabler by then, and 76.3% for both together.\n- **Single creatures you can fetch with Survival:**\n  - **Bone Shredder:** Kills a creature right away, and kills another when Living Death brings it back.\n  - **Avatar of Woe:** Costs just {B}{B} once there are 10 creature cards across all graveyards.\n- **Duress and Cabal Therapy:** These protect your turn against combo and counterspell decks. Cabal Therapy's flashback lets you sacrifice a Bird you were going to lose to Living Death anyway.\n\n**Mana**\nThe deck runs 20 lands: 8 Forest, 7 Swamp, 4 Llanowar Wastes and 1 Volrath's Stronghold. That gives you 13 black and 14 green sources, plus 4 Birds of Paradise. check_deck suggested about 24 lands, but that count treats 7 cards as 7-drops when they're really land-finders: Tusker cycles for any basic and Abomination cycles for a Swamp. BG Survival lists average 21.25 lands, so this is close to their numbers.\n\n**Sideboarding against the current field**\n- **Stiflenought (14.9% of the field):** Bring in 3 Smother and Diabolic Edict, which kill Phyrexian Dreadnought. Take out Wall of Blossoms and a Duress. Be careful: Stifle can counter your cycling and Survival triggers.\n- **Sligh and Goblins:** Bring in Smother, Engineered Plague (name Goblin), Pernicious Deed, Ravenous Baloth and Spike Feeder. Take out Duress, Cabal Therapy and Buried Alive.\n- **Enchantress, Replenish and Oath:** Bring in Naturalize, Pernicious Deed and Uktabi Orangutan. Keep all the discard.\n- **Reanimator, Hermit Druid and other Survival decks:** Bring in 2 Withered Wretch. Your Living Death brings back **their** creatures too, so exile their best graveyard targets before you cast it.\n- **Elves:** Bring in Engineered Plague (name Elf) and Pernicious Deed.\n\n**Label:** This is a brew. I borrowed BG Survival's mana and creature package but rebuilt the deck around Living Death.\n\n**Caveats**\n- Living Death is symmetrical, so always check what's in your opponent's graveyard before you cast it.\n- I haven't playtested this. The sideboard plans are based on what the meta data shows, not on actual match results.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Birds of Paradise"},{"qty":4,"name":"Wild Mongrel"},{"qty":2,"name":"Wall of Blossoms"},{"qty":4,"name":"Krosan Tusker"},{"qty":3,"name":"Twisted Abomination"},{"qty":1,"name":"Bone Shredder"},{"qty":1,"name":"Visara the Dreadful"},{"qty":1,"name":"Avatar of Woe"},{"qty":1,"name":"Symbiotic Wurm"},{"qty":1,"name":"Genesis"},{"qty":4,"name":"Living Death"},{"qty":4,"name":"Survival of the Fittest"},{"qty":2,"name":"Buried Alive"},{"qty":3,"name":"Insidious Dreams"},{"qty":2,"name":"Duress"},{"qty":3,"name":"Cabal Therapy"},{"qty":8,"name":"Forest"},{"qty":7,"name":"Swamp"},{"qty":4,"name":"Llanowar Wastes"},{"qty":1,"name":"Volrath's Stronghold"}],"side":[{"qty":2,"name":"Withered Wretch"},{"qty":2,"name":"Engineered Plague"},{"qty":2,"name":"Naturalize"},{"qty":3,"name":"Smother"},{"qty":2,"name":"Pernicious Deed"},{"qty":1,"name":"Spike Feeder"},{"qty":1,"name":"Uktabi Orangutan"},{"qty":1,"name":"Diabolic Edict"},{"qty":1,"name":"Ravenous Baloth"}],"mainCount":60,"sideCount":15}}},{"id":"56318b52d1d0","prompt":"holdout-pauper-inside-out","brew":true,"left":{"text":"This is a Boros brew. Both Eidolons say \"whenever you cast a multicolored spell, you may return this card from your graveyard to your hand.\" Spirit Mascot gets a +1/+1 counter \"whenever one or more cards leave your graveyard.\" So the deck is built so that every return, flashback or disturb also grows the Mascot.\n\n**How it plays:** Thrilling Discovery (discard two, draw three), Pursue the Past and Faithless Looting let you throw the Eidolons away as fodder. Then you cast one of 22 multicolored cards, and they come back to your hand. Spirit Mascot, Feisty Spikeling and Skyknight Legionnaire are multicolored creatures, and Manamorphose replaces itself and refunds its own mana, so it's close to a free trigger. Each Eidolon that comes back is a separate card leaving the graveyard, so each one grows the Mascot. The flashback on Pursue the Past, Looting and Prismatic Strands grows it too, and so does casting Lunarch Veteran from the graveyard with disturb. The Eidolons' sacrifice abilities are useful even if you're just looping them. Sandstorm Eidolon stops a blocker. Aurora Eidolon prevents the next 3 damage to any target, which can save Mascot from a Lightning Bolt.\n\n**Three directions I considered:**\n1. A Boros graveyard deck using the flashback and discard cards from Boros Aggro (the Thrilling Discovery deck) and Mono-White Aggro, plus Faithless Looting from the Madness deck.\n2. A Kor Skyfisher artifact shell borrowed from the Synthesizer deck.\n3. A red-heavy deck using red/green hybrid cards like Burning-Tree Emissary from Mono-Red Rally.\n\nI picked the first because its cards already leave the graveyard constantly, which is exactly what Spirit Mascot rewards. I took Manamorphose from the third idea, since red mana can pay its hybrid cost.\n\n**Things to know:**\n- The odds of drawing a Spirit Mascot by turn 4 on the play are about 53%. You'll almost always have a multicolored spell to bring back the Eidolons (98%).\n- The deck has 12 white and 12 red sources. Boros Aggro runs about 16 white, but it's built around white-heavy cards like Battle Screech. Here most two-drops are red/white hybrids, so an even split is better.\n- The Eidolons are 4-mana 2/2s and weak on their own. Their value comes from coming back over and over, so I play 3 of each rather than 4.\n- The sideboard is aimed at the decks winning right now. Red Elemental Blast and Pyroblast are for the blue Terror deck, Faeries and Gates. Dust to Dust is for Affinity. Electrickery is for Elves and Mono-White Aggro. The extra Prismatic Strands are for Madness, the most common deck.\n\n**Main deck (60):**\n- 4 Lunarch Veteran\n- 4 Spirit Mascot\n- 4 Feisty Spikeling\n- 3 Skyknight Legionnaire\n- 3 Aurora Eidolon\n- 3 Sandstorm Eidolon\n- 4 Thrilling Discovery\n- 4 Manamorphose\n- 4 Lightning Bolt\n- 3 Pursue the Past\n- 2 Faithless Looting\n- 2 Journey to Nowhere\n- 2 Prismatic Strands\n- 4 Wind-Scarred Crag\n- 2 Boros Garrison\n- 6 Plains\n- 6 Mountain\n\n**Sideboard (15):**\n- 3 Red Elemental Blast\n- 2 Pyroblast\n- 2 Prismatic Strands\n- 2 Dust to Dust\n- 2 Electrickery\n- 2 Journey to Nowhere\n- 2 Thraben Charm","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Lunarch Veteran"},{"qty":4,"name":"Spirit Mascot"},{"qty":4,"name":"Feisty Spikeling"},{"qty":3,"name":"Skyknight Legionnaire"},{"qty":3,"name":"Aurora Eidolon"},{"qty":3,"name":"Sandstorm Eidolon"},{"qty":4,"name":"Thrilling Discovery"},{"qty":4,"name":"Manamorphose"},{"qty":4,"name":"Lightning Bolt"},{"qty":3,"name":"Pursue the Past"},{"qty":2,"name":"Faithless Looting"},{"qty":2,"name":"Journey to Nowhere"},{"qty":2,"name":"Prismatic Strands"},{"qty":4,"name":"Wind-Scarred Crag"},{"qty":2,"name":"Boros Garrison"},{"qty":6,"name":"Plains"},{"qty":6,"name":"Mountain"}],"side":[{"qty":2,"name":"Prismatic Strands"},{"qty":3,"name":"Red Elemental Blast"},{"qty":2,"name":"Pyroblast"},{"qty":2,"name":"Dust to Dust"},{"qty":2,"name":"Electrickery"},{"qty":2,"name":"Journey to Nowhere"},{"qty":2,"name":"Thraben Charm"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built a Boros (red-white) deck where the two Eidolons keep coming back, plus a sideboard aimed at the current field. It's a brew: none of these three cards showed up in any recent tournament list.\n\n**How it works:** Both Eidolons return from your graveyard to your hand whenever you cast a multicolored spell. 24 of the deck's 41 spells are multicolored, and you'll draw at least one by turn 4 about 99.7% of the time. That means you can sacrifice the Eidolons every turn without losing them:\n- **Sandstorm Eidolon:** pay {R} and sacrifice it to stop a creature from blocking.\n- **Aurora Eidolon:** pay {W} and sacrifice it to prevent 3 damage, for example to save Spirit Mascot from Lightning Bolt.\n\nEach time an Eidolon comes back, a card leaves your graveyard, so Spirit Mascot gets a +1/+1 counter. Pursue the Past fits especially well. It's a two-color spell that lets you discard an Eidolon to draw two. Casting it again with flashback brings an Eidolon back and also takes Pursue out of the graveyard, which can trigger Mascot twice.\n\n**Other cheap multicolored spells:**\n- Manamorphose: costs 2 but gives back 2 mana, so it brings an Eidolon back for free and draws a card.\n- Battlegate Mimic: becomes a 4/2 first striker whenever you cast a spell that's both red and white.\n- Wojek Halberdiers.\n- Skyknight Legionnaire.\n\n**Directions I considered:**\n1. A red-heavy version using the Madness deck's Faithless Looting and Lava Dart, whose flashback also grows Mascot.\n2. A version using the Mono-Red Rally deck's Burning-Tree Emissary, which counts as multicolored.\n3. A Boros multicolored creature deck, borrowing the Synthesizer deck's two-color lands and removal.\n\nI chose the third because it's the only one where both Eidolons get back to your hand nearly every turn. The other two only feed Mascot.\n\n**Borrowed from Synthesizer:** Kor Skyfisher, Lightning Bolt, Journey to Nowhere, the Wind-Scarred Crag / Boros Garrison land base, and most of the sideboard. The checker found the deck is 41.7% the same as one Synthesizer list (the limit for a brew is 65%).\n\n**Mana:** I run 19 lands, with 13 red and 13 white sources. That's below Synthesizer's average of 20.5 but above the checker's suggested 17.7. The extra lands are there to pay for the 4-mana Eidolons, Pursue's 4-mana flashback and the sacrifice costs.\n\n**Honest odds:** You'll have an Eidolon by turn 4 only about 68% of the time, and Spirit Mascot about 53%. The deck still works as a cheap, efficient aggro deck when those cards don't show up.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Spirit Mascot"},{"qty":3,"name":"Aurora Eidolon"},{"qty":3,"name":"Sandstorm Eidolon"},{"qty":4,"name":"Battlegate Mimic"},{"qty":4,"name":"Wojek Halberdiers"},{"qty":4,"name":"Skyknight Legionnaire"},{"qty":3,"name":"Kor Skyfisher"},{"qty":4,"name":"Pursue the Past"},{"qty":4,"name":"Manamorphose"},{"qty":4,"name":"Lightning Bolt"},{"qty":4,"name":"Journey to Nowhere"},{"qty":4,"name":"Wind-Scarred Crag"},{"qty":2,"name":"Boros Garrison"},{"qty":1,"name":"Sacred Peaks"},{"qty":6,"name":"Mountain"},{"qty":6,"name":"Plains"}],"side":[{"qty":3,"name":"Red Elemental Blast"},{"qty":1,"name":"Pyroblast"},{"qty":2,"name":"Dust to Dust"},{"qty":2,"name":"Destroy Evil"},{"qty":3,"name":"Electrickery"},{"qty":2,"name":"Relic of Progenitus"},{"qty":2,"name":"Prismatic Strands"}],"mainCount":60,"sideCount":15}}},{"id":"6e6be2377468","prompt":"holdout-modern-fanatic-eldrazi","brew":true,"left":{"text":"I built a mono-green deck around your three cards and borrowed the ramp and colorless lands from Eldrazi Ramp. It's a brew: Fight Rigging and Turntimber Symbiosis have no recent tournament results, and Slumbering Trudge has only 4 lists in the last 90 days, all marked \"Rogue.\"\n\n**How the three cards work together**\n- **Slumbering Trudge** costs one green mana for a 6/6. Cast that way, it enters tapped with three stun counters. That doesn't matter here, because Fight Rigging only needs a creature with 7 power, not one that can attack.\n- **Fight Rigging:** at the start of combat it puts a +1/+1 counter on a creature, so the Trudge becomes 7/6 right away. You then get to play the hidden card for free.\n- **The free card can be huge.** The hidden card comes from your top five, and the deck is full of 7- and 13-mana Eldrazi. Playing one for free still counts as casting it, so their cast abilities trigger. A free Emrakul, the Promised End means you control your opponent's next turn. A free Devourer of Destiny exiles any coloured permanent.\n- **Turntimber Symbiosis** works as a land early and a 7-mana spell late. It looks at your top 7 cards and puts a creature onto the battlefield. If it finds a Trudge, the Trudge gets three extra +1/+1 counters and comes in as a 9/9. If it finds an Eldrazi, you get the Eldrazi for free.\n\n**Three directions I considered**\n1. **Mono-green stompy:** Mossborn Hydra, fetch lands and mana creatures.\n2. **Neoform-style:** Summoner's Pact to find the Trudge.\n3. **Eldrazi Ramp package (chosen):** Utopia Sprawl, Talisman of Impulse, Malevolent Rumble, Eldrazi Temple, Ugin's Labyrinth and the big Eldrazi.\n\nI picked the Eldrazi Ramp package because it fixes both weak spots of the other two. It reliably reaches 7 mana for Symbiosis, and it makes every Fight Rigging free card a game-winning threat instead of a random spell. Malevolent Rumble also digs for both Fight Rigging and the Trudge, since it finds permanents.\n\n**Changes from the borrowed deck**\n- I dropped red completely, because none of the spells need it. The deck check flagged 2 red sources against about 4.9 in Eldrazi Ramp lists. That only matters if you add red cards.\n- There are 20 real lands plus 3 Symbiosis that can be played as lands, a bit under the shell's average of about 22. Sprawl and Talisman make up the difference.\n- 2 Mossborn Hydra give you a second creature that can reach 7 power. Kozilek's Command is the main removal and card draw.\n\n**Honest odds:** if you draw first, you'll have Fight Rigging and a 7-power creature (Trudge or Mossborn Hydra) together by turn 3 about 35% of the time. Without that pairing, Fight Rigging still adds a counter every turn, and the deck plays like a normal ramp deck.\n\nThe 15-card sideboard uses cards that Eldrazi Ramp lists actually run. It's aimed at Affinity, graveyard decks (Goryo's, Living End, Persist), free spells, and Energy's Goblin Bombardment.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Slumbering Trudge"},{"qty":2,"name":"Mossborn Hydra"},{"qty":4,"name":"Sowing Mycospawn"},{"qty":3,"name":"Emrakul, the Promised End"},{"qty":2,"name":"Devourer of Destiny"},{"qty":1,"name":"Sire of Seven Deaths"},{"qty":1,"name":"World Breaker"},{"qty":4,"name":"Fight Rigging"},{"qty":4,"name":"Utopia Sprawl"},{"qty":4,"name":"Malevolent Rumble"},{"qty":4,"name":"Talisman of Impulse"},{"qty":4,"name":"Kozilek's Command"},{"qty":3,"name":"Turntimber Symbiosis"},{"qty":4,"name":"Eldrazi Temple"},{"qty":3,"name":"Ugin's Labyrinth"},{"qty":1,"name":"Bojuka Bog"},{"qty":2,"name":"Wooded Foothills"},{"qty":10,"name":"Forest"}],"side":[{"qty":2,"name":"Trinisphere"},{"qty":2,"name":"Vexing Bauble"},{"qty":2,"name":"Force of Vigor"},{"qty":1,"name":"Haywire Mite"},{"qty":2,"name":"Grafdigger's Cage"},{"qty":2,"name":"Disruptor Flute"},{"qty":1,"name":"Ensnaring Bridge"},{"qty":1,"name":"Tormod's Crypt"},{"qty":2,"name":"Nature's Claim"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built a red-green \"Rigged Trudge\" ramp brew. It's legal in Modern and the site accepted it.\n\n**How it works:** On turn 1, cast Slumbering Trudge for X=0. It's a 6/6 that enters tapped with three stun counters, but its power still counts. Fight Rigging puts a +1/+1 counter on it at the start of your combat, which makes it 7 power. That lets you play the card Fight Rigging hid away (it hides one of your top five cards when it enters) for free on turn 2–3. The deck is packed with good cards to hide: Turntimber Symbiosis, Emrakul, the Promised End, both Ghaltas and Trumpeting Carnosaur. I estimate about a 75% chance that Fight Rigging finds one in its top five. If Fight Rigging isn't around:\n* **Turntimber Symbiosis:** you can cast it with fast mana. If it puts Slumbering Trudge into play, Trudge gets three extra counters and becomes a 9/9. Otherwise it's an untapped green land.\n* **Ghalta, Primal Hunger:** costs one less for each point of power you control, so it's cheap once Trudge is out.\n* **Formidable Speaker:** finds Trudge, and its untap ability removes Trudge's stun counters early.\n\n**Three directions I considered:**\n1. **Red-green ramp using Eldrazi Ramp's mana package:** Utopia Sprawl, Malevolent Rumble, Stomping Ground, fetch lands and Formidable Speaker.\n2. **Mono-green with Arbor Elf and Quirion Ranger:** these untap Trudge to remove its stun counters faster.\n3. **Neoform-style:** sacrifice Trudge to Eldritch Evolution.\n\nI chose the first. Its proven fast mana and graveyard filling (which makes Emrakul cheaper) work best with Fight Rigging. I added Arbor Elf from the second option because it untaps a Forest enchanted with Utopia Sprawl for 3 mana on turn 2. I dropped the third because sacrificing Trudge works against Fight Rigging. Four Lightning Bolts and a Galvanic Discharge give you some early interaction.\n\n**Honest odds:** With 4 copies, you have Fight Rigging by turn 3 only 48.8% of the time on the play. You have both Fight Rigging and a 7-power enabler by then 39.3% of the time. The rest of the time it plays like a normal ramp deck.\n\n**Deck check:**\n* It has 21 lands, about one fewer than Eldrazi Ramp's average of 22.3. I trimmed because the 4 Arbor Elves and 4 Utopia Sprawls add more mana.\n* The deck check flagged zero black sources. That's fine, because the deck has no black cards.\n* The sideboard targets the decks winning now:\n  * **Energy, Affinity and Prowess:** Force of Vigor, Pick Your Poison, Haywire Mite, Ancient Grudge, Obstinate Baloth.\n  * **Storm and the fast decks:** Trinisphere.\n  * **Goryo's Vengeance and Persist:** Tormod's Crypt.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Slumbering Trudge"},{"qty":4,"name":"Arbor Elf"},{"qty":4,"name":"Formidable Speaker"},{"qty":2,"name":"Ghalta, Primal Hunger"},{"qty":2,"name":"Ghalta, Stampede Tyrant"},{"qty":2,"name":"Emrakul, the Promised End"},{"qty":2,"name":"Trumpeting Carnosaur"},{"qty":4,"name":"Fight Rigging"},{"qty":4,"name":"Turntimber Symbiosis"},{"qty":4,"name":"Utopia Sprawl"},{"qty":4,"name":"Malevolent Rumble"},{"qty":4,"name":"Lightning Bolt"},{"qty":1,"name":"Galvanic Discharge"},{"qty":9,"name":"Forest"},{"qty":3,"name":"Stomping Ground"},{"qty":3,"name":"Wooded Foothills"},{"qty":2,"name":"Windswept Heath"},{"qty":1,"name":"Boseiju, Who Endures"},{"qty":1,"name":"Mountain"}],"side":[{"qty":3,"name":"Force of Vigor"},{"qty":2,"name":"Pick Your Poison"},{"qty":2,"name":"Trinisphere"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Haywire Mite"},{"qty":2,"name":"Obstinate Baloth"},{"qty":2,"name":"Ancient Grudge"}],"mainCount":60,"sideCount":15}}},{"id":"876ce9fd2d7b","prompt":"holdout-premodern-living-death","brew":true,"left":{"text":"I built a Black-Green \"Druid Death\" deck (a brew). You fill your own graveyard with big creatures, then cast Living Death. It brings all of them back at once and kills everything else on the battlefield, including the opponent's creatures. Against the creature decks in the meta (Sligh, Goblins, Elves, GW Madness) it also works as a one-sided board wipe that leaves you with an army.\n\n**The three directions I considered**\n1. **Black-Green with Hermit Druid and Survival (chosen).** It borrows two packages from the menu: Hermit Druid, Survival of the Fittest and Birds of Paradise from Hermit Druid Combo, and the Cabal Therapy/Duress hand attack. Living Death has already shown up in 3 recent BG Survival lists.\n2. **Mono-black with Dark Ritual and Buried Alive.** It would use Reanimator's Putrid Imp, Lotus Petal and Ritual.\n3. **Blue-Black self-mill.** Careful Study and card-draw spells to discard creatures.\n\nI picked the first because green gives you four different ways to fill the graveyard. Hermit Druid, Survival, Buried Alive and Krosan Tusker's cycling all do it, plus Birds to reach 5 mana. The other two directions rely on a narrower set of discard outlets.\n\n**How it plays**\n- **Filling the graveyard:**\n  - **Hermit Druid:** The deck runs only 9 basic lands, so each activation mills a big chunk of the library.\n  - **Survival of the Fittest:** Discard a creature to search for another.\n  - **Buried Alive:** Puts three creatures straight into the graveyard.\n  - **Krosan Tusker:** Cycling it draws a card and finds a basic land, and leaves a 6/5 in the graveyard.\n- **What comes back:**\n  - Visara and Bone Shredder kill creatures when they return.\n  - Deranged Hermit brings four squirrels.\n  - Akroma and Phantom Nishoba are strong against red decks.\n  - Symbiotic Wurm makes seven insects whenever it dies, including when a second Living Death sacrifices it.\n  - Akroma and Nishoba can't realistically be cast from hand. They're only there to come back from the graveyard, which is why I ignored the deck checker's warning about having only 7 white sources.\n- **Finding and protecting Living Death:**\n  - Diabolic Intent can search for it. Sacrifice a Druid or Bird you've already used.\n  - Dark Ritual can make a turn-3 Living Death possible.\n  - Therapy and Duress clear counterspells out of the way first, which matters most against Stiflenought.\n\n**Honest odds:** Without a mulligan, you have about a 61% chance of holding Living Death or a Diabolic Intent by turn 4. You'll almost always have a way to fill the graveyard by then (about 96%), so the real bottleneck is drawing Living Death itself.\n\n**Things to watch for**\n- Living Death also brings back creatures in the opponent's graveyard.\n- The pain lands (Llanowar Wastes, City of Brass) cost life against Sligh.\n- The deck runs 20 lands, slightly below the roughly 21 that BG Survival lists play. Birds, Dark Ritual and Tusker's land search make up the difference.\n\n**Sideboard:** It's aimed at the top decks:\n- Engineered Plague for Goblins and Elves\n- Smother for Dreadnought and small creatures\n- Xantid Swarm against counterspell decks\n- Naturalize and Pernicious Deed for Enchantress and Oath\n- Tormod's Crypt for opposing graveyard decks\n- Uktabi Orangutan to destroy artifacts (Survival can fetch it)\n- A spare Duress","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Birds of Paradise"},{"qty":4,"name":"Hermit Druid"},{"qty":4,"name":"Krosan Tusker"},{"qty":1,"name":"Squee, Goblin Nabob"},{"qty":1,"name":"Bone Shredder"},{"qty":1,"name":"Deranged Hermit"},{"qty":1,"name":"Visara the Dreadful"},{"qty":1,"name":"Symbiotic Wurm"},{"qty":1,"name":"Verdant Force"},{"qty":1,"name":"Akroma, Angel of Wrath"},{"qty":1,"name":"Phantom Nishoba"},{"qty":4,"name":"Survival of the Fittest"},{"qty":3,"name":"Buried Alive"},{"qty":4,"name":"Living Death"},{"qty":2,"name":"Diabolic Intent"},{"qty":3,"name":"Dark Ritual"},{"qty":3,"name":"Cabal Therapy"},{"qty":1,"name":"Duress"},{"qty":4,"name":"Llanowar Wastes"},{"qty":3,"name":"City of Brass"},{"qty":2,"name":"Gemstone Mine"},{"qty":2,"name":"Treetop Village"},{"qty":5,"name":"Swamp"},{"qty":4,"name":"Forest"}],"side":[{"qty":3,"name":"Engineered Plague"},{"qty":2,"name":"Naturalize"},{"qty":2,"name":"Smother"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Xantid Swarm"},{"qty":1,"name":"Uktabi Orangutan"},{"qty":2,"name":"Pernicious Deed"},{"qty":1,"name":"Duress"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built **BG Living Death**, a brew that uses BG Survival's mana base.\n\n**The plan**\nSpend turns 1–4 filling your graveyard with big creatures while staying alive behind Wild Mongrel, Wall of Blossoms and discard. Then cast Living Death. It's a board wipe that only costs you a Bird or a Mongrel, and it puts Krosan Tusker (6/5), Twisted Abomination (5/3, regenerates), Visara (5/5 flier that kills creatures), Avatar of Woe and Symbiotic Wurm onto the battlefield. If Living Death is answered or the Wurm dies again, Genesis, Volrath's Stronghold and seven Insect tokens give you more to work with.\n\n**Key cards**\n- **Living Death ×4:** The card you asked to build around. Living Death has shown up in 7 recent lists, mostly BG Survival, so it's proven as a one-of. A whole deck built around it hasn't been tried.\n- **Ways to fill the graveyard:**\n  - **Survival of the Fittest:** Each activation discards a creature and finds another, so it fills the graveyard and finds targets at the same time.\n  - **Buried Alive:** Puts three creatures in the graveyard at once.\n  - **Wild Mongrel:** Lets you discard cards for free.\n  - **Krosan Tusker and Twisted Abomination:** You can cycle them early for a land, and they're also the big creatures you bring back.\n- **Insidious Dreams ×3:** You cast it at instant speed by discarding cards. Discard two big creatures at the end of your opponent's turn, put Living Death on top of your library, and draw it next turn. With 4 Living Death and 3 Dreams, you have a **77.8%** chance of seeing one by turn 5 on the play (no mulligans). You have a 98.3% chance of having a graveyard enabler by then, and 76.3% for both together.\n- **Single creatures you can fetch with Survival:**\n  - **Bone Shredder:** Kills a creature right away, and kills another when Living Death brings it back.\n  - **Avatar of Woe:** Costs just {B}{B} once there are 10 creature cards across all graveyards.\n- **Duress and Cabal Therapy:** These protect your turn against combo and counterspell decks. Cabal Therapy's flashback lets you sacrifice a Bird you were going to lose to Living Death anyway.\n\n**Mana**\nThe deck runs 20 lands: 8 Forest, 7 Swamp, 4 Llanowar Wastes and 1 Volrath's Stronghold. That gives you 13 black and 14 green sources, plus 4 Birds of Paradise. check_deck suggested about 24 lands, but that count treats 7 cards as 7-drops when they're really land-finders: Tusker cycles for any basic and Abomination cycles for a Swamp. BG Survival lists average 21.25 lands, so this is close to their numbers.\n\n**Sideboarding against the current field**\n- **Stiflenought (14.9% of the field):** Bring in 3 Smother and Diabolic Edict, which kill Phyrexian Dreadnought. Take out Wall of Blossoms and a Duress. Be careful: Stifle can counter your cycling and Survival triggers.\n- **Sligh and Goblins:** Bring in Smother, Engineered Plague (name Goblin), Pernicious Deed, Ravenous Baloth and Spike Feeder. Take out Duress, Cabal Therapy and Buried Alive.\n- **Enchantress, Replenish and Oath:** Bring in Naturalize, Pernicious Deed and Uktabi Orangutan. Keep all the discard.\n- **Reanimator, Hermit Druid and other Survival decks:** Bring in 2 Withered Wretch. Your Living Death brings back **their** creatures too, so exile their best graveyard targets before you cast it.\n- **Elves:** Bring in Engineered Plague (name Elf) and Pernicious Deed.\n\n**Label:** This is a brew. I borrowed BG Survival's mana and creature package but rebuilt the deck around Living Death.\n\n**Caveats**\n- Living Death is symmetrical, so always check what's in your opponent's graveyard before you cast it.\n- I haven't playtested this. The sideboard plans are based on what the meta data shows, not on actual match results.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Birds of Paradise"},{"qty":4,"name":"Wild Mongrel"},{"qty":2,"name":"Wall of Blossoms"},{"qty":4,"name":"Krosan Tusker"},{"qty":3,"name":"Twisted Abomination"},{"qty":1,"name":"Bone Shredder"},{"qty":1,"name":"Visara the Dreadful"},{"qty":1,"name":"Avatar of Woe"},{"qty":1,"name":"Symbiotic Wurm"},{"qty":1,"name":"Genesis"},{"qty":4,"name":"Living Death"},{"qty":4,"name":"Survival of the Fittest"},{"qty":2,"name":"Buried Alive"},{"qty":3,"name":"Insidious Dreams"},{"qty":2,"name":"Duress"},{"qty":3,"name":"Cabal Therapy"},{"qty":8,"name":"Forest"},{"qty":7,"name":"Swamp"},{"qty":4,"name":"Llanowar Wastes"},{"qty":1,"name":"Volrath's Stronghold"}],"side":[{"qty":2,"name":"Withered Wretch"},{"qty":2,"name":"Engineered Plague"},{"qty":2,"name":"Naturalize"},{"qty":3,"name":"Smother"},{"qty":2,"name":"Pernicious Deed"},{"qty":1,"name":"Spike Feeder"},{"qty":1,"name":"Uktabi Orangutan"},{"qty":1,"name":"Diabolic Edict"},{"qty":1,"name":"Ravenous Baloth"}],"mainCount":60,"sideCount":15}}},{"id":"9cf9ad6e71ea","prompt":"holdout-modern-persist","brew":true,"left":{"text":"I've built a Rakdos \"Eyetwitch Recursion\" brew for Modern. Its creatures keep coming back from the graveyard, and they double as free sacrifices for Flare of Malice.\n\n**The plan**\nYou play cheap black creatures that want to die. Stitcher's Supplier mills three cards when it enters and again when it dies. Eyetwitch \"learns\" when it dies. You sacrifice them to Flare of Malice (free, and it makes the opponent sacrifice their highest-mana-value creature or planeswalker), Village Rites or Carrion Feeder. Bloodghast, Retriever Phoenix and an escaped Kroxa then come back to finish the game.\n\n**Main deck (60)**\n- **Creatures (24):** 4 Eyetwitch, 4 Stitcher's Supplier, 4 Carrion Feeder, 4 Bloodghast, 2 Orcish Bowmasters, 4 Retriever Phoenix, 2 Kroxa, Titan of Death's Hunger\n- **Spells (18):** 4 Flare of Malice, 4 Village Rites, 3 Fatal Push, 3 Lightning Bolt, 2 Faithless Looting, 2 Igneous Inspiration\n- **Lands (18):** 4 Bloodstained Mire, 1 Polluted Delta, 1 Wooded Foothills, 3 Blood Crypt, 2 Raucous Theater, 2 Spymaster's Vault, 3 Swamp, 2 Mountain\n\n**Why these cards**\n- **Eyetwitch and Retriever Phoenix:** This is the main idea. When Eyetwitch dies, its learn can do one of three things:\n  - Bring back a Retriever Phoenix from your graveyard. Phoenix says that if it's in your graveyard when you would learn, it can return to the battlefield instead. That gives you a 2/2 flying, haste creature for free.\n  - Discard a card to draw a card. Discarding a Phoenix or Kroxa sets up later turns.\n  - Fetch a Lesson from your sideboard. That turns Eyetwitch into a tutor for an answer.\n- **Igneous Inspiration:** It deals 3 damage and also learns, so it's a second way to trigger Phoenix.\n- **Stitcher's Supplier:** Gets Phoenix and Kroxa into the graveyard and fuels Kroxa's escape (exile five other graveyard cards). It's also a Zombie that Flare can sacrifice.\n- **Flare of Malice:** 20 of the main-deck creatures are black and can pay its free cost. With 22 counted (an earlier draft), you draw Flare plus a creature to sacrifice by turn 3 about 48% of the time, and nearly every time you have Flare, you can cast it free.\n- **Other sacrifice outlets and payoffs:** Carrion Feeder and Village Rites let you sacrifice at instant speed or for cards. Spymaster's Vault rewards turns where several creatures died.\n\n**Honest odds**\nSeeing both Eyetwitch and a Phoenix by turn 4 is only about 26.5% without help. Supplier's milling, Faithless Looting and Eyetwitch's own discard push that higher. The Phoenix loop is a bonus engine, not something you rely on every game. The base deck is a sacrifice deck with efficient removal.\n\n**Mana**\n- 18 lands with 15 black and 12 red sources. That matches the proven Reanimator lists (18.2 lands, 14.5 black, 12.7 red).\n- The deck checker suggested about 20 lands, but that's a generic number. The average mana value is 1.86, and Flare is usually free, so I followed the real lists.\n- The fetch lands also trigger Bloodghast's landfall twice.\n\n**Sideboard (15)**\n- **Lessons (Firebending Lesson, Dai Li Indoctrination, Price of Freedom):** These work as normal sideboard cards and are also what Eyetwitch and Phoenix can fetch in game 1. Firebending Lesson is for Energy and Prowess creatures. Dai Li Indoctrination takes a key permanent out of a combo or Tron hand. Price of Freedom destroys an Affinity artifact or a land from Tron or Amulet, and draws a card.\n- **Energy (20.6% of the meta) and Prowess:** Bring in 2 Brotherhood's End (3 damage to everything). Take out Faithless Looting and some Igneous Inspiration.\n- **Affinity (9.4%):** Bring in Brotherhood's End (artifact mode), Rakdos Charm and Price of Freedom.\n- **Eldrazi Tron, Amulet Titan and Eldrazi Ramp:** Bring in 2 Obsidian Charmaw. It costs less for each land they control that makes colorless mana, and it destroys a nonbasic land.\n- **Living End, Goryo's Vengeance, Belcher and Storm:** Bring in 3 Vexing Bauble (counters any spell cast without spending mana), 2 Rakdos Charm (exile a graveyard) and 2 Dauthi Voidwalker (exiles their cards instead of letting them hit the graveyard).\n- **Blink and control decks:** Bring in Extract the Truth and Dai Li Indoctrination.\n\n**Label and limits**\n- This is a **brew**. I took the mana base and some sideboard ideas from Modern's Reanimator archetype, which already plays Supplier and Flare. But there's no Archon of Cruelty or Persist here. The engine is learn, Phoenix and recursion.\n- Eyetwitch, Retriever Phoenix and Igneous Inspiration appear in 0 recent tournament lists. Nothing here has been tested in real matches, and the card choices and sideboard plans are my judgment.\n- I'm assuming Lessons in your sideboard count as \"outside the game\" for learn, which is how constructed tournament rules have handled it. The tools don't confirm that ruling.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Eyetwitch"},{"qty":4,"name":"Stitcher's Supplier"},{"qty":4,"name":"Carrion Feeder"},{"qty":4,"name":"Bloodghast"},{"qty":2,"name":"Orcish Bowmasters"},{"qty":4,"name":"Retriever Phoenix"},{"qty":2,"name":"Kroxa, Titan of Death's Hunger"},{"qty":4,"name":"Flare of Malice"},{"qty":4,"name":"Village Rites"},{"qty":3,"name":"Fatal Push"},{"qty":3,"name":"Lightning Bolt"},{"qty":2,"name":"Faithless Looting"},{"qty":2,"name":"Igneous Inspiration"},{"qty":4,"name":"Bloodstained Mire"},{"qty":1,"name":"Polluted Delta"},{"qty":1,"name":"Wooded Foothills"},{"qty":3,"name":"Blood Crypt"},{"qty":2,"name":"Raucous Theater"},{"qty":2,"name":"Spymaster's Vault"},{"qty":3,"name":"Swamp"},{"qty":2,"name":"Mountain"}],"side":[{"qty":1,"name":"Firebending Lesson"},{"qty":1,"name":"Dai Li Indoctrination"},{"qty":1,"name":"Price of Freedom"},{"qty":2,"name":"Brotherhood's End"},{"qty":2,"name":"Rakdos Charm"},{"qty":3,"name":"Vexing Bauble"},{"qty":2,"name":"Dauthi Voidwalker"},{"qty":2,"name":"Obsidian Charmaw"},{"qty":1,"name":"Extract the Truth"}],"mainCount":60,"sideCount":15}},"right":{"text":"I submitted a mono-black reanimator brew called \"Twitch & Stitch.\" Cheap black creatures go to the graveyard and get value on the way. Flare of Malice is free removal, and Persist or Emperor of Bones brings back Archon of Cruelty.\n\n**How it works:** Stitcher's Supplier mills three cards when it enters and again when it dies. When Eyetwitch dies, it lets you discard a card to draw one, so you can throw away an Archon. Buried Alive (legal in Modern) and Unmarked Grave can put Archon straight into the graveyard on turn 2–3. Persist (2 mana) or Emperor of Bones then puts it into play.\n\nFlare of Malice ties it together. Instead of paying its cost, you can sacrifice a nontoken black creature. If that's Eyetwitch or Supplier, its death trigger fires too, so you remove their best creature for free and dig toward Archon. Village Rites (sacrifice a creature, draw two) does the same job. Orcish Bowmasters, Thoughtseize and Fatal Push help against Energy, the most common deck.\n\n**The three directions I considered:**\n1. **Mono-black Buried Alive Persist (chosen).** It takes the Persist + Archon package from the Grixis Persist deck in your list.\n2. **Golgari sacrifice combo**, built like Soultrader Combo with Gravecrawler, Warren Soultrader and Carrion Feeder.\n3. **Orzhov tokens** with Hunt for Specimens, Blood Artist and Lessons.\n\nI picked the first because both of your cards and Flare do the most there: every sacrifice fills the graveyard toward an 8-mana Archon you never pay for.\n\n**Numbers:**\n- **Odds:** On the play, you'll have a way to fill the graveyard by turn 3 90.8% of the time, and a reanimation spell 70% of the time. You'll have both together 62.7% of the time. It's a fast, disruptive deck, not a guaranteed turn-2 combo.\n- **Not a copy:** The checker found 53% overlap with the closest existing list, a Rakdos Reanimator deck (its limit is 65%). The difference is that this build drops red (no Faithless Looting or Lightning Bolt) and uses Buried Alive and Unmarked Grave instead.\n- **18 lands:** That's below the checker's suggested 20.6, but it counts Archon at 8 mana and you never cast it. Real Reanimator lists run about 18.\n- **Off-color lands:** Undercity Sewers and Raucous Theater are only there to surveil Archons into the graveyard. Every land makes black mana.\n\n**Sideboard:** It targets Energy (Toxic Deluge, the extra Bowmasters), graveyard decks (Nihil Spellbomb, Dauthi Voidwalker) and combo/Tron (Duress, Extract the Truth, Damping Sphere, Vexing Bauble). It also holds two Lessons, Dai Li Indoctrination and Ruinous Waterbending. When Eyetwitch dies, you can take one of them from the sideboard instead of drawing.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Eyetwitch"},{"qty":4,"name":"Stitcher's Supplier"},{"qty":3,"name":"Orcish Bowmasters"},{"qty":3,"name":"Emperor of Bones"},{"qty":2,"name":"Bloodghast"},{"qty":4,"name":"Archon of Cruelty"},{"qty":4,"name":"Flare of Malice"},{"qty":4,"name":"Persist"},{"qty":3,"name":"Buried Alive"},{"qty":2,"name":"Unmarked Grave"},{"qty":3,"name":"Village Rites"},{"qty":3,"name":"Thoughtseize"},{"qty":2,"name":"Fatal Push"},{"qty":1,"name":"Unearth"},{"qty":9,"name":"Swamp"},{"qty":2,"name":"Polluted Delta"},{"qty":1,"name":"Urborg, Tomb of Yawgmoth"},{"qty":2,"name":"Raucous Theater"},{"qty":2,"name":"Undercity Sewers"},{"qty":1,"name":"Spymaster's Vault"},{"qty":1,"name":"Hive of the Eye Tyrant"}],"side":[{"qty":1,"name":"Orcish Bowmasters"},{"qty":2,"name":"Dauthi Voidwalker"},{"qty":2,"name":"Toxic Deluge"},{"qty":2,"name":"Duress"},{"qty":2,"name":"Extract the Truth"},{"qty":2,"name":"Nihil Spellbomb"},{"qty":1,"name":"Damping Sphere"},{"qty":1,"name":"Vexing Bauble"},{"qty":1,"name":"Dai Li Indoctrination"},{"qty":1,"name":"Ruinous Waterbending"}],"mainCount":60,"sideCount":15}}},{"id":"a828fe049f91","prompt":"holdout-standard-mardu-discard","brew":true,"left":{"text":"I built this as **Rakdos Discard Aggro**, a brew. None of your three cards shows up in recent results: Iron-Shield Elf appears in 0 lists, and Bloodthorn Flail and Flamewake Phoenix in 1 list each.\n\n**Main deck (60)**\n- 4 Marauding Mako\n- 4 Iron-Shield Elf\n- 4 Sunset Saboteur\n- 3 Inti, Seneschal of the Sun\n- 4 Fear of Missing Out\n- 4 Flamewake Phoenix\n- 2 Ultimate Green Goblin\n- 4 Bloodthorn Flail\n- 4 Burst Lightning\n- 3 Bitter Triumph\n- 2 Lightning Strike\n- 4 Blood Crypt\n- 4 Blazemire Verge\n- 3 Haunted Ridge\n- 6 Mountain\n- 5 Swamp\n\n**Sideboard (15)**\n- 3 Duress\n- 2 Thought-Stalker Warlock\n- 2 Soul-Guide Lantern\n- 2 Abrade\n- 2 Heartless Act\n- 2 Nowhere to Run\n- 2 Shock\n\n**The plan**\nThis is a fast deck that turns discarding into an advantage. Discarding throws Flamewake Phoenix into the graveyard, grows your creatures and draws you cards. Big creatures (power 4 or more) then let you pay {R} at the start of combat to bring the Phoenix back. Its ability is called Ferocious. The deck curves out low (average mana value 1.84) and finishes with burn.\n\n**Why these cards**\n- **Your three cards fit together.** Bloodthorn Flail costs {B}, and you can equip it by discarding a card instead of paying {3}. On a 3/1 Iron-Shield Elf it makes a 5/2. That alone turns on the Phoenix. The Elf's own \"discard: indestructible\" ability is a second discard outlet, so your extra Phoenixes become value, not dead cards.\n- **Sunset Saboteur:** a 4/1 menace for 2, so it turns on the Phoenix by itself. Its ward (\"discard a card\") protects it.\n- **Ultimate Green Goblin:** a 5/4 for 3 that also makes you discard every upkeep. That fills the graveyard, makes a Treasure, and triggers the other discard cards.\n- **Marauding Mako:** gets a +1/+1 counter for every card you discard, so it often reaches 4 power on its own.\n- **Inti:** each attack can turn a discard into a +1/+1 counter. Each discard also exiles your top card, and you can play it until your next end step, which refuels you after the Flail and the Elf eat your hand.\n- **Fear of Missing Out:** looting on a 2-drop: you discard a card, then draw one. Pitching a Phoenix here is the ideal play.\n- **Removal:** Bitter Triumph can be paid for with a discard instead of 3 life. Burst Lightning and Lightning Strike clear blockers or finish the game.\n- **The odds:** you have a 4-power enabler (Saboteur, Green Goblin or Flail) by turn 4 86% of the time on the play. Seeing an enabler and a Phoenix together by then is 45%. The loot effects push that number up in practice.\n\n**Mana**\nNo proven Rakdos list exists, so I borrowed the land count from Izzet Aggro and set it to 22. That's slightly under Izzet's 24 average, which fits this deck's lower curve. The checker recommended 22.4. You get 17 red sources for the Phoenix's {1}{R}{R} and 16 black. Blazemire Verge makes red off any Mountain or Blood Crypt, and Haunted Ridge enters untapped from your third land onward.\n\n**Sideboarding**\n- **Simic Ouroboroid (18%) and Landfall:** bring in Heartless Act, which removes up to three counters from the creatures Ouroboroid pumps, plus Nowhere to Run and Shock. Take out Lightning Strike and 1–2 Mako.\n- **Jeskai Control and Dimir Midrange:** bring in Duress and Thought-Stalker Warlock. Take out Lightning Strike and 1 Bitter Triumph. Your recursive Phoenix and the indestructible Elf already hold up well against removal.\n- **Lessons and Reanimator:** bring in 2 Soul-Guide Lantern and Duress.\n- **Izzet Aggro and Boros Aggro:** bring in Abrade and Shock. Take out Duress-style slow cards and a Flail or two. Be careful: Fire Magic and Pyroclasm in their sideboards kill your 1-toughness creatures.\n\n**What I couldn't verify**\n- No one has played this as a full deck, so the matchup advice is my reasoning, not results.\n- Ultimate Green Goblin and Haunted Ridge show 0 recent  Hired Claw doesn't use discarding at all. From the other two I only borrowed what fit: Burst Lightning, Bitter Triumph and the 22-land count, which matches Boros Aggro's average of 22.1.\n\n**Honest odds:** You'll have at least one card that discards or rewards discarding by turn 3 about 98% of the time. But you'll only have a Flail in hand by turn 3 about 49% of the time, so the Elf-and-Flail combo is just one of several ways the deck turns the Phoenix back on.\n\nThe sideboard is aimed at the most-played decks:\n- **Control decks (Jeskai, Lessons):** Duress and Thought-Stalker Warlock.\n- **Creature decks (Ouroboroid, Landfall):** Electro's Bolt, which you can also cast from the graveyard after discarding it.\n- **Izzet and Boros aggro:** Sandman's Quicksand, which only shrinks their creatures when cast from the graveyard, and Shock.\n- **Reanimator:** Soul-Guide Lantern.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Iron-Shield Elf"},{"qty":4,"name":"Scarlet Spider, Kaine"},{"qty":4,"name":"Hobgoblin, Mantled Marauder"},{"qty":4,"name":"Inti, Seneschal of the Sun"},{"qty":4,"name":"Flamewake Phoenix"},{"qty":4,"name":"Ultimate Green Goblin"},{"qty":4,"name":"Bloodthorn Flail"},{"qty":4,"name":"Burst Lightning"},{"qty":4,"name":"Bitter Triumph"},{"qty":2,"name":"Pumpkin Bombardment"},{"qty":4,"name":"Blood Crypt"},{"qty":4,"name":"Haunted Ridge"},{"qty":2,"name":"Raucous Theater"},{"qty":7,"name":"Mountain"},{"qty":5,"name":"Swamp"}],"side":[{"qty":3,"name":"Duress"},{"qty":2,"name":"Thought-Stalker Warlock"},{"qty":2,"name":"Electro's Bolt"},{"qty":2,"name":"Sandman's Quicksand"},{"qty":2,"name":"Soul-Guide Lantern"},{"qty":2,"name":"Shock"},{"qty":2,"name":"The Death of Gwen Stacy"}],"mainCount":60,"sideCount":15}}},{"id":"ddd0503bb441","prompt":"holdout-pauper-inside-out","brew":true,"left":{"text":"I built a Boros (red-white) deck where the two Eidolons keep coming back, plus a sideboard aimed at the current field. It's a brew: none of these three cards showed up in any recent tournament list.\n\n**How it works:** Both Eidolons return from your graveyard to your hand whenever you cast a multicolored spell. 24 of the deck's 41 spells are multicolored, and you'll draw at least one by turn 4 about 99.7% of the time. That means you can sacrifice the Eidolons every turn without losing them:\n- **Sandstorm Eidolon:** pay {R} and sacrifice it to stop a creature from blocking.\n- **Aurora Eidolon:** pay {W} and sacrifice it to prevent 3 damage, for example to save Spirit Mascot from Lightning Bolt.\n\nEach time an Eidolon comes back, a card leaves your graveyard, so Spirit Mascot gets a +1/+1 counter. Pursue the Past fits especially well. It's a two-color spell that lets you discard an Eidolon to draw two. Casting it again with flashback brings an Eidolon back and also takes Pursue out of the graveyard, which can trigger Mascot twice.\n\n**Other cheap multicolored spells:**\n- Manamorphose: costs 2 but gives back 2 mana, so it brings an Eidolon back for free and draws a card.\n- Battlegate Mimic: becomes a 4/2 first striker whenever you cast a spell that's both red and white.\n- Wojek Halberdiers.\n- Skyknight Legionnaire.\n\n**Directions I considered:**\n1. A red-heavy version using the Madness deck's Faithless Looting and Lava Dart, whose flashback also grows Mascot.\n2. A version using the Mono-Red Rally deck's Burning-Tree Emissary, which counts as multicolored.\n3. A Boros multicolored creature deck, borrowing the Synthesizer deck's two-color lands and removal.\n\nI chose the third because it's the only one where both Eidolons get back to your hand nearly every turn. The other two only feed Mascot.\n\n**Borrowed from Synthesizer:** Kor Skyfisher, Lightning Bolt, Journey to Nowhere, the Wind-Scarred Crag / Boros Garrison land base, and most of the sideboard. The checker found the deck is 41.7% the same as one Synthesizer list (the limit for a brew is 65%).\n\n**Mana:** I run 19 lands, with 13 red and 13 white sources. That's below Synthesizer's average of 20.5 but above the checker's suggested 17.7. The extra lands are there to pay for the 4-mana Eidolons, Pursue's 4-mana flashback and the sacrifice costs.\n\n**Honest odds:** You'll have an Eidolon by turn 4 only about 68% of the time, and Spirit Mascot about 53%. The deck still works as a cheap, efficient aggro deck when those cards don't show up.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Spirit Mascot"},{"qty":3,"name":"Aurora Eidolon"},{"qty":3,"name":"Sandstorm Eidolon"},{"qty":4,"name":"Battlegate Mimic"},{"qty":4,"name":"Wojek Halberdiers"},{"qty":4,"name":"Skyknight Legionnaire"},{"qty":3,"name":"Kor Skyfisher"},{"qty":4,"name":"Pursue the Past"},{"qty":4,"name":"Manamorphose"},{"qty":4,"name":"Lightning Bolt"},{"qty":4,"name":"Journey to Nowhere"},{"qty":4,"name":"Wind-Scarred Crag"},{"qty":2,"name":"Boros Garrison"},{"qty":1,"name":"Sacred Peaks"},{"qty":6,"name":"Mountain"},{"qty":6,"name":"Plains"}],"side":[{"qty":3,"name":"Red Elemental Blast"},{"qty":1,"name":"Pyroblast"},{"qty":2,"name":"Dust to Dust"},{"qty":2,"name":"Destroy Evil"},{"qty":3,"name":"Electrickery"},{"qty":2,"name":"Relic of Progenitus"},{"qty":2,"name":"Prismatic Strands"}],"mainCount":60,"sideCount":15}},"right":{"text":"The deck was accepted. It's a **brew**: none of the three cards turned up in any Pauper list from the last 90 days, so it's built from scratch. I borrowed the mana base from the small Boros Aggro archetype (3 recent lists).\n\n## Boros Eidolon Recursion (Pauper)\n\n**Creatures (26)**\n4 Spirit Mascot\n4 Duergar Assailant\n4 Kor Skyfisher\n3 Wojek Halberdiers\n2 Battlegate Mimic\n3 Skyknight Legionnaire\n3 Aurora Eidolon\n3 Sandstorm Eidolon\n\n**Spells (15)**\n4 Lightning Bolt\n4 Faithless Looting\n3 Pursue the Past\n2 Journey to Nowhere\n2 Fire at Will\n\n**Lands (19)**\n4 Boros Garrison, 4 Wind-Scarred Crag, 6 Plains, 5 Mountain\n\n**Sideboard (15)**\n3 Red Elemental Blast, 2 Pyroblast, 2 Dust to Dust, 2 Electrickery, 2 Prismatic Strands, 2 Thraben Charm, 2 Destroy Evil\n\n### The plan\nThis is a cheap red-white aggro deck where 22 cards count as multicolored. Hybrid cards (cards with mana symbols like {R/W}) count as both red and white. Each Eidolon is a 2/2 you can sacrifice for an effect:\n- **Aurora Eidolon** prevents 3 damage, which can stop a Bolt or win a fight in combat.\n- **Sandstorm Eidolon** makes a creature unable to block, which helps push through damage.\n\nThen the next multicolored spell you cast returns the Eidolon from your graveyard to your hand. **Spirit Mascot** gets a +1/+1 counter every time cards leave your graveyard, so each returned Eidolon and each flashback spell makes it bigger.\n\n### Why the key cards\n- **Duergar Assailant** costs one hybrid mana ({R/W}), so it returns both Eidolons for one mana. It can also sacrifice itself to deal 1 damage to an attacking or blocking creature.\n- **Kor Skyfisher** returns one of your permanents to your hand when it enters. Bounce an Assailant or Mascot to cast it again and trigger the Eidolons again. You can also bounce a Boros Garrison.\n- **Faithless Looting and Pursue the Past** let you discard Eidolons on purpose, so they're in the graveyard waiting to come back. Casting either one with flashback also grows Mascot. Pursue the Past is red-white, so casting it from the graveyard also returns your Eidolons.\n- **Battlegate Mimic** becomes a 4/2 first striker whenever you cast a spell that's both red and white, and nearly every spell in this deck is.\n- **Skyknight Legionnaire and Wojek Halberdiers** are the best red-white common threats that are legal. Lightning Helix, Boros Charm and Boros Swiftblade are all not legal in Pauper.\n- **Odds:** you'll see at least one Eidolon by turn 5 about 72% of the time, and a multicolored spell 99.6% of the time. That's why I ran 3+3 Eidolons rather than eight: they're slow 4-mana 2/2s, and the deck works best when they come back again and again, not when you draw lots of them.\n\n### The mana\nI ran 19 lands, as Boros Aggro does (about 19.3), because Pursue the Past's flashback costs 4 mana and so do the Eidolons. You have 14 white and 13 red sources. The check tool flagged that Boros Aggro runs about 16 white sources. I kept the split even because its lists are mostly white, while this deck needs red-white mana right away for Mascot and Halberdiers on turn 2. Boros Garrison gives both colors at once and works well with Skyfisher.\n\n### Sideboarding against the current field\n- **Madness (16%), Mono-Red Rally:** Bring in Prismatic Strands and Electrickery. Take out Battlegate Mimic and a Looting.\n- **Terror (13.5%), Faeries, Spy Combo:** Bring in Red Elemental Blast and Pyroblast. Take out Fire at Will and Mimic.\n- **Affinity:** Bring in Dust to Dust, plus REB against the blue cards. Take out Fire at Will.\n- **Elves, Mono-White Aggro:** Bring in Electrickery and Thraben Charm.\n- **Golgari Gardens, Tron, Ponza:** Bring in Destroy Evil, plus Thraben Charm to remove graveyards and enchantments.\n\n### What I couldn't verify\n- The card database lists Faithless Looting as legal. It shows up in 551 recent lists, mostly Madness. Check the current ban list before an event anyway.\n- This exact shell has never been tested in tournaments, so the 19-land count and the creature balance are my best estimates.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Spirit Mascot"},{"qty":4,"name":"Duergar Assailant"},{"qty":4,"name":"Kor Skyfisher"},{"qty":3,"name":"Wojek Halberdiers"},{"qty":2,"name":"Battlegate Mimic"},{"qty":3,"name":"Skyknight Legionnaire"},{"qty":3,"name":"Aurora Eidolon"},{"qty":3,"name":"Sandstorm Eidolon"},{"qty":4,"name":"Lightning Bolt"},{"qty":4,"name":"Faithless Looting"},{"qty":3,"name":"Pursue the Past"},{"qty":2,"name":"Journey to Nowhere"},{"qty":2,"name":"Fire at Will"},{"qty":4,"name":"Boros Garrison"},{"qty":4,"name":"Wind-Scarred Crag"},{"qty":6,"name":"Plains"},{"qty":5,"name":"Mountain"}],"side":[{"qty":3,"name":"Red Elemental Blast"},{"qty":2,"name":"Pyroblast"},{"qty":2,"name":"Dust to Dust"},{"qty":2,"name":"Electrickery"},{"qty":2,"name":"Prismatic Strands"},{"qty":2,"name":"Thraben Charm"},{"qty":2,"name":"Destroy Evil"}],"mainCount":60,"sideCount":15}}},{"id":"f2377d58ce46","prompt":"holdout-premodern-living-death","brew":true,"left":{"text":"I built **BG Survival-Death**, a brew that uses the Survival of the Fittest shell from BG Survival with 4 Living Death as the payoff.\n\n**How it plays:** Survival (discard a creature card to search up another one), Buried Alive and the cycling big creatures fill your graveyard with large creatures. The cyclers are Krosan Tusker (cycling also finds a basic land) and Twisted Abomination (cycles into a Swamp). Living Death then swaps boards: your cheap creatures die and your graveyard comes back. Many of those creatures do something when they return or when they die. Bone Shredder destroys an opposing creature when it enters. Deranged Hermit brings four squirrels, Uktabi Orangutan destroys an artifact, and Symbiotic Wurm leaves seven insects when it's sacrificed. Withered Wretch can exile the opponent's creature cards from their graveyard first, so only your side comes back big. Duress and Cabal Therapy clear counterspells out of the way before you cast it.\n\n**Three directions I considered:**\n1. **BG Survival.** Takes the Survival package that Elves and BG Survival run. This is the one I chose.\n2. **Mono-black Dark Ritual.** Duress, Therapy and Ritual from Moneyball Black, plus Buried Alive, to cast Living Death fast.\n3. **Hermit Druid self-mill.** Uses Hermit Druid to dump the library into the graveyard, with Living Death as the way to bring it back.\n\nI picked BG Survival because Survival lets you discard creatures at will, which fills the graveyard. It also searches up a creature for whatever the situation needs, so the deck still plays well in games where you don't draw Living Death. And Living Death works as a one-sided board wipe against Sligh, Goblins and GW Madness.\n\n**Things to know:**\n- **Living Death odds:** there are only 4 copies, and Survival can't search for a sorcery. You'll have one by turn 5 about 57% of the time, but you'll have something that fills the graveyard 91% of the time.\n- **Squee has no red mana on purpose:** you never cast it. You discard it to Survival over and over, and Living Death brings it back as a free body.\n- **20 lands:** that's one fewer than BG Survival usually runs (about 21). 4 Birds, 3 Wall of Roots and the four cyclers make up for it.\n- **Reanimator and Hermit Druid decks get your Living Death too:** that's why Withered Wretch is in the main deck and Tormod's Crypt is in the sideboard.\n\nThe 15-card sideboard is aimed at the decks the meta search showed: Pernicious Deed, Smother, Engineered Plague, Naturalize, Tormod's Crypt, Diabolic Edict, Spike Feeder and a second Ravenous Baloth.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Living Death"},{"qty":4,"name":"Survival of the Fittest"},{"qty":3,"name":"Buried Alive"},{"qty":4,"name":"Duress"},{"qty":3,"name":"Cabal Therapy"},{"qty":4,"name":"Birds of Paradise"},{"qty":3,"name":"Wall of Roots"},{"qty":2,"name":"Wall of Blossoms"},{"qty":1,"name":"Squee, Goblin Nabob"},{"qty":2,"name":"Krosan Tusker"},{"qty":2,"name":"Twisted Abomination"},{"qty":1,"name":"Symbiotic Wurm"},{"qty":1,"name":"Verdant Force"},{"qty":1,"name":"Ravenous Baloth"},{"qty":1,"name":"Bone Shredder"},{"qty":1,"name":"Genesis"},{"qty":1,"name":"Deranged Hermit"},{"qty":1,"name":"Uktabi Orangutan"},{"qty":1,"name":"Withered Wretch"},{"qty":4,"name":"Llanowar Wastes"},{"qty":8,"name":"Forest"},{"qty":8,"name":"Swamp"}],"side":[{"qty":3,"name":"Pernicious Deed"},{"qty":3,"name":"Smother"},{"qty":2,"name":"Engineered Plague"},{"qty":2,"name":"Naturalize"},{"qty":2,"name":"Tormod's Crypt"},{"qty":1,"name":"Diabolic Edict"},{"qty":1,"name":"Spike Feeder"},{"qty":1,"name":"Ravenous Baloth"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built a Black-Green \"Druid Death\" deck (a brew). You fill your own graveyard with big creatures, then cast Living Death. It brings all of them back at once and kills everything else on the battlefield, including the opponent's creatures. Against the creature decks in the meta (Sligh, Goblins, Elves, GW Madness) it also works as a one-sided board wipe that leaves you with an army.\n\n**The three directions I considered**\n1. **Black-Green with Hermit Druid and Survival (chosen).** It borrows two packages from the menu: Hermit Druid, Survival of the Fittest and Birds of Paradise from Hermit Druid Combo, and the Cabal Therapy/Duress hand attack. Living Death has already shown up in 3 recent BG Survival lists.\n2. **Mono-black with Dark Ritual and Buried Alive.** It would use Reanimator's Putrid Imp, Lotus Petal and Ritual.\n3. **Blue-Black self-mill.** Careful Study and card-draw spells to discard creatures.\n\nI picked the first because green gives you four different ways to fill the graveyard. Hermit Druid, Survival, Buried Alive and Krosan Tusker's cycling all do it, plus Birds to reach 5 mana. The other two directions rely on a narrower set of discard outlets.\n\n**How it plays**\n- **Filling the graveyard:**\n  - **Hermit Druid:** The deck runs only 9 basic lands, so each activation mills a big chunk of the library.\n  - **Survival of the Fittest:** Discard a creature to search for another.\n  - **Buried Alive:** Puts three creatures straight into the graveyard.\n  - **Krosan Tusker:** Cycling it draws a card and finds a basic land, and leaves a 6/5 in the graveyard.\n- **What comes back:**\n  - Visara and Bone Shredder kill creatures when they return.\n  - Deranged Hermit brings four squirrels.\n  - Akroma and Phantom Nishoba are strong against red decks.\n  - Symbiotic Wurm makes seven insects whenever it dies, including when a second Living Death sacrifices it.\n  - Akroma and Nishoba can't realistically be cast from hand. They're only there to come back from the graveyard, which is why I ignored the deck checker's warning about having only 7 white sources.\n- **Finding and protecting Living Death:**\n  - Diabolic Intent can search for it. Sacrifice a Druid or Bird you've already used.\n  - Dark Ritual can make a turn-3 Living Death possible.\n  - Therapy and Duress clear counterspells out of the way first, which matters most against Stiflenought.\n\n**Honest odds:** Without a mulligan, you have about a 61% chance of holding Living Death or a Diabolic Intent by turn 4. You'll almost always have a way to fill the graveyard by then (about 96%), so the real bottleneck is drawing Living Death itself.\n\n**Things to watch for**\n- Living Death also brings back creatures in the opponent's graveyard.\n- The pain lands (Llanowar Wastes, City of Brass) cost life against Sligh.\n- The deck runs 20 lands, slightly below the roughly 21 that BG Survival lists play. Birds, Dark Ritual and Tusker's land search make up the difference.\n\n**Sideboard:** It's aimed at the top decks:\n- Engineered Plague for Goblins and Elves\n- Smother for Dreadnought and small creatures\n- Xantid Swarm against counterspell decks\n- Naturalize and Pernicious Deed for Enchantress and Oath\n- Tormod's Crypt for opposing graveyard decks\n- Uktabi Orangutan to destroy artifacts (Survival can fetch it)\n- A spare Duress","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Birds of Paradise"},{"qty":4,"name":"Hermit Druid"},{"qty":4,"name":"Krosan Tusker"},{"qty":1,"name":"Squee, Goblin Nabob"},{"qty":1,"name":"Bone Shredder"},{"qty":1,"name":"Deranged Hermit"},{"qty":1,"name":"Visara the Dreadful"},{"qty":1,"name":"Symbiotic Wurm"},{"qty":1,"name":"Verdant Force"},{"qty":1,"name":"Akroma, Angel of Wrath"},{"qty":1,"name":"Phantom Nishoba"},{"qty":4,"name":"Survival of the Fittest"},{"qty":3,"name":"Buried Alive"},{"qty":4,"name":"Living Death"},{"qty":2,"name":"Diabolic Intent n**How it plays:** Thrilling Discovery (discard two, draw three), Pursue the Past and Faithless Looting let you throw the Eidolons away as fodder. Then you cast one of 22 multicolored cards, and they come back to your hand. Spirit Mascot, Feisty Spikeling and Skyknight Legionnaire are multicolored creatures, and Manamorphose replaces itself and refunds its own mana, so it's close to a free trigger. Each Eidolon that comes back is a separate card leaving the graveyard, so each one grows the Mascot. The flashback on Pursue the Past, Looting and Prismatic Strands grows it too, and so does casting Lunarch Veteran from the graveyard with disturb. The Eidolons' sacrifice abilities are useful even if you're just looping them. Sandstorm Eidolon stops a blocker. Aurora Eidolon prevents the next 3 damage to any target, which can save Mascot from a Lightning Bolt.\n\n**Three directions I considered:**\n1. A Boros graveyard deck using the flashback and discard cards from Boros Aggro (the Thrilling Discovery deck) and Mono-White Aggro, plus Faithless Looting from the Madness deck.\n2. A Kor Skyfisher artifact shell borrowed from the Synthesizer deck.\n3. A red-heavy deck using red/green hybrid cards like Burning-Tree Emissary from Mono-Red Rally.\n\nI picked the first because its cards already leave the graveyard constantly, which is exactly what Spirit Mascot rewards. I took Manamorphose from the third idea, since red mana can pay its hybrid cost.\n\n**Things to know:**\n- The odds of drawing a Spirit Mascot by turn 4 on the play are about 53%. You'll almost always have a multicolored spell to bring back the Eidolons (98%).\n- The deck has 12 white and 12 red sources. Boros Aggro runs about 16 white, but it's built around white-heavy cards like Battle Screech. Here most two-drops are red/white hybrids, so an even split is better.\n- The Eidolons are 4-mana 2/2s and weak on their own. Their value comes from coming back over and over, so I play 3 of each rather than 4.\n- The sideboard is aimed at the decks winning right now. Red Elemental Blast and Pyroblast are for the blue Terror deck, Faeries and Gates. Dust to Dust is for Affinity. Electrickery is for Elves and Mono-White Aggro. The extra Prismatic Strands are for Madness, the most common deck.\n\n**Main deck (60):**\n- 4 Lunarch Veteran\n- 4 Spirit Mascot\n- 4 Feisty Spikeling\n- 3 Skyknight Legionnaire\n- 3 Aurora Eidolon\n- 3 Sandstorm Eidolon\n- 4 Thrilling Discovery\n- 4 Manamorphose\n- 4 Lightning Bolt\n- 3 Pursue the Past\n- 2 Faithless Looting\n- 2 Journey to Nowhere\n- 2 Prismatic Strands\n- 4 Wind-Scarred Crag\n- 2 Boros Garrison\n- 6 Plains\n- 6 Mountain\n\n**Sideboard (15):**\n- 3 Red Elemental Blast\n- 2 Pyroblast\n- 2 Prismatic Strands\n- 2 Dust to Dust\n- 2 Electrickery\n- 2 Journey to Nowhere\n- 2 Thraben Charm","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Lunarch Veteran"},{"qty":4,"name":"Spirit Mascot"},{"qty":4,"name":"Feisty Spikeling"},{"qty":3,"name":"Skyknight Legionnaire"},{"qty":3,"name":"Aurora Eidolon"},{"qty":3,"name":"Sandstorm Eidolon"},{"qty":4,"name":"Thrilling Discovery"},{"qty":4,"name":"Manamorphose"},{"qty":4,"name":"Lightning Bolt"},{"qty":3,"name":"Pursue the Past"},{"qty":2,"name":"Faithless Looting"},{"qty":2,"name":"Journey to Nowhere"},{"qty":2,"name":"Prismatic Strands"},{"qty":4,"name":"Wind-Scarred Crag"},{"qty":2,"name":"Boros Garrison"},{"qty":6,"name":"Plains"},{"qty":6,"name":"Mountain"}],"side":[{"qty":2,"name":"Prismatic Strands"},{"qty":3,"name":"Red Elemental Blast"},{"qty":2,"name":"Pyroblast"},{"qty":2,"name":"Dust to Dust"},{"qty":2,"name":"Electrickery"},{"qty":2,"name":"Journey to Nowhere"},{"qty":2,"name":"Thraben Charm"}],"mainCount":60,"sideCount":15}}},{"id":"f73a1345606f","prompt":"holdout-standard-mardu-discard","brew":true,"left":{"text":"I built a Rakdos discard aggro brew. It passed check_deck with no errors or warnings, and submit_deck accepted it.\n\n**The plan:** Your three cards fit together through discarding. Iron-Shield Elf discards cards to make itself indestructible. Bloodthorn Flail can be equipped by discarding a card instead of paying {3}, and once it's on, the Elf is a 5/2. Any creature with 4 or more power lets you pay {R} at the start of combat to bring Flamewake Phoenix back from your graveyard. So the Phoenix is a good card to throw away. The rest of the deck either rewards discarding or gives you power 4:\n- **Ultimate Green Goblin:** a 5/4 for 3 that makes you discard every upkeep (you can pitch the Phoenix) and gives you a Treasure.\n- **Scarlet Spider, Kaine:** 2 mana, can be cast again from the graveyard for 1 if you discarded it that turn.\n- **Hobgoblin, Mantled Marauder:** gets +2/+0 each time you discard. Equipping the Flail by discarding before combat makes it a 5/3, which turns the Phoenix's return on.\n- **Inti, Seneschal of the Sun:** turns your discards into extra cards.\n\nFor removal, Burst Lightning, Bitter Triumph and Pumpkin Bombardment all keep the curve low, and the last two can take a discard as their extra cost.\n\n**Directions I considered:**\n1. Rakdos discard aggro built around Ultimate Green Goblin and the other cards you can recast after discarding them.\n2. Rakdos with the Monument to Endurance card-draw package from Lessons.\n3. Mardu, borrowing the Boros Aggro core of Hired Claw and Burst Lightning.\n\nI chose the first because every creature in it either discards for free or reaches 4 power, which is what the Phoenix needs. The Monument plan is too slow for a 2/2 that has to attack every turn, and Hired Claw doesn't use discarding at all. From the other two I only borrowed what fit: Burst Lightning, Bitter Triumph and the 22-land count, which matches Boros Aggro's average of 22.1.\n\n**Honest odds:** You'll have at least one card that discards or rewards discarding by turn 3 about 98% of the time. But you'll only have a Flail in hand by turn 3 about 49% of the time, so the Elf-and-Flail combo is just one of several
