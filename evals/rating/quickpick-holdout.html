n**How it plays:** Thrilling Discovery (discard two, draw three), Pursue the Past and Faithless Looting let you throw the Eidolons away as fodder. Then you cast one of 22 multicolored cards, and they come back to your hand. Spirit Mascot, Feisty Spikeling and Skyknight Legionnaire are multicolored creatures, and Manamorphose replaces itself and refunds its own mana, so it's close to a free trigger. Each Eidolon that comes back is a separate card leaving the graveyard, so each one grows the Mascot. The flashback on Pursue the Past, Looting and Prismatic Strands grows it too, and so does casting Lunarch Veteran from the graveyard with disturb. The Eidolons' sacrifice abilities are useful even if you're just looping them. Sandstorm Eidolon stops a blocker. Aurora Eidolon prevents the next 3 damage to any target, which can save Mascot from a Lightning Bolt.\n\n**Three directions I considered:**\n1. A Boros graveyard deck using the flashback and discard cards from Boros Aggro (the Thrilling Discovery deck) and Mono-White Aggro, plus Faithless Looting from the Madness deck.\n2. A Kor Skyfisher artifact shell borrowed from the Synthesizer deck.\n3. A red-heavy deck using red/green hybrid cards like Burning-Tree Emissary from Mono-Red Rally.\n\nI picked the first because its cards already leave the graveyard constantly, which is exactly what Spirit Mascot rewards. I took Manamorphose from the third idea, since red mana can pay its hybrid cost.\n\n**Things to know:**\n- The odds of drawing a Spirit Mascot by turn 4 on the play are about 53%. You'll almost always have a multicolored spell to bring back the Eidolons (98%).\n- The deck has 12 white and 12 red sources. Boros Aggro runs about 16 white, but it's built around white-heavy cards like Battle Screech. Here most two-drops are red/white hybrids, so an even split is better.\n- The Eidolons are 4-mana 2/2s and weak on their own. Their value comes from coming back over and over, so I play 3 of each rather than 4.\n- The sideboard is aimed at the decks winning right now. Red Elemental Blast and Pyroblast are for the blue Terror deck, Faeries and Gates. Dust to Dust is for Affinity. Electrickery is for Elves and Mono-White Aggro. The extra Prismatic Strands are for Madness, the most common deck.\n\n**Main deck (60):**\n- 4 Lunarch Veteran\n- 4 Spirit Mascot\n- 4 Feisty Spikeling\n- 3 Skyknight Legionnaire\n- 3 Aurora Eidolon\n- 3 Sandstorm Eidolon\n- 4 Thrilling Discovery\n- 4 Manamorphose\n- 4 Lightning Bolt\n- 3 Pursue the Past\n- 2 Faithless Looting\n- 2 Journey to Nowhere\n- 2 Prismatic Strands\n- 4 Wind-Scarred Crag\n- 2 Boros Garrison\n- 6 Plains\n- 6 Mountain\n\n**Sideboard (15):**\n- 3 Red Elemental Blast\n- 2 Pyroblast\n- 2 Prismatic Strands\n- 2 Dust to Dust\n- 2 Electrickery\n- 2 Journey to Nowhere\n- 2 Thraben Charm","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Lunarch Veteran"},{"qty":4,"name":"Spirit Mascot"},{"qty":4,"name":"Feisty Spikeling"},{"qty":3,"name":"Skyknight Legionnaire"},{"qty":3,"name":"Aurora Eidolon"},{"qty":3,"name":"Sandstorm Eidolon"},{"qty":4,"name":"Thrilling Discovery"},{"qty":4,"name":"Manamorphose"},{"qty":4,"name":"Lightning Bolt"},{"qty":3,"name":"Pursue the Past"},{"qty":2,"name":"Faithless Looting"},{"qty":2,"name":"Journey to Nowhere"},{"qty":2,"name":"Prismatic Strands"},{"qty":4,"name":"Wind-Scarred Crag"},{"qty":2,"name":"Boros Garrison"},{"qty":6,"name":"Plains"},{"qty":6,"name":"Mountain"}],"side":[{"qty":2,"name":"Prismatic Strands"},{"qty":3,"name":"Red Elemental Blast"},{"qty":2,"name":"Pyroblast"},{"qty":2,"name":"Dust to Dust"},{"qty":2,"name":"Electrickery"},{"qty":2,"name":"Journey to Nowhere"},{"qty":2,"name":"Thraben Charm"}],"mainCount":60,"sideCount":15}}},{"id":"f73a1345606f","prompt":"holdout-standard-mardu-discard","brew":true,"left":{"text":"I built a Rakdos discard aggro brew. It passed check_deck with no errors or warnings, and submit_deck accepted it.\n\n**The plan:** Your three cards fit together through discarding. Iron-Shield Elf discards cards to make itself indestructible. Bloodthorn Flail can be equipped by discarding a card instead of paying {3}, and once it's on, the Elf is a 5/2. Any creature with 4 or more power lets you pay {R} at the start of combat to bring Flamewake Phoenix back from your graveyard. So the Phoenix is a good card to throw away. The rest of the deck either rewards discarding or gives you power 4:\n- **Ultimate Green Goblin:** a 5/4 for 3 that makes you discard every upkeep (you can pitch the Phoenix) and gives you a Treasure.\n- **Scarlet Spider, Kaine:** 2 mana, can be cast again from the graveyard for 1 if you discarded it that turn.\n- **Hobgoblin, Mantled Marauder:** gets +2/+0 each time you discard. Equipping the Flail by discarding before combat makes it a 5/3, which turns the Phoenix's return on.\n- **Inti, Seneschal of the Sun:** turns your discards into extra cards.\n\nFor removal, Burst Lightning, Bitter Triumph and Pumpkin Bombardment all keep the curve low, and the last two can take a discard as their extra cost.\n\n**Directions I considered:**\n1. Rakdos discard aggro built around Ultimate Green Goblin and the other cards you can recast after discarding them.\n2. Rakdos with the Monument to Endurance card-draw package from Lessons.\n3. Mardu, borrowing the Boros Aggro core of Hired Claw and Burst Lightning.\n\nI chose the first because every creature in it either discards for free or reaches 4 power, which is what the Phoenix needs. The Monument plan is too slow for a 2/2 that has to attack every turn, and Hired Claw doesn't use discarding at all. From the other two I only borrowed what fit: Burst Lightning, Bitter Triumph and the 22-land count, which matches Boros Aggro's average of 22.1.\n\n**Honest odds:** You'll have at least one card that discards or rewards discarding by turn 3 about 98% of the time. But you'll only have a Flail in hand by turn 3 about 49% of the time, so the Elf-and-Flail combo is just one of several ways the deck turns the Phoenix back on.\n\nThe sideboard is aimed at the most-played decks:\n- **Control decks (Jeskai, Lessons):** Duress and Thought-Stalker Warlock.\n- **Creature decks (Ouroboroid, Landfall):** Electro's Bolt, which you can also cast from the graveyard after discarding it.\n- **Izzet and Boros aggro:** Sandman's Quicksand, which only shrinks their creatures when cast from the graveyard, and Shock.\n- **Reanimator:** Soul-Guide Lantern.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Iron-Shield Elf"},{"qty":4,"name":"Scarlet Spider, Kaine"},{"qty":4,"name":"Hobgoblin, Mantled Marauder"},{"qty":4,"name":"Inti, Seneschal of the Sun"},{"qty":4,"name":"Flamewake Phoenix"},{"qty":4,"name":"Ultimate Green Goblin"},{"qty":4,"name":"Bloodthorn Flail"},{"qty":4,"name":"Burst Lightning"},{"qty":4,"name":"Bitter Triumph"},{"qty":2,"name":"Pumpkin Bombardment"},{"qty":4,"name":"Blood Crypt"},{"qty":4,"name":"Haunted Ridge"},{"qty":2,"name":"Raucous Theater"},{"qty":7,"name":"Mountain"},{"qty":5,"name":"Swamp"}],"side":[{"qty":3,"name":"Duress"},{"qty":2,"name":"Thought-Stalker Warlock"},{"qty":2,"name":"Electro's Bolt"},{"qty":2,"name":"Sandman's Quicksand"},{"qty":2,"name":"Soul-Guide Lantern"},{"qty":2,"name":"Shock"},{"qty":2,"name":"The Death of Gwen Stacy"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built this as **Rakdos Discard Aggro**, a brew. None of your three cards shows up in recent results: Iron-Shield Elf appears in 0 lists, and Bloodthorn Flail and Flamewake Phoenix in 1 list each.\n\n**Main deck (60)**\n- 4 Marauding Mako\n- 4 Iron-Shield Elf\n- 4 Sunset Saboteur\n- 3 Inti, Seneschal of the Sun\n- 4 Fear of Missing Out\n- 4 Flamewake Phoenix\n- 2 Ultimate Green Goblin\n- 4 Bloodthorn Flail\n- 4 Burst Lightning\n- 3 Bitter Triumph\n- 2 Lightning Strike\n- 4 Blood Crypt\n- 4 Blazemire Verge\n- 3 Haunted Ridge\n- 6 Mountain\n- 5 Swamp\n\n**Sideboard (15)**\n- 3 Duress\n- 2 Thought-Stalker Warlock\n- 2 Soul-Guide Lantern\n- 2 Abrade\n- 2 Heartless Act\n- 2 Nowhere to Run\n- 2 Shock\n\n**The plan**\nThis is a fast deck that turns discarding into an advantage. Discarding throws Flamewake Phoenix into the graveyard, grows your creatures and draws you cards. Big creatures (power 4 or more) then let you pay {R} at the start of combat to bring the Phoenix back. Its ability is called Ferocious. The deck curves out low (average mana value 1.84) and finishes with burn.\n\n**Why these cards**\n- **Your three cards fit together.** Bloodthorn Flail costs {B}, and you can equip it by discarding a card instead of paying {3}. On a 3/1 Iron-Shield Elf it makes a 5/2. That alone turns on the Phoenix. The Elf's own \"discard: indestructible\" ability is a second discard outlet, so your extra Phoenixes become value, not dead cards.\n- **Sunset Saboteur:** a 4/1 menace for 2, so it turns on the Phoenix by itself. Its ward (\"discard a card\") protects it.\n- **Ultimate Green Goblin:** a 5/4 for 3 that also makes you discard every upkeep. That fills the graveyard, makes a Treasure, and triggers the other discard cards.\n- **Marauding Mako:** gets a +1/+1 counter for every card you discard, so it often reaches 4 power on its own.\n- **Inti:** each attack can turn a discard into a +1/+1 counter. Each discard also exiles your top card, and you can play it until your next end step, which refuels you after the Flail and the Elf eat your hand.\n- **Fear of Missing Out:** looting on a 2-drop: you discard a card, then draw one. Pitching a Phoenix here is the ideal play.\n- **Removal:** Bitter Triumph can be paid for with a discard instead of 3 life. Burst Lightning and Lightning Strike clear blockers or finish the game.\n- **The odds:** you have a 4-power enabler (Saboteur, Green Goblin or Flail) by turn 4 86% of the time on the play. Seeing an enabler and a Phoenix together by then is 45%. The loot effects push that number up in practice.\n\n**Mana**\nNo proven Rakdos list exists, so I borrowed the land count from Izzet Aggro and set it to 22. That's slightly under Izzet's 24 average, which fits this deck's lower curve. The checker recommended 22.4. You get 17 red sources for the Phoenix's {1}{R}{R} and 16 black. Blazemire Verge makes red off any Mountain or Blood Crypt, and Haunted Ridge enters untapped from your third land onward.\n\n**Sideboarding**\n- **Simic Ouroboroid (18%) and Landfall:** bring in Heartless Act, which removes up to three counters from the creatures Ouroboroid pumps, plus Nowhere to Run and Shock. Take out Lightning Strike and 1–2 Mako.\n- **Jeskai Control and Dimir Midrange:** bring in Duress and Thought-Stalker Warlock. Take out Lightning Strike and 1 Bitter Triumph. Your recursive Phoenix and the indestructible Elf already hold up well against removal.\n- **Lessons and Reanimator:** bring in 2 Soul-Guide Lantern and Duress.\n- **Izzet Aggro and Boros Aggro:** bring in Abrade and Shock. Take out Duress-style slow cards and a Flail or two. Be careful: Fire Magic and Pyroclasm in their sideboards kill your 1-toughness creatures.\n\n**What I couldn't verify**\n- No one has played this as a full deck, so the matchup advice is my reasoning, not results.\n- Ultimate Green Goblin and Haunted Ridge show 0 recent lists.\n- The upkeep discard from Green Goblin can hurt when your hand is empty. That's why I'm only running two copies.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Marauding Mako"},{"qty":4,"name":"Iron-Shield Elf"},{"qty":4,"name":"Sunset Saboteur"},{"qty":3,"name":"Inti, Seneschal of the Sun"},{"qty":4,"name":"Fear of Missing Out"},{"qty":4,"name":"Flamewake Phoenix"},{"qty":2,"name":"Ultimate Green Goblin"},{"qty":4,"name":"Bloodthorn Flail"},{"qty":4,"name":"Burst Lightning"},{"qty":3,"name":"Bitter Triumph"},{"qty":2,"name":"Lightning Strike"},{"qty":4,"name":"Blood Crypt"},{"qty":4,"name":"Blazemire Verge"},{"qty":3,"name":"Haunted Ridge"},{"qty":6,"name":"Mountain"},{"qty":5,"name":"Swamp"}],"side":[{"qty":3,"name":"Duress"},{"qty":2,"name":"Thought-Stalker Warlock"},{"qty":2,"name":"Soul-Guide Lantern"},{"qty":2,"name":"Abrade"},{"qty":2,"name":"Heartless Act"},{"qty":2,"name":"Nowhere to Run"},{"qty":2,"name":"Shock"}],"mainCount":60,"sideCount":15}}}]}</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const picks = new Map();
  let db = null;
  let canWrite = false;
  let current = 0;
  let chain = Promise.resolve();
  let advanceTimer = null;
  const brewsOnly = document.getElementById("brewsOnly");
  const unjudgedOnly = document.getElementById("unjudgedOnly");

  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
    }
    for (const kid of kids) if (kid) n.append(kid);
    return n;
  };
  const judged = (id) => Boolean(picks.get(id) && picks.get(id).winner);
  const inView = (i) => (!brewsOnly.checked || DATA.pairs[i].brew) && (!unjudgedOnly.checked || !judged(DATA.pairs[i].id) || i === current);

  /** Card -> copies across main, side and commander. */
  function counts(deck) {
    const m = new Map();
    if (!deck) return m;
    for (const zone of ["commander", "main", "side"]) {
      for (const c of deck[zone] || []) {
        const k = (zone === "side" ? "SB: " : "") + c.name;
        m.set(k, (m.get(k) || 0) + c.qty);
      }
    }
    return m;
  }
  function diff(a, b) {
    const onlyA = [];
    const onlyB = [];
    const both = [];
    for (const k of new Set([...a.keys(), ...b.keys()])) {
      const x = a.get(k) || 0;
      const y = b.get(k) || 0;
      const shared = Math.min(x, y);
      if (shared) both.push(`${shared} ${k}`);
      if (x > shared) onlyA.push(`${x - shared} ${k}`);
      if (y > shared) onlyB.push(`${y - shared} ${k}`);
    }
    const byMain = (s) => (s.includes("SB: ") ? 1 : 0);
    const sort = (xs) => xs.sort((p, q) => byMain(p) - byMain(q) || p.replace(/^\d+ /, "").localeCompare(q.replace(/^\d+ /, "")));
    return { onlyA: sort(onlyA), onlyB: sort(onlyB), both: sort(both) };
  }
  /** The reply's opening: its first two sentences, where answers put the plan. */
  function opening(text) {
    if (!text) return "";
    const clean = text.replace(/\*\*/g, "").replace(/\s+/g, " ").trim();
    const parts = clean.match(/[^.!?]+[.!?]+/g) || [clean];
    const out = parts.slice(0, 2).join(" ").trim();
    return out.length > 360 ? out.slice(0, 357) + "…" : out;
  }

  function renderProgress() {
    const pool = DATA.pairs.filter((p) => !brewsOnly.checked || p.brew);
    const done = pool.filter((p) => judged(p.id)).length;
    document.getElementById("progress").replaceChildren(el("b", { text: `${done} of ${pool.length}` }), brewsOnly.checked ? " brew pairs judged" : " pairs judged");
  }

  function save(patch, advance) {
    if (!db || !canWrite) return;
    const p = DATA.pairs[current];
    const body = { ...(picks.get(p.id) || {}), ...patch, pair: p.id, prompt: p.prompt, quick: true, updatedAt: new Date().toISOString() };
    picks.set(p.id, body);
    sync();
    renderProgress();
    const status = document.getElementById("saved");
    status.textContent = "Saving…";
    chain = chain
      .then(() => db.collection("pairs").doc(p.id).set(body))
      .then(() => { status.textContent = advance ? "Saved. Next pair in a moment (change your mind with Previous)." : "Saved"; })
      .catch((e) => { status.textContent = e && e.code === "invalid_argument" ? "Only the owner can save picks on this page." : "Could not save. Try again in a moment."; });
    if (advance) {
      clearTimeout(advanceTimer);
      advanceTimer = setTimeout(() => go(1), 900);
    }
  }

  /** The whole list, by zone; lines with more copies than the other deck are highlighted. */
  function fullList(deck, other) {
    const d = el("details", { class: "full", open: "" }, el("summary", { text: "Full decklist" }));
    const theirs = counts(other);
    for (const [zone, label] of [["commander", "Commander"], ["main", "Main"], ["side", "Sideboard"]]) {
      const lines = deck[zone] || [];
      if (!lines.length) continue;
      const total = lines.reduce((n, c) => n + c.qty, 0);
      const ul = el("ul");
      for (const c of lines) {
        const k = (zone === "side" ? "SB: " : "") + c.name;
        ul.append(el("li", { class: c.qty > (theirs.get(k) || 0) ? "uniq" : null, text: `${c.qty} ${c.name}` }));
      }
      d.append(el("h4", { text: `${label} (${total})` }), ul);
    }
    return d;
  }

  function side(letter, ans, only, other) {
    const box = el("article", { class: "side" });
    box.append(el("div", { class: "side-head" }, el("span", { class: "letter", text: letter }), ans.deck ? null : el("span", { class: "fmt", text: "No deck" })));
    if (ans.text) box.append(el("p", { class: "lead", text: opening(ans.text) }));
    const o = el("div", { class: "only" }, el("h3", { text: `Only in ${letter}` }));
    o.append(only.length ? el("pre", { text: only.join("\n") }) : el("p", { class: "none", text: "Nothing: every card is also in the other deck." }));
    box.append(o);
    if (ans.deck) box.append(fullList(ans.deck, other));
    if (ans.text) {
      const d = el("details", {}, el("summary", { text: "Full reply" }));
      d.append(el("div", { class: "reply", text: ans.text }));
      box.append(d);
    }
    return box;
  }

  function sync() {
    const s = picks.get(DATA.pairs[current].id) || {};
    for (const b of document.querySelectorAll("#picks button")) {
      b.setAttribute("aria-pressed", String(s.winner === b.dataset.w));
      b.disabled = !canWrite;
    }
    for (const b of document.querySelectorAll("#why button")) {
      b.setAttribute("aria-pressed", String((s.reasons || []).includes(b.dataset.r)));
      b.disabled = !canWrite;
    }
  }

  function render() {
    const p = DATA.pairs[current];
    const pr = DATA.prompts[p.prompt];
    const first = pr.prompt.split("\n")[0];
    const req = [el("span", { class: "fmt", text: pr.format }), el("p", { class: "prompt", text: first })];
    if (pr.prompt.includes("\n") && pr.prompt.length > 220) {
      const d = el("details", {}, el("summary", { text: "Show the pasted list" }));
      d.append(el("div", { class: "reply", text: pr.prompt.slice(first.length).trim() }));
      req.push(d);
    }
    document.getElementById("request").replaceChildren(...req);
    const d = diff(counts(p.left.deck), counts(p.right.deck));
    document.getElementById("duel").replaceChildren(side("A", p.left, d.onlyA, p.right.deck), side("B", p.right, d.onlyB, p.left.deck));
    const shared = document.getElementById("shared");
    shared.replaceChildren(el("summary", { text: `Both decks play ${d.both.length} of the same card lines` }), el("pre", { text: d.both.join("\n") || "None" }));
    shared.open = false;
    document.getElementById("saved").textContent = "";
    document.getElementById("prev").disabled = !DATA.pairs.some((_, i) => i < current && inView(i));
    document.getElementById("next").disabled = !DATA.pairs.some((_, i) => i > current && inView(i));
    sync();
    renderProgress();
  }

  function go(dir) {
    let i = current + dir;
    while (i >= 0 && i < DATA.pairs.length && !inView(i)) i += dir;
    if (i < 0 || i >= DATA.pairs.length) {
      if (dir > 0) document.getElementById("saved").textContent = "That was the last one in this view. Thank you!";
      return;
    }
    current = i;
    try { localStorage.setItem("quick-pair", String(current)); } catch (e) {}
    render();
    window.scrollTo(0, 0);
  }
  function jumpToFirst() {
    const i = DATA.pairs.findIndex((_, j) => (!brewsOnly.checked || DATA.pairs[j].brew) && (!unjudgedOnly.checked || !judged(DATA.pairs[j].id)));
    if (i >= 0) { current = i; render(); }
  }

  document.getElementById("prev").addEventListener("click", () => go(-1));
  document.getElementById("next").addEventListener("click", () => go(1));
  brewsOnly.addEventListener("change", jumpToFirst);
  unjudgedOnly.addEventListener("change", jumpToFirst);
  for (const b of document.querySelectorAll("#picks button")) b.addEventListener("click", () => save({ winner: b.dataset.w }, true));
  for (const b of document.querySelectorAll("#why button")) {
    b.addEventListener("click", () => {
      clearTimeout(advanceTimer);
      const s = picks.get(DATA.pairs[current].id) || {};
      const set = new Set(s.reasons || []);
      set.has(b.dataset.r) ? set.delete(b.dataset.r) : set.add(b.dataset.r);
      save({ reasons: [...set] }, false);
    });
  }
  document.addEventListener("keydown", (e) => {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    const map = { "1": "A", "2": "tie", "3": "B" };
    if (map[e.key] && canWrite) save({ winner: map[e.key] }, true);
    if (e.key === "ArrowRight") go(1);
    if (e.key === "ArrowLeft") go(-1);
  });

  try { current = Math.min(Number(localStorage.getItem("quick-pair") || 0), DATA.pairs.length - 1) || 0; } catch (e) {}
  render();

  (async () => {
    const notice = document.getElementById("notice");
    const claude = window.claude;
    const dbNs = claude && claude.use ? await claude.use("db") : null;
    const user = claude && claude.use ? await claude.use("user") : null;
    if (!dbNs) { notice.textContent = "Picks save only when this page is open on claude.ai and you're signed in."; return; }
    db = dbNs;
    canWrite = user ? (user.isOwner() ?? false) : false;
    let first = true;
    db.collection("pairs").onSnapshot(
      (snap) => {
        picks.clear();
        for (const d of snap.docs) picks.set(d.id, d.data());
        if (first) {
          first = false;
          notice.textContent = canWrite
            ? "The cards that differ are at the top; full lists are below, with those cards highlighted. Press 1, 2 or 3 (or click) and it moves on. The opening two sentences of each reply say what the deck is going for."
            : "Read-only: only the page owner can judge.";
          jumpToFirst();
          return;
        }
        sync();
        renderProgress();
      },
      () => { notice.textContent = "Saved picks could not be loaded. Reload the page to try again."; },
    );
  })();
})();
</script>
