 deviation of about 2. The simulator isn't useful for this deck. It reported a 60.2% mulligan rate and 98.4% \"screw\", and it gave identical figures for the real Dredge list. That is because it only counts lands and Dredge doesn't cast spells off lands. I'm not citing those numbers as real consistency. In practice you keep hands with Bazaar, or with a cycler such as Serum Powder or a free spell, and plenty of dredgers. `check_deck` passed the 60-card main with no errors.\n\n**Sideboard (15):** 4 Force of Vigor, 4 Sickening Shoal, 3 Force of Negation, 3 Wasteland, 1 Strip Mine.\n- **Against graveyard hate:** this is the deck's main weak spot. Bring in Force of Vigor and Force of Negation. Against Leyline of the Void, Rest in Peace and Containment Priest, Force of Vigor is the key card. It is free, and the Mono-White Initiative list I looked at sideboards those cards. Take out Chalice and the weaker creatures.\n- **Against Lurrus Control and Paradoxical Outcome:** they are fast and carry free counters. Keep the Grief and counter suite. Sickening Shoal is free removal for their small creatures, and Wasteland and Strip Mine can be strong against Workshop and utility lands. This is judgment, not tested.\n- **Against Workshop decks (Shops):** Chalice is already in the main. Wasteland and Strip Mine are probably better against their lands than against Bazaar-based Dredge, but I haven't measured this.\n- **Against Oath and Tinker:** they are slow to interact with the graveyard. Keep the Forces and cut the narrower sideboard cards. This is judgment, not tested.\n\n**Unverified.** I did not look up card text with `card_info`. The deck's list, the sideboard plan and the matchup advice come from the reference list and archetype data, plus my own judgment. I did not measure matchup win rates.","error":false,"deck":{"commander":[],"main":[{"qty":1,"name":"Chalice of the Void"},{"qty":4,"name":"Serum Powder"},{"qty":1,"name":"Golgari Grave-Troll"},{"qty":4,"name":"Golgari Thug"},{"qty":4,"name":"Grief"},{"qty":4,"name":"Hollow One"},{"qty":4,"name":"Ichorid"},{"qty":4,"name":"Narcomoeba"},{"qty":4,"name":"Prized Amalgam"},{"qty":4,"name":"Shambling Shell"},{"qty":4,"name":"Silversmote Ghoul"},{"qty":4,"name":"Stinkweed Imp"},{"qty":1,"name":"Force of Negation"},{"qty":4,"name":"Force of Will"},{"qty":1,"name":"Mental Misstep"},{"qty":4,"name":"Noxious Revival"},{"qty":4,"name":"Bazaar of Baghdad"},{"qty":4,"name":"Creeping Chill"}],"side":[{"qty":3,"name":"Force of Negation"},{"qty":4,"name":"Force of Vigor"},{"qty":4,"name":"Sickening Shoal"},{"qty":1,"name":"Strip Mine"},{"qty":3,"name":"Wasteland"}],"mainCount":60,"sideCount":15}}},{"id":"f0ff791b81bc","prompt":"fresh-premodern-mono-red-prison","brew":true,"left":{"text":"Yes, you can build it. One thing surprised me: **Blood Moon is legal in Premodern**, yet the results data shows it in 0 lists over the last 90 days. I built around it.\n\n**Mono-Red Prison (Premodern), a brew**\n\n```\nLands (22)\n4 Ancient Tomb\n4 City of Traitors\n14 Mountain\n\nLock pieces (12)\n4 Sphere of Resistance\n4 Blood Moon\n4 Tangle Wire\n\nOther artifacts (8)\n4 Mind Stone\n2 Black Vise\n2 Cursed Scroll\n\nCreatures (10)\n4 Masticore\n2 Karn, Silver Golem\n3 Flametongue Kavu\n1 Covetous Dragon\n\nBurn (8)\n4 Lightning Bolt\n2 Incinerate\n2 Earthquake\n\nSideboard (15)\n4 Pyroblast\n3 Pyrostatic Pillar\n2 Anarchy\n2 Ensnaring Bridge\n2 Pyroclasm\n2 Tormod's Crypt\n```\n\n**The plan**\nAncient Tomb and City of Traitors each make two mana, so they put a lock piece down on turn 1 or 2. Sphere of Resistance makes every spell cost {1} more. Blood Moon turns all nonbasic lands into Mountains. Tangle Wire forces each player to tap permanents during their upkeep. While the opponent is stuck, big colorless threats and burn finish them.\n\n**Why these cards**\n- **Blood Moon:** It wrecks the decks that rely on nonbasic lands. Every Enchantress list plays 4 Serra's Sanctum and 4 Brushland. It also hits Terrageddon and Oath Ponza, which lean on Wasteland, Rishadan Port and Treetop Village. It turns our own Tomb and City into Mountains too, but that helps: by then they've done their job, and Tomb stops dealing damage while City stops being sacrificed.\n- **Sphere of Resistance:** Stiflenought is a mono-blue deck with about 16 Islands, so Blood Moon does nothing there. Its game is cheap spells (Opt, Portent, Stifle, Daze, Gush), and Sphere taxes all of them.\n- **Tangle Wire:** Our Spheres, Black Vises and Mind Stones can be tapped to pay its cost. Sphere works the same whether tapped or not, so the Wire costs us little.\n- **Black Vise and Cursed Scroll:** Opponents locked under Sphere end up with full hands, which Black Vise punishes. Our own hand empties fast, which is what makes Cursed Scroll work.\n- **Threats:** Masticore and Karn are colorless, so the two-mana lands pay for them. Flametongue Kavu is a body plus removal. Covetous Dragon is a 6/5 flier, and all our artifacts keep it on the battlefield.\n\n**The mana**\nThe deck has 22 lands plus 4 Mind Stone, and 8 of those lands make two mana. check_deck flagged that Mono-Red Land Destruction runs about 26 lands. Those lists count Port, Wasteland and Factory as utility lands, though, so 22 lands plus 4 Mind Stone (26 mana sources) is comparable. There are 14 red sources, and every land becomes a red source once Blood Moon is out. Odds:\n- 85% to see a lock piece by turn 2 (on the play)\n- 71% to see Tomb or City by turn 2\n- 59% to have both\n- 89% to see a lock piece by turn 3\n\n**Sideboarding**\n- **Stiflenought, Psychatog, Standstill:** Bring in 4 Pyroblast. Take out Blood Moon against mono-blue and Earthquake. Watch out for Powder Keg, which shows up in about 24% of recent lists and can wipe our Spheres.\n- **Enchantress:** Bring in 3 Pyrostatic Pillar, 2 Anarchy (kills Solitary Confinement, Parallax Wave and Seal of Cleansing) and Tormod's Crypt (against Replenish). Take out Earthquake and Incinerate.\n- **Sligh and Goblins:** Bring in Ensnaring Bridge and Pyroclasm. Take out Black Vise, plus Blood Moon against mostly-basic mana.\n- **Hermit Druid and Replenish:** Bring in Tormod's Crypt and Pillar.\n- **Terrageddon:** Keep Moon. Flametongue Kavu and Bolt handle Terravore.\n\n**Label:** This is a brew. No mono-red prison list shows up in recent results. I took the mono-red mana base idea from Mono-Red Land Destruction and the fast mana and artifacts from Welder Prison.\n\n**What I couldn't verify**\n- How it actually performs against the field. Blood Moon and Covetous Dragon have no recent results at all.\n- One risk worth knowing: Cursed Totem (in about 9% of recent lists, mostly Terrageddon) shuts off Masticore's abilities.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Ancient Tomb"},{"qty":4,"name":"City of Traitors"},{"qty":14,"name":"Mountain"},{"qty":4,"name":"Sphere of Resistance"},{"qty":4,"name":"Blood Moon"},{"qty":4,"name":"Tangle Wire"},{"qty":4,"name":"Mind Stone"},{"qty":2,"name":"Black Vise"},{"qty":2,"name":"Cursed Scroll"},{"qty":4,"name":"Masticore"},{"qty":2,"name":"Karn, Silver Golem"},{"qty":3,"name":"Flametongue Kavu"},{"qty":1,"name":"Covetous Dragon"},{"qty":4,"name":"Lightning Bolt"},{"qty":2,"name":"Incinerate"},{"qty":2,"name":"Earthquake"}],"side":[{"qty":4,"name":"Pyroblast"},{"qty":3,"name":"Pyrostatic Pillar"},{"qty":2,"name":"Anarchy"},{"qty":2,"name":"Ensnaring Bridge"},{"qty":2,"name":"Pyroclasm"},{"qty":2,"name":"Tormod's Crypt"}],"mainCount":60,"sideCount":15}},"right":{"text":"There's a \"Mono-Red Land Destruction\" strategy in the results. Let me pull it.\n\nI built you a mono-red prison deck. No \"Mono Red Prison\" or \"Ponza\" archetype shows up under those names in the last 30 days of Premodern results, but the card data shows a **Mono-Red Land Destruction** archetype that does exactly what you asked for. I used its latest top list without changes, a 5-0 Premodern League finish from 2026-10-01. It's a small archetype, with only 7 lists in the data, and it isn't one of the 20 biggest strategies in the meta.\n\n**The plan**\nDestroy or tap down the opponent's lands so they can't cast spells, and punish the cards stuck in their hand with Black Vise. Burn handles their creatures, and cheap threats and creature lands (Mishra's Factory, Ghitu Encampment, Barbarian Ring) finish the game. All your bounce-back comes from Mountains and colorless lands, while they're stuck on one or two lands.\n\n**Main deck (60)**\n- 4 Stone Rain, 3 Pillage, 4 Avalanche Riders, 1 Dwarven Miner\n- 3 Black Vise, 1 Cursed Scroll, 2 Phyrexian Furnace\n- 4 Mogg Fanatic, 2 Grim Lavamancer\n- 4 Lightning Bolt, 2 Incinerate, 2 Firebolt, 2 Earthquake\n- 11 Mountain, 4 Wasteland, 4 Rishadan Port, 4 Mishra's Factory, 2 Ghitu Encampment, 1 Barbarian Ring\n\n**Sideboard (15)**\n- 4 Overload, 4 Red Elemental Blast, 2 Pyroblast, 2 Anarchy, 2 Aftershock, 1 Tormod's Crypt\n\n**Why these cards**\n- **Stone Rain and Pillage:** your main 3-mana land destruction. Pillage (\"destroy target artifact or land\") can also hit artifacts.\n- **Avalanche Riders:** has haste and destroys a land when it enters, so it attacks and destroys a land the same turn.\n- **Wasteland, Rishadan Port and Dwarven Miner:** they destroy or tap lands from your land slots, so the lock starts on turns 1–2.\n- **Black Vise:** deals damage each upkeep equal to the cards in their hand minus 4. That's the payoff for keeping them from casting their spells.\n- **Burn, Mogg Fanatic and Lavamancer:** they clear early creatures so the lock doesn't get attacked down.\n- **Phyrexian Furnace:** graveyard hate that also draws a card.\n\n**Mana (5,000 simulated games)**\n- **Lands:** 26, matching the real lists (average 26.3). Average mana value of the spells is 1.85.\n- **Red sources:** 14.\n- **Mulligans and land drops:** 12.8% of hands mulligan. You make every land drop through turn 4 in 77.3% of games; mana screw is 5.3% and flood is 5.9%. You have about 2.9 lands in play on turn 3.\n- **Red mana:** you have the red you need 80.8% of the time on turn 3, and 86–92% from turn 4 on. The dip comes from 12 colorless lands (Port, Wasteland, Factory). Lead with Mountains when you have a choice.\n- **Draw odds (on the play):** 70% to have Stone Rain or Pillage by turn 3. 97.6% to have some land-attack card by turn 3 (any of the 19 Stone Rains, Pillages, Wastelands, Ports or Riders). Riders cost 4, so they're usually a turn-4 play.\n\n**Sideboarding against the current top decks** (meta shares are measured; the swaps are my judgment)\n- **Enchantress (12.5%) and Terrageddon (11.2%):** bring in Anarchy, which destroys all white permanents, plus Overload and Aftershock for key artifacts. Your Wastelands and Ports are good here.\n- **Stiflenought (10.4%) and UB Psychatog (4.8%):** bring in Red Elemental Blast and Pyroblast against their blue spells, and Overload for small artifacts. Take out Black Vise against Stiflenought and Earthquake against Psychatog.\n- **Sligh (9.9%) and Goblins (4.4%):** Black Vise is weak because they empty their hands quickly, so cut it. Keep all the burn and Earthquake, and add Overload for their cheap artifacts.\n- **Hermit Druid Combo (5.5%) and Replenish (4.8%):** bring in Tormod's Crypt and keep both Furnaces. Land destruction is your main way to slow them down.\n\n**Label:** stock. It's the Mono-Red Land Destruction reference list unchanged, and it passed the deck check with no errors or warnings.\n\n**Not verified**\n- The deck is legal and its mana matches the real lists, but 7 lists is a small sample. I can't tell you how well it does against the field, because no tool measured win rates.\n- I didn't look up Pyroblast's card text or the mana values of the opponents' key artifacts (for example, Stiflenought's Phyrexian Dreadnought). Whether unkicked Overload kills Dreadnought is my assumption, not checked.","error":false,"deck":{"commander":[],"main":[{"qty":3,"name":"Black Vise"},{"qty":1,"name":"Cursed Scroll"},{"qty":2,"name":"Phyrexian Furnace"},{"qty":4,"name":"Avalanche Riders"},{"qty":1,"name":"Dwarven Miner"},{"qty":2,"name":"Grim Lavamancer"},{"qty":4,"name":"Mogg Fanatic"},{"qty":2,"name":"Incinerate"},{"qty":4,"name":"Lightning Bolt"},{"qty":1,"name":"Barbarian Ring"},{"qty":2,"name":"Ghitu Encampment"},{"qty":4,"name":"Mishra's Factory"},{"qty":11,"name":"Mountain"},{"qty":4,"name":"Rishadan Port"},{"qty":4,"name":"Wasteland"},{"qty":2,"name":"Earthquake"},{"qty":2,"name":"Firebolt"},{"qty":3,"name":"Pillage"},{"qty":4,"name":"Stone Rain"}],"side":[{"qty":2,"name":"Aftershock"},{"qty":2,"name":"Anarchy"},{"qty":4,"name":"Overload"},{"qty":2,"name":"Pyroblast"},{"qty":4,"name":"Red Elemental Blast"},{"qty":1,"name":"Tormod's Crypt"}],"mainCount":60,"sideCount":15}}}]}</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const picks = new Map();
  let db = null;
  let canWrite = false;
  let current = 0;
  let chain = Promise.resolve();
  let advanceTimer = null;
  const brewsOnly = document.getElementById("brewsOnly");
  const unjudgedOnly = document.getElementById("unjudgedOnly");

  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
    }
    for (const kid of kids) if (kid) n.append(kid);
    return n;
  };
  const judged = (id) => Boolean(picks.get(id) && picks.get(id).winner);
  const inView = (i) => (!brewsOnly.checked || DATA.pairs[i].brew) && (!unjudgedOnly.checked || !judged(DATA.pairs[i].id) || i === current);

  /** Card -> copies across main, side and commander. */
  function counts(deck) {
    const m = new Map();
    if (!deck) return m;
    for (const zone of ["commander", "main", "side"]) {
      for (const c of deck[zone] || []) {
        const k = (zone === "side" ? "SB: " : "") + c.name;
        m.set(k, (m.get(k) || 0) + c.qty);
      }
    }
    return m;
  }
  function diff(a, b) {
    const onlyA = [];
    const onlyB = [];
    const both = [];
    for (const k of new Set([...a.keys(), ...b.keys()])) {
      const x = a.get(k) || 0;
      const y = b.get(k) || 0;
      const shared = Math.min(x, y);
      if (shared) both.push(`${shared} ${k}`);
      if (x > shared) onlyA.push(`${x - shared} ${k}`);
      if (y > shared) onlyB.push(`${y - shared} ${k}`);
    }
    const byMain = (s) => (s.includes("SB: ") ? 1 : 0);
    const sort = (xs) => xs.sort((p, q) => byMain(p) - byMain(q) || p.replace(/^\d+ /, "").localeCompare(q.replace(/^\d+ /, "")));
    return { onlyA: sort(onlyA), onlyB: sort(onlyB), both: sort(both) };
  }
  /** The reply's opening: its first two sentences, where answers put the plan. */
  function opening(text) {
    if (!text) return "";
    const clean = text.replace(/\*\*/g, "").replace(/\s+/g, " ").trim();
    const parts = clean.match(/[^.!?]+[.!?]+/g) || [clean];
    const out = parts.slice(0, 2).join(" ").trim();
    return out.length > 360 ? out.slice(0, 357) + "…" : out;
  }

  function renderProgress() {
    const pool = DATA.pairs.filter((p) => !brewsOnly.checked || p.brew);
    const done = pool.filter((p) => judged(p.id)).length;
    document.getElementById("progress").replaceChildren(el("b", { text: `${done} of ${pool.length}` }), brewsOnly.checked ? " brew pairs judged" : " pairs judged");
  }

  function save(patch, advance) {
    if (!db || !canWrite) return;
    const p = DATA.pairs[current];
    const body = { ...(picks.get(p.id) || {}), ...patch, pair: p.id, prompt: p.prompt, quick: true, updatedAt: new Date().toISOString() };
    picks.set(p.id, body);
    sync();
    renderProgress();
    const status = document.getElementById("saved");
    status.textContent = "Saving…";
    chain = chain
      .then(() => db.collection("pairs").doc(p.id).set(body))
      .then(() => { status.textContent = advance ? "Saved. Next pair in a moment (change your mind with Previous)." : "Saved"; })
      .catch((e) => { status.textContent = e && e.code === "invalid_argument" ? "Only the owner can save picks on this page." : "Could not save. Try again in a moment."; });
    if (advance) {
      clearTimeout(advanceTimer);
      advanceTimer = setTimeout(() => go(1), 900);
    }
  }

  /** The whole list, by zone; lines with more copies than the other deck are highlighted. */
  function fullList(deck, other) {
    const d = el("details", { class: "full", open: "" }, el("summary", { text: "Full decklist" }));
    const theirs = counts(other);
    for (const [zone, label] of [["commander", "Commander"], ["main", "Main"], ["side", "Sideboard"]]) {
      const lines = deck[zone] || [];
      if (!lines.length) continue;
      const total = lines.reduce((n, c) => n + c.qty, 0);
      const ul = el("ul");
      for (const c of lines) {
        const k = (zone === "side" ? "SB: " : "") + c.name;
        ul.append(el("li", { class: c.qty > (theirs.get(k) || 0) ? "uniq" : null, text: `${c.qty} ${c.name}` }));
      }
      d.append(el("h4", { text: `${label} (${total})` }), ul);
    }
    return d;
  }

  function side(letter, ans, only, other) {
    const box = el("article", { class: "side" });
    box.append(el("div", { class: "side-head" }, el("span", { class: "letter", text: letter }), ans.deck ? null : el("span", { class: "fmt", text: "No deck" })));
    if (ans.text) box.append(el("p", { class: "lead", text: opening(ans.text) }));
    const o = el("div", { class: "only" }, el("h3", { text: `Only in ${letter}` }));
    o.append(only.length ? el("pre", { text: only.join("\n") }) : el("p", { class: "none", text: "Nothing: every card is also in the other deck." }));
    box.append(o);
    if (ans.deck) box.append(fullList(ans.deck, other));
    if (ans.text) {
      const d = el("details", {}, el("summary", { text: "Full reply" }));
      d.append(el("div", { class: "reply", text: ans.text }));
      box.append(d);
    }
    return box;
  }

  function sync() {
    const s = picks.get(DATA.pairs[current].id) || {};
    for (const b of document.querySelectorAll("#picks button")) {
      b.setAttribute("aria-pressed", String(s.winner === b.dataset.w));
      b.disabled = !canWrite;
    }
    for (const b of document.querySelectorAll("#why button")) {
      b.setAttribute("aria-pressed", String((s.reasons || []).includes(b.dataset.r)));
      b.disabled = !canWrite;
    }
  }

  function render() {
    const p = DATA.pairs[current];
    const pr = DATA.prompts[p.prompt];
    const first = pr.prompt.split("\n")[0];
    const req = [el("span", { class: "fmt", text: pr.format }), el("p", { class: "prompt", text: first })];
    if (pr.prompt.includes("\n") && pr.prompt.length > 220) {
      const d = el("details", {}, el("summary", { text: "Show the pasted list" }));
      d.append(el("div", { class: "reply", text: pr.prompt.slice(first.length).trim() }));
      req.push(d);
    }
    document.getElementById("request").replaceChildren(...req);
    const d = diff(counts(p.left.deck), counts(p.right.deck));
    document.getElementById("duel").replaceChildren(side("A", p.left, d.onlyA, p.right.deck), side("B", p.right, d.onlyB, p.left.deck));
    const shared = document.getElementById("shared");
    shared.replaceChildren(el("summary", { text: `Both decks play ${d.both.length} of the same card lines` }), el("pre", { text: d.both.join("\n") || "None" }));
    shared.open = false;
    document.getElementById("saved").textContent = "";
    document.getElementById("prev").disabled = !DATA.pairs.some((_, i) => i < current && inView(i));
    document.getElementById("next").disabled = !DATA.pairs.some((_, i) => i > current && inView(i));
    sync();
    renderProgress();
  }

  function go(dir) {
    let i = current + dir;
    while (i >= 0 && i < DATA.pairs.length && !inView(i)) i += dir;
    if (i < 0 || i >= DATA.pairs.length) {
      if (dir > 0) document.getElementById("saved").textContent = "That was the last one in this view. Thank you!";
      return;
    }
    current = i;
    try { localStorage.setItem("quick-pair", String(current)); } catch (e) {}
    render();
    window.scrollTo(0, 0);
  }
  function jumpToFirst() {
    const i = DATA.pairs.findIndex((_, j) => (!brewsOnly.checked || DATA.pairs[j].brew) && (!unjudgedOnly.checked || !judged(DATA.pairs[j].id)));
    if (i >= 0) { current = i; render(); }
  }

  document.getElementById("prev").addEventListener("click", () => go(-1));
  document.getElementById("next").addEventListener("click", () => go(1));
  brewsOnly.addEventListener("change", jumpToFirst);
  unjudgedOnly.addEventListener("change", jumpToFirst);
  for (const b of document.querySelectorAll("#picks button")) b.addEventListener("click", () => save({ winner: b.dataset.w }, true));
  for (const b of document.querySelectorAll("#why button")) {
    b.addEventListener("click", () => {
      clearTimeout(advanceTimer);
      const s = picks.get(DATA.pairs[current].id) || {};
      const set = new Set(s.reasons || []);
      set.has(b.dataset.r) ? set.delete(b.dataset.r) : set.add(b.dataset.r);
      save({ reasons: [...set] }, false);
    });
  }
  document.addEventListener("keydown", (e) => {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    const map = { "1": "A", "2": "tie", "3": "B" };
    if (map[e.key] && canWrite) save({ winner: map[e.key] }, true);
    if (e.key === "ArrowRight") go(1);
    if (e.key === "ArrowLeft") go(-1);
  });

  try { current = Math.min(Number(localStorage.getItem("quick-pair") || 0), DATA.pairs.length - 1) || 0; } catch (e) {}
  render();

  (async () => {
    const notice = document.getElementById("notice");
    const claude = window.claude;
    const dbNs = claude && claude.use ? await claude.use("db") : null;
    const user = claude && claude.use ? await claude.use("user") : null;
    if (!dbNs) { notice.textContent = "Picks save only when this page is open on claude.ai and you're signed in."; return; }
    db = dbNs;
    canWrite = user ? (user.isOwner() ?? false) : false;
    let first = true;
    db.collection("pairs").onSnapshot(
      (snap) => {
        picks.clear();
        for (const d of snap.docs) picks.set(d.id, d.data());
        if (first) {
          first = false;
          notice.textContent = canWrite
            ? "The cards that differ are at the top; full lists are below, with those cards highlighted. Press 1, 2 or 3 (or click) and it moves on. The opening two sentences of each reply say what the deck is going for."
            : "Read-only: only the page owner can judge.";
          jumpToFirst();
          return;
        }
        sync();
        renderProgress();
      },
      () => { notice.textContent = "Saved picks could not be loaded. Reload the page to try again."; },
    );
  })();
})();
</script>
