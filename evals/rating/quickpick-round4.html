<style>
/* Layout: one question per screen. The request, each answer's opening, only the cards that differ, then A / Same / B. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --ink: #1b2236;
  --muted: #5d667d;
  --line: #dde2ec;
  --accent: #2459a6;
  --pick: #b5650d;
  --chip: #e8edf6;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141d; --surface: #181e2b; --ink: #e5e9f2; --muted: #9aa4ba; --line: #2a3346;
    --accent: #6f9fe0; --pick: #e2a04f; --chip: #222b3d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141d; --surface: #181e2b; --ink: #e5e9f2; --muted: #9aa4ba; --line: #2a3346;
  --accent: #6f9fe0; --pick: #e2a04f; --chip: #222b3d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 64px; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.top h1 { font-size: 1.3rem; }
.progress { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.progress b { color: var(--pick); }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 0.9rem; color: var(--muted); }
.controls label { display: inline-flex; gap: 6px; align-items: center; }
.btn { font: 600 0.88rem var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.btn:disabled { opacity: 0.5; cursor: default; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.notice { margin: 0; color: var(--muted); font-size: 0.9rem; }
.request { display: grid; gap: 6px; }
.fmt { font: 600 0.75rem var(--font-body); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.prompt { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.duel { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 14px; }
.side { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.side-head { display: flex; gap: 10px; align-items: center; }
.letter { font: 700 1.2rem var(--font-display); width: 2.1rem; height: 2.1rem; display: grid; place-items: center; border-radius: 8px; background: var(--ink); color: var(--surface); }
.lead { margin: 0; font-size: 0.94rem; overflow-wrap: anywhere; }
.only h3 { font: 600 0.78rem var(--font-body); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
.only pre { margin: 0; font: 0.84rem/1.5 var(--font-mono); padding: 10px 12px; background: var(--bg); border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
.none { color: var(--muted); font-style: italic; }
.full summary { font-size: 0.85rem; }
.full h4 { font: 600 0.72rem var(--font-body); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 8px 0 2px; }
.full ul { list-style: none; margin: 0; padding: 0; font: 0.8rem/1.5 var(--font-mono); columns: 2 170px; column-gap: 14px; }
.full li { break-inside: avoid; overflow-wrap: anywhere; }
.full li.uniq { color: var(--accent); font-weight: 600; }
details summary { cursor: pointer; color: var(--accent); font-size: 0.9rem; }
.shared pre { margin: 6px 0 0; font: 0.8rem/1.45 var(--font-mono); padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; columns: 2 220px; }
.reply { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 20rem; overflow: auto; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.9rem; margin-top: 6px; }
.ask { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.ask h2 { font-size: 1.1rem; }
.picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.picks button { font: 700 1.05rem var(--font-display); padding: 16px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); cursor: pointer; }
.picks button kbd { display: block; font: 0.75rem var(--font-mono); color: var(--muted); margin-top: 2px; }
.picks button[aria-pressed="true"] { background: var(--pick); color: var(--surface); border-color: var(--pick); }
.picks button[aria-pressed="true"] kbd { color: var(--surface); }
.why { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.85rem; color: var(--muted); }
.why button { font: 0.85rem var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 4px 10px; border-radius: 999px; cursor: pointer; }
.why button[aria-pressed="true"] { background: var(--chip); border-color: var(--accent); color: var(--accent); }
button:disabled { cursor: not-allowed; opacity: 0.6; }
.saved { font-size: 0.8rem; color: var(--muted); min-height: 1.2em; }
@media (max-width: 560px) { .picks { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .picks button, .why button { transition: background 120ms ease, color 120ms ease; } }

<script type="application/json" id="data">{"prompts":{"fresh-modern-mono-black-tron":{"format":"Modern","prompt":"Mono black tron in Modern?","lookFor":""},"fresh-premodern-city-of-traitors-black":{"format":"Premodern","prompt":"City of Traitors mono black premodern deck?","lookFor":""},"fresh-premodern-mono-red-prison":{"format":"Premodern","prompt":"Mono red prison but in Premodern?","lookFor":""},"fresh-premodern-5c-solution":{"format":"Premodern","prompt":"Best 5 color Solution deck in premodern?","lookFor":""},"fresh-vintage-no-power":{"format":"Vintage","prompt":"Most competitive non-power nine vintage deck?","lookFor":""}},"pairs":[{"id":"35e4b68d1809","prompt":"fresh-modern-mono-black-tron","brew":true,"left":{"text":"**Mono-black Tron: revised list (brew, borrowing the Eldrazi Tron shell)**\n\n**Plan.** Assemble Urza's Mine, Tower and Power Plant with the help of Expedition Map, World Map and Urza's Cave. Then land a 7-mana-or-more threat a turn or two early. Those threats are Wurmcoil Engine, Grave Titan, Ugin (both versions), Karn Liberated and Ulamog. Until Tron is up, Thoughtseize, Thought-Knot Seer, Fatal Push, Infernal Grasp, Dismember and Kozilek's Command buy time. Swamps make the black mana.\n\n**What I changed from the submitted list (shell, mana and sideboard only; the engine is untouched):**\n- **Ghost Quarter became an 8th Swamp.** The simulation compared the two builds.\n\n| Measure (simulated, 5,000 games) | Original (7 Swamp + Ghost Quarter) | Revised (8 Swamp) |\n|---|---|---|\n| Black mana available on turn 4 | 82.9% | 86.5% |\n| Tron lands in hand by turn 4 | 13.6% | 15.7% |\n\n  Ghost Quarter moves to the sideboard for Urza's Saga decks.\n- **Night's Whisper ×2 became Fatal Push ×2.** The top decks are fast, so cheap interaction beats card draw. Push kills 2-mana threats like Basking Broodscale. That is judgment, since I didn't check which cards Push hits.\n- **I tried 21 lands and rejected it.** Screw rose to 22.7% (it was 11.5%), so I kept 22.\n- **Sideboard:** Thoughtseize, Night's Whisper and Ghost Quarter are in; Fatal Push ×2 moved to the main deck.\n\n**Mana (simulated).** The 22 lands are 4 Mine, 4 Tower, 4 Power Plant, 2 Cave and 8 Swamp. The final 60 weren't re-simulated. The test list had 61 cards, with a third Thoughtseize and no Ghost Quarter or Swamp swap difference beyond that.\n- Mulligan rate is about 20%, and screw is about 11%.\n- Flood is about 1.5%.\n- Having all three Tron lands in hand by turn 4 is only about 16%. The deck relies on the Maps and Cave to find the rest, and the simulator doesn't model their abilities. So the real turn-4 Tron rate is higher than 16%, but I haven't measured it.\n- Grave Titan's BB is the awkward cost with 8 Swamps. Fetching a Swamp with Map or Cave helps.\n\n**Matchups.** Shares come from the meta data.\n- **Broodscale Combo (14.4%), Storm, Goryo's Vengeance and Living End** are the worst matchups. They are fast, and Tron can't interact until turn 3 or later. Thoughtseize, Thought-Knot Seer, Fatal Push and Kozilek's Command are the main-deck answers. Karn, the Great Creator is one of the few cards that comes in against Broodscale. Karn's static shuts off activated abilities of opposing artifacts. I didn't check whether that affects their combo pieces, so treat it as unverified.\n- **Prowess (9.9%) and Affinity (5.4%)** are dangerous if Tron stumbles. Push, Grasp, Ballista and Wurmcoil help. Karn's static also stops Affinity's artifact abilities.\n- **Eldrazi Tron (4.9%)** is a close mirror and a race to cast the bigger spells. Ugin and Karn Liberated exile its permanents.\n- **Slower decks** (Rakdos Delirium, UW Control, Jeskai Control) are the best matchups, because Wurmcoil and Grave Titan outgrind them.\n- **Boros Land Destruction** is fine only if Tron is already assembled.\n\n**Sideboarding.**\n- **Against Broodscale, Storm, Living End and Goryo's Vengeance:**\n  - Bring in Grafdigger's Cage ×2 and Tormod's Crypt.\n  - Bring in Relic of Progenitus, Pithing Needle and the third Thoughtseize.\n  - Bring in Ghost Quarter against Urza's Saga.\n  - Take out Wurmcoil Engine and the 7-drop Karn.\n- **Against Affinity and Prowess:**\n  - Bring in Toxic Deluge, Oblivion Stone and Ensnaring Bridge.\n  - Take out Thought-Knot Seer.\n  - Take out Ulamog.\n- **Against Amulet Titan and Domain Zoo:** Damping Sphere and Chalice of the Void are options.\n- **The sideboard is also Karn, the Great Creator's wish list.** Karn's −2 can fetch Chalice, Cage, Sphere, Needle, Relic, Crypt or Bridge from outside the game. I'm assuming your event allows wishing from the sideboard.\n\n**Unverified.**\n- Total win rates are not measured.\n- Whether Karn's static stops Broodscale's combo pieces.\n- How often Maps and Cave actually find Tron.\n- Ulamog costs 10, so it is very slow.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Urza's Mine"},{"qty":4,"name":"Urza's Tower"},{"qty":4,"name":"Urza's Power Plant"},{"qty":2,"name":"Urza's Cave"},{"qty":8,"name":"Swamp"},{"qty":4,"name":"Expedition Map"},{"qty":1,"name":"World Map"},{"qty":3,"name":"Mind Stone"},{"qty":2,"name":"Wurmcoil Engine"},{"qty":2,"name":"Grave Titan"},{"qty":1,"name":"Ugin, the Spirit Dragon"},{"qty":1,"name":"Ulamog, the Ceaseless Hunger"},{"qty":1,"name":"Karn Liberated"},{"qty":3,"name":"Dismember"},{"qty":3,"name":"Kozilek's Command"},{"qty":3,"name":"Infernal Grasp"},{"qty":2,"name":"Thoughtseize"},{"qty":2,"name":"Fatal Push"},{"qty":3,"name":"Thought-Knot Seer"},{"qty":3,"name":"Karn, the Great Creator"},{"qty":2,"name":"Ugin, Eye of the Storms"},{"qty":2,"name":"Walking Ballista"}],"side":[{"qty":1,"name":"Ghost Quarter"},{"qty":1,"name":"Oblivion Stone"},{"qty":1,"name":"Tormod's Crypt"},{"qty":2,"name":"Grafdigger's Cage"},{"qty":1,"name":"Ensnaring Bridge"},{"qty":1,"name":"Chalice of the Void"},{"qty":2,"name":"Warping Wail"},{"qty":1,"name":"Toxic Deluge"},{"qty":1,"name":"Damping Sphere"},{"qty":1,"name":"Relic of Progenitus"},{"qty":1,"name":"Pithing Needle"},{"qty":1,"name":"Thoughtseize"},{"qty":1,"name":"Night's Whisper"}],"mainCount":60,"sideCount":15}},"right":{"text":"I built and submitted a mono-black Tron deck for Modern. It's a brew, not a proven list. Tron doesn't appear in the current meta data, so I borrowed the mana and artifact package from Eldrazi Tron and added black disruption.\n\n**Plan:** Disrupt early with discard and cheap removal while you hunt for Urza's Tower, Mine and Power Plant. Once you assemble Tron (7 mana on turn 3), cast Wurmcoil Engine, Karn Liberated, Ugin or Ulamog. Black doesn't need colored mana from the Tron lands, so the deck stays mono-colored without strain.\n\n**Key cards**\n- **Thoughtseize ×4, Inquisition of Kozilek ×2, Fatal Push ×4:** These are the cheap turns that keep you alive until Tron. Thoughtseize is in 29% of recent Modern lists and Fatal Push in 24%. Combo (Broodscale, Devoted Druid) and Prowess are the top threats.\n- **Expedition Map ×4:** It finds a missing Tron piece, and sacrificing it also turns on Fatal Push's revolt.\n- **Dismember ×2, Bloodchief's Thirst ×2, Collective Brutality ×1:** Extra removal. Thirst's kicker kills anything once you have lots of mana.\n- **Walking Ballista ×3, Mind Stone ×3:** Ballista kills small creatures and gives you something to spend mana on. Mind Stone gets you to Karn and Wurmcoil early.\n- **Sheoldred ×2, Karn, the Great Creator ×2:** Sheoldred is a strong four-drop without Tron. Karn's −2 fetches artifacts from the sideboard (see the caveat below).\n- **Top end:** Wurmcoil Engine ×3, Karn Liberated, Ugin ×2, Ulamog ×1.\n- **Night's Whisper ×2, Grim Tutor, Solemn Simulacrum:** Card draw, a tutor, and a way to fetch a Swamp.\n\n**Mana:** The deck has 20 lands: 12 Tron lands, 7 Swamp and 1 Ghost Quarter. Four Expedition Maps and three Mind Stones sit on top of that. The deck checker flagged it as a little under Eldrazi Tron's average of about 22 lands, but the Maps and Mind Stones make up for it. Seven black sources is on the low side for Sheoldred's BB. That is the deck's weakest spot, so Sheoldred is a bonus, not a plan.\n\n**Sideboard (15)**\n- **Graveyard decks (Goryo's, Living End, Broodscale):** Bring in Grafdigger's Cage ×2, Nihil Spellbomb, Soul-Guide Lantern, Relic of Progenitus and Pithing Needle.\n- **Creature combo and Ballista decks (Broodscale, Devoted Druid):** Bring in Cursed Totem ×2 and Needle. Take out some slow cards, such as Night's Whisper or one Karn.\n- **Affinity, Prowess, Energy and tokens:** Bring in Engineered Explosives, Ratchet Bomb and Oblivion Stone. Wurmcoil and Ugin are already strong here.\n- **Eldrazi Tron and other big-mana mirrors:** Take out Fatal Push and bring in Kozilek and Myr Battlesphere for more top-end power. Ghost Quarter is good against Urza's Saga, which is in about 21% of lists.\n- **Karn, the Great Creator:** His −2 can fetch any of these artifacts from the sideboard, which makes him a flexible tutor.\n\n**What I couldn't verify:** There is no Tron list in the meta data, so none of this is tested against real results. Karn's sideboard wish depends on the platform supporting \"outside the game\" effects. I didn't check win rates against any matchup.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Urza's Tower"},{"qty":4,"name":"Urza's Mine"},{"qty":4,"name":"Urza's Power Plant"},{"qty":7,"name":"Swamp"},{"qty":1,"name":"Ghost Quarter"},{"qty":4,"name":"Expedition Map"},{"qty":4,"name":"Thoughtseize"},{"qty":2,"name":"Inquisition of Kozilek"},{"qty":4,"name":"Fatal Push"},{"qty":2,"name":"Dismember"},{"qty":2,"name":"Bloodchief's Thirst"},{"qty":1,"name":"Collective Brutality"},{"qty":3,"name":"Walking Ballista"},{"qty":3,"name":"Mind Stone"},{"qty":2,"name":"Night's Whisper"},{"qty":1,"name":"Grim Tutor"},{"qty":1,"name":"Solemn Simulacrum"},{"qty":2,"name":"Sheoldred, the Apocalypse"},{"qty":2,"name":"Karn, the Great Creator"},{"qty":3,"name":"Wurmcoil Engine"},{"qty":1,"name":"Karn Liberated"},{"qty":2,"name":"Ugin, the Spirit Dragon"},{"qty":1,"name":"Ulamog, the Ceaseless Hunger"}],"side":[{"qty":2,"name":"Pithing Needle"},{"qty":2,"name":"Grafdigger's Cage"},{"qty":1,"name":"Nihil Spellbomb"},{"qty":1,"name":"Soul-Guide Lantern"},{"qty":1,"name":"Engineered Explosives"},{"qty":2,"name":"Cursed Totem"},{"qty":1,"name":"Ratchet Bomb"},{"qty":1,"name":"Oblivion Stone"},{"qty":1,"name":"Relic of Progenitus"},{"qty":1,"name":"Myr Battlesphere"},{"qty":1,"name":"Kozilek, Butcher of Truth"},{"qty":1,"name":"Collective Brutality"}],"mainCount":60,"sideCount":15}}},{"id":"43933cb6e220","prompt":"fresh-premodern-city-of-traitors-black","brew":true,"left":{"text":"# Mono-Black City of Traitors: fast mana into big threats (Premodern brew)\n\n**The plan:** City of Traitors, Ancient Tomb and Dark Ritual let you cast 3–4 mana threats on turn 1 or 2. Those are Hypnotic Specter, Phyrexian Negator, Masticore, Phyrexian Scuta, Phyrexian Processor and Tangle Wire. Duress and Cabal Therapy clear counterspells and answers out of the opponent's hand first. City is a one-shot burst of mana: you're happy to lose it once your threat is down. When the opponent is short on lands, Tangle Wire can keep them stuck while your creatures attack.\n\n## Main deck (60)\n**Lands (23):** 4 City of Traitors, 4 Ancient Tomb, 14 Swamp, 1 Cabal Pit\n**Fast mana (4):** 4 Dark Ritual\n**Threats (18):** 4 Hypnotic Specter, 4 Phyrexian Negator, 3 Masticore, 2 Phyrexian Scuta, 2 Phyrexian Processor, 3 Tangle Wire\n**Discard (6):** 4 Duress, 2 Cabal Therapy\n**Removal (5):** 2 Smother, 2 Diabolic Edict, 1 Snuff Out\n**Other (4):** 2 Cursed Scroll, 2 Bottle Gnomes\n\n## Sideboard (15)\n3 Engineered Plague, 3 Dystopia, 2 Gloom, 2 Tormod's Crypt, 2 Powder Keg, 2 Vendetta, 1 Drain Life\n\n## Why these cards\n- **City of Traitors and Ancient Tomb** each tap for two colorless mana. With a Swamp or Dark Ritual, that's enough for Negator (2B), Masticore (4), Tangle Wire (3) or Processor (4) on turn 1 or 2.\n- **Specter and Negator** are the fastest real clocks. Negator is a 5/5 trampler for 3, but you sacrifice a permanent for each point of damage dealt to it.\n- **Masticore** answers creature decks by itself (it pings for 2 mana and regenerates).\n- **Tangle Wire** hurts the opponent more than you, because your burst mana has already been spent.\n\n## What I changed from the submitted deck\nThe core cards weren't touched; only these slots changed.\n- **2 Chimeric Idol → 2 Bottle Gnomes.** Idol taps all your lands, which fights with the mana you need for Masticore and Processor. Gnomes cost 3 colorless, so Tomb or City casts them. They gain 3 life against burn, and they're spare creatures to tap for Tangle Wire or sacrifice to flash back Cabal Therapy.\n- **1 Cabal Pit → 1 Swamp.** That's one less land that costs you life, and one less nonbasic for Price of Progress, which 34% of Sligh lists run. You keep the same 15 black sources.\n- **Sideboard: 1 Ravenous Rats → 1 Drain Life,** for life gain against burn.\n- **Not kept:** I tried 2 Withered Wretch and later 2 Ravenous Rats in the Gnomes slots.\n  - Wretch costs BB, and the simulation showed it dropped your chance of having the right colors on turn 2 from 96.3% to 83.4%.\n  - Rats pushed the deck too close to an existing Moneyball Black list for it to count as a brew.\n\n## The mana (5,000 simulated games)\n- **Mulligans:** 17.5%, against 8.6% for a current Moneyball Black list. This is the real cost of 8 colorless lands plus Specter's BB.\n- **Running short on lands:** 9.3% screw (vs 21.5% for Moneyball) and 67% of games hit every land drop through turn 4 (vs 50%).\n- **Right colors in play:** 95.7% on turn 1, 96.3% on turn 2, but only 87.6% on turn 3. A Tomb-or-City hand that needs BB for Specter is the usual stumble.\n- **Fast start:** A turn-2 threat is in your hand 77.4% of the time. The simulation doesn't count Dark Ritual, so I can't give you a measured number for actually casting it on turn 2.\n- **Land count:** 23, with 15 black sources. That matches the Moneyball Black average of 23.15 lands, though those lists run about 17.3 black sources.\n\n## Sideboarding against the field (last 30 days)\n- **Enchantress (12.5%):** Bring in 3 Dystopia and 2 Gloom; take out 2 Smother, 2 Diabolic Edict and 1 Snuff Out (they have almost no creatures to target). Keep all the discard. Expect Swords to Plowshares on your threats.\n- **Terrageddon (11.2%):** Bring in Dystopia and 1–2 Engineered Plague. Their 4 Wasteland and Armageddon punish keeping City around, so cast your threat right away. Masticore and the Edicts handle Terravore and the Mongooses.\n- **Stiflenought (10.4%):** Take out 2 Bottle Gnomes and 1 Smother. Discard and Edict/Snuff Out handle Phyrexian Dreadnought (Snuff Out works because it's a nonblack artifact creature). Watch for their Powder Keg; it sweeps your 3-drops at three counters.\n- **Sligh (9.9%) and Goblins (4.4%), your worst matchups:**\n  - Bring in 2 Vendetta (kills Grim Lavamancer and Goblins for 1 life), Drain Life and Engineered Plague (vs Goblins), plus Powder Keg (vs Goblins).\n  - Take out Phyrexian Processor, Scuta and Cabal Therapy.\n  - Burn kills Specter easily, and Negator's sacrifice drawback hurts. Fetch and mana-land Tomb damage carefully.\n- **Hermit Druid (5.5%) and Replenish (4.8%):** Bring in 2 Tormod's Crypt. Keep all the discard and take out removal.\n\n## Label and what's unverified\n- **Label:** This is a **brew**. It borrows its removal suite, Cursed Scroll and sideboard from Moneyball Black, and the City/Tomb/Tangle Wire/Processor package is new.\n- **Unverified:** The matchup judgments above are my reasoning from the decks' card lists, not tested results. Phyrexian Processor, Scuta and Tangle Wire barely show up in recent tournament results, so they're untested in this shell.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"City of Traitors"},{"qty":4,"name":"Ancient Tomb"},{"qty":14,"name":"Swamp"},{"qty":1,"name":"Cabal Pit"},{"qty":4,"name":"Dark Ritual"},{"qty":4,"name":"Hypnotic Specter"},{"qty":4,"name":"Phyrexian Negator"},{"qty":3,"name":"Masticore"},{"qty":3,"name":"Tangle Wire"},{"qty":2,"name":"Phyrexian Processor"},{"qty":4,"name":"Duress"},{"qty":2,"name":"Cabal Therapy"},{"qty":2,"name":"Smother"},{"qty":2,"name":"Diabolic Edict"},{"qty":1,"name":"Snuff Out"},{"qty":2,"name":"Cursed Scroll"},{"qty":2,"name":"Bottle Gnomes"},{"qty":2,"name":"Phyrexian Scuta"}],"side":[{"qty":3,"name":"Engineered Plague"},{"qty":3,"name":"Dystopia"},{"qty":2,"name":"Gloom"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Powder Keg"},{"qty":2,"name":"Vendetta"},{"qty":1,"name":"Drain Life"}],"mainCount":60,"sideCount":15}},"right":{"text":"**Mono-Black City of Traitors (Premodern brew)**\n\n```\nMain (60)\n16 Swamp\n4 City of Traitors\n2 Mishra's Factory\n4 Hypnotic Specter\n4 Phyrexian Negator\n4 Ravenous Rats\n3 Masticore\n4 Dark Ritual\n4 Duress\n4 Cabal Therapy\n3 Cursed Scroll\n2 Phyrexian Processor\n2 Smother\n2 Diabolic Edict\n2 Snuff Out\n\nSideboard (15)\n3 Engineered Plague\n3 Dystopia\n2 Gloom\n2 Tormod's Crypt\n2 Nevinyrral's Disk\n2 Plague Spitter\n1 Powder Keg\n```\n\n**The plan:** On turn 1, make them discard with Duress, Cabal Therapy or Ravenous Rats. On turn 2, use City of Traitors or Dark Ritual to get a 3–5 mana threat out early. Then, with their hand stripped, finish them off with big bodies and Cursed Scroll.\n\n**Why these cards**\n- **City of Traitors:** It taps for {C}{C}, but you have to sacrifice it when you play another land. Play it as your second land after a Swamp: you get 3 mana on turn 2, and you keep that mana for as long as you don't play another land. When you do play one, tap City in response to the sacrifice trigger and you still get the {C}{C} that turn.\n- **Cards that use colorless mana:** I picked threats that mostly cost generic mana so City's {C}{C} isn't wasted:\n  - Phyrexian Negator ({2}{B}, a 5/5 trample)\n  - Masticore ({4})\n  - Phyrexian Processor ({4}: pay life as it comes in, then make X/X tokens)\n  - Cursed Scroll ({1} to cast, {3} to use)\n  - Mishra's Factory activations\n- **Masticore and Cursed Scroll fix City's drawback.** Holding lands to keep City is normally a cost. Here, extra lands are what you discard to Masticore's upkeep, and Scroll gets better as your hand shrinks.\n- **Dark Ritual** turns one Swamp into a turn-1 Negator or Specter. With Ritual plus City on turn 2, you can have 5 mana for Masticore or Processor.\n- **The odds:** You'll see City or Ritual by turn 2 on the play about 71% of the time. You'll have a 3–4 mana threat about 88% of the time, and both together about 61%.\n- **Specter costs {1}{B}{B},** so City only pays for part of it. It's still here because Moneyball Black, the main mono-black deck, plays it in 97% of lists.\n\n**The mana:** 22 lands: 16 Swamps, 4 City and 2 Factory, plus 4 Rituals. Moneyball Black averages about 23 lands and 17 black sources, so I'm one or two lower. City making two mana makes up some of that. check_deck found no errors or warnings.\n\n**Sideboarding** (the field is mostly Enchantress 12.5%, Terrageddon 11.2%, Stiflenought 10.4%, Sligh 9.9%, Hermit Druid 5.5%):\n- **Enchantress:** Bring in Dystopia, Gloom and Nevinyrral's Disk. Take out Smother, Edict and 1 Processor.\n- **Terrageddon:** Bring in Dystopia. Keep all the discard; Duress and Therapy can take Armageddon before it resolves.\n- **Sligh and Goblins:** Bring in Engineered Plague (name Goblin) and Plague Spitter. Take out the Processors, since paying life loses to burn.\n- **Hermit Druid and Replenish:** Bring in Tormod's Crypt. Keep all 8 Duress and Therapy, and take out removal.\n- **Stiflenought:** Edict and Smother are already good main-deck answers. Add Powder Keg.\n\n**Label:** This is a **brew**. No mono-black deck in recent results plays City of Traitors; it shows up mostly in Terrageddon (44 of 80 lists). I copied the discard, removal and sideboard from Moneyball Black and The Rack, and built the threats and mana around City.\n\n**What I checked and couldn't verify**\n- Two classic cards for this style are not legal in Premodern: Juzám Djinn and Sinkhole.\n- Phyrexian Processor shows up in only 4 recent lists, and none of them are mono-black, so its role here hasn't been tested.","error":false,"deck":{"commander":[],"main":[{"qty":16,"name":"Swamp"},{"qty":4,"name":"City of Traitors"},{"qty":2,"name":"Mishra's Factory"},{"qty":4,"name":"Hypnotic Specter"},{"qty":4,"name":"Phyrexian Negator"},{"qty":4,"name":"Ravenous Rats"},{"qty":3,"name":"Masticore"},{"qty":4,"name":"Dark Ritual"},{"qty":4,"name":"Duress"},{"qty":4,"name":"Cabal Therapy"},{"qty":3,"name":"Cursed Scroll"},{"qty":2,"name":"Phyrexian Processor"},{"qty":2,"name":"Smother"},{"qty":2,"name":"Diabolic Edict"},{"qty":2,"name":"Snuff Out"}],"side":[{"qty":3,"name":"Engineered Plague"},{"qty":3,"name":"Dystopia"},{"qty":2,"name":"Gloom"},{"qty":2,"name":"Tormod's Crypt"},{"qty":2,"name":"Nevinyrral's Disk"},{"qty":2,"name":"Plague Spitter"},{"qty":1,"name":"Powder Keg"}],"mainCount":60,"sideCount":15}}},{"id":"885a4b405f1c","prompt":"fresh-premodern-mono-red-prison","brew":true,"left":{"text":"The deck is submitted as a brew. It's a mono-red land-destruction prison deck built on the mana of the Mono-Red Land Destruction lists in recent results. I didn't find any \"Mono-Red Prison\" lists in the results, so the prison pieces are my own addition.\n\n**Plan:** Keep the opponent off mana from turn 2 on, using Stone Rain, Pillage, four Avalanche Riders, Rishadan Port and Wasteland. Then lock the game with Sphere of Resistance, Smokestack and Black Vise while cheap burn and Mishra's Factory finish them.\n\n**Key cards**\n- **Land destruction:** The 4 Stone Rain, 3 Pillage and 4 Avalanche Riders are the core of the 5-0 league list I borrowed from. Pillage also hits artifacts, so it can answer Powder Keg-style cards.\n- **Sphere of Resistance (4):** Spells cost {1} more, which hurts a stumbling opponent far more than a deck full of 1-mana spells.\n- **Smokestack (2):** This is the late-game lock. It only really works once I'm ahead on board and lands, so I run just two.\n- **Black Vise (3):** It punishes the card-holding decks, and it was in 6 of the 7 land-destruction lists.\n- **Burn and creatures:** 4 Lightning Bolt, 2 Incinerate, 2 Firebolt, 3 Mogg Fanatic, 2 Grim Lavamancer, 2 Earthquake and a Cursed Scroll handle early creatures and close out games.\n\n**Mana:** I play 24 lands, below the 26 average in the land-destruction lists, because the average mana value is only about 2.1. Fourteen of them produce red. The colourless utility lands are 4 Rishadan Port, 3 Wasteland and 3 Mishra's Factory. The rest are 13 Mountain and 1 Ghitu Encampment. `check_deck` came back clean. Its only note is that the real lists run about 2 more lands. I accepted that, but if you stumble on mana, cut a Black Vise for a Mountain.\n\n**Sideboard (15)**\n- **Against blue decks** (UB Psychatog, Standstill, Stiflenought, Oath Ponza, Replenish): bring in the 3 Red Elemental Blast and 2 Pyroblast. The blue-based decks in the results are also the likeliest to be running artifacts.\n- **Against artifact-heavy decks:** bring in 2 Overload and the Powder Keg.\n- **Against Hermit Druid and Replenish:** bring in 2 Tormod's Crypt and 2 Pyroclasm. Pyroclasm also helps against Goblins.\n- **Against white or Standstill decks:** bring in 2 Anarchy. It destroys white permanents, so it should hit the white cards in Enchantress, Terrageddon and Standstill. I didn't verify the colours of those decks' cards.\n- **Against Sligh and other aggro:** bring in Bottle Gnomes. Cut Smokestack and a Sphere of Resistance, since slowing them down hurts me too.\n\n**Not verified:** I haven't tested how this deck matches up against the field. Several strong prison cards (Trinisphere, Chalice of the Void, Sol Ring, Chaos Orb) aren't legal in Premodern. Others, such as Winter Orb and Ensnaring Bridge, are legal, but I left them out because they clash with this deck's own cheap, hand-emptying plan.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Rishadan Port"},{"qty":3,"name":"Wasteland"},{"qty":3,"name":"Mishra's Factory"},{"qty":1,"name":"Ghitu Encampment"},{"qty":13,"name":"Mountain"},{"qty":4,"name":"Stone Rain"},{"qty":3,"name":"Pillage"},{"qty":4,"name":"Avalanche Riders"},{"qty":4,"name":"Sphere of Resistance"},{"qty":2,"name":"Smokestack"},{"qty":3,"name":"Black Vise"},{"qty":4,"name":"Lightning Bolt"},{"qty":2,"name":"Incinerate"},{"qty":2,"name":"Firebolt"},{"qty":3,"name":"Mogg Fanatic"},{"qty":2,"name":"Grim Lavamancer"},{"qty":2,"name":"Earthquake"},{"qty":1,"name":"Cursed Scroll"}],"side":[{"qty":3,"name":"Red Elemental Blast"},{"qty":2,"name":"Pyroblast"},{"qty":2,"name":"Overload"},{"qty":2,"name":"Anarchy"},{"qty":2,"name":"Pyroclasm"},{"qty":2,"name":"Tormod's Crypt"},{"qty":1,"name":"Powder Keg"},{"qty":1,"name":"Bottle Gnomes"}],"mainCount":60,"sideCount":15}},"right":{"text":"I submitted the most recent top list of the Mono-Red Land Destruction archetype, unchanged, as a stock deck. It was a 5-0 Premodern League list from 2026-10-01. The results show no \"Mono red prison\" list, and the Rogue reference list isn't red prison at all. Land destruction was the closest real mono-red resource-denial deck, so I used it as the stand-in. It is not the Winter Orb / Smokestack / Static Orb style of prison. Premodern has no Trinisphere or Chalice of the Void, and Strip Mine, Mana Vault and Grim Monolith are banned.\n\n**Plan:** Stone Rain, Pillage, Wasteland, Rishadan Port and Avalanche Riders (a creature that destroys a land when it enters) keep the opponent short on mana. Black Vise, Mogg Fanatic, Mishra's Factory and the burn spells then finish them while they stumble. The deck is built to hurt opponents who need a lot of mana or specific nonbasic lands.\n\n**Key cards:**\n- **Stone Rain (4), Pillage (3), Avalanche Riders (4):** these are the land-destruction core. Avalanche Riders appears in 100% of the archetype's lists, averaging 3.6 copies.\n- **Wasteland (4) and Rishadan Port (4):** both are 100% adopted. They deny mana without using a spell slot.\n- **Black Vise (3) and Cursed Scroll (1):** these punish the opponent's hand while they're stuck on lands.\n- **Lightning Bolt, Incinerate, Firebolt, Earthquake, Grim Lavamancer and Mogg Fanatic:** these remove blockers and finish the game.\n\n**Mana (26 lands, 14 of them red sources):** This matches the archetype's real average of 26.3 lands. `check_deck` found no issues. In the 5,000-game simulation:\n- **Mulligans:** 12.8% of games.\n- **Land drops:** I hit all four land drops through turn 4 in 77.3% of games.\n- **Mana screw / flood:** 5.3% of games were screwed and 5.9% flooded.\n- **Red available on turn 3:** 80.8% of games, which is the weakest point because Wasteland and Port make colorless mana.\n- **Land destruction ready by turn 3:** the cards (Stone Rain, Pillage, Avalanche Riders) were castable in 32.9% of games and in hand in 59.5%.\n\nThe simulation only models land drops and colors, not what the cards do.\n\n**Sideboard (stock):**\n- **Overload (4), Red Elemental Blast (4), Pyroblast (2):** against blue decks such as Stiflenought, UB Psychatog and Standstill. RED BLAST and Pyroblast counter blue spells, and Overload is meant for their artifacts. I didn't look up Overload's text, so that last part is from memory and not checked.\n- **Anarchy (2):** against Enchantress and Terrageddon's white permanents. The tool confirms it destroys all white permanents.\n- **Aftershock (2):** a sideboard card I didn't look up. I'd bring it in against creature decks, but that is my guess about its role.\n- **Tormod's Crypt (1):** graveyard hate against Replenish and Hermit Druid Combo.\n\nAgainst Terrageddon and Enchantress, which together are about 24% of the field, I'd expect a hard time. I haven't measured that matchup.\n\nIf you want a real Stax build with Smokestack, Sphere of Resistance and Ankh of Mishra, it would be a brew with no tournament results behind it. Smokestack and Sphere only show up as sideboard or fringe cards in this archetype.","error":false,"deck":{"commander":[],"main":[{"qty":3,"name":"Black Vise"},{"qty":1,"name":"Cursed Scroll"},{"qty":2,"name":"Phyrexian Furnace"},{"qty":4,"name":"Avalanche Riders"},{"qty":1,"name":"Dwarven Miner"},{"qty":2,"name":"Grim Lavamancer"},{"qty":4,"name":"Mogg Fanatic"},{"qty":2,"name":"Incinerate"},{"qty":4,"name":"Lightning Bolt"},{"qty":1,"name":"Barbarian Ring"},{"qty":2,"name":"Ghitu Encampment"},{"qty":4,"name":"Mishra's Factory"},{"qty":11,"name":"Mountain"},{"qty":4,"name":"Rishadan Port"},{"qty":4,"name":"Wasteland"},{"qty":2,"name":"Earthquake"},{"qty":2,"name":"Firebolt"},{"qty":3,"name":"Pillage"},{"qty":4,"name":"Stone Rain"}],"side":[{"qty":2,"name":"Aftershock"},{"qty":2,"name":"Anarchy"},{"qty":4,"name":"Overload"},{"qty":2,"name":"Pyroblast"},{"qty":4,"name":"Red Elemental Blast"},{"qty":1,"name":"Tormod's Crypt"}],"mainCount":60,"sideCount":15}}},{"id":"9c8047d51a5d","prompt":"fresh-modern-mono-black-tron","brew":true,"left":{"text":"Yes, it works. Nobody has posted results with a real mono-black Tron list, so this is a **brew**. It uses the proven Eldrazi Tron shell, which is 4.9% of the current Modern field. Most of those lists only touch black for one Swamp and Dismember. This version makes black the deck's only color and its main source of interaction.\n\n**The plan**\nAssemble Urza's Tron (Mine, Power Plant and Tower) by turn 3 or 4 and take over with Karn, the Great Creator, Ugin, Eye of the Storms, Devourer of Destiny and Ulamog. Until then, cheap black removal and hand disruption keep you alive.\n\n**Main deck (60)**\n- **Lands (22):** 4 Urza's Mine, 4 Urza's Power Plant, 4 Urza's Tower, 3 Eldrazi Temple, 6 Swamp, 1 Urborg, Tomb of Yawgmoth\n- **Ramp (8):** 4 Expedition Map, 4 Mind Stone\n- **Big threats (14):** 4 Karn, the Great Creator, 3 Ugin, Eye of the Storms, 2 Devourer of Destiny, 1 Ulamog, the Ceaseless Hunger, 4 Thought-Knot Seer\n- **Interaction (16):** 4 Kozilek's Command, 2 Dismember, 3 Sheoldred's Edict, 2 Toxic Deluge, 3 Orcish Bowmasters, 2 Thoughtseize\n\n**Why these cards**\n- **Black interaction:** Sheoldred's Edict can make the opponent sacrifice a nontoken creature, a token or a planeswalker. Toxic Deluge is a sweeper against creature-heavy decks. Orcish Bowmasters has flash and punishes extra card draw. Thoughtseize strips a key card early. Each costs only one black mana. Dismember can be paid with life, so it works even without black.\n- **The core I kept from Eldrazi Tron:** Kozilek's Command (removal, graveyard hate and card selection), Thought-Knot Seer, Karn, Ugin, Devourer and Ulamog. Ugin and Devourer exile colored permanents, and almost all of yours are colorless.\n- **What I cut:** All Is Dust, which would also kill your own Bowmasters, and Glaring Fleshraker, which needs colorless spells and you now cast fewer of them.\n\n**The mana**\nYou have 22 lands, matching real Eldrazi Tron lists (average 22.3). Black comes from 7 sources: 6 Swamps plus Urborg. Urborg makes every land a Swamp, so once it's out your Tron lands also tap for black. Expedition Map can fetch Urborg or a Tron piece.\n\nTo be honest about the odds: you have only a **65% chance of a black source by turn 2** (on the play, no mulligans). That's why the black cards are all single-black and mostly reactive, and why Dismember can be cast without black.\n\n**Sideboard (15)**\n- **10 artifacts Karn can fetch:** Tormod's Crypt, Liquimetal Coating, Ensnaring Bridge, Walking Ballista, The Stone Brain, Torpor Orb, Grafdigger's Cage, Trinisphere, Cityscape Leveler, Chalice of the Void\n- **5 black cards:** 2 Thoughtseize, 1 Toxic Deluge, 1 Surgical Extraction, 1 Sheoldred's Edict\n\n**Sideboarding against the top decks**\n- **Broodscale Combo (14.4%):** Bring in Torpor Orb, Grafdigger's Cage and Walking Ballista. Use Sheoldred's Edict's token mode. Bring in more Thoughtseize; cut Toxic Deluge.\n- **Prowess, Energy and Domain Zoo:** Bring in the third Toxic Deluge and the extra Edict; Ensnaring Bridge can be fetched with Karn. Cut Thoughtseize, since it costs you life.\n- **Affinity:** Karn already stops their artifacts' activated abilities while he's out. Bring in Liquimetal Coating, Ballista and Deluge.\n- **Living End, Goryo's Vengeance and Storm:** Bring in Thoughtseize, Surgical Extraction, Tormod's Crypt, Grafdigger's Cage and Trinisphere. Cut Deluge and some Edicts.\n- **Control and Amulet Titan:** Bring in Thoughtseize and The Stone Brain, plus Chalice of the Void against Amulet. Cut Deluge.\n\n**What I couldn't verify**\nNo tournament results exist for this exact build, so its win rate is untested. There is a different \"Mono-Black Eldrazi\" deck (37 lists, built on Urza's Saga and Nethergoyf without Tron). Some of its black cards appear here, but it isn't Tron. If black only needs to be a light splash for you, regular Eldrazi Tron is the proven option.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Urza's Mine"},{"qty":4,"name":"Urza's Power Plant"},{"qty":4,"name":"Urza's Tower"},{"qty":3,"name":"Eldrazi Temple"},{"qty":6,"name":"Swamp"},{"qty":1,"name":"Urborg, Tomb of Yawgmoth"},{"qty":4,"name":"Expedition Map"},{"qty":4,"name":"Mind Stone"},{"qty":4,"name":"Karn, the Great Creator"},{"qty":3,"name":"Ugin, Eye of the Storms"},{"qty":2,"name":"Devourer of Destiny"},{"qty":1,"name":"Ulamog, the Ceaseless Hunger"},{"qty":4,"name":"Thought-Knot Seer"},{"qty":4,"name":"Kozilek's Command"},{"qty":2,"name":"Dismember"},{"qty":3,"name":"Sheoldred's Edict"},{"qty":2,"name":"Toxic Deluge"},{"qty":3,"name":"Orcish Bowmasters"},{"qty":2,"name":"Thoughtseize"}],"side":[{"qty":1,"name":"Tormod's Crypt"},{"qty":1,"name":"Liquimetal Coating"},{"qty":1,"name":"Ensnaring Bridge"},{"qty":1,"name":"Walking Ballista"},{"qty":1,"name":"The Stone Brain"},{"qty":1,"name":"Torpor Orb"},{"qty":1,"name":"Grafdigger's Cage"},{"qty":1,"name":"Trinisphere"},{"qty":1,"name":"Cityscape Leveler"},{"qty":1,"name":"Chalice of the Void"},{"qty":2,"name":"Thoughtseize"},{"qty":1,"name":"Toxic Deluge"},{"qty":1,"name":"Surgical Extraction"},{"qty":1,"name":"Sheoldred's Edict"}],"mainCount":60,"sideCount":15}},"right":{"text":"I reviewed this against the current Modern field and made one revision: two Eldrazi Temple and a sharper sideboard. The black cards and Tron payoffs stayed locked.\n\n## The plan\nThis is mono-black Tron. You put the Urza lands together with Expedition Map, Urza's Cave and cheap artifacts. Then you cast Karn, the Great Creator and Thought-Knot Seer turns early, and finish with Wurmcoil Engine, Ulamog or All Is Dust. Black doesn't get Ancient Stirrings, so the deck isn't built to need Tron. Every 4-drop works off any four lands, and Fatal Push, Thoughtseize and Kozilek's Command buy time until then.\n\n## Why the key cards\n- **Karn, the Great Creator:** turns off activated abilities of your opponent's artifacts. That stops Affinity and also stops Broodscale Combo from equipping Blade of the Bloodchief. Its −2 lets you fetch an artifact from your sideboard, so 11 of the sideboard cards are artifacts you can grab mid-game.\n- **Thought-Knot Seer and Thoughtseize:** strip combo pieces and answers out of the opponent's hand.\n- **Fatal Push:** Expedition Map, Chromatic Star, Mind Stone, Urza's Cave, Deadly Dispute and Wurmcoil all make it easy to turn on revolt, which raises Push's reach from 2-mana creatures to 4-mana ones.\n- **New: Eldrazi Temple (2 copies).** It's colorless, so it fits mono-black, and it's in all 412 recent Eldrazi Tron lists. Its two-mana mode pays for Thought-Knot Seer, Kozilek's Command, Ulamog and All Is Dust, which are all colorless Eldrazi.\n\n## Mana (5,000 simulated games each)\n| | Submitted (23 lands, 4 Mind Stone) | **Final (25 lands, 2 Mind Stone)** | Real Eldrazi Tron list |\n|---|---|---|---|\n| Mulligan rate | 17.5% | **14.2%** | 18.0% |\n| Too few lands (screw) | 9.3% | **6.2%** | 8.9% |\n| Too many lands (flood) | 2.7% | 4.7% | 2.7% |\n| Karn or Thought-Knot Seer castable by turn 4 | 61.1% | **65.7%** | — |\n| Black mana on turn 1 | 90.7% | 90.1% | — |\n\n- I tested a 24-land version too (7 Swamp, 3 Mind Stone). It came out worse: 63.7% castable by turn 4, and black on turn 1 fell to 88.7%.\n- The deck checker points out that real Eldrazi Tron lists run about 22.3 lands. I kept the extra lands because this deck has no Ancient Stirrings to find them. The cost is flood going up 2 points.\n- Black sources are 8 Swamp, Urborg, Chromatic Star and the Treasure from Deadly Dispute.\n\n## Matchups and sideboarding\nThese shares come from the last 30 days of results.\n\n- **Broodscale Combo (14.4%), your worst matchup.** It's the most played deck and it's fast.\n  - In: Cursed Totem, Disruptor Flute (name Basking Broodscale), Trinisphere, 4th Thoughtseize.\n  - Out: 2 Wurmcoil, All Is Dust, 1 Kozilek's Command.\n  - Cursed Totem stops all activated abilities of creatures, so it shuts off Broodscale's Adapt and the Spawn tokens' \"sacrifice: add mana.\"\n  - All Is Dust only removes colored permanents, and Broodscale is colorless, so it misses.\n  - They run Haywire Mite and Nature's Claim, so your artifacts can be destroyed.\n- **Prowess (9.9%).**\n  - In: 2 Toxic Deluge, plus Ensnaring Bridge and Walking Ballista (or fetch them with Karn).\n  - Out: 2 Ulamog, some Thoughtseize (it costs you life you can't spare).\n- **Devoted Druid Combo (5.1%):** Cursed Totem, Ballista and Disruptor Flute. Fatal Push is already in the main deck.\n- **Storm and Goryo's Vengeance (3.7% each), Living End (2.4%):**\n  - In: Thoughtseize, Trinisphere against Storm.\n  - In: Tormod's Crypt, Grafdigger's Cage and the new Bojuka Bog against the graveyard decks.\n  - Out: Wurmcoil, All Is Dust.\n- **Affinity, Energy and Domain Zoo:** Karn and Wurmcoil do the work. Add Toxic Deluge against creature swarms.\n- **UW and Jeskai Control:** cut some Fatal Push, add the 4th Thoughtseize, and use Karn to fetch The Stone Brain.\n- **Boros Land Destruction (1.8%):** this will stay a bad matchup. Expedition Map and Urza's Cave help you rebuild.\n\nTo make room in the sideboard I cut Dismember and Sheoldred's Edict, since 4 Fatal Push already handle small creatures. Disruptor Flute and Bojuka Bog took their places.\n\n## Label and what's unverified\n**Brew.** The Tron lands, Karn and the sideboard artifacts come from Eldrazi Tron. The all-black shell is new.\n- Wurmcoil Engine showed up in just 1 Modern list in the last 90 days, Chromatic Star in 2 and Deadly Dispute in 0. Those slots are my judgment, not proven choices.\n- The simulator only counts how much mana a land produces, so it doesn't model Temple's Eldrazi-only two-mana mode. Temple's real value for Thought-Knot Seer is probably higher than the table shows.\n- I didn't measure any matchup win rates. The matchup read above is based on what each card does.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Urza's Tower"},{"qty":4,"name":"Urza's Mine"},{"qty":4,"name":"Urza's Power Plant"},{"qty":2,"name":"Urza's Cave"},{"qty":1,"name":"Urborg, Tomb of Yawgmoth"},{"qty":8,"name":"Swamp"},{"qty":2,"name":"Eldrazi Temple"},{"qty":4,"name":"Expedition Map"},{"qty":4,"name":"Chromatic Star"},{"qty":2,"name":"Mind Stone"},{"qty":3,"name":"Deadly Dispute"},{"qty":4,"name":"Fatal Push"},{"qty":3,"name":"Thoughtseize"},{"qty":2,"name":"Kozilek's Command"},{"qty":4,"name":"Karn, the Great Creator"},{"qty":4,"name":"Thought-Knot Seer"},{"qty":2,"name":"Wurmcoil Engine"},{"qty":2,"name":"Ulamog, the Ceaseless Hunger"},{"qty":1,"name":"All Is Dust"}],"side":[{"qty":1,"name":"Tormod's Crypt"},{"qty":1,"name":"Grafdigger's Cage"},{"qty":1,"name":"Ensnaring Bridge"},{"qty":1,"name":"Trinisphere"},{"qty":1,"name":"Torpor Orb"},{"qty":1,"name":"Walking Ballista"},{"qty":1,"name":"Cityscape Leveler"},{"qty":1,"name":"The Stone Brain"},{"qty":1,"name":"Liquimetal Coating"},{"qty":1,"name":"Cursed Totem"},{"qty":1,"name":"Disruptor Flute"},{"qty":1,"name":"Bojuka Bog"},{"qty":2,"name":"Toxic Deluge"},{"qty":1,"name":"Thoughtseize"}],"mainCount":60,"sideCount":15}}},{"id":"a4ed1e459b52","prompt":"fresh-premodern-city-of-traitors-black","brew":true,"left":{"text":"**The deck is a brew.** It borrows the proven Moneyball Black shell: Duress, Cabal Therapy, Hypnotic Specter, Withered Wretch, Ravenous Rats and Dark Ritual. I added City of Traitors and Priest of Gix on top of it. check_deck found no errors or warnings. I did not run draw odds for how often the City/Priest opener shows up, so I can't give a percentage.\n\n**Plan:** Make the opponent discard on turns 1–2, land a Hypnotic Specter or Nantuko Shade early, and finish with Specters, Shades and Mishra's Factory. Smother, Diabolic Edict and Snuff Out clear blockers. Graveborn Muse draws extra cards later.\n\n**Why City of Traitors works here:**\n- City taps for {C}{C}, and Priest of Gix costs {2}{B}. On turn 2, City plus one Swamp pays for Priest.\n- Priest then adds {B}{B}{B}. That pays for Hypnotic Specter ({1}{B}{B}) with one black mana left for Duress or Cabal Therapy.\n- With Dark Ritual on turn 2, you have City's two colorless plus Swamp's black plus Ritual's three. That is five mana, enough for Priest and then Graveborn Muse.\n- If you tap City before playing your next land, it still pays for that turn. On turn 3 you get four mana, and the sacrifice costs you nothing.\n- It is a risk: City is a dead land late, and playing Wasteland sacrifices it too. That is why I run only 2.\n\n**Mana (22 lands):**\n- 15 Swamp, 3 Mishra's Factory, 2 Wasteland and 2 City of Traitors.\n- That gives 15 black sources, below the 17.3 average in Moneyball lists. I traded some consistency for the City/Priest burst, so mulligan hands with no Swamp.\n- Priest, Dark Ritual and the low curve (average mana value 2) make up for the lower land count.\n\n**Sideboard (what each card is for):**\n- **Enchantress (12.5% of the field):** Dystopia ×3 and Gloom ×2.\n- **Terrageddon and Goblins:** Engineered Plague ×3, naming Goblin or a similar type. Wasteland stays in the main deck for their nonbasic lands.\n- **Stiflenought and Sligh:** Powder Keg ×2, plus Spinning Darkness, Snuff Out and Diabolic Edict.\n- **Replenish and graveyard decks:** Tormod's Crypt. Withered Wretch also exiles cards from graveyards.\n- **Racing or grinding games:** Drain Life as a finisher.\n- **Against slow control (Standstill, Psychatog):** bring in the Engineered Plagues and Edicts only where they match what you're facing. Keep the discard suite and creatures in.\n\nI could not verify how the City/Priest build performs in tournaments. Only the Moneyball core has results behind it.","error":false,"deck":{"commander":[],"main":[{"qty":15,"name":"Swamp"},{"qty":3,"name":"Mishra's Factory"},{"qty":2,"name":"City of Traitors"},{"qty":2,"name":"Wasteland"},{"qty":4,"name":"Duress"},{"qty":4,"name":"Cabal Therapy"},{"qty":4,"name":"Dark Ritual"},{"qty":4,"name":"Priest of Gix"},{"qty":4,"name":"Hypnotic Specter"},{"qty":3,"name":"Ravenous Rats"},{"qty":3,"name":"Withered Wretch"},{"qty":2,"name":"Graveborn Muse"},{"qty":2,"name":"Smother"},{"qty":2,"name":"Diabolic Edict"},{"qty":2,"name":"Cursed Scroll"},{"qty":1,"name":"Snuff Out"},{"qty":1,"name":"Plaguebearer"},{"qty":2,"name":"Nantuko Shade"}],"side":[{"qty":3,"name":"Engineered Plague"},{"qty":3,"name":"Dystopia"},{"qty":2,"name":"Gloom"},{"qty":2,"name":"Powder Keg"},{"qty":1,"name":"Tormod's Crypt"},{"qty":1,"name":"Drain Life"},{"qty":1,"name":"Spinning Darkness"},{"qty":1,"name":"Diabolic Edict"},{"qty":1,"name":"Snuff Out"}],"mainCount":60,"sideCount":15}},"right":{"text":"**Deck: City of Traitors mono-black aggro-discard (brew, borrowing the Moneyball Black shell).** I did not simulate this final 60. The mana figures below are from the closely related earlier version.\n\n**Plan.** City of Traitors, Dark Ritual, Lotus Petal and Mox Diamond power out Phyrexian Negator, Hypnotic Specter, Priest of Gix and the shadow creatures on turns 1–2. Duress and Cabal Therapy clear the way. Edicts and cheap removal then protect the clock.\n\n**Changes after reviewing the draft.**\n- **Misses in the meta.** The draft's Terror and Royal Assassin showed 0 recent results in the tool, and Blackmail and Funeral Charm are weak. I cut all but one Terror.\n- **Colorless lands and threats.**\n  - Mishra's Factory is a colorless land that doubles as a threat. It appears in 21.7% of recent lists, and Moneyball Black plays 4.\n  - The 14 Swamps and the 18 lands are now 12 Swamps, 4 City and 3 Factory.\n  - Dauthi Slayer, Dauthi Horror and Black Knight add cheap black threats. Shadow dodges blockers and edicts.\n  - Smother kills Sligh and Enchantress creatures, but Terror can't hit artifact creatures like Juggernaut.\n- **Originality.** My first revision was rejected because 65% of it matched a real Moneyball list (the limit is 60%). The Dauthi and Black Knight package fixed that.\n\n**Mana (measured on the earlier version, 19 lands plus Scrolls and Shades).**\n- Mulligan rate was 8.6%.\n- Screw rate was 29.8%, versus 34.1% for the original 18-land draft.\n- The simulator counted at least one black source on 94.1% of turn-1 hands and 88.7% by turn 2. Colorless lands cost some color consistency.\n- Only 17.5% of games had a threat and accelerant ready by turn 2. The simulator may undercount Dark Ritual.\n- The deck check says 19 lands is light. It recommended about 20.8 lands, and real Moneyball lists run about 23.\n- City of Traitors is sacrificed when you play another land, so it is weak late. That is a real cost of the deck.\n\n**Matchups (from meta shares).**\n- **Likely good:**\n  - **Enchantress (12.5%):** discard plus Gloom from the sideboard.\n  - **Hermit Druid and Replenish:** discard and graveyard hate.\n  - **UB Psychatog:** discard and fast threats.\n- **Likely bad:**\n  - **Sligh (9.9%):** burn kills Specter and Negator, and Negator and Factory cost life. This is a judgment from card text, not a measured win rate.\n  - **Terrageddon (11.2%):** the deck cannot recover from land destruction, and City is a liability against Wasteland.\n- **Stiflenought (10.4%):** Vendetta, Snuff Out, Smother and Edicts all hit Juggernaut.\n\n**Sideboard** (Engineered Plague 3, Dystopia 3, Gloom 2, Wasteland 2, Powder Keg 2, Withered Wretch 2, Tormod's Crypt 1). The Plague, Dystopia and Gloom plan comes from Moneyball Black's own sideboard.\n- **Versus Enchantress:** bring in Gloom ×2 and Dystopia ×3, and cut Priest, Smother and Chainer's Edict.\n- **Versus Sligh and Goblins:** bring in Engineered Plague (naming Goblin), Powder Keg and Withered Wretch. Cut Cabal Therapy, Duress and Black Knight.\n- **Versus Terrageddon:** bring in Wasteland ×2, and cut the weakest removal. I am not certain Wasteland is good here, and you should watch your own land count.\n- **Versus Hermit Druid and Replenish:** bring in Tormod's Crypt and Withered Wretch.\n\n**Unverified.** I did not run matchup simulations, and none of this is a measured win rate.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"City of Traitors"},{"qty":12,"name":"Swamp"},{"qty":3,"name":"Mishra's Factory"},{"qty":4,"name":"Dark Ritual"},{"qty":4,"name":"Lotus Petal"},{"qty":2,"name":"Mox Diamond"},{"qty":4,"name":"Phyrexian Negator"},{"qty":4,"name":"Hypnotic Specter"},{"qty":2,"name":"Priest of Gix"},{"qty":3,"name":"Dauthi Slayer"},{"qty":2,"name":"Dauthi Horror"},{"qty":2,"name":"Black Knight"},{"qty":2,"name":"Duress"},{"qty":3,"name":"Cabal Therapy"},{"qty":2,"name":"Vendetta"},{"qty":2,"name":"Snuff Out"},{"qty":2,"name":"Smother"},{"qty":2,"name":"Chainer's Edict"},{"qty":1,"name":"Terror"}],"side":[{"qty":3,"name":"Engineered Plague"},{"qty":3,"name":"Dystopia"},{"qty":2,"name":"Gloom"},{"qty":2,"name":"Wasteland"},{"qty":2,"name":"Powder Keg"},{"qty":2,"name":"Withered Wretch"},{"qty":1,"name":"Tormod's Crypt"}],"mainCount":60,"sideCount":15}}},{"id":"a655df79c0ae","prompt":"fresh-premodern-5c-solution","brew":true,"left":{"text":"I couldn't find a \"Solution\" deck in the card pool or the tournament data. Searching \"solution\" returned no cards, and there is no archetype by that name. If you meant a specific list, tell me and I'll rebuild around it. The only five-colour archetype in the results is **5 Color Psychatog**, so I built the best version of that.\n\n**Plan:** Play cheap blue cantrips and free counters (Daze, Gush) to keep tempo. Land an early threat, either Quirion Dryad or Meddling Mage, and protect it with Counterspell, Swords to Plowshares and Fire/Ice. Armageddon finishes while you're ahead, and Psychatog is the top end. Gush draws cards for free, and the whole deck costs very little mana.\n\n**Key cards:**\n- **Quirion Dryad** grows whenever you cast a white, blue, black or red spell, and this deck casts about 40 of them.\n- **Meddling Mage** is the second threat and also shuts off a key card in Replenish or Standstill.\n- **Swords to Plowshares** is the cheapest answer to anything. It is the most played card in the format, in 976 recent lists.\n- **Fire/Ice** kills small creatures from Sligh and Goblins, or taps a permanent and draws.\n- **Seal of Cleansing** is the one change from the standard list: I moved it into the main deck, in place of one Sleight of Hand. Enchantress is the top deck in the data at 12.5% of lists, and Terrageddon (11.2%) also plays enchantments.\n\n**Mana:** 19 lands. That is 4 City of Brass, 4 Gemstone Mine, 4 Flooded Strand, 6 Island and 1 Plains, plus Mox Diamond. `check_deck` counts sources as W14, U19, B9, R9, G9. That is in line with real 5 Color Psychatog lists, with no warnings. `check_deck` suggested more lands, but real lists play about 19 and the deck's average mana value is 2.2. The weak spot is Wasteland, which is in about 29% of recent lists, since most of your mana is nonbasic. Island, Plains and the Strands help a little.\n\n**Sideboard (15):**\n- **Sligh and Goblins:** bring in 4 Blue Elemental Blast, 2 Pyroclasm and 2 Engineered Plague. Take out Armageddon and Psychatog, which are slow.\n- **Enchantress and Terrageddon:** bring in 2 Ray of Revelation and 3 Seal of Cleansing, plus Duress to strip their key spell. Take out Fire/Ice and Daze.\n- **Stiflenought and Standstill:** this is a counterspell mirror. Duress and Meddling Mage do the work. Side out the Engineered Plague and the Pyroclasms.\n- **UB Psychatog and Replenish:** Meddling Mage on their key card, plus Duress. Ray of Revelation and the Seals answer enchantment-based plans.\n\n**Label:** tuned. It is based on the 5 Color Psychatog archetype and a recent list, which placed 19th at Premodern Challenge 16 with a 1-4 record. That is a weak result, so don't treat this as a proven winner. I used the archetype's card averages as well as that one list. I couldn't verify how the deck matches up against each opposing deck, since the tools only show what people play.","error":false,"deck":{"commander":[],"main":[{"qty":1,"name":"Mox Diamond"},{"qty":4,"name":"Meddling Mage"},{"qty":2,"name":"Psychatog"},{"qty":4,"name":"Quirion Dryad"},{"qty":4,"name":"Counterspell"},{"qty":2,"name":"Daze"},{"qty":4,"name":"Gush"},{"qty":4,"name":"Opt"},{"qty":4,"name":"Swords to Plowshares"},{"qty":4,"name":"City of Brass"},{"qty":4,"name":"Flooded Strand"},{"qty":4,"name":"Gemstone Mine"},{"qty":6,"name":"Island"},{"qty":1,"name":"Plains"},{"qty":2,"name":"Armageddon"},{"qty":4,"name":"Portent"},{"qty":2,"name":"Sleight of Hand"},{"qty":3,"name":"Fire/Ice"},{"qty":1,"name":"Seal of Cleansing"}],"side":[{"qty":4,"name":"Blue Elemental Blast"},{"qty":2,"name":"Duress"},{"qty":2,"name":"Engineered Plague"},{"qty":2,"name":"Pyroclasm"},{"qty":2,"name":"Ray of Revelation"},{"qty":3,"name":"Seal of Cleansing"}],"mainCount":60,"sideCount":15}},"right":{"text":"I submitted the most recent top-finishing 5 Color Psychatog list, unchanged, as a stock deck. I couldn't find anything called \"Solution\" in the card pool or the results data, so I assumed you meant the five-color deck. Tell me if \"Solution\" means something else.\n\n**Plan:** The deck is a tempo-control build. It plays cheap threats (Meddling Mage, Quirion Dryad, Psychatog) and backs them with Counterspell, Daze, Swords to Plowshares and Fire/Ice. Gush, Opt, Portent and Sleight of Hand smooth the draws. Armageddon ends the game once you're ahead on board.\n\n**Key cards:**\n- **City of Brass, Gemstone Mine and Flooded Strand** (4 each) fix your colors.\n- **Meddling Mage** is a cheap threat that taxes the opponent's key spell.\n- **Armageddon** (2 copies) lets a small lead on board win the game.\n\n**Mana:** The list has 19 lands plus Mox Diamond. The check tool counts these colored sources: W 14, U 19, B 9, R 9, G 9. The 5 Color Psychatog lists in the results average 19.2 lands, so this matches them.\n\nIn 5,000 simulated games:\n\n| Measure | Result |\n|---|---|\n| Mulligan rate | 8.9% |\n| Games short on lands (screw) | 28.7% |\n| Games with too many lands (flood) | 0.2% |\n| Colors castable on turn 3 | 85.3% |\n| Colors castable on turn 6 | 90.4% |\n| A creature or counterspell in hand and castable by turn 3 | 37.6% |\n| A creature or counterspell in hand by turn 3 | 49.8% |\n\nThe check tool recommends about 21.6 lands, so the low land count is a trade-off. It leans on cheap spells: 29 of the 40 non-land cards cost 1 or 2 mana.\n\n**Colors:** The main deck only uses white, blue, red and green, with black appearing only in the sideboard. It is a \"five-color\" deck only in the sense that the lands can produce all five colors. All cards fit within WUBRG.\n\n**Sideboarding:**\n- **Against red (Sligh, Goblins):** bring in Blue Elemental Blast and Pyroclasm. Blue Elemental Blast is the main answer to a red spell, and Pyroclasm clears small creatures.\n- **Against Stiflenought and artifact decks:** bring in Seal of Cleansing and Ray of Revelation. Ray of Revelation also answers Enchantress, the most-played deck in the results (12.5% share).\n- **Against black or creature decks:** bring in Engineered Plague and Duress.\n- **Against slow or combo decks:** the sideboard has little for them. Armageddon is already in the main deck, so you can race them or hold counters.\n\n**Unverified:** I didn't check how this list matches up against each deck in the field. The source list went 1-4 and finished 19th at Premodern Challenge 16, so it is proven to be playable, not shown to be the best. I made no changes to it.","error":false,"deck":{"commander":[],"main":[{"qty":1,"name":"Mox Diamond"},{"qty":4,"name":"Meddling Mage"},{"qty":2,"name":"Psychatog"},{"qty":4,"name":"Quirion Dryad"},{"qty":4,"name":"Counterspell"},{"qty":2,"name":"Daze"},{"qty":4,"name":"Gush"},{"qty":4,"name":"Opt"},{"qty":4,"name":"Swords to Plowshares"},{"qty":4,"name":"City of Brass"},{"qty":4,"name":"Flooded Strand"},{"qty":4,"name":"Gemstone Mine"},{"qty":6,"name":"Island"},{"qty":1,"name":"Plains"},{"qty":2,"name":"Armageddon"},{"qty":4,"name":"Portent"},{"qty":3,"name":"Sleight of Hand"},{"qty":3,"name":"Fire/Ice"}],"side":[{"qty":4,"name":"Blue Elemental Blast"},{"qty":2,"name":"Duress"},{"qty":2,"name":"Engineered Plague"},{"qty":2,"name":"Pyroclasm"},{"qty":2,"name":"Ray of Revelation"},{"qty":3,"name":"Seal of Cleansing"}],"mainCount":60,"sideCount":15}}},{"id":"e7bf532d2863","prompt":"fresh-vintage-no-power","brew":true,"left":{"text":"**Bazaar Dredge (stock), Vintage**\n\n**Why this deck.** Most of the top Vintage decks right now run Power Nine. The two biggest non-Lurrus decks, Mono-White Initiative (12.1% of the field) and Raker Shops (9.1%), both play it: the latest 5-0 Initiative list has Black Lotus and all five Moxen. I only pulled the Initiative list myself; the Shops claim is my judgment. Dredge is the most-played deck in the last 30 days that doesn't need Power: 26 lists, 3.9% of the field. In the 94 Dredge lists recorded, Moxen and Lotus each show up in only 2–3%. The other Power-free Bazaar deck, Hollow Vine, is smaller (1.6%). That makes Dredge the safest answer to \"most competitive without Power.\" That's based on how many people play it; no tool measured win rates.\n\n**The list** (Vintage Challenge, 8th place, 4-3, 2026-10-11)\n- **Lands (4):** 4 Bazaar of Baghdad\n- **Creatures (37):** 4 Golgari Thug, 4 Stinkweed Imp, 1 Golgari Grave-Troll, 4 Ichorid, 4 Narcomoeba, 4 Prized Amalgam, 4 Shambling Shell, 4 Silversmote Ghoul, 4 Hollow One, 4 Grief\n- **Spells (19):** 4 Creeping Chill, 4 Noxious Revival, 4 Force of Will, 1 Force of Negation, 1 Mental Misstep, 1 Chalice of the Void, 4 Serum Powder\n- **Sideboard (15):** 4 Force of Vigor, 4 Sickening Shoal, 3 Force of Negation, 3 Wasteland, 1 Strip Mine\n\n**The plan.** Bazaar draws two and discards three each turn. Instead of drawing normally, you dredge the cards with dredge (Thug, Imp, Grave-Troll) to fill your graveyard quickly.\n- Narcomoeba comes into play free when milled.\n- Each Creeping Chill that gets milled deals 3 damage and gains you 3 life. That life gain brings back Silversmote Ghoul.\n- Ichorid returns from the graveyard every upkeep, and Prized Amalgam returns at the end of the turn.\n- Hollow One costs nothing after one Bazaar activation (each discarded card makes it 2 cheaper).\n- The deck needs almost no mana. Grief, Force of Will and Force of Negation can all be cast free, which lets you strip a key card or counter one on turn 1.\n\n**Mana and consistency**\n- **Odds of a Bazaar:** 39.9% in your opening 7 on the play and 44.5% by your first draw on the draw (exact odds, measured). That's why the deck runs 4 Serum Powder: it lets you swap your whole hand for a new one before deciding to mulligan.\n- **The simulation doesn't fit this deck.** It reported a 60.2% mulligan rate and 98.4% \"mana screw,\" because it treats 4 lands as a broken mana base and can't use Serum Powder. In practice, Dredge players do mulligan hard to find Bazaar, so the high mulligan rate is roughly real. The screw number isn't: the deck barely uses mana.\n- **Deck check:** passed with no issues. 4 lands sits within the normal Dredge range (average 4.57).\n\n**Sideboarding** (which cards go in is from the stock list; the matchup advice is my judgment)\n- **Against graveyard hate** (Leyline of the Void, Rest in Peace, both in the Initiative sideboard) **and against Shops:** bring in Force of Vigor. It's free on their turn and destroys two artifacts or enchantments.\n- **Against Initiative and creature decks** (White Plume Adventurer, Archon of Emeria, Witch Enchanter): bring in Sickening Shoal as free removal.\n- **Against combo** (Paradoxical Outcome, Tinker, Oath, Underworld Breach, Doomsday): bring in the 3 extra Force of Negation.\n- **Against Shops and Initiative:** Wasteland and Strip Mine can hit Ancient Tomb, Karakas and Cavern of Souls.\n- Cut cards like Chalice, Mental Misstep or some Hollow Ones depending on the matchup.\n\n**Label:** stock. This is the most recent top-finishing Dredge list, unchanged.\n\n**Not verified**\n- It's a 4-3 Top 8 finish, not a tournament win.\n- No tool measured how this deck does against specific opponents. The matchup notes above are my judgment.","error":false,"deck":{"commander":[],"main":[{"qty":1,"name":"Chalice of the Void"},{"qty":4,"name":"Serum Powder"},{"qty":1,"name":"Golgari Grave-Troll"},{"qty":4,"name":"Golgari Thug"},{"qty":4,"name":"Grief"},{"qty":4,"name":"Hollow One"},{"qty":4,"name":"Ichorid"},{"qty":4,"name":"Narcomoeba"},{"qty":4,"name":"Prized Amalgam"},{"qty":4,"name":"Shambling Shell"},{"qty":4,"name":"Silversmote Ghoul"},{"qty":4,"name":"Stinkweed Imp"},{"qty":1,"name":"Force of Negation"},{"qty":4,"name":"Force of Will"},{"qty":1,"name":"Mental Misstep"},{"qty":4,"name":"Noxious Revival"},{"qty":4,"name":"Bazaar of Baghdad"},{"qty":4,"name":"Creeping Chill"}],"side":[ *\nThe deck runs four lands: four Bazaars. The checker suggested about 11 lands for a normal deck, but that doesn't apply here, since real Dredge lists average 4.57 lands. Almost nothing needs mana. Creatures come back from the graveyard, Grief and the Forces are cast for free, and Chill does its damage when milled.\n\n**Sideboarding against the current field**\n- **Graveyard hate (Leyline of the Void, Containment Priest, Null Rod in nearly every Mono-White Initiative sideboard):** Bring in Force of Vigor ×4 to destroy Leylines, Rest in Peace or artifacts. Bring in Wasteland ×3 and Strip Mine against Karakas, Cavern of Souls and Ancient Tomb. Take out Chalice, Mental Misstep and some Hollow Ones.\n- **Mono-White Initiative and other creature decks:** Bring in Sickening Shoal ×4, which you cast for free by exiling a black card, to kill Archon of Emeria, Witch Enchanter or Clarion Conqueror. Your free creatures are mostly black, so they double as the cost. Wasteland also helps against Ancient Tomb and Cavern.\n- **Lurrus Control, Paradoxical Outcome, Tinker, Coveted Jewel Combo, Oath:** Bring in Force of Negation ×3 to stop their key noncreature spells. Force of Vigor also handles Oath of Druids and artifact engines. Take out Hollow One and Chalice where Chalice is weak.\n- **Shops (Raker and Sphere):** Bring in Force of Vigor and Wasteland/Strip Mine. Take out the counterspells.\n\n**What I couldn't verify**\n- **Prices:** \"Non-Power Nine\" usually means \"cheaper,\" but Bazaar of Baghdad is a very expensive card in its own right. I have no price data, so if budget is your real goal, check that first.\n- **Matchup win rates:** I have no head-to-head data. \"Most competitive\" here is based on how often each deck is played and finishes well, not on measured matchups.","error":false,"deck":{"commander":[],"main":[{"qty":1,"name":"Chalice of the Void"},{"qty":4,"name":"Serum Powder"},{"qty":1,"name":"Golgari Grave-Troll"},{"qty":4,"name":"Golgari Thug"},{"qty":4,"name":"Grief"},{"qty":4,"name":"Hollow One"},{"qty":4,"name":"Ichorid"},{"qty":4,"name":"Narcomoeba"},{"qty":4,"name":"Prized Amalgam"},{"qty":4,"name":"Shambling Shell"},{"qty":4,"name":"Silversmote Ghoul"},{"qty":4,"name":"Stinkweed Imp"},{"qty":1,"name":"Force of Negation"},{"qty":4,"name":"Force of Will"},{"qty":1,"name":"Mental Misstep"},{"qty":4,"name":"Noxious Revival"},{"qty":4,"name":"Bazaar of Baghdad"},{"qty":4,"name":"Creeping Chill"}],"side":[{"qty":3,"name":"Force of Negation"},{"qty":4,"name":"Force of Vigor"},{"qty":4,"name":"Sickening Shoal"},{"qty":1,"name":"Strip Mine"},{"qty":3,"name":"Wasteland"}],"mainCount":60,"sideCount":15}}},{"id":"e89658e61b0a","prompt":"fresh-premodern-5c-solution","brew":true,"left":{"text":"**Note on the name:** the tournament data has no deck called \"Solution\" or \"5c Solution.\" The closest five-color deck it tracks is **5 Color Psychatog**: Meddling Mage, Quirion Dryad, Gush, Fire // Ice, Swords to Plowshares and Armageddon, played on City of Brass and Gemstone Mine. It has 14 lists in the last 90 days, so I've assumed that's the deck you mean. If \"Solution\" is something else, like a domain control deck, tell me and I'll rebuild it.\n\n## The deck (Premodern, tuned)\n\n**Creatures (10)**\n- 4 Meddling Mage\n- 4 Quirion Dryad\n- 2 Psychatog\n\n**Spells (31)**\n- 4 Counterspell\n- 2 Daze\n- 4 Gush\n- 4 Opt\n- 4 Portent\n- 2 Sleight of Hand\n- 4 Swords to Plowshares\n- 3 Fire // Ice\n- 1 Seal of Cleansing\n- 2 Armageddon\n- 1 Mox Diamond\n\n**Lands (19)**\n- 4 City of Brass\n- 4 Gemstone Mine\n- 4 Flooded Strand\n- 6 Island\n- 1 Plains\n\n**Sideboard (15)**\n- 4 Hydroblast\n- 3 Seal of Cleansing\n- 2 Ray of Revelation\n- 2 Pyroclasm\n- 2 Duress\n- 1 Engineered Plague\n- 1 Tormod's Crypt\n\n## How it plays\nPlay a cheap threat early: Quirion Dryad, Meddling Mage, or Psychatog. Then protect it with Daze, Counterspell and Swords to Plowshares while one-mana cantrips draw you through the deck. Once you're ahead on board, Armageddon can destroy every land and leave the opponent with nothing to answer your creature.\n\n## Why the key cards\n- **Quirion Dryad** gets a +1/+1 counter every time you cast a white, blue, black or red spell. Almost every spell here counts, so it often becomes a 4/4 or bigger within a few turns.\n- **Gush** draws two cards and costs nothing if you return two Islands to your hand. It's free card draw, it powers up Psychatog, and it adds a counter to Dryad.\n- **Meddling Mage** names a card the opponent can't cast, which shuts down a key piece of their deck while it attacks.\n- **Fire // Ice and Swords to Plowshares** are cheap removal, and Ice can also tap a blocker or a land.\n- **Armageddon** is the finisher once you have a creature on the board.\n\n**My change to the stock list:** I cut one Sleight of Hand for a maindeck Seal of Cleansing. Enchantress is the most-played deck right now (12.5%), and Seal can also destroy Phyrexian Dreadnought from Stiflenought (10.4%). It's a white spell, so it still adds a counter to Dryad. The rest of the list is the most recent finishing list, left as is because it matches the archetype's averages.\n\n## Mana\n19 lands, with 14 white, 19 blue, 9 black, 9 red and 9 green sources. That matches real lists of the archetype, which average 19.2 lands. `check_deck` reported no issues. The count is low because 14 one-mana spells and Mox Diamond make up for it. The off-colors only appear in Psychatog (black), Fire (red) and Dryad (green), so City of Brass, Gemstone Mine and Mox Diamond can cover them. Fetch Islands first, since Gush and Daze need them.\n\n## Sideboarding against the current top decks\n- **Enchantress:** bring in 3 Seal of Cleansing, 2 Ray of Revelation and 2 Duress. Take out Fire // Ice and 1–2 Daze.\n- **Stiflenought (blue):** bring in Seal of Cleansing for Dreadnought and Duress. Take out Armageddon, which is weak against their cheap threats and Daze.\n- **Sligh and Goblins:** bring in 4 Hydroblast (it can counter or destroy red cards), 2 Pyroclasm and Engineered Plague (name Goblin). Take out Armageddon, Daze and Sleight of Hand. I chose Hydroblast over Blue Elemental Blast for this reason, since Blast can only hit red cards.\n- **Terrageddon:** keep Armageddon in, since you can play around your own better. Bring in Duress and Ray of Revelation.\n- **Hermit Druid and Replenish:** bring in Tormod's Crypt and Duress.\n\n## Honest caveats\n- **It's a tuned list.** It's built on the most recent finishing 5 Color Psychatog list from Premodern Challenge 16.\n- **\"Best\" is a stretch.** That list finished 19th with a 1-4 record, and the archetype isn't in the 30-day top 20. It's a real deck, but a small one with weak recent results.\n- **I couldn't confirm the name.** Nothing in the data links \"Solution\" to this deck, so that part of my answer is an inference.","error":false,"deck":{"commander":[],"main":[{"qty":4,"name":"Meddling Mage"},{"qty":4,"name":"Quirion Dryad"},{"qty":2,"name":"Psychatog"},{"qty":4,"name":"Counterspell"},{"qty":2,"name":"Daze"},{"qty":4,"name":"Gush"},{"qty":4,"name":"Opt"},{"qty":4,"name":"Portent"},{"qty":2,"name":"Sleight of Hand"},{"qty":4,"name":"Swords to Plowshares"},{"qty":3,"name":"Fire // Ice"},{"qty":1,"name":"Seal of Cleansing"},{"qty":2,"name":"Armageddon"},{"qty":1,"name":"Mox Diamond"},{"qty":4,"name":"City of Brass"},{"qty":4,"name":"Gemstone Mine"},{"qty":4,"name":"Flooded Strand"},{"qty":6,"name":"Island"},{"qty":1,"name":"Plains"}],"side":[{"qty":4,"name":"Hydroblast"},{"qty":3,"name":"Seal of Cleansing"},{"qty":2,"name":"Ray of Revelation"},{"qty":2,"name":"Pyroclasm"},{"qty":2,"name":"Duress"},{"qty":1,"name":"Engineered Plague"},{"qty":1,"name":"Tormod's Crypt"}],"mainCount":60,"sideCount":15}},"right":{"text":"I didn't find a deck called \"Solution\" in the Premodern results. A search under \"Solution\", \"The Solution\", \"5 Color Solution\", \"5C\", \"Domain\" and \"Five Color\" turned up nothing. So I've assumed you mean the most-played true five-color deck in the current results, **Hermit Druid Combo** (a Survival of the Fittest graveyard-combo deck). It makes up 5.5% of the field, with 42 lists in the last 30 days. The base is its most recent top list, a 5-0 Premodern League finish (2026-10-13), and I haven't changed it.\n\n**The plan**\nMake mana with Birds, Wall of Roots and Elvish Spirit Guide, then land a Hermit Druid or a Survival of the Fittest by turn 2–3. With 22 lands and none of them basic, an active Hermit Druid should mill most or all of your library. Then a reanimation spell (Unearth, Animate Dead, Shallow Grave) or the Volrath's Shapeshifter / Krosan Reclamation package turns that graveyard into a win. Survival is the second way in: it lets you discard the right creatures and set up the same finish without Druid.\n\n**Why the key cards**\n- **4 Hermit Druid, 4 Survival of the Fittest:** the two engines. All 93 lists in the archetype data run 4 Druid, and the lists that play Survival run 4.\n- **The single-copy creatures** (Akroma, Karmic Guide, Palinchron, Phyrexian Devourer, Psychatog, Squee, Triskelion, Battlefield Scrounger, plus 2 Shapeshifter) are the combo pieces and finishers. Each one appears in about 86–87% of lists.\n- **4 Cabal Therapy:** protects the combo by stripping counterspells and hate cards. It's in 100% of lists.\n- I haven't checked these cards' exact rules text this session. The combo lines above are the usual way the deck plays, not something I traced step by step. Read the cards before you sleeve up.\n\n**Mana (measured)**\n- 22 lands, 2.53 average mana value. Colored sources: G 24, U 19, B 18, W 16, R 14, all within the normal range for this archetype (for example, 23.2 G and 19.5 U on average). check_deck found no issues.\n- Over 5,000 simulated games: 19.7% mulligan rate, 10.4% mana screw, 1.9% flood.\n- Correct colors: 86.1% on turn 1, 98.5% on turn 2.\n- Hermit Druid or Survival in hand and castable by turn 2: 41.1%. This doesn't count digging or mulligans.\n- The mulligan rate is high because the deck keeps only hands that can find its engine.\n\n**Sideboarding (judgment, based on the field)**\n- **Sligh, Goblins, GR Zoo (fast red decks):** bring in Pyroclasm ×2, plus Swords to Plowshares if your build has room. Cut slow pieces like Shallow Grave.\n- **Stiflenought, UB Psychatog, Standstill (blue tempo and counterspells):** bring in Xantid Swarm ×2 and Duress ×2, and keep all four Therapy.\n- **Enchantress, Replenish (enchantment decks):** bring in Naturalize ×2, Ray of Revelation, Monk Realist and Uktabi Orangutan. Enlightened Tutor finds the answer you need.\n- **Terrageddon (land destruction):** Elvish Spirit Guide and the mana creatures carry you through. Swords handles their threats.\n- **Graveyard hate in general:** the Survival line and Unearth help you rebuild. Eladamri's Vineyard and Ghitu Slinger are niche cards that the list carries.\n\n**Status:** stock, the latest 5-0 Hermit Druid Combo list, unchanged. The deck passed the legality and color checks. Unverified: whether this is the deck you call \"Solution\". If that name refers to a different five-color build (for example, an old-school control deck), tell me and I'll rebuild around it, keeping in mind it has no recent results to work from.","error":false,"deck":{"commander":[],"main":[{"qty":1,"name":"Akroma, Angel of Wrath"},{"qty":1,"name":"Battlefield Scrounger"},{"qty":4,"name":"Birds of Paradise"},{"qty":2,"name":"Elvish Spirit Guide"},{"qty":4,"name":"Hermit Druid"},{"qty":1,"name":"Karmic Guide"},{"qty":1,"name":"Palinchron"},{"qty":1,"name":"Phyrexian Devourer"},{"qty":1,"name":"Psychatog"},{"qty":1,"name":"Squee, Goblin Nabob"},{"qty":1,"name":"Triskelion"},{"qty":2,"name":"Volrath's Shapeshifter"},{"qty":3,"name":"Wall of Roots"},{"qty":1,"name":"Animate Dead"},{"qty":4,"name":"Survival of the Fittest"},{"qty":1,"name":"Krosan Reclamation"},{"qty":2,"name":"Shallow Grave"},{"qty":1,"name":"Brushland"},{"qty":4,"name":"City of Brass p ×1 protect the plan. Chalice stays in the main deck.\n\n**Mana:** The deck runs 4 lands (the four Bazaars) and no colored sources. That matches real Dredge lists, which average 4.57 lands. check_deck passed with no errors or warnings. Its suggestion of about 11 lands doesn't suit a deck built around Bazaar and free spells.\n\n**Sideboard (15 cards):**\n- **Graveyard hate:** The biggest risks are Mono-White Initiative and Oath. Their sideboards commonly hold Leyline of the Void, Rest in Peace, Containment Priest and Grafdigger's Cage. Bring in Force of Vigor ×4 to hit artifacts and enchantments. Add Force of Negation ×3 to stop the answer before it lands.\n- **Wasteland ×3 and Strip Mine:** These are for decks that rely on nonbasic lands or utility lands, such as Shops and Initiative.\n- **Sickening Shoal ×4:** Use these as free removal against small creatures, especially the Initiative creatures.\n- **Being on the draw:** Think about whether to side out slower or clunkier cards, but I haven't tested that.\n\n**Unverified:** I didn't check individual matchup win rates. I also didn't check whether a Power-Nine-free variant of Initiative or Lurrus would beat Dredge in practice. I chose Dredge because it needs no Power Nine, and it's a proven shell with a real result.","error":false,"deck":{"commander":[],"main":[{"qty":1,"name":"Chalice of the Void"},{"qty":4,"name":"Serum Powder"},{"qty":1,"name":"Golgari Grave-Troll"},{"qty":4,"name":"Golgari Thug"},{"qty":4,"name":"Grief"},{"qty":4,"name":"Hollow One"},{"qty":4,"name":"Ichorid"},{"qty":4,"name":"Narcomoeba"},{"qty":4,"name":"Prized Amalgam"},{"qty":4,"name":"Shambling Shell"},{"qty":4,"name":"Silversmote Ghoul"},{"qty":4,"name":"Stinkweed Imp"},{"qty":1,"name":"Force of Negation"},{"qty":4,"name":"Force of Will"},{"qty":1,"name":"Mental Misstep"},{"qty":4,"name":"Noxious Revival"},{"qty":4,"name":"Bazaar of Baghdad"},{"qty":4,"name":"Creeping Chill"}],"side":[{"qty":3,"name":"Force of Negation"},{"qty":4,"name":"F
